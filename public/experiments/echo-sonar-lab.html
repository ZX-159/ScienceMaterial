<body>

<header class="toolbar">

  <div class="chips">

</header>

<main>
  <div class="left">
    <nav class="tabs">
      <button id="tab-lab" class="on" onclick="setMode('lab')"><span data-i="tabLab"></span></button>
      <button id="tab-cmp" onclick="setMode('cmp')"><span data-i="tabCmp"></span></button>
      <button id="tab-quiz" onclick="setMode('quiz')"><span data-i="tabQuiz"></span></button>
      <button id="tab-game" onclick="setMode('game')"><span data-i="tabGame"></span></button>
    </nav>

    <div class="stage">
      <section class="panel on" id="panel-lab">
        <div class="cvarea"><canvas id="cv-lab" width="2000" height="1000"></canvas></div>
        <div class="rail">
          <div class="rail-t" data-i="presetLabel"></div>
          <button class="railbtn" data-p="pr1" onclick="preset('pr1')"><span data-i="pr1"></span></button>
          <button class="railbtn" data-p="pr2" onclick="preset('pr2')"><span data-i="pr2"></span></button>
          <button class="railbtn" data-p="pr3" onclick="preset('pr3')"><span data-i="pr3"></span></button>
          <button class="railbtn" data-p="pr4" onclick="preset('pr4')"><span data-i="pr4"></span></button>
          <button class="railbtn" data-p="pr5" onclick="preset('pr5')"><span data-i="pr5"></span></button>
        </div>
      </section>

      <section class="panel" id="panel-cmp">
        <div class="duo">
          <div class="box">
            <div class="track-label" id="ca-name"></div>
            <div class="cvwrap"><canvas id="cv-ca" width="880" height="760"></canvas></div>
            <div class="minictl" id="ca-cond"></div>
          </div>
          <div class="box">
            <div class="track-label" id="cb-name"></div>
            <div class="cvwrap"><canvas id="cv-cb" width="880" height="760"></canvas></div>
            <div class="minictl" id="cb-cond"></div>
          </div>
        </div>
      </section>

      <section class="panel" id="panel-quiz">
        <div class="quiz-wrap">
          <div class="q-timer" id="q-timer"><i id="q-timer-bar"></i></div>
          <div class="quiz-emoji" id="q-emoji"></div>
          <div class="quiz-q" id="q-text"></div>
          <div class="quiz-btns" id="q-opts"></div>
          <div class="quiz-exp" id="q-exp"></div>
          <div class="quiz-nav">
            <button class="btn" id="q-next" style="display:none" onclick="nextQ()"><span data-i="next"></span> ➜</button>
            <button class="btn ghost" id="q-restart" style="display:none" onclick="restartQ()">🔄 <span data-i="again"></span></button>
          </div>
        </div>
      </section>

      <section class="panel" id="panel-game">
        <div class="gamehud">
          <span class="gt"><span data-i="gRound"></span> <b id="g-round">1</b>/3</span>
          <span class="gt"><span data-i="gTargetLabel"></span> <b id="g-target">--</b> s</span>
          <span class="gtime" id="g-time">40</span>
        </div>
        <div id="game-cvhost"></div>
      </section>
    </div>

    <div class="ctlbar">
      <div class="ctl-group on" id="ctl-lab">
        <div class="rowline">
          <span class="ctl-label" data-i="sceneLabel"></span>
          <button class="sbtn pick" data-sc="sea" onclick="setScene('sea')"><span data-i="scSea"></span></button>
          <button class="sbtn" data-sc="air" onclick="setScene('air')"><span data-i="scAir"></span></button>
          <label class="ctl"><span data-i="slD"></span>
            <input type="range" id="s-d" min="150" max="3000" step="10" value="1500" oninput="setD(+this.value)">
            <output id="s-d-o">1500 m</output>
          </label>
          <button class="btn" id="btn-fire" onclick="fireSonar()"></button>
        </div>
        <div class="hint-line" data-i="labHint"></div>
      </div>

      <div class="ctl-group" id="ctl-cmp">
        <div class="rowline">
          <button class="btn ghost" style="font-size:14px; letter-spacing:0" onclick="presetCmp(0)">📕 <span data-i="cp1"></span></button>
          <button class="btn ghost" style="font-size:14px; letter-spacing:0" onclick="presetCmp(1)">📗 <span data-i="cp2"></span></button>
          <button class="btn ghost" style="font-size:14px; letter-spacing:0" onclick="presetCmp(2)">📙 <span data-i="cp3"></span></button>
        </div>
        <div class="rowline">
          <span class="ctl-label" data-i="guessQ"></span>
          <button class="sbtn" data-g="a" onclick="pickGuess(this)"><span data-i="gMoreA"></span></button>
          <button class="sbtn" data-g="same" onclick="pickGuess(this)"><span data-i="gSame"></span></button>
          <button class="sbtn" data-g="b" onclick="pickGuess(this)"><span data-i="gMoreB"></span></button>
          <button class="btn" id="cmp-run" onclick="runCmp()" disabled>📣 <span data-i="runCmp"></span></button>
        </div>
        <div class="hint-line" data-i="cmpHint"></div>
      </div>

      <div class="ctl-group" id="ctl-quiz">
        <div class="hint-line" data-i="quizHint"></div>
      </div>

      <div class="ctl-group" id="ctl-game">
        <div class="rowline">
          <span class="ctl-label" id="g-vlabel"></span>
          <label class="ctl"><span data-i="slD"></span>
            <input type="range" id="g-d" min="150" max="3000" step="10" value="1500" oninput="setD(+this.value)">
            <output id="g-d-o">? m</output>
          </label>
          <button class="btn" id="g-lock" onclick="lockGame()"></button>
        </div>
        <div class="hint-line" data-i="gHint"></div>
      </div>
    </div>
  </div>

  <aside>
    <div class="sb on" id="sb-lab">
      <div>
        <div class="sb-title" data-i="dLabel"></div>
        <div class="bigang"><b id="l-d">1500</b><i> m</i></div>
      </div>
      <span class="netchip" id="l-state"></span>
      <div class="mini3">
        <div><span data-i="kV"></span><b id="l-v">1500</b></div>
        <div><span data-i="kT"></span><b id="l-t">2.00</b></div>
        <div><span data-i="kHalf"></span><b id="l-half">1.00</b></div>
      </div>
      <button class="explain-btn" id="l-exp-btn" onclick="toggleExplain()"><span data-i="expOpen"></span></button>
      <div class="explain" id="l-explain">
        <div class="statusbox" id="l-status"></div>
        <div class="concl" id="l-conclude"></div>
      </div>
      <div class="rec-head">
        <button class="rec-btn" onclick="recordData()">📌 <span data-i="recBtn"></span></button>
        <button class="rec-clear" onclick="clearRec()" data-i="recClear"></button>
      </div>
      <table class="rec">
        <thead><tr><th data-i="thScene"></th><th data-i="thV"></th><th data-i="thT"></th><th data-i="thD"></th><th style="width:24%"></th></tr></thead>
        <tbody id="rec-body"></tbody>
      </table>
    </div>

    <div class="sb" id="sb-cmp">
      <div class="sb-title" data-i="outLabel"></div>
      <div class="cmp-angs">
        <div class="one"><span id="s-ca-name"></span><b id="c-out-a">0</b><em> %</em></div>
        <div class="one"><span id="s-cb-name"></span><b id="c-out-b">0</b><em> %</em></div>
      </div>
      <div class="mini3">
        <div><span data-i="kRefl"></span><b id="c-r-a">--</b></div>
        <div><span data-i="kAbs"></span><b id="c-a-a">--</b></div>
        <div><span data-i="kEcho"></span><b id="c-e-a">--</b></div>
      </div>
      <div class="mini3">
        <div><span data-i="kRefl"></span><b id="c-r-b">--</b></div>
        <div><span data-i="kAbs"></span><b id="c-a-b">--</b></div>
        <div><span data-i="kEcho"></span><b id="c-e-b">--</b></div>
      </div>
      <div class="feedback" id="cmp-fb"></div>
      <div class="concl" id="cmp-conclude"></div>
    </div>

    <div class="sb" id="sb-quiz">
      <div class="sb-title" data-i="score"></div>
      <div class="scorebig"><b id="q-score-n">0</b><span> / 8</span></div>
      <div class="qdots" id="q-prog"></div>
      <div class="statusbox" id="q-side-hint"></div>
    </div>

    <div class="sb" id="sb-game">
      <div>
        <div class="sb-title" data-i="gTargetLabel"></div>
        <div class="bigang"><b id="g-target-side">--</b><i> s</i></div>
      </div>
      <div>
        <div class="sb-title" data-i="gScene"></div>
        <div class="goalbig" id="g-scene-side">--</div>
      </div>
      <div>
        <div class="sb-title" data-i="score"></div>
        <div class="scorebig"><b id="g-score">0</b></div>
      </div>
      <div class="statusbox" id="g-status"></div>
    </div>

    <footer id="credit"></footer>
  </aside>
</main>

<script>
'use strict';
const $ = id => document.getElementById(id);
function clamp(v,a,b){ if(!isFinite(v)) return a; return v<a?a:(v>b?b:v); }

============================================================ */

/* ============================================================
   Shared drawing helpers
============================================================ */
const CV_FONT = '"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
function rrect(c,x,y,w,h,r){
  c.beginPath();
  if(c.roundRect){ c.roundRect(x,y,w,h,r); return; }
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}
function circle(c,x,y,r,fill,stroke,lw){
  c.beginPath(); c.arc(x,y,r,0,Math.PI*2);
  if(fill){ c.fillStyle=fill; c.fill(); }
  if(stroke){ c.strokeStyle=stroke; c.lineWidth=lw||1.5; c.stroke(); }
}
function line(c,x1,y1,x2,y2,col,lw,dash){
  c.beginPath();
  if(c.setLineDash) c.setLineDash(dash||[]);
  c.moveTo(x1,y1); c.lineTo(x2,y2);
  c.strokeStyle=col; c.lineWidth=lw||1.5; c.stroke();
  if(c.setLineDash) c.setLineDash([]);
}
function TX(c,s,x,y,font,color,align,base){
  if(!isFinite(x)||!isFinite(y)) return;
  c.font=font; c.fillStyle=color; c.textAlign=align||'left'; c.textBaseline=base||'middle';
  c.fillText(s,x,y);
}
/* pill-backed text, clamped inside the canvas */
function tchip(c,s,x,y,font,color,align,W,H){
  c.font=font;
  const w=c.measureText(s).width;
  const m=/([\d.]+)px/.exec(font), fs=m?parseFloat(m[1]):14, h=fs+14;
  const al=align||'center';
  let x0 = al==='left' ? x : (al==='right' ? x-w : x-w/2);
  x0 = clamp(x0, 10, Math.max(10, (W||1000)-w-10));
  const yy = clamp(y, h/2+4, (H||500)-h/2-4);
  rrect(c,x0-11,yy-h/2,w+22,h,9);
  c.fillStyle=C().pill; c.fill();
  c.strokeStyle=C().pillLine; c.lineWidth=1.2; c.stroke();
  TX(c,s,x0+w/2,yy,font,color,'center','middle');
}
function ptr(ev,cv,sc){
  const r = cv.getBoundingClientRect();
  return { x:(ev.clientX-r.left)*(cv.width/r.width)/sc, y:(ev.clientY-r.top)*(cv.height/r.height)/sc };
}

/* ============================================================
   Physics: echo ranging.  d = v * t / 2   (t = round trip)
============================================================ */
const SCENES = {
  sea:{ key:'sea', v:1500, Dmin:150, Dmax:3000, step:10, nameK:'scSeaName', distK:'scSeaDist', dragK:'cvDragSea', D0:1500 },
  air:{ key:'air', v:340,  Dmin:2,   Dmax:400,  step:1,  nameK:'scAirName', distK:'scAirDist', dragK:'cvDragAir', D0:25 },
};
const MIN_T = 0.1;                       /* the ear can separate two sounds 0.1 s apart */
let scene = 'sea';
let D = SCENES.sea.D0;                   /* the one state variable: distance in metres */

function sc(){ return SCENES[scene]; }
function roundD(v){ const s=sc(); return clamp(Math.round(v/s.step)*s.step, s.Dmin, s.Dmax); }
function tripT(dd){ return 2*dd/sc().v; }          /* round-trip time (s) */
function calcD(tt){ return sc().v*tt/2; }          /* d = v * t / 2 */
function fracOf(dd){ const s=sc(); return clamp((dd-s.Dmin)/(s.Dmax-s.Dmin),0,1); }
function tFix(tt){ return tt>=1 ? tt.toFixed(2) : tt.toFixed(3); }
function canHear(tt){ return tt >= MIN_T - 1e-9; }

const SCN = {x0:14, x1:616};
const SEA = {cx:296, surf:118, shipY:96, top:172, bot:436};
const AIR = {groundY:396, srcX:70, mouthY:296, x0:250, x1:580, skyTop:26};
const PN  = {x0:636, x1:988, y0:52, y1:456};

const labCv = $('cv-lab'), labCtx = labCv.getContext('2d');
const FIRE = { on:false, p:0, dur:2.4 };
let FLASH = null, CONCL = null;

function gameAiming(){ return $('panel-game').classList.contains('on') && GAME.phase==='aim'; }

function obsPos(){
  const f = fracOf(D);
  return scene==='sea' ? SEA.top + f*(SEA.bot-SEA.top) : AIR.x0 + f*(AIR.x1-AIR.x0);
}

/* ---------- scene: sea water ---------- */
function drawSea(c, hide){
  const oy = obsPos(), x0 = SCN.x0, x1 = SCN.x1, bottom = 474;
  /* sky */
  let g = c.createLinearGradient(0,20,0,SEA.surf);
  g.addColorStop(0,C().skyA); g.addColorStop(1,C().skyB);
  c.fillStyle=g; rrect(c,x0,20,x1-x0,SEA.surf-20,8); c.fill();
  /* water */
  g = c.createLinearGradient(0,SEA.surf,0,bottom);
  g.addColorStop(0,C().seaA); g.addColorStop(1,C().seaB);
  c.fillStyle=g; rrect(c,x0,SEA.surf,x1-x0,bottom-SEA.surf,8); c.fill();
  /* sea floor */
  c.beginPath(); c.moveTo(x0,bottom); c.lineTo(x0,oy+12);
  for(let x=x0;x<=x1;x+=40) c.lineTo(x, oy + Math.sin(x*0.03)*7);
  c.lineTo(x1,bottom); c.closePath();
  c.fillStyle=C().bed; c.fill();
  c.strokeStyle=C().bedLine; c.lineWidth=1.6; c.stroke();
  /* drag hint */
  line(c, x0+16, oy, x1-16, oy, C().amber, 1.8, [7,6]);
  TX(c, t('cvDragSea'), x1-24, oy-16, '700 15px '+CV_FONT, C().amber, 'right', 'middle');
  /* ship */
  TX(c, '🚢', SEA.cx, SEA.shipY, '40px '+CV_FONT, C().cvText, 'center', 'middle');
  /* distance annotation */
  const mx = SEA.cx+62;
  line(c, mx, SEA.surf, mx, oy, C().cvTextDim, 1.4);
  line(c, mx-8, SEA.surf, mx+8, SEA.surf, C().cvTextDim, 1.4);
  line(c, mx-8, oy, mx+8, oy, C().cvTextDim, 1.4);
  const lbl = hide ? tf('cvUnknown',{n:t('scSeaDist')}) : tf('cvActual',{n:t('scSeaDist'), d:Math.round(D)});
  tchip(c, lbl, mx+14, (SEA.surf+oy)/2, '700 15px '+CV_FONT, hide?C().amber:C().cvText, 'left', W_W, W_H);
  /* pulse */
  if(FIRE.on){
    const p = FIRE.p, y0 = SEA.surf+6, down = p<0.5;
    const y = down ? y0 + (oy-y0)*(p/0.5) : oy - (oy-y0)*((p-0.5)/0.5);
    if(Math.abs(p-0.5)<0.05){
      c.beginPath(); c.arc(SEA.cx, oy, 26, Math.PI, 2*Math.PI);
      c.strokeStyle=C().hit; c.lineWidth=3.4; c.stroke();
    }
    const col = down ? C().go : C().back;
    circle(c, SEA.cx, y, 10, col, null, 0);
    c.globalAlpha=.55; circle(c, SEA.cx, y, 19, null, col, 2); c.globalAlpha=1;
    TX(c, down? t('cvGo') : t('cvBack'), SEA.cx-30, y, '700 15px '+CV_FONT, col, 'right', 'middle');
  }
}

/* ---------- scene: air / cliff ---------- */
function drawAir(c, hide){
  const ox = obsPos(), x0 = SCN.x0, x1 = SCN.x1, bottom = 474;
  let g = c.createLinearGradient(0,AIR.skyTop,0,AIR.groundY);
  g.addColorStop(0,C().skyA); g.addColorStop(1,C().skyB);
  c.fillStyle=g; rrect(c,x0,AIR.skyTop,x1-x0,AIR.groundY-AIR.skyTop,8); c.fill();
  c.fillStyle=C().ground; rrect(c,x0,AIR.groundY,x1-x0,bottom-AIR.groundY,8); c.fill();
  line(c, x0, AIR.groundY, x1, AIR.groundY, C().rockLine, 2);
  /* cliff */
  c.beginPath();
  c.moveTo(ox, AIR.groundY);
  c.lineTo(ox-14, AIR.groundY-56);
  c.lineTo(ox+8,  AIR.groundY-132);
  c.lineTo(ox-5,  AIR.skyTop+22);
  c.lineTo(x1, AIR.skyTop+22); c.lineTo(x1, AIR.groundY);
  c.closePath(); c.fillStyle=C().rock; c.fill();
  c.strokeStyle=C().rockLine; c.lineWidth=1.2;
  for(let y=AIR.skyTop+50; y<AIR.groundY; y+=26){
    line(c, ox+2, y, x1, y, C().rockLine, 1);
  }
  /* reflecting face + drag hint */
  line(c, ox, AIR.skyTop+26, ox, AIR.groundY, C().amber, 1.8, [7,6]);
  TX(c, t('cvDragAir'), clamp(ox, SCN.x0+70, SCN.x1-70), AIR.skyTop+12, '700 15px '+CV_FONT, C().amber, 'center', 'middle');
  /* person */
  TX(c, '🧍', AIR.srcX, AIR.groundY-24, '46px '+CV_FONT, C().cvText, 'center', 'middle');
  /* distance annotation */
  const my = AIR.groundY+42;
  line(c, AIR.srcX, my, ox, my, C().cvTextDim, 1.4);
  line(c, AIR.srcX, my-8, AIR.srcX, my+8, C().cvTextDim, 1.4);
  line(c, ox, my-8, ox, my+8, C().cvTextDim, 1.4);
  const lbl = hide ? tf('cvUnknown',{n:t('scAirDist')}) : tf('cvActual',{n:t('scAirDist'), d:Math.round(D)});
  tchip(c, lbl, (AIR.srcX+ox)/2, my, '700 15px '+CV_FONT, hide?C().amber:C().cvText, 'center', W_W, W_H);
  /* pulse */
  if(FIRE.on){
    const p = FIRE.p, sx = AIR.srcX+18, right = p<0.5;
    const x = right ? sx + (ox-sx)*(p/0.5) : ox - (ox-sx)*((p-0.5)/0.5);
    if(Math.abs(p-0.5)<0.05){
      c.beginPath(); c.arc(ox, AIR.mouthY, 26, -Math.PI/2, Math.PI/2);
      c.strokeStyle=C().hit; c.lineWidth=3.4; c.stroke();
    }
    const col = right ? C().go : C().back;
    circle(c, x, AIR.mouthY, 10, col, null, 0);
    c.globalAlpha=.55; circle(c, x, AIR.mouthY, 19, null, col, 2); c.globalAlpha=1;
    TX(c, right? t('cvGoR') : t('cvBackR'), x, AIR.mouthY-32, '700 15px '+CV_FONT, col, 'center', 'middle');
  }
}

/* ---------- the "why divide by 2" panel ---------- */
function drawPanel(c, hide){
  const s = sc();
  const tShown = FIRE.on ? FIRE.p*tripT(D) : tripT(D);
  const tTarget = hide ? GAME.tgt : tShown;
  const dShown = calcD(tShown);
  rrect(c, PN.x0, PN.y0, PN.x1-PN.x0, PN.y1-PN.y0, 12);
  c.fillStyle=C().panel; c.fill(); c.strokeStyle=C().panelLine; c.lineWidth=1.4; c.stroke();
  const cx = (PN.x0+PN.x1)/2;
  TX(c, t('cvPanelTitle'), cx, PN.y0+28, '700 16px '+CV_FONT, C().cvTextDim, 'center', 'middle');
  TX(c, '⏱ '+tFix(tTarget)+' s', cx, PN.y0+74, '900 34px '+CV_FONT, C().amber, 'center', 'middle');

  /* total-path bar, split into "there" and "back" */
  const bx0 = PN.x0+24, bx1 = PN.x1-24, by = PN.y0+118, bh = 26, mid = (bx0+bx1)/2;
  TX(c, hide ? t('cvTotalQ') : tf('cvTotal',{s:Math.round(s.v*tShown)}), cx, by-20, '700 15px '+CV_FONT, C().cvTextDim, 'center', 'middle');
  rrect(c, bx0, by, bx1-bx0, bh, 7); c.fillStyle=C().barBg; c.fill();
  if(!hide){
    const q = FIRE.on ? FIRE.p : 1;
    const gw = Math.min(q,0.5)/0.5*(mid-bx0);
    c.fillStyle=C().go; rrect(c, bx0, by, Math.max(0,gw), bh, 7); c.fill();
    if(q>0.5){
      const bw = (q-0.5)/0.5*(bx1-mid);
      c.fillStyle=C().back; rrect(c, mid, by, Math.max(0,bw), bh, 7); c.fill();
    }
  }
  rrect(c, bx0, by, bx1-bx0, bh, 7); c.strokeStyle=C().panelLine; c.lineWidth=1.4; c.stroke();
  line(c, mid, by-7, mid, by+bh+7, C().amber, 2.2, [5,4]);
  TX(c, t('cvSegGo'),   (bx0+mid)/2, by+bh+17, '700 14px '+CV_FONT, C().go,   'center', 'middle');
  TX(c, t('cvSegBack'), (mid+bx1)/2, by+bh+17, '700 14px '+CV_FONT, C().back, 'center', 'middle');
  TX(c, t('cvWhy'), cx, by+bh+40, '700 13px '+CV_FONT, C().cvTextDim, 'center', 'middle');

  /* the formula, spelled out with live numbers */
  const fy = PN.y0+236;
  TX(c, tf('cvV',{v:s.v}), cx, fy, '700 16px '+CV_FONT, C().cvTextDim, 'center', 'middle');
  TX(c, tf('cvT',{t:tFix(tTarget)}), cx, fy+26, '700 16px '+CV_FONT, C().cvTextDim, 'center', 'middle');
  const dLine = hide ? tf('cvDQ',{v:s.v, t:tFix(tTarget)})
                     : tf('cvD',{v:s.v, t:tFix(tShown), d:Math.round(dShown)});
  TX(c, dLine, cx, fy+62, '900 17px '+CV_FONT, C().amber, 'center', 'middle');
  /* the 0.1 s / 17 m criterion */
  const tj = hide ? GAME.tgt : tripT(D);
  const okHear = canHear(tj);
  TX(c, okHear ? tf('cvJudgeOk',{t:tFix(tj)}) : tf('cvJudgeNo',{t:tFix(tj)}),
     cx, fy+100, '700 15px '+CV_FONT, okHear?C().good:C().bad, 'center', 'middle');
}

function drawLab(){
  const c = labCtx;
  c.setTransform(1,0,0,1,0,0);
  c.clearRect(0,0,labCv.width,labCv.height);
  c.setTransform(SC,0,0,SC,0,0);
  const hide = gameAiming();
  if(scene==='sea') drawSea(c,hide); else drawAir(c,hide);
  drawPanel(c,hide);
}

/* ---------- sidebar message ---------- */
function renderMsg(){
  const s = sc(), tt = tripT(D), ok = canHear(tt);
  const flash = FLASH ? '<em>'+t(FLASH)+'</em><br>' : '';
  const formula = tf('f_formula', {v:s.v, t:tFix(tt), d:Math.round(calcD(tt))});
  const live = ok ? tf('live_hear',{t:tFix(tt)}) : tf('live_no',{t:tFix(tt)});
  const tip = scene==='sea' ? t('tip_sea') : t('tip_air');
  const box = $('l-status');
  if(box) box.innerHTML = flash + formula + '<br>' + live + '<br>' + tip;
  const cb = $('l-conclude');
  if(cb){
    if(CONCL){ cb.innerHTML = t(CONCL); cb.classList.add('on'); }
    else cb.classList.remove('on');
  }
}

/* ---------- state setters ---------- */
function syncSliders(){
  const s = sc();
  [['s-d','s-d-o'],['g-d','g-d-o']].forEach(pair=>{
    const el = $(pair[0]), out = $(pair[1]);
    if(el){ el.min=s.Dmin; el.max=s.Dmax; el.step=s.step; el.value=D; }
    if(out){
      const hideNum = (pair[0]==='g-d') && gameAiming();
      out.textContent = hideNum ? '? m' : Math.round(D)+' m';
    }
  });
}
/* 解释文字默认收起来 —— 屏幕上先只留大数字，要讲的时候才点开 */
let EXPLAIN = false;
function syncExplain(){
  const box = $('l-explain'), b = $('l-exp-btn');
  if(box) box.classList.toggle('on', EXPLAIN);
  if(b){
    b.classList.toggle('open', EXPLAIN);
    const sp = b.querySelector('span');
    if(sp){ sp.dataset.i = EXPLAIN ? 'expClose' : 'expOpen'; sp.innerHTML = t(sp.dataset.i); }
  }
}
function toggleExplain(){ EXPLAIN = !EXPLAIN; syncExplain(); }

function labSync(){
  const s = sc(), tt = tripT(D), ok = canHear(tt);
  /* while the pulse is in flight the stopwatch counts up — that IS the measurement */
  const tLive = FIRE.on ? FIRE.p*tt : tt;
  if($('l-d')) $('l-d').textContent = Math.round(calcD(tLive));
  if($('l-v')) $('l-v').textContent = s.v;
  if($('l-t')) $('l-t').textContent = tFix(tLive);
  if($('l-half')) $('l-half').textContent = tFix(tLive/2);
  const bd = $('l-state');
  if(bd){
    bd.innerHTML = ok ? t('stHear')+'<small>'+t('stHearSub')+'</small>'
                      : t('stNo')+'<small>'+t('stNoSub')+'</small>';
    bd.style.color = ok ? '#1d7a3a' : '#b8432f';
    bd.style.borderColor = ok ? '#1d7a3a' : 'var(--pos)';
  }
  document.querySelectorAll('.sbtn[data-sc]').forEach(b=>b.classList.toggle('pick', b.dataset.sc===scene));
  const fb = $('btn-fire');
  if(fb) fb.textContent = FIRE.on ? t('btnFiring') : t('btnFire');
  syncSliders();
  renderMsg();
}
function setD(v){
  const before = canHear(tripT(D));
  D = roundD(v);
  const after = canHear(tripT(D));
  if(before !== after){ FLASH = after ? 'r_toHear' : 'r_toNo'; CONCL = 'c_hear'; }
  labSync();
}
function setScene(k){
  if(!SCENES[k]) return;
  scene = k; D = SCENES[k].D0;
  FIRE.on = false; FLASH = null; CONCL = null;
  labSync();
}
function labReset(){
  FIRE.on = false; FLASH = null; CONCL = null;
  D = sc().D0;
  labSync();
}
function fireSonar(){
  if(FIRE.on) return;
  FIRE.on = true; FIRE.p = 0;
  FIRE.dur = 1.6 + 2.6*fracOf(D);      /* slowed to 1.6–4.2 s so the class can watch */
  CONCL = 'c_half';
  labSync();
}

/* ---------- one-click presets (absorbs the old "can you hear the echo?" module) ---------- */
const PRESETS = {
  pr1:{ scene:'air', D:5   },
  pr2:{ scene:'air', D:17  },
  pr3:{ scene:'air', D:50  },
  pr4:{ scene:'sea', D:1500},
  pr5:{ scene:'sea', D:3000},
};
function preset(id){
  const p = PRESETS[id];
  if(!p) return;
  setMode('lab');
  scene = p.scene; D = roundD(p.D);
  FIRE.on = false; FLASH = null;
  labSync();
  CONCL = id+'why';
  renderMsg();
  fireSonar();
  CONCL = id+'why';
  renderMsg();
  const btn = document.querySelector('.rail [data-p="'+id+'"]');
  if(btn){ btn.classList.remove('flash'); void btn.offsetWidth; btn.classList.add('flash');
    setTimeout(()=>btn.classList.remove('flash'), 1800); }
}

/* ---------- data recording ---------- */
let recRows = [];
function recordData(){
  const tt = tripT(D);
  recRows.push({ scene:scene, v:sc().v, t:tFix(tt), d:Math.round(calcD(tt)) });
  if(recRows.length > 7) recRows.shift();
  renderRec();
}
function clearRec(){ recRows = []; renderRec(); }
function renderRec(){
  const body = $('rec-body');
  if(!body) return;
  let top = 0;
  recRows.forEach(r=>{ top = Math.max(top, r.d); });
  body.innerHTML = recRows.map(r=>{
    const pct = top>0 ? Math.max(6, r.d/top*100) : 0;
    const nm = r.scene==='sea' ? '🌊' : '🏔️';
    return '<tr><td>'+nm+'</td><td>'+r.v+'</td><td>'+r.t+'</td><td>'+r.d+'</td>'+
      '<td><div class="bar '+r.scene+'"><i style="width:'+pct+'%"></i></div></td></tr>';
  }).join('');
}

/* ============================================================
   Tab 2: Compare — reflection vs absorption (world 440 x 380)
============================================================ */
const CM_W = 440, CM_H = 380;
const CW = {srcX:56, wallX:322, wallW:46, cy:176, top:44, bot:300};
const CMP_PRESETS = [
  { id:0, a:{R:0.92, hard:true,  nameK:'cp1a', condK:'cp1ac'}, b:{R:0.15, hard:false, nameK:'cp1b', condK:'cp1bc'}, concl:'cc_1' },
  { id:1, a:{R:0.85, hard:true,  nameK:'cp2a', condK:'cp2ac'}, b:{R:0.25, hard:false, nameK:'cp2b', condK:'cp2bc'}, concl:'cc_2' },
  { id:2, a:{R:0.70, hard:true,  nameK:'cp3a', condK:'cp3ac'}, b:{R:0.10, hard:false, nameK:'cp3b', condK:'cp3bc'}, concl:'cc_3' },
];
const CMP = { preset:0, p:0, running:false, guess:null };
const cvA = $('cv-ca'), ctxA = cvA.getContext('2d');
const cvB = $('cv-cb'), ctxB = cvB.getContext('2d');
function side(which){ return CMP_PRESETS[CMP.preset][which]; }
function echoShown(R, p){ return R*100*clamp((p-0.12)/0.22, 0, 1); }
function echoWord(R){ return R>=0.6 ? t('wStrong') : R>=0.3 ? t('wMid') : t('wWeak'); }

function drawCmpSide(ctx, s, p){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,CM_W*SC,CM_H*SC);
  ctx.setTransform(SC,0,0,SC,0,0);
  const cy = CW.cy, srcX = CW.srcX, wallX = CW.wallX;
  const Dpx = wallX - srcX - 8;

  /* wall */
  if(s.hard){
    ctx.fillStyle=C().hardWall; rrect(ctx, wallX, CW.top, CW.wallW, CW.bot-CW.top, 4); ctx.fill();
    for(let y=CW.top+16; y<CW.bot-8; y+=22) line(ctx, wallX, y, wallX+CW.wallW, y, C().hardLine, 1.2);
  } else {
    ctx.fillStyle=C().softWall;
    for(let y=CW.top+12; y<CW.bot-6; y+=14){
      circle(ctx, wallX+9,  y,   7.5, C().softWall, null, 0);
      circle(ctx, wallX+25, y+7, 7.5, C().softWall, null, 0);
      circle(ctx, wallX+41, y,   7.5, C().softWall, null, 0);
    }
  }
  /* source */
  TX(ctx, '🧍', srcX, cy+6, '34px '+CV_FONT, C().cvText, 'center', 'middle');
  TX(ctx, t('cvSrc'), srcX, cy+40, '700 13px '+CV_FONT, C().cvTextDim, 'center', 'middle');

  /* waves: 3 round trips over p = 0..1 */
  const NW = 4, ROUND = 2*Dpx, phase = p*3;
  let hitFlash = false;
  for(let i=0;i<NW;i++){
    const r = ((phase*ROUND) + i*ROUND/NW) % ROUND;
    if(r < Dpx){
      const a = 1 - r/Dpx*0.25;
      ctx.strokeStyle = C().go; ctx.globalAlpha = a; ctx.lineWidth = 2.8;
      ctx.beginPath(); ctx.arc(srcX, cy, r+14, -0.55, 0.55); ctx.stroke();
      ctx.globalAlpha = 1;
      if(Dpx-r < 14) hitFlash = true;
    } else {
      const rr = r-Dpx, a = s.R*(1-rr/Dpx*0.35);
      if(a > 0.04){
        ctx.strokeStyle = s.hard ? C().back : C().hit;
        ctx.globalAlpha = clamp(a,0,1); ctx.lineWidth = s.hard ? 2.8 : 1.6;
        ctx.beginPath(); ctx.arc(wallX, cy, rr+12, Math.PI-0.55, Math.PI+0.55); ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }
  }
  if(hitFlash && p>0){
    ctx.strokeStyle=C().amber; ctx.lineWidth=3.4;
    ctx.beginPath(); ctx.arc(wallX, cy, 22, Math.PI-0.6, Math.PI+0.6); ctx.stroke();
  }
  if(!s.hard) TX(ctx, t('cvAbsorb'), wallX+CW.wallW/2, cy-52, '700 14px '+CV_FONT, C().hit, 'center', 'middle');

  /* readouts */
  const shown = echoShown(s.R, p);
  TX(ctx, tf('cvEcho',{r:Math.round(shown)}), CM_W/2, 334,
     '900 26px '+CV_FONT, shown>=40?C().good:(shown>=15?C().amber:C().bad), 'center', 'middle');
  TX(ctx, tf('cvRefl',{r:Math.round(s.R*100), a:Math.round((1-s.R)*100)}), CM_W/2, 362,
     '700 14px '+CV_FONT, C().cvTextDim, 'center', 'middle');
  TX(ctx, t('cvWall'), wallX+CW.wallW/2, CW.bot+18, '700 13px '+CV_FONT, C().cvTextDim, 'center', 'middle');
}
function drawCmpBoth(){
  drawCmpSide(ctxA, side('a'), CMP.p);
  drawCmpSide(ctxB, side('b'), CMP.p);
  updateCmpSide();
}
function updateCmpSide(){
  const a = side('a'), b = side('b');
  $('c-out-a').textContent = Math.round(echoShown(a.R, CMP.p));
  $('c-out-b').textContent = Math.round(echoShown(b.R, CMP.p));
  $('c-r-a').textContent = Math.round(a.R*100);
  $('c-a-a').textContent = Math.round((1-a.R)*100);
  $('c-e-a').textContent = echoWord(a.R);
  $('c-r-b').textContent = Math.round(b.R*100);
  $('c-a-b').textContent = Math.round((1-b.R)*100);
  $('c-e-b').textContent = echoWord(b.R);
}
function cmpLabels(){
  const a = side('a'), b = side('b');
  $('ca-name').textContent = t(a.nameK);
  $('cb-name').textContent = t(b.nameK);
  $('ca-cond').textContent = t(a.condK);
  $('cb-cond').textContent = t(b.condK);
  $('s-ca-name').textContent = LANG==='zh' ? '甲' : 'A';
  $('s-cb-name').textContent = LANG==='zh' ? '乙' : 'B';
}
function presetCmp(i){
  CMP.preset = i; CMP.p = 0; CMP.running = false;
  document.querySelectorAll('#ctl-cmp .btn.ghost').forEach((b,k)=>b.style.opacity = (k===i?'1':'.6'));
  clearGuess(); cmpLabels(); drawCmpBoth();
  $('cmp-fb').textContent=''; $('cmp-fb').className='feedback';
  $('cmp-conclude').classList.remove('on');
}
function cmpReset(){
  if(CMP.running) return;
  CMP.p = 0;
  cmpLabels(); drawCmpBoth();
  $('cmp-fb').textContent=''; $('cmp-fb').className='feedback';
  $('cmp-conclude').classList.remove('on');
}
function pickGuess(btn){
  document.querySelectorAll('#ctl-cmp .sbtn[data-g]').forEach(b=>b.classList.remove('pick'));
  btn.classList.add('pick');
  CMP.guess = btn.dataset.g;
  $('cmp-run').disabled = false;
}
function clearGuess(){
  document.querySelectorAll('#ctl-cmp .sbtn[data-g]').forEach(b=>b.classList.remove('pick'));
  CMP.guess = null; $('cmp-run').disabled = true;
}
function runCmp(){
  if(CMP.running) return;
  CMP.p = 0; CMP.running = true;
  $('cmp-run').disabled = true;
}
function finishCmp(){
  const a = side('a'), b = side('b');
  const real = Math.abs(a.R-b.R) < 0.03 ? 'same' : (a.R>b.R ? 'a' : 'b');
  const zh = LANG==='zh';
  const detail = (zh?'（':' (')+(zh?'甲':'A')+' '+Math.round(a.R*100)+'% · '+
                 (zh?'乙':'B')+' '+Math.round(b.R*100)+'%'+(zh?'）':')');
  const fb = $('cmp-fb');
  if(CMP.guess === real){ fb.innerHTML = t('fbRight')+detail; fb.className='feedback good'; }
  else { fb.innerHTML = t('fbWrong')+detail; fb.className='feedback bad'; }
  const box = $('cmp-conclude');
  box.innerHTML = t(CMP_PRESETS[CMP.preset].concl);
  box.classList.add('on');
  clearGuess();
}

/* ============================================================
   Tab 3: Class quiz
============================================================ */
const QUIZ_TIME = 20;
let qIdx = 0, qScore = 0, qDone = [], qTimer = null, qLeft = 0;
function stopTimer(){ if(qTimer){ clearInterval(qTimer); qTimer=null; } }
function startTimer(){
  stopTimer();
  qLeft = QUIZ_TIME;
  const bar = $('q-timer-bar');
  bar.style.width = '100%';
  $('q-timer').classList.remove('low');
  qTimer = setInterval(()=>{
    qLeft -= 0.1;
    bar.style.width = Math.max(0, qLeft/QUIZ_TIME*100)+'%';
    if(qLeft <= 5) $('q-timer').classList.add('low');
    if(qLeft <= 0){ stopTimer(); timeUpQ(); }
  }, 100);
}
function renderQ(){
  const item = QUIZ()[qIdx];
  $('q-emoji').textContent = item.e;
  $('q-text').innerHTML = (qIdx+1)+'. '+item.q;
  $('q-exp').innerHTML = '';
  $('q-next').style.display='none';
  $('q-restart').style.display='none';
  const box = $('q-opts');
  box.innerHTML = '';
  item.o.forEach((opt,i)=>{
    const b = document.createElement('button');
    b.className='qbtn';
    b.textContent = 'ABC'[i]+'. '+opt;
    b.onclick = ()=>answerQ(i,b);
    box.appendChild(b);
  });
  renderProg();
  $('q-score-n').textContent = qScore;
  if(qDone[qIdx] !== undefined){
    const btns=[...box.children];
    btns.forEach(b=>b.disabled=true);
    btns[item.a].classList.add('right');
    $('q-exp').innerHTML = item.x;
    if(qIdx < QUIZ().length-1) $('q-next').style.display='inline-block';
    else $('q-restart').style.display='inline-block';
  } else startTimer();
}
function renderProg(){
  $('q-prog').innerHTML = QUIZ().map((_,i)=>
    '<div class="qdot '+(i===qIdx?'cur ':'')+(qDone[i]===true?'right':qDone[i]===false?'wrong':'')+'"></div>').join('');
}
function finishQ(prefix, correct){
  stopTimer();
  const item = QUIZ()[qIdx];
  qDone[qIdx] = correct;
  if(correct) qScore++;
  const btns = [...$('q-opts').children];
  btns.forEach(b=>b.disabled=true);
  btns[item.a].classList.add('right');
  $('q-exp').innerHTML = prefix + item.x;
  renderProg();
  $('q-score-n').textContent = qScore;
  if(qIdx < QUIZ().length-1) $('q-next').style.display='inline-block';
  else {
    const pct = qScore/QUIZ().length;
    const msg = pct===1 ? t('resGold') : pct>=0.7 ? t('resGood') : t('resTry');
    $('q-exp').innerHTML += '<br><em>'+qScore+' / '+QUIZ().length+' — '+msg+'</em>';
    $('q-restart').style.display='inline-block';
  }
}
function answerQ(i, btn){
  if(qDone[qIdx] !== undefined) return;
  const item = QUIZ()[qIdx];
  const correct = i===item.a;
  if(!correct) btn.classList.add('wrong');
  finishQ(correct ? t('rRight')+' ' : t('rWrong')+' ', correct);
}
function timeUpQ(){
  if(qDone[qIdx] !== undefined) return;
  finishQ(t('timeUp')+' ', false);
}
function nextQ(){ qIdx++; renderQ(); }
function restartQ(){ qIdx=0; qScore=0; qDone=[]; renderQ(); }

/* ============================================================
   Tab 4: Ranging challenge (target challenge — reuses the lab canvas)
   Given a round-trip time t, the class must set d = v * t / 2 blind.
============================================================ */
const GAME_ROUNDS = 3, GAME_TIME = 40;
const GAME_POOL = [
  { scene:'sea', t:2.0 },   /* 1500 m */
  { scene:'sea', t:3.0 },   /* 2250 m */
  { scene:'sea', t:1.0 },   /*  750 m */
  { scene:'sea', t:4.0 },   /* 3000 m */
  { scene:'air', t:0.5 },   /*   85 m */
  { scene:'air', t:1.0 },   /*  170 m */
  { scene:'air', t:0.2 },   /*   34 m */
  { scene:'air', t:2.0 },   /*  340 m */
];
const GAME = { round:0, score:0, tgt:2, phase:'aim', left:GAME_TIME, timer:null, order:[] };
function stopGTimer(){ if(GAME.timer){ clearInterval(GAME.timer); GAME.timer=null; } }
function startGame(){
  GAME.round = 0; GAME.score = 0;
  $('g-score').textContent = 0;
  const idx = GAME_POOL.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const tm=idx[i]; idx[i]=idx[j]; idx[j]=tm; }
  GAME.order = idx.slice(0, GAME_ROUNDS);
  nextRound();
}
function nextRound(){
  GAME.round++;
  GAME.phase = 'aim';
  GAME.left = GAME_TIME;
  const r = GAME_POOL[GAME.order[GAME.round-1]];
  scene = r.scene; GAME.tgt = r.t;
  FIRE.on = false; FLASH = null; CONCL = null;
  /* start from the middle of the range so the slider gives nothing away */
  D = roundD((sc().Dmin + sc().Dmax)/2);
  $('g-status').innerHTML = tf('gGo', {t:tFix(GAME.tgt), sc:t(sc().nameK), v:sc().v});
  labSync(); gameSync();
  stopGTimer();
  GAME.timer = setInterval(()=>{
    GAME.left--;
    $('g-time').textContent = Math.max(0, GAME.left);
    $('g-time').classList.toggle('low', GAME.left<=10);
    if(GAME.left<=0) lockGame(true);
  }, 1000);
}
function lockGame(timedOut){
  if(GAME.phase === 'aim'){
    stopGTimer();
    const correct = calcD(GAME.tgt);
    const err = Math.abs(D-correct)/correct*100;
    const pts = err<=2 ? 100 : err<=5 ? 80 : err<=10 ? 50 : err<=20 ? 20 : 5;
    GAME.score += pts;
    const grade = err<=2 ? t('gPerfect') : err<=5 ? t('gGood') : err<=10 ? t('gOk') : t('gMiss');
    GAME.phase = GAME.round >= GAME_ROUNDS ? 'done' : 'next';
    let msg = (timedOut===true ? t('gTimeUp')+' ' : '') + grade + '<br>' +
      tf('gYour', {y:Math.round(D), c:Math.round(correct), e:err.toFixed(1), p:pts});
    if(GAME.phase === 'done'){
      const rk = GAME.score>=270 ? t('gRank1') : GAME.score>=180 ? t('gRank2') : t('gRank3');
      msg += '<br>' + t('gFinal') + ' ' + GAME.score + ' — ' + rk;
    }
    $('g-status').innerHTML = msg;
    labSync(); gameSync();
  } else if(GAME.phase === 'next'){
    nextRound();
  } else {
    startGame();
  }
}
function gameSync(){
  $('g-round').textContent = GAME.round;
  $('g-target').textContent = tFix(GAME.tgt);
  $('g-target-side').textContent = tFix(GAME.tgt);
  $('g-time').textContent = Math.max(0, GAME.left);
  $('g-score').textContent = GAME.score;
  $('g-scene-side').textContent = t(sc().nameK)+' · v = '+sc().v+' m/s';
  syncGameBtn();
  syncSliders();
}
function syncGameBtn(){
  const b = $('g-lock');
  if(b) b.textContent = GAME.phase==='aim' ? t('gLock')
                      : GAME.phase==='next' ? t('gNextRound') : t('gPlayAgain');
  const v = $('g-vlabel');
  if(v) v.textContent = t(sc().nameK)+' · v = '+sc().v+' m/s';
}

/* ============================================================
   Canvas dragging (world coords, clamped)
============================================================ */
let dragging = false;
labCv.addEventListener('pointerdown', e=>{
  if(FIRE.on) return;
  if(ptr(e, labCv, SC).x > SCN.x1) return;   /* the formula panel is not draggable */
  dragging = true;
  try{ labCv.setPointerCapture(e.pointerId); }catch(err){}
  dragObs(e);
});
labCv.addEventListener('pointermove', e=>{ if(dragging) dragObs(e); });
labCv.addEventListener('pointerup', ()=>{ dragging=false; });
labCv.addEventListener('pointercancel', ()=>{ dragging=false; });
function dragObs(e){
  const p = ptr(e, labCv, SC);
  if(p.x > SCN.x1) return;                 /* clicks on the formula panel are not drags */
  const s = sc();
  const f = scene==='sea'
    ? clamp((p.y-SEA.top)/(SEA.bot-SEA.top), 0, 1)
    : clamp((p.x-AIR.x0)/(AIR.x1-AIR.x0), 0, 1);
  setD(s.Dmin + f*(s.Dmax-s.Dmin));
}

/* ============================================================
   Main loop & mode switching
============================================================ */
let lastT = performance.now();
function mainLoop(now){
  const dt = Math.min(0.04, (now-lastT)/1000);
  lastT = now;
  const labOn = $('panel-lab').classList.contains('on');
  const gameOn = $('panel-game').classList.contains('on');
  if(labOn || gameOn){
    if(FIRE.on){
      FIRE.p += dt/FIRE.dur;
      if(FIRE.p >= 1){ FIRE.p = 1; FIRE.on = false; labSync(); }
      else if(labOn) labSync();
    }
    drawLab();
  } else if($('panel-cmp').classList.contains('on')){
    if(CMP.running){
      CMP.p += dt/5;
      if(CMP.p >= 1){ CMP.p = 1; CMP.running = false; drawCmpBoth(); finishCmp(); }
      else drawCmpBoth();
    }
  }
  requestAnimationFrame(mainLoop);
}
function setMode(m){
  stopTimer(); stopGTimer();
  CMP.running = false; FIRE.on = false;
  for(const id of ['lab','cmp','quiz','game']){
    $('tab-'+id).classList.toggle('on', id===m);
    $('panel-'+id).classList.toggle('on', id===m);
    $('ctl-'+id).classList.toggle('on', id===m);
    $('sb-'+id).classList.toggle('on', id===m);
  }
  if(m==='lab'){ ($('panel-lab').querySelector('.cvarea')||$('panel-lab')).appendChild(labCv); labSync(); }
  if(m==='cmp'){ cmpLabels(); cmpReset(); }
  if(m==='quiz') renderQ();
  if(m==='game'){ $('game-cvhost').appendChild(labCv); startGame(); }
}

/* ---------- boot ---------- */
applyTheme();
applyLang();
syncExplain();
presetCmp(0);
renderQ();
setMode('lab');
requestAnimationFrame(mainLoop);
</script>

/* ============================================================
   Shared drawing helpers
============================================================ */
const CV_FONT = '"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
function rrect(c,x,y,w,h,r){
  c.beginPath();
  if(c.roundRect){ c.roundRect(x,y,w,h,r); return; }
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}
function circle(c,x,y,r,fill,stroke,lw){
  c.beginPath(); c.arc(x,y,r,0,Math.PI*2);
  if(fill){ c.fillStyle=fill; c.fill(); }
  if(stroke){ c.strokeStyle=stroke; c.lineWidth=lw||1.5; c.stroke(); }
}
function line(c,x1,y1,x2,y2,col,lw,dash){
  c.beginPath();
  if(c.setLineDash) c.setLineDash(dash||[]);
  c.moveTo(x1,y1); c.lineTo(x2,y2);
  c.strokeStyle=col; c.lineWidth=lw||1.5; c.stroke();
  if(c.setLineDash) c.setLineDash([]);
}
function TX(c,s,x,y,font,color,align,base){
  if(!isFinite(x)||!isFinite(y)) return;
  c.font=font; c.fillStyle=color; c.textAlign=align||'left'; c.textBaseline=base||'middle';
  c.fillText(s,x,y);
}
/* pill-backed text, clamped inside the canvas */
function tchip(c,s,x,y,font,color,align,W,H){
  c.font=font;
  const w=c.measureText(s).width;
  const m=/([\d.]+)px/.exec(font), fs=m?parseFloat(m[1]):14, h=fs+14;
  const al=align||'center';
  let x0 = al==='left' ? x : (al==='right' ? x-w : x-w/2);
  x0 = clamp(x0, 10, Math.max(10, (W||1000)-w-10));
  const yy = clamp(y, h/2+4, (H||500)-h/2-4);
  rrect(c,x0-11,yy-h/2,w+22,h,9);
  c.fillStyle=C().pill; c.fill();
  c.strokeStyle=C().pillLine; c.lineWidth=1.2; c.stroke();
  TX(c,s,x0+w/2,yy,font,color,'center','middle');
}
function ptr(ev,cv,sc){
  const r = cv.getBoundingClientRect();
  return { x:(ev.clientX-r.left)*(cv.width/r.width)/sc, y:(ev.clientY-r.top)*(cv.height/r.height)/sc };
}

/* ============================================================
   Physics: echo ranging.  d = v * t / 2   (t = round trip)
============================================================ */
const SCENES = {
  sea:{ key:'sea', v:1500, Dmin:150, Dmax:3000, step:10, nameK:'scSeaName', distK:'scSeaDist', dragK:'cvDragSea', D0:1500 },
  air:{ key:'air', v:340,  Dmin:2,   Dmax:400,  step:1,  nameK:'scAirName', distK:'scAirDist', dragK:'cvDragAir', D0:25 },
};
const MIN_T = 0.1;                       /* the ear can separate two sounds 0.1 s apart */
let scene = 'sea';
let D = SCENES.sea.D0;                   /* the one state variable: distance in metres */

function sc(){ return SCENES[scene]; }
function roundD(v){ const s=sc(); return clamp(Math.round(v/s.step)*s.step, s.Dmin, s.Dmax); }
function tripT(dd){ return 2*dd/sc().v; }          /* round-trip time (s) */
function calcD(tt){ return sc().v*tt/2; }          /* d = v * t / 2 */
function fracOf(dd){ const s=sc(); return clamp((dd-s.Dmin)/(s.Dmax-s.Dmin),0,1); }
function tFix(tt){ return tt>=1 ? tt.toFixed(2) : tt.toFixed(3); }
function canHear(tt){ return tt >= MIN_T - 1e-9; }

const SC = 2, W_W = 1000, W_H = 500;
const SCN = {x0:14, x1:616};
const SEA = {cx:296, surf:118, shipY:96, top:172, bot:436};
const AIR = {groundY:396, srcX:70, mouthY:296, x0:250, x1:580, skyTop:26};
const PN  = {x0:636, x1:988, y0:52, y1:456};

const labCv = $('cv-lab'), labCtx = labCv.getContext('2d');
const FIRE = { on:false, p:0, dur:2.4 };
let FLASH = null, CONCL = null;

function gameAiming(){ return $('panel-game').classList.contains('on') && GAME.phase==='aim'; }

function obsPos(){
  const f = fracOf(D);
  return scene==='sea' ? SEA.top + f*(SEA.bot-SEA.top) : AIR.x0 + f*(AIR.x1-AIR.x0);
}

/* ---------- scene: sea water ---------- */
function drawSea(c, hide){
  const oy = obsPos(), x0 = SCN.x0, x1 = SCN.x1, bottom = 474;
  /* sky */
  let g = c.createLinearGradient(0,20,0,SEA.surf);
  g.addColorStop(0,C().skyA); g.addColorStop(1,C().skyB);
  c.fillStyle=g; rrect(c,x0,20,x1-x0,SEA.surf-20,8); c.fill();
  /* water */
  g = c.createLinearGradient(0,SEA.surf,0,bottom);
  g.addColorStop(0,C().seaA); g.addColorStop(1,C().seaB);
  c.fillStyle=g; rrect(c,x0,SEA.surf,x1-x0,bottom-SEA.surf,8); c.fill();
  /* sea floor */
  c.beginPath(); c.moveTo(x0,bottom); c.lineTo(x0,oy+12);
  for(let x=x0;x<=x1;x+=40) c.lineTo(x, oy + Math.sin(x*0.03)*7);
  c.lineTo(x1,bottom); c.closePath();
  c.fillStyle=C().bed; c.fill();
  c.strokeStyle=C().bedLine; c.lineWidth=1.6; c.stroke();
  /* drag hint */
  line(c, x0+16, oy, x1-16, oy, C().amber, 1.8, [7,6]);
  TX(c, t('cvDragSea'), x1-24, oy-16, '700 15px '+CV_FONT, C().amber, 'right', 'middle');
  /* ship */
  TX(c, '🚢', SEA.cx, SEA.shipY, '40px '+CV_FONT, C().cvText, 'center', 'middle');
  /* distance annotation */
  const mx = SEA.cx+62;
  line(c, mx, SEA.surf, mx, oy, C().cvTextDim, 1.4);
  line(c, mx-8, SEA.surf, mx+8, SEA.surf, C().cvTextDim, 1.4);
  line(c, mx-8, oy, mx+8, oy, C().cvTextDim, 1.4);
  const lbl = hide ? tf('cvUnknown',{n:t('scSeaDist')}) : tf('cvActual',{n:t('scSeaDist'), d:Math.round(D)});
  tchip(c, lbl, mx+14, (SEA.surf+oy)/2, '700 15px '+CV_FONT, hide?C().amber:C().cvText, 'left', W_W, W_H);
  /* pulse */
  if(FIRE.on){
    const p = FIRE.p, y0 = SEA.surf+6, down = p<0.5;
    const y = down ? y0 + (oy-y0)*(p/0.5) : oy - (oy-y0)*((p-0.5)/0.5);
    if(Math.abs(p-0.5)<0.05){
      c.beginPath(); c.arc(SEA.cx, oy, 26, Math.PI, 2*Math.PI);
      c.strokeStyle=C().hit; c.lineWidth=3.4; c.stroke();
    }
    const col = down ? C().go : C().back;
    circle(c, SEA.cx, y, 10, col, null, 0);
    c.globalAlpha=.55; circle(c, SEA.cx, y, 19, null, col, 2); c.globalAlpha=1;
    TX(c, down? t('cvGo') : t('cvBack'), SEA.cx-30, y, '700 15px '+CV_FONT, col, 'right', 'middle');
  }
}

/* ---------- scene: air / cliff ---------- */
function drawAir(c, hide){
  const ox = obsPos(), x0 = SCN.x0, x1 = SCN.x1, bottom = 474;
  let g = c.createLinearGradient(0,AIR.skyTop,0,AIR.groundY);
  g.addColorStop(0,C().skyA); g.addColorStop(1,C().skyB);
  c.fillStyle=g; rrect(c,x0,AIR.skyTop,x1-x0,AIR.groundY-AIR.skyTop,8); c.fill();
  c.fillStyle=C().ground; rrect(c,x0,AIR.groundY,x1-x0,bottom-AIR.groundY,8); c.fill();
  line(c, x0, AIR.groundY, x1, AIR.groundY, C().rockLine, 2);
  /* cliff */
  c.beginPath();
  c.moveTo(ox, AIR.groundY);
  c.lineTo(ox-14, AIR.groundY-56);
  c.lineTo(ox+8,  AIR.groundY-132);
  c.lineTo(ox-5,  AIR.skyTop+22);
  c.lineTo(x1, AIR.skyTop+22); c.lineTo(x1, AIR.groundY);
  c.closePath(); c.fillStyle=C().rock; c.fill();
  c.strokeStyle=C().rockLine; c.lineWidth=1.2;
  for(let y=AIR.skyTop+50; y<AIR.groundY; y+=26){
    line(c, ox+2, y, x1, y, C().rockLine, 1);
  }
  /* reflecting face + drag hint */
  line(c, ox, AIR.skyTop+26, ox, AIR.groundY, C().amber, 1.8, [7,6]);
  TX(c, t('cvDragAir'), clamp(ox, SCN.x0+70, SCN.x1-70), AIR.skyTop+12, '700 15px '+CV_FONT, C().amber, 'center', 'middle');
  /* person */
  TX(c, '🧍', AIR.srcX, AIR.groundY-24, '46px '+CV_FONT, C().cvText, 'center', 'middle');
  /* distance annotation */
  const my = AIR.groundY+42;
  line(c, AIR.srcX, my, ox, my, C().cvTextDim, 1.4);
  line(c, AIR.srcX, my-8, AIR.srcX, my+8, C().cvTextDim, 1.4);
  line(c, ox, my-8, ox, my+8, C().cvTextDim, 1.4);
  const lbl = hide ? tf('cvUnknown',{n:t('scAirDist')}) : tf('cvActual',{n:t('scAirDist'), d:Math.round(D)});
  tchip(c, lbl, (AIR.srcX+ox)/2, my, '700 15px '+CV_FONT, hide?C().amber:C().cvText, 'center', W_W, W_H);
  /* pulse */
  if(FIRE.on){
    const p = FIRE.p, sx = AIR.srcX+18, right = p<0.5;
    const x = right ? sx + (ox-sx)*(p/0.5) : ox - (ox-sx)*((p-0.5)/0.5);
    if(Math.abs(p-0.5)<0.05){
      c.beginPath(); c.arc(ox, AIR.mouthY, 26, -Math.PI/2, Math.PI/2);
      c.strokeStyle=C().hit; c.lineWidth=3.4; c.stroke();
    }
    const col = right ? C().go : C().back;
    circle(c, x, AIR.mouthY, 10, col, null, 0);
    c.globalAlpha=.55; circle(c, x, AIR.mouthY, 19, null, col, 2); c.globalAlpha=1;
    TX(c, right? t('cvGoR') : t('cvBackR'), x, AIR.mouthY-32, '700 15px '+CV_FONT, col, 'center', 'middle');
  }
}

/* ---------- the "why divide by 2" panel ---------- */
function drawPanel(c, hide){
  const s = sc();
  const tShown = FIRE.on ? FIRE.p*tripT(D) : tripT(D);
  const tTarget = hide ? GAME.tgt : tShown;
  const dShown = calcD(tShown);
  rrect(c, PN.x0, PN.y0, PN.x1-PN.x0, PN.y1-PN.y0, 12);
  c.fillStyle=C().panel; c.fill(); c.strokeStyle=C().panelLine; c.lineWidth=1.4; c.stroke();
  const cx = (PN.x0+PN.x1)/2;
  TX(c, t('cvPanelTitle'), cx, PN.y0+28, '700 16px '+CV_FONT, C().cvTextDim, 'center', 'middle');
  TX(c, '⏱ '+tFix(tTarget)+' s', cx, PN.y0+74, '900 34px '+CV_FONT, C().amber, 'center', 'middle');

  /* total-path bar, split into "there" and "back" */
  const bx0 = PN.x0+24, bx1 = PN.x1-24, by = PN.y0+118, bh = 26, mid = (bx0+bx1)/2;
  TX(c, hide ? t('cvTotalQ') : tf('cvTotal',{s:Math.round(s.v*tShown)}), cx, by-20, '700 15px '+CV_FONT, C().cvTextDim, 'center', 'middle');
  rrect(c, bx0, by, bx1-bx0, bh, 7); c.fillStyle=C().barBg; c.fill();
  if(!hide){
    const q = FIRE.on ? FIRE.p : 1;
    const gw = Math.min(q,0.5)/0.5*(mid-bx0);
    c.fillStyle=C().go; rrect(c, bx0, by, Math.max(0,gw), bh, 7); c.fill();
    if(q>0.5){
      const bw = (q-0.5)/0.5*(bx1-mid);
      c.fillStyle=C().back; rrect(c, mid, by, Math.max(0,bw), bh, 7); c.fill();
    }
  }
  rrect(c, bx0, by, bx1-bx0, bh, 7); c.strokeStyle=C().panelLine; c.lineWidth=1.4; c.stroke();
  line(c, mid, by-7, mid, by+bh+7, C().amber, 2.2, [5,4]);
  TX(c, t('cvSegGo'),   (bx0+mid)/2, by+bh+17, '700 14px '+CV_FONT, C().go,   'center', 'middle');
  TX(c, t('cvSegBack'), (mid+bx1)/2, by+bh+17, '700 14px '+CV_FONT, C().back, 'center', 'middle');
  TX(c, t('cvWhy'), cx, by+bh+40, '700 13px '+CV_FONT, C().cvTextDim, 'center', 'middle');

  /* the formula, spelled out with live numbers */
  const fy = PN.y0+236;
  TX(c, tf('cvV',{v:s.v}), cx, fy, '700 16px '+CV_FONT, C().cvTextDim, 'center', 'middle');
  TX(c, tf('cvT',{t:tFix(tTarget)}), cx, fy+26, '700 16px '+CV_FONT, C().cvTextDim, 'center', 'middle');
  const dLine = hide ? tf('cvDQ',{v:s.v, t:tFix(tTarget)})
                     : tf('cvD',{v:s.v, t:tFix(tShown), d:Math.round(dShown)});
  TX(c, dLine, cx, fy+62, '900 17px '+CV_FONT, C().amber, 'center', 'middle');
  /* the 0.1 s / 17 m criterion */
  const tj = hide ? GAME.tgt : tripT(D);
  const okHear = canHear(tj);
  TX(c, okHear ? tf('cvJudgeOk',{t:tFix(tj)}) : tf('cvJudgeNo',{t:tFix(tj)}),
     cx, fy+100, '700 15px '+CV_FONT, okHear?C().good:C().bad, 'center', 'middle');
}

function drawLab(){
  const c = labCtx;
  c.setTransform(1,0,0,1,0,0);
  c.clearRect(0,0,labCv.width,labCv.height);
  c.setTransform(SC,0,0,SC,0,0);
  const hide = gameAiming();
  if(scene==='sea') drawSea(c,hide); else drawAir(c,hide);
  drawPanel(c,hide);
}

/* ---------- sidebar message ---------- */
function renderMsg(){
  const s = sc(), tt = tripT(D), ok = canHear(tt);
  const flash = FLASH ? '<em>'+t(FLASH)+'</em><br>' : '';
  const formula = tf('f_formula', {v:s.v, t:tFix(tt), d:Math.round(calcD(tt))});
  const live = ok ? tf('live_hear',{t:tFix(tt)}) : tf('live_no',{t:tFix(tt)});
  const tip = scene==='sea' ? t('tip_sea') : t('tip_air');
  const box = $('l-status');
  if(box) box.innerHTML = flash + formula + '<br>' + live + '<br>' + tip;
  const cb = $('l-conclude');
  if(cb){
    if(CONCL){ cb.innerHTML = t(CONCL); cb.classList.add('on'); }
    else cb.classList.remove('on');
  }
}

/* ---------- state setters ---------- */
function syncSliders(){
  const s = sc();
  [['s-d','s-d-o'],['g-d','g-d-o']].forEach(pair=>{
    const el = $(pair[0]), out = $(pair[1]);
    if(el){ el.min=s.Dmin; el.max=s.Dmax; el.step=s.step; el.value=D; }
    if(out){
      const hideNum = (pair[0]==='g-d') && gameAiming();
      out.textContent = hideNum ? '? m' : Math.round(D)+' m';
    }
  });
}
/* 解释文字默认收起来 —— 屏幕上先只留大数字，要讲的时候才点开 */
let EXPLAIN = false;
function syncExplain(){
  const box = $('l-explain'), b = $('l-exp-btn');
  if(box) box.classList.toggle('on', EXPLAIN);
  if(b){
    b.classList.toggle('open', EXPLAIN);
    const sp = b.querySelector('span');
    if(sp){ sp.dataset.i = EXPLAIN ? 'expClose' : 'expOpen'; sp.innerHTML = t(sp.dataset.i); }
  }
}
function toggleExplain(){ EXPLAIN = !EXPLAIN; syncExplain(); }

function labSync(){
  const s = sc(), tt = tripT(D), ok = canHear(tt);
  /* while the pulse is in flight the stopwatch counts up — that IS the measurement */
  const tLive = FIRE.on ? FIRE.p*tt : tt;
  if($('l-d')) $('l-d').textContent = Math.round(calcD(tLive));
  if($('l-v')) $('l-v').textContent = s.v;
  if($('l-t')) $('l-t').textContent = tFix(tLive);
  if($('l-half')) $('l-half').textContent = tFix(tLive/2);
  const bd = $('l-state');
  if(bd){
    bd.innerHTML = ok ? t('stHear')+'<small>'+t('stHearSub')+'</small>'
                      : t('stNo')+'<small>'+t('stNoSub')+'</small>';
    bd.style.color = ok ? '#1d7a3a' : '#b8432f';
    bd.style.borderColor = ok ? '#1d7a3a' : 'var(--pos)';
  }
  document.querySelectorAll('.sbtn[data-sc]').forEach(b=>b.classList.toggle('pick', b.dataset.sc===scene));
  const fb = $('btn-fire');
  if(fb) fb.textContent = FIRE.on ? t('btnFiring') : t('btnFire');
  syncSliders();
  renderMsg();
}
function setD(v){
  const before = canHear(tripT(D));
  D = roundD(v);
  const after = canHear(tripT(D));
  if(before !== after){ FLASH = after ? 'r_toHear' : 'r_toNo'; CONCL = 'c_hear'; }
  labSync();
}
function setScene(k){
  if(!SCENES[k]) return;
  scene = k; D = SCENES[k].D0;
  FIRE.on = false; FLASH = null; CONCL = null;
  labSync();
}
function labReset(){
  FIRE.on = false; FLASH = null; CONCL = null;
  D = sc().D0;
  labSync();
}
function fireSonar(){
  if(FIRE.on) return;
  FIRE.on = true; FIRE.p = 0;
  FIRE.dur = 1.6 + 2.6*fracOf(D);      /* slowed to 1.6–4.2 s so the class can watch */
  CONCL = 'c_half';
  labSync();
}

/* ---------- one-click presets (absorbs the old "can you hear the echo?" module) ---------- */
const PRESETS = {
  pr1:{ scene:'air', D:5   },
  pr2:{ scene:'air', D:17  },
  pr3:{ scene:'air', D:50  },
  pr4:{ scene:'sea', D:1500},
  pr5:{ scene:'sea', D:3000},
};
function preset(id){
  const p = PRESETS[id];
  if(!p) return;
  setMode('lab');
  scene = p.scene; D = roundD(p.D);
  FIRE.on = false; FLASH = null;
  labSync();
  CONCL = id+'why';
  renderMsg();
  fireSonar();
  CONCL = id+'why';
  renderMsg();
  const btn = document.querySelector('.rail [data-p="'+id+'"]');
  if(btn){ btn.classList.remove('flash'); void btn.offsetWidth; btn.classList.add('flash');
    setTimeout(()=>btn.classList.remove('flash'), 1800); }
}

/* ---------- data recording ---------- */
let recRows = [];
function recordData(){
  const tt = tripT(D);
  recRows.push({ scene:scene, v:sc().v, t:tFix(tt), d:Math.round(calcD(tt)) });
  if(recRows.length > 7) recRows.shift();
  renderRec();
}
function clearRec(){ recRows = []; renderRec(); }
function renderRec(){
  const body = $('rec-body');
  if(!body) return;
  let top = 0;
  recRows.forEach(r=>{ top = Math.max(top, r.d); });
  body.innerHTML = recRows.map(r=>{
    const pct = top>0 ? Math.max(6, r.d/top*100) : 0;
    const nm = r.scene==='sea' ? '🌊' : '🏔️';
    return '<tr><td>'+nm+'</td><td>'+r.v+'</td><td>'+r.t+'</td><td>'+r.d+'</td>'+
      '<td><div class="bar '+r.scene+'"><i style="width:'+pct+'%"></i></div></td></tr>';
  }).join('');
}

/* ============================================================
   Tab 2: Compare — reflection vs absorption (world 440 x 380)
============================================================ */
const CM_W = 440, CM_H = 380;
const CW = {srcX:56, wallX:322, wallW:46, cy:176, top:44, bot:300};
const CMP_PRESETS = [
  { id:0, a:{R:0.92, hard:true,  nameK:'cp1a', condK:'cp1ac'}, b:{R:0.15, hard:false, nameK:'cp1b', condK:'cp1bc'}, concl:'cc_1' },
  { id:1, a:{R:0.85, hard:true,  nameK:'cp2a', condK:'cp2ac'}, b:{R:0.25, hard:false, nameK:'cp2b', condK:'cp2bc'}, concl:'cc_2' },
  { id:2, a:{R:0.70, hard:true,  nameK:'cp3a', condK:'cp3ac'}, b:{R:0.10, hard:false, nameK:'cp3b', condK:'cp3bc'}, concl:'cc_3' },
];
const CMP = { preset:0, p:0, running:false, guess:null };
const cvA = $('cv-ca'), ctxA = cvA.getContext('2d');
const cvB = $('cv-cb'), ctxB = cvB.getContext('2d');
function side(which){ return CMP_PRESETS[CMP.preset][which]; }
function echoShown(R, p){ return R*100*clamp((p-0.12)/0.22, 0, 1); }
function echoWord(R){ return R>=0.6 ? t('wStrong') : R>=0.3 ? t('wMid') : t('wWeak'); }

function drawCmpSide(ctx, s, p){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,CM_W*SC,CM_H*SC);
  ctx.setTransform(SC,0,0,SC,0,0);
  const cy = CW.cy, srcX = CW.srcX, wallX = CW.wallX;
  const Dpx = wallX - srcX - 8;

  /* wall */
  if(s.hard){
    ctx.fillStyle=C().hardWall; rrect(ctx, wallX, CW.top, CW.wallW, CW.bot-CW.top, 4); ctx.fill();
    for(let y=CW.top+16; y<CW.bot-8; y+=22) line(ctx, wallX, y, wallX+CW.wallW, y, C().hardLine, 1.2);
  } else {
    ctx.fillStyle=C().softWall;
    for(let y=CW.top+12; y<CW.bot-6; y+=14){
      circle(ctx, wallX+9,  y,   7.5, C().softWall, null, 0);
      circle(ctx, wallX+25, y+7, 7.5, C().softWall, null, 0);
      circle(ctx, wallX+41, y,   7.5, C().softWall, null, 0);
    }
  }
  /* source */
  TX(ctx, '🧍', srcX, cy+6, '34px '+CV_FONT, C().cvText, 'center', 'middle');
  TX(ctx, t('cvSrc'), srcX, cy+40, '700 13px '+CV_FONT, C().cvTextDim, 'center', 'middle');

  /* waves: 3 round trips over p = 0..1 */
  const NW = 4, ROUND = 2*Dpx, phase = p*3;
  let hitFlash = false;
  for(let i=0;i<NW;i++){
    const r = ((phase*ROUND) + i*ROUND/NW) % ROUND;
    if(r < Dpx){
      const a = 1 - r/Dpx*0.25;
      ctx.strokeStyle = C().go; ctx.globalAlpha = a; ctx.lineWidth = 2.8;
      ctx.beginPath(); ctx.arc(srcX, cy, r+14, -0.55, 0.55); ctx.stroke();
      ctx.globalAlpha = 1;
      if(Dpx-r < 14) hitFlash = true;
    } else {
      const rr = r-Dpx, a = s.R*(1-rr/Dpx*0.35);
      if(a > 0.04){
        ctx.strokeStyle = s.hard ? C().back : C().hit;
        ctx.globalAlpha = clamp(a,0,1); ctx.lineWidth = s.hard ? 2.8 : 1.6;
        ctx.beginPath(); ctx.arc(wallX, cy, rr+12, Math.PI-0.55, Math.PI+0.55); ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }
  }
  if(hitFlash && p>0){
    ctx.strokeStyle=C().amber; ctx.lineWidth=3.4;
    ctx.beginPath(); ctx.arc(wallX, cy, 22, Math.PI-0.6, Math.PI+0.6); ctx.stroke();
  }
  if(!s.hard) TX(ctx, t('cvAbsorb'), wallX+CW.wallW/2, cy-52, '700 14px '+CV_FONT, C().hit, 'center', 'middle');

  /* readouts */
  const shown = echoShown(s.R, p);
  TX(ctx, tf('cvEcho',{r:Math.round(shown)}), CM_W/2, 334,
     '900 26px '+CV_FONT, shown>=40?C().good:(shown>=15?C().amber:C().bad), 'center', 'middle');
  TX(ctx, tf('cvRefl',{r:Math.round(s.R*100), a:Math.round((1-s.R)*100)}), CM_W/2, 362,
     '700 14px '+CV_FONT, C().cvTextDim, 'center', 'middle');
  TX(ctx, t('cvWall'), wallX+CW.wallW/2, CW.bot+18, '700 13px '+CV_FONT, C().cvTextDim, 'center', 'middle');
}
function drawCmpBoth(){
  drawCmpSide(ctxA, side('a'), CMP.p);
  drawCmpSide(ctxB, side('b'), CMP.p);
  updateCmpSide();
}
function updateCmpSide(){
  const a = side('a'), b = side('b');
  $('c-out-a').textContent = Math.round(echoShown(a.R, CMP.p));
  $('c-out-b').textContent = Math.round(echoShown(b.R, CMP.p));
  $('c-r-a').textContent = Math.round(a.R*100);
  $('c-a-a').textContent = Math.round((1-a.R)*100);
  $('c-e-a').textContent = echoWord(a.R);
  $('c-r-b').textContent = Math.round(b.R*100);
  $('c-a-b').textContent = Math.round((1-b.R)*100);
  $('c-e-b').textContent = echoWord(b.R);
}
function cmpLabels(){
  const a = side('a'), b = side('b');
  $('ca-name').textContent = t(a.nameK);
  $('cb-name').textContent = t(b.nameK);
  $('ca-cond').textContent = t(a.condK);
  $('cb-cond').textContent = t(b.condK);
  $('s-ca-name').textContent = LANG==='zh' ? '甲' : 'A';
  $('s-cb-name').textContent = LANG==='zh' ? '乙' : 'B';
}
function presetCmp(i){
  CMP.preset = i; CMP.p = 0; CMP.running = false;
  document.querySelectorAll('#ctl-cmp .btn.ghost').forEach((b,k)=>b.style.opacity = (k===i?'1':'.6'));
  clearGuess(); cmpLabels(); drawCmpBoth();
  $('cmp-fb').textContent=''; $('cmp-fb').className='feedback';
  $('cmp-conclude').classList.remove('on');
}
function cmpReset(){
  if(CMP.running) return;
  CMP.p = 0;
  cmpLabels(); drawCmpBoth();
  $('cmp-fb').textContent=''; $('cmp-fb').className='feedback';
  $('cmp-conclude').classList.remove('on');
}
function pickGuess(btn){
  document.querySelectorAll('#ctl-cmp .sbtn[data-g]').forEach(b=>b.classList.remove('pick'));
  btn.classList.add('pick');
  CMP.guess = btn.dataset.g;
  $('cmp-run').disabled = false;
}
function clearGuess(){
  document.querySelectorAll('#ctl-cmp .sbtn[data-g]').forEach(b=>b.classList.remove('pick'));
  CMP.guess = null; $('cmp-run').disabled = true;
}
function runCmp(){
  if(CMP.running) return;
  CMP.p = 0; CMP.running = true;
  $('cmp-run').disabled = true;
}
function finishCmp(){
  const a = side('a'), b = side('b');
  const real = Math.abs(a.R-b.R) < 0.03 ? 'same' : (a.R>b.R ? 'a' : 'b');
  const zh = LANG==='zh';
  const detail = (zh?'（':' (')+(zh?'甲':'A')+' '+Math.round(a.R*100)+'% · '+
                 (zh?'乙':'B')+' '+Math.round(b.R*100)+'%'+(zh?'）':')');
  const fb = $('cmp-fb');
  if(CMP.guess === real){ fb.innerHTML = t('fbRight')+detail; fb.className='feedback good'; }
  else { fb.innerHTML = t('fbWrong')+detail; fb.className='feedback bad'; }
  const box = $('cmp-conclude');
  box.innerHTML = t(CMP_PRESETS[CMP.preset].concl);
  box.classList.add('on');
  clearGuess();
}

/* ============================================================
   Tab 3: Class quiz
============================================================ */
const QUIZ_TIME = 20;
let qIdx = 0, qScore = 0, qDone = [], qTimer = null, qLeft = 0;
function stopTimer(){ if(qTimer){ clearInterval(qTimer); qTimer=null; } }
function startTimer(){
  stopTimer();
  qLeft = QUIZ_TIME;
  const bar = $('q-timer-bar');
  bar.style.width = '100%';
  $('q-timer').classList.remove('low');
  qTimer = setInterval(()=>{
    qLeft -= 0.1;
    bar.style.width = Math.max(0, qLeft/QUIZ_TIME*100)+'%';
    if(qLeft <= 5) $('q-timer').classList.add('low');
    if(qLeft <= 0){ stopTimer(); timeUpQ(); }
  }, 100);
}
function renderQ(){
  const item = QUIZ()[qIdx];
  $('q-emoji').textContent = item.e;
  $('q-text').innerHTML = (qIdx+1)+'. '+item.q;
  $('q-exp').innerHTML = '';
  $('q-next').style.display='none';
  $('q-restart').style.display='none';
  const box = $('q-opts');
  box.innerHTML = '';
  item.o.forEach((opt,i)=>{
    const b = document.createElement('button');
    b.className='qbtn';
    b.textContent = 'ABC'[i]+'. '+opt;
    b.onclick = ()=>answerQ(i,b);
    box.appendChild(b);
  });
  renderProg();
  $('q-score-n').textContent = qScore;
  if(qDone[qIdx] !== undefined){
    const btns=[...box.children];
    btns.forEach(b=>b.disabled=true);
    btns[item.a].classList.add('right');
    $('q-exp').innerHTML = item.x;
    if(qIdx < QUIZ().length-1) $('q-next').style.display='inline-block';
    else $('q-restart').style.display='inline-block';
  } else startTimer();
}
function renderProg(){
  $('q-prog').innerHTML = QUIZ().map((_,i)=>
    '<div class="qdot '+(i===qIdx?'cur ':'')+(qDone[i]===true?'right':qDone[i]===false?'wrong':'')+'"></div>').join('');
}
function finishQ(prefix, correct){
  stopTimer();
  const item = QUIZ()[qIdx];
  qDone[qIdx] = correct;
  if(correct) qScore++;
  const btns = [...$('q-opts').children];
  btns.forEach(b=>b.disabled=true);
  btns[item.a].classList.add('right');
  $('q-exp').innerHTML = prefix + item.x;
  renderProg();
  $('q-score-n').textContent = qScore;
  if(qIdx < QUIZ().length-1) $('q-next').style.display='inline-block';
  else {
    const pct = qScore/QUIZ().length;
    const msg = pct===1 ? t('resGold') : pct>=0.7 ? t('resGood') : t('resTry');
    $('q-exp').innerHTML += '<br><em>'+qScore+' / '+QUIZ().length+' — '+msg+'</em>';
    $('q-restart').style.display='inline-block';
  }
}
function answerQ(i, btn){
  if(qDone[qIdx] !== undefined) return;
  const item = QUIZ()[qIdx];
  const correct = i===item.a;
  if(!correct) btn.classList.add('wrong');
  finishQ(correct ? t('rRight')+' ' : t('rWrong')+' ', correct);
}
function timeUpQ(){
  if(qDone[qIdx] !== undefined) return;
  finishQ(t('timeUp')+' ', false);
}
function nextQ(){ qIdx++; renderQ(); }
function restartQ(){ qIdx=0; qScore=0; qDone=[]; renderQ(); }

/* ============================================================
   Tab 4: Ranging challenge (target challenge — reuses the lab canvas)
   Given a round-trip time t, the class must set d = v * t / 2 blind.
============================================================ */
const GAME_ROUNDS = 3, GAME_TIME = 40;
const GAME_POOL = [
  { scene:'sea', t:2.0 },   /* 1500 m */
  { scene:'sea', t:3.0 },   /* 2250 m */
  { scene:'sea', t:1.0 },   /*  750 m */
  { scene:'sea', t:4.0 },   /* 3000 m */
  { scene:'air', t:0.5 },   /*   85 m */
  { scene:'air', t:1.0 },   /*  170 m */
  { scene:'air', t:0.2 },   /*   34 m */
  { scene:'air', t:2.0 },   /*  340 m */
];
const GAME = { round:0, score:0, tgt:2, phase:'aim', left:GAME_TIME, timer:null, order:[] };
function stopGTimer(){ if(GAME.timer){ clearInterval(GAME.timer); GAME.timer=null; } }
function startGame(){
  GAME.round = 0; GAME.score = 0;
  $('g-score').textContent = 0;
  const idx = GAME_POOL.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const tm=idx[i]; idx[i]=idx[j]; idx[j]=tm; }
  GAME.order = idx.slice(0, GAME_ROUNDS);
  nextRound();
}
function nextRound(){
  GAME.round++;
  GAME.phase = 'aim';
  GAME.left = GAME_TIME;
  const r = GAME_POOL[GAME.order[GAME.round-1]];
  scene = r.scene; GAME.tgt = r.t;
  FIRE.on = false; FLASH = null; CONCL = null;
  /* start from the middle of the range so the slider gives nothing away */
  D = roundD((sc().Dmin + sc().Dmax)/2);
  $('g-status').innerHTML = tf('gGo', {t:tFix(GAME.tgt), sc:t(sc().nameK), v:sc().v});
  labSync(); gameSync();
  stopGTimer();
  GAME.timer = setInterval(()=>{
    GAME.left--;
    $('g-time').textContent = Math.max(0, GAME.left);
    $('g-time').classList.toggle('low', GAME.left<=10);
    if(GAME.left<=0) lockGame(true);
  }, 1000);
}
function lockGame(timedOut){
  if(GAME.phase === 'aim'){
    stopGTimer();
    const correct = calcD(GAME.tgt);
    const err = Math.abs(D-correct)/correct*100;
    const pts = err<=2 ? 100 : err<=5 ? 80 : err<=10 ? 50 : err<=20 ? 20 : 5;
    GAME.score += pts;
    const grade = err<=2 ? t('gPerfect') : err<=5 ? t('gGood') : err<=10 ? t('gOk') : t('gMiss');
    GAME.phase = GAME.round >= GAME_ROUNDS ? 'done' : 'next';
    let msg = (timedOut===true ? t('gTimeUp')+' ' : '') + grade + '<br>' +
      tf('gYour', {y:Math.round(D), c:Math.round(correct), e:err.toFixed(1), p:pts});
    if(GAME.phase === 'done'){
      const rk = GAME.score>=270 ? t('gRank1') : GAME.score>=180 ? t('gRank2') : t('gRank3');
      msg += '<br>' + t('gFinal') + ' ' + GAME.score + ' — ' + rk;
    }
    $('g-status').innerHTML = msg;
    labSync(); gameSync();
  } else if(GAME.phase === 'next'){
    nextRound();
  } else {
    startGame();
  }
}
function gameSync(){
  $('g-round').textContent = GAME.round;
  $('g-target').textContent = tFix(GAME.tgt);
  $('g-target-side').textContent = tFix(GAME.tgt);
  $('g-time').textContent = Math.max(0, GAME.left);
  $('g-score').textContent = GAME.score;
  $('g-scene-side').textContent = t(sc().nameK)+' · v = '+sc().v+' m/s';
  syncGameBtn();
  syncSliders();
}
function syncGameBtn(){
  const b = $('g-lock');
  if(b) b.textContent = GAME.phase==='aim' ? t('gLock')
                      : GAME.phase==='next' ? t('gNextRound') : t('gPlayAgain');
  const v = $('g-vlabel');
  if(v) v.textContent = t(sc().nameK)+' · v = '+sc().v+' m/s';
}

/* ============================================================
   Canvas dragging (world coords, clamped)
============================================================ */
let dragging = false;
labCv.addEventListener('pointerdown', e=>{
  if(FIRE.on) return;
  if(ptr(e, labCv, SC).x > SCN.x1) return;   /* the formula panel is not draggable */
  dragging = true;
  try{ labCv.setPointerCapture(e.pointerId); }catch(err){}
  dragObs(e);
});
labCv.addEventListener('pointermove', e=>{ if(dragging) dragObs(e); });
labCv.addEventListener('pointerup', ()=>{ dragging=false; });
labCv.addEventListener('pointercancel', ()=>{ dragging=false; });
function dragObs(e){
  const p = ptr(e, labCv, SC);
  if(p.x > SCN.x1) return;                 /* clicks on the formula panel are not drags */
  const s = sc();
  const f = scene==='sea'
    ? clamp((p.y-SEA.top)/(SEA.bot-SEA.top), 0, 1)
    : clamp((p.x-AIR.x0)/(AIR.x1-AIR.x0), 0, 1);
  setD(s.Dmin + f*(s.Dmax-s.Dmin));
}

/* ============================================================
   Main loop & mode switching
============================================================ */
let lastT = performance.now();
function mainLoop(now){
  const dt = Math.min(0.04, (now-lastT)/1000);
  lastT = now;
  const labOn = $('panel-lab').classList.contains('on');
  const gameOn = $('panel-game').classList.contains('on');
  if(labOn || gameOn){
    if(FIRE.on){
      FIRE.p += dt/FIRE.dur;
      if(FIRE.p >= 1){ FIRE.p = 1; FIRE.on = false; labSync(); }
      else if(labOn) labSync();
    }
    drawLab();
  } else if($('panel-cmp').classList.contains('on')){
    if(CMP.running){
      CMP.p += dt/5;
      if(CMP.p >= 1){ CMP.p = 1; CMP.running = false; drawCmpBoth(); finishCmp(); }
      else drawCmpBoth();
    }
  }
  requestAnimationFrame(mainLoop);
}
function setMode(m){
  stopTimer(); stopGTimer();
  CMP.running = false; FIRE.on = false;
  for(const id of ['lab','cmp','quiz','game']){
    $('tab-'+id).classList.toggle('on', id===m);
    $('panel-'+id).classList.toggle('on', id===m);
    $('ctl-'+id).classList.toggle('on', id===m);
    $('sb-'+id).classList.toggle('on', id===m);
  }
  if(m==='lab'){ ($('panel-lab').querySelector('.cvarea')||$('panel-lab')).appendChild(labCv); labSync(); }
  if(m==='cmp'){ cmpLabels(); cmpReset(); }
  if(m==='quiz') renderQ();
  if(m==='game'){ $('game-cvhost').appendChild(labCv); startGame(); }
}

/* ---------- boot ---------- */
applyTheme();
applyLang();
syncExplain();
presetCmp(0);
renderQ();
setMode('lab');
requestAnimationFrame(mainLoop);

</script>

  setVH(); window.addEventListener('resize',setVH); if(window.visualViewport) window.visualViewport.addEventListener('resize',setVH);
  window.addEventListener('message',e=>{const d=e.data;if(!d)return;if(d==='reset'||d.type==='reset')location.reload()});

})();
