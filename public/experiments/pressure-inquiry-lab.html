<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>压强探究实验室 · Pressure Inquiry · ScienceMaterial</title>
<style>
:root{
  color-scheme:light;
  --paper:#fffefb; --bg:#f2f1e9; --card:#FFFEFB; --surface:#FFFFFF;
  --ink:#1c2c42; --muted:#68786f; --line:#DDD9CF; --line2:#EDE9E0;
  --teal:#146e61; --teal-soft:#e4eee4; --gold:#b88a43; --red:#bd6151; --hot:#D9542B; --warm:#B88A43; --cool:#2C7D8C; --green:#2F7D4F;
  --app-height:100vh;
</style>
</head>
<body>

<header class="toolbar">
  <div class="hleft">
    <div class="brand">ScienceMaterial</div>
    <h1><svg width="20" height="20" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex:none;display:inline-block;vertical-align:middle"><rect width="28" height="28" rx="6" fill="#1C2C42"/><path d="M9 9H19L17.5 19C17.5 19 16 21 14 21C12 21 10.5 19 10.5 19L9 9Z" fill="#FFFEFB"/><circle cx="14" cy="14" r="2" fill="#146E61"/></svg> 🧱 <span data-i="title"></span></h1>
    <div class="sub">Pressure Inquiry · chu-yi-xia/b2-c5 · ScienceMaterial</div>
  </div>
  <div class="chips">
    <span data-i="chip1"></span>
    <span data-i="chip2"></span>
    <span style="color:var(--neg); border-color:rgba(63,208,108,.55)" data-i="chip3"></span>
  </div>
  <div class="hbtns">
    <button class="hbtn lang" id="langBtn" onclick="toggleLang()">EN</button>
    <button class="hbtn" id="themeBtn" onclick="toggleTheme()"></button>
    <button class="hbtn" onclick="toggleFull()"><span data-i="btnFull"></span></button>
    <button class="hbtn" onclick="resetActive()">↺ <span data-i="btnReset"></span></button>
  </div>
</header>

<main>
  <div class="left">
    <nav class="tabs">
      <button id="tab-lab" class="on" onclick="setMode('lab')"><span data-i="tabLab"></span></button>
      <button id="tab-cmp" onclick="setMode('cmp')"><span data-i="tabCmp"></span></button>
      <button id="tab-quiz" onclick="setMode('quiz')"><span data-i="tabQuiz"></span></button>
      <button id="tab-game" onclick="setMode('game')"><span data-i="tabGame"></span></button>
    </nav>

    <div class="stage">
      <section class="panel on" id="panel-lab">
        <div class="cvarea"><canvas id="cv-lab" width="2000" height="1000"></canvas></div>
        <div class="rail">
          <div class="rail-t" data-i="lifeLabel"></div>
          <button class="railbtn" data-life="lf1" onclick="lifeDemo('lf1')"><span data-i="lf1"></span></button>
          <button class="railbtn" data-life="lf2" onclick="lifeDemo('lf2')"><span data-i="lf2"></span></button>
          <button class="railbtn" data-life="lf3" onclick="lifeDemo('lf3')"><span data-i="lf3"></span></button>
        </div>
      </section>

      <section class="panel" id="panel-cmp">
        <div class="duo">
          <div class="box">
            <div class="track-label" id="ca-name"></div>
            <div class="cvwrap"><canvas id="cv-ca" width="880" height="760"></canvas></div>
            <div class="minictl" id="ca-cond"></div>
          </div>
          <div class="box">
            <div class="track-label" id="cb-name"></div>
            <div class="cvwrap"><canvas id="cv-cb" width="880" height="760"></canvas></div>
            <div class="minictl" id="cb-cond"></div>
          </div>
        </div>
      </section>

      <section class="panel" id="panel-quiz">
        <div class="quiz-wrap">
          <div class="q-timer" id="q-timer"><i id="q-timer-bar"></i></div>
          <div class="quiz-emoji" id="q-emoji"></div>
          <div class="quiz-q" id="q-text"></div>
          <div class="quiz-btns" id="q-opts"></div>
          <div class="quiz-exp" id="q-exp"></div>
          <div class="quiz-nav">
            <button class="btn" id="q-next" style="display:none" onclick="nextQ()"><span data-i="next"></span> ➜</button>
            <button class="btn ghost" id="q-restart" style="display:none" onclick="restartQ()">🔄 <span data-i="again"></span></button>
          </div>
        </div>
      </section>

      <section class="panel" id="panel-game">
        <div class="gamehud">
          <span class="gt"><span data-i="gRound"></span> <b id="g-round">1</b>/3</span>
          <span class="gt"><span data-i="gGoalLabel"></span> <b id="g-goal-hud">--</b></span>
          <span class="gt"><span data-i="gCurLabel"></span> <b id="g-cur-hud">--</b></span>
          <span class="gtime" id="g-time">30</span>
        </div>
        <div id="game-cvhost"></div>
      </section>
    </div>

    <div class="ctlbar">
      <div class="ctl-group on" id="ctl-lab">
        <div class="rowline">
          <label class="ctl"><span data-i="slF"></span>
            <input type="range" id="s-f" min="10" max="60" step="10" value="30" oninput="setF(+this.value)">
            <output id="s-f-o">30 N</output>
          </label>
          <span class="ctl-label" data-i="areaLabel"></span>
          <button class="sbtn mini area" data-a="5" onclick="setArea(5)"><span data-i="a5"></span></button>
          <button class="sbtn mini area" data-a="10" onclick="setArea(10)"><span data-i="a10"></span></button>
          <button class="sbtn mini area pick" data-a="20" onclick="setArea(20)"><span data-i="a20"></span></button>
          <button class="sbtn mini area" data-a="50" onclick="setArea(50)"><span data-i="a50"></span></button>
        </div>
        <div class="hint-line" data-i="labHint"></div>
      </div>

      <div class="ctl-group" id="ctl-cmp">
        <div class="rowline">
          <button class="btn ghost" style="font-size:14px; letter-spacing:0" onclick="presetCmp(0)"><span data-i="cp1"></span></button>
          <button class="btn ghost" style="font-size:14px; letter-spacing:0" onclick="presetCmp(1)"><span data-i="cp2"></span></button>
          <button class="btn ghost" style="font-size:14px; letter-spacing:0" onclick="presetCmp(2)"><span data-i="cp3"></span></button>
        </div>
        <div class="rowline">
          <span class="ctl-label" data-i="guessQ"></span>
          <button class="sbtn" data-g="a" onclick="pickGuess(this)"><span data-i="gMoreA"></span></button>
          <button class="sbtn" data-g="same" onclick="pickGuess(this)"><span data-i="gSame"></span></button>
          <button class="sbtn" data-g="b" onclick="pickGuess(this)"><span data-i="gMoreB"></span></button>
          <button class="btn" id="cmp-run" onclick="runCmp()" disabled>⬇ <span data-i="runCmp"></span></button>
        </div>
        <div class="hint-line" data-i="cmpHint"></div>
      </div>

      <div class="ctl-group" id="ctl-quiz">
        <div class="hint-line" data-i="quizHint"></div>
      </div>

      <div class="ctl-group" id="ctl-game">
        <div class="rowline">
          <label class="ctl"><span data-i="slF"></span>
            <input type="range" id="g-s-f" min="10" max="60" step="10" value="10" oninput="setF(+this.value)">
            <output id="g-s-f-o">10 N</output>
          </label>
          <span class="ctl-label" data-i="areaLabel"></span>
          <button class="sbtn mini area" data-ga="5" onclick="setArea(5)"><span data-i="a5"></span></button>
          <button class="sbtn mini area" data-ga="10" onclick="setArea(10)"><span data-i="a10"></span></button>
          <button class="sbtn mini area pick" data-ga="20" onclick="setArea(20)"><span data-i="a20"></span></button>
          <button class="sbtn mini area" data-ga="50" onclick="setArea(50)"><span data-i="a50"></span></button>
          <button class="btn" id="g-lock" onclick="lockP()">🎯</button>
        </div>
        <div class="hint-line" data-i="gHint"></div>
      </div>
    </div>
  </div>

  <aside>
    <div class="sb on" id="sb-lab">
      <div>
        <div class="sb-title" data-i="pLabel"></div>
        <div class="bigang"><b id="l-p">1.5</b><i> N/cm²</i></div>
      </div>
      <span class="netchip" id="l-state"></span>
      <div class="mini3">
        <div><span data-i="kF"></span><b id="l-f">30</b></div>
        <div><span data-i="kA"></span><b id="l-a">20</b></div>
        <div><span data-i="kPa"></span><b id="l-pa">15000</b></div>
      </div>
      <button class="explain-btn" data-exp="l" onclick="toggleExplain('l')"><span data-i="expOpen"></span></button>
      <div class="explain" id="exp-l">
        <div class="statusbox" id="l-status"></div>
        <div class="concl" id="l-conclude"></div>
      </div>
      <div class="rec-head">
        <button class="rec-btn" onclick="recordData()">📌 <span data-i="recBtn"></span></button>
        <button class="rec-clear" onclick="clearRec()" data-i="recClear"></button>
      </div>
      <table class="rec">
        <thead><tr><th data-i="thF"></th><th data-i="thA"></th><th data-i="thP"></th><th style="width:34%"></th></tr></thead>
        <tbody id="rec-body"></tbody>
      </table>
    </div>

    <div class="sb" id="sb-cmp">
      <div class="sb-title" data-i="outLabel"></div>
      <div class="cmp-angs">
        <div class="one"><span id="s-ca-name"></span><b id="c-p-a">0.0</b><em> N/cm²</em></div>
        <div class="one"><span id="s-cb-name"></span><b id="c-p-b">0.0</b><em> N/cm²</em></div>
      </div>
      <div class="mini3">
        <div><span data-i="kF"></span><b id="c-f-a">--</b></div>
        <div><span data-i="kA"></span><b id="c-a-a">--</b></div>
        <div><span data-i="kPa"></span><b id="c-pa-a">--</b></div>
      </div>
      <div class="mini3">
        <div><span data-i="kF"></span><b id="c-f-b">--</b></div>
        <div><span data-i="kA"></span><b id="c-a-b">--</b></div>
        <div><span data-i="kPa"></span><b id="c-pa-b">--</b></div>
      </div>
      <div class="feedback" id="cmp-fb"></div>
      <div class="concl" id="cmp-conclude"></div>
    </div>

    <div class="sb" id="sb-quiz">
      <div class="sb-title" data-i="score"></div>
      <div class="scorebig"><b id="q-score-n">0</b><span> / 8</span></div>
      <div class="qdots" id="q-prog"></div>
      <div class="statusbox" id="q-side-hint"></div>
    </div>

    <div class="sb" id="sb-game">
      <div>
        <div class="sb-title" data-i="gGoalLabel"></div>
        <div class="goalbig" id="g-goal-side">--</div>
      </div>
      <div>
        <div class="sb-title" data-i="gCurLabel"></div>
        <div class="bigang"><b id="g-cur-side">0.5</b><i> N/cm²</i></div>
      </div>
      <div>
        <div class="sb-title" data-i="score"></div>
        <div class="scorebig"><b id="g-score">0</b></div>
      </div>
      <div class="statusbox" id="g-status"></div>
    </div>

    <footer id="credit"></footer>
  </aside>
</main>

<script>
'use strict';
const $ = id => document.getElementById(id);
function clamp(v,a,b){ if(!isFinite(v)) return a; return v<a?a:(v>b?b:v); }

/* ============================================================
   Shared drawing helpers
============================================================ */
const CV_FONT = '"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
function rrect(c,x,y,w,h,r){
  c.beginPath();
  if(c.roundRect){ c.roundRect(x,y,w,h,r); return; }
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}
function circle(c,x,y,r,fill,stroke,lw){
  c.beginPath(); c.arc(x,y,r,0,Math.PI*2);
  if(fill){ c.fillStyle=fill; c.fill(); }
  if(stroke){ c.strokeStyle=stroke; c.lineWidth=lw||1.5; c.stroke(); }
}
function line(c,x1,y1,x2,y2,col,lw,dash){
  c.beginPath();
  if(c.setLineDash) c.setLineDash(dash||[]);
  c.moveTo(x1,y1); c.lineTo(x2,y2);
  c.strokeStyle=col; c.lineWidth=lw||1.5; c.stroke();
  if(c.setLineDash) c.setLineDash([]);
}
function TX(c,s,x,y,font,color,align,base){
  c.font=font; c.fillStyle=color; c.textAlign=align||'left'; c.textBaseline=base||'middle';
  if(!isFinite(x)||!isFinite(y)) return;
  c.fillText(s,x,y);
}
/* pill-backed text, clamped inside the canvas */
function tchip(c,s,x,y,font,color,align,W,H){
  c.font=font;
  const w=c.measureText(s).width;
  const m=/([\d.]+)px/.exec(font), fs=m?parseFloat(m[1]):14, h=fs+14;
  const al=align||'center';
  let x0 = al==='left' ? x : (al==='right' ? x-w : x-w/2);
  x0 = clamp(x0, 10, Math.max(10, (W||1000)-w-10));
  const yy = clamp(y, h/2+4, (H||500)-h/2-4);
  rrect(c,x0-11,yy-h/2,w+22,h,9);
  c.fillStyle=C().pill; c.fill();
  c.strokeStyle=C().pillLine; c.lineWidth=1.2; c.stroke();
  TX(c,s,x0+w/2,yy,font,color,'center','middle');
}
function panelLines(c, cx, yBottom, lines, font, gap, W, H){
  const F=font||('700 14px '+CV_FONT), G=gap||21;
  c.font=F;
  let w=0;
  for(let i=0;i<lines.length;i++) w=Math.max(w, c.measureText(lines[i].s).width);
  const n=lines.length;
  const x0 = clamp(cx-w/2-12, 8, Math.max(8,(W||1000)-w-32));
  const cxx = x0+w/2+12;
  const top = clamp(yBottom-(n-1)*G, G, (H||500)-8);
  rrect(c, cxx-w/2-12, top-G*0.6-4, w+24, (n-1)*G+G*1.2+8, 10);
  c.fillStyle=C().panel; c.fill();
  c.strokeStyle=C().panelLine; c.lineWidth=1.3; c.stroke();
  for(let i=0;i<n;i++) TX(c, lines[i].s, cxx, top+i*G, F, lines[i].c, 'center', 'middle');
}
function mix(c1,c2,k){
  const p = h => [parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)];
  const a=p(c1), b=p(c2), f=clamp(k,0,1);
  return 'rgb('+Math.round(a[0]+(b[0]-a[0])*f)+','+Math.round(a[1]+(b[1]-a[1])*f)+','+Math.round(a[2]+(b[2]-a[2])*f)+')';
}
function prand(i){ const v=Math.sin(i*127.1+311.7)*43758.5453; return v-Math.floor(v); }
function grp(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

/* ============================================================
   Physics (ported verbatim from the self-study version)
   P = F / A  (N/cm²) ;  Pa = F / (A/10000)
============================================================ */
const AREAS = [5, 10, 20, 50];
const FMIN = 10, FMAX = 60, FSTEP = 10;
function pressure(F,A){ return F/A; }
function paOf(F,A){ return Math.round(F/(A/10000)); }
function fmtP(v){ return Number.isInteger(v) ? String(v) : v.toFixed(1); }
function levelOf(p){ return p>=4 ? 'hi' : (p>=1.5 ? 'mid' : 'lo'); }
function lvKey(p){ const l=levelOf(p); return l==='hi'?'lvHi':(l==='mid'?'lvMid':'lvLo'); }
/* visual dent depth, world px — same shape as the source (depth ∝ P, capped) */
function depth(p){ return clamp(p*8, 4, 96); }
function bwOf(a){ return 25*Math.sqrt(a); }

const ST = { F:30, A:20 };
const VIS = { d:depth(1.5), bw:bwOf(20) };

function drawScene(c, o){
  /* o = {W,H, x0,x1,top,h, d, bw, F, A, drop, wH, blockH, small} */
  const cx = (o.x0+o.x1)/2, top = o.top, d = o.d, half = o.bw/2 + o.shoulder;
  const tableY = top + o.h;

  /* table */
  c.fillStyle = C().table;
  c.fillRect(0, tableY, o.W, o.H-tableY);
  line(c, 0, tableY, o.W, tableY, C().tableLine, 2.2);

  /* sponge body with the dented top */
  c.beginPath();
  c.moveTo(o.x0, top);
  c.lineTo(cx-half-o.shoulder*1.6, top);
  c.bezierCurveTo(cx-half, top, cx-half, top+d, cx-half+o.shoulder, top+d);
  c.lineTo(cx+half-o.shoulder, top+d);
  c.bezierCurveTo(cx+half, top+d, cx+half, top, cx+half+o.shoulder*1.6, top);
  c.lineTo(o.x1, top);
  c.lineTo(o.x1, tableY);
  c.lineTo(o.x0, tableY);
  c.closePath();
  c.fillStyle = C().sponge; c.fill();
  c.strokeStyle = C().spongeDark; c.lineWidth = o.small?2.2:3; c.lineJoin='round'; c.stroke();

  /* pores */
  const nPore = o.small ? 12 : 18;
  for(let i=0;i<nPore;i++){
    const px = o.x0+18 + prand(i*2+1)*(o.x1-o.x0-36);
    const py = top+22 + prand(i*2+2)*(o.h-40);
    if(py < top + d + 14 && Math.abs(px-cx) < half) continue;
    c.beginPath();
    c.ellipse(px, py, 3.5+(i%3), 2.8+(i%2), 0, 0, Math.PI*2);
    c.fillStyle = C().pore; c.fill();
  }

  /* compressed zone: hotter colour as P grows */
  const heat = clamp(pressure(o.F,o.A)/10, 0, 1);
  const hotCol = mix(C().sponge, C().spongeHot, heat);
  rrect(c, cx-half+o.shoulder, top+d, (half-o.shoulder)*2, o.small?8:11, 4);
  c.fillStyle = hotCol; c.globalAlpha = 0.9; c.fill(); c.globalAlpha = 1;

  /* pressure plate */
  const blockTop = top + d - o.blockH;
  rrect(c, cx-o.bw/2, blockTop, o.bw, o.blockH, 4);
  c.fillStyle = C().block; c.fill();
  c.strokeStyle = C().blockEdge; c.lineWidth = o.small?1.8:2.4; c.stroke();

  /* weight stack */
  const n = Math.round(o.F/FSTEP);
  const wW = o.small ? 62 : 88, wH = o.wH;
  let stackTop = blockTop;
  for(let i=0;i<n;i++){
    const y = blockTop - (i+1)*wH - 2 - o.drop;
    stackTop = y;
    rrect(c, cx-wW/2, y, wW, wH-3, 5);
    c.fillStyle = C().weight; c.fill();
    c.strokeStyle = C().weightEdge; c.lineWidth = 1.6; c.stroke();
    rrect(c, cx-wW/2+6, y+3, wW-12, 4, 2);
    c.fillStyle = C().weightGloss; c.fill();
    TX(c, '10N', cx, y+wH/2-1, '700 13px '+CV_FONT, C().weightText, 'center', 'middle');
  }

  /* downward force arrow */
  const aLen = o.small ? (14+n*5) : (20+n*6);
  const aBot = stackTop - (o.small?8:12);
  const aTop = aBot - aLen;
  line(c, cx, aTop, cx, aBot, C().force, o.small?4:5);
  c.beginPath();
  c.moveTo(cx-(o.small?7:9), aBot-3);
  c.lineTo(cx, aBot+(o.small?8:11));
  c.lineTo(cx+(o.small?7:9), aBot-3);
  c.closePath();
  c.fillStyle = C().force; c.fill();
  TX(c, tf('cvForce',{f:o.F}), cx+(o.small?12:16), (aTop+aBot)/2, (o.small?'900 14px ':'900 18px ')+CV_FONT, C().force, 'left', 'middle');

  /* dent gauge */
  if(d > (o.small?8:10)){
    const gx = cx + half + (o.small?26:40);
    line(c, gx, top, gx, top+d, C().gauge, 1.6);
    line(c, gx-6, top, gx+6, top, C().gauge, 1.6);
    line(c, gx-6, top+d, gx+6, top+d, C().gauge, 1.6);
    TX(c, t('cvDent'), gx+9, top+d/2, (o.small?'700 13px ':'700 15px ')+CV_FONT, C().cvTextDim, 'left', 'middle');
  }
  return { cx:cx, tableY:tableY };
}

function drawLab(){
  const c = labCtx;
  c.setTransform(1,0,0,1,0,0);
  c.clearRect(0,0,labCv.width,labCv.height);
  c.setTransform(SC,0,0,SC,0,0);
  const p = curP();

  drawScene(c, {
    W:W_W, H:W_H, x0:SP.x0, x1:SP.x1, top:SP.top, h:SP.h,
    d:VIS.d, bw:VIS.bw, F:ST.F, A:ST.A, drop:0,
    wH:26, blockH:20, shoulder:18, small:false
  });

  /* captions */
  tchip(c, tf('cvTitle',{f:ST.F, a:ST.A}), SP.x0-6, 28, '700 18px '+CV_FONT, C().cvText, 'left', W_W, W_H);
  tchip(c, tf('cvArea',{a:ST.A}), SCX, 470, '900 18px '+CV_FONT, C().area, 'center', W_W, W_H);

  /* ---- P–A chart at fixed F ---- */
  const GX = a => PC.x0 + clamp(a,0,A_XMAX)/A_XMAX*(PC.x1-PC.x0);
  const GY = v => PC.y1 - clamp(v,0,P_YMAX)/P_YMAX*(PC.y1-PC.y0);
  rrect(c, PC.x0, PC.y0, PC.x1-PC.x0, PC.y1-PC.y0, 8);
  c.fillStyle=C().panel; c.fill(); c.strokeStyle=C().panelLine; c.lineWidth=1.3; c.stroke();
  [0,3,6,9,12].forEach(v=>{
    const yy = GY(v);
    line(c, PC.x0, yy, PC.x1, yy, v===0?C().axis:C().grid, v===0?1.8:1);
    TX(c, String(v), PC.x0-8, yy, '700 13px '+CV_FONT, C().cvTextDim, 'right', 'middle');
  });
  [0,10,20,30,40,50].forEach(a=>{
    line(c, GX(a), PC.y0, GX(a), PC.y1, a===0?C().axis:C().grid, a===0?1.8:1);
    TX(c, String(a), GX(a), PC.y1+16, '700 13px '+CV_FONT, C().cvTextDim, 'center', 'middle');
  });
  c.beginPath();
  const aStart = Math.max(3, ST.F/P_YMAX);
  for(let i=0;i<=70;i++){
    const a = aStart + (A_XMAX-aStart)*i/70;
    const x = GX(a), y = GY(ST.F/a);
    if(i===0) c.moveTo(x,y); else c.lineTo(x,y);
  }
  c.strokeStyle=C().gold; c.lineWidth=3.2; c.lineCap='round'; c.stroke();
  AREAS.forEach(a=>{
    circle(c, GX(a), GY(ST.F/a), 4.4, C().panel, C().gold, 2);
  });
  line(c, GX(ST.A), PC.y0, GX(ST.A), GY(p), C().force, 1.6, [5,4]);
  circle(c, GX(ST.A), GY(p), 7.5, C().force, C().pill, 2.6);
  TX(c, t('cvCurve'), (PC.x0+PC.x1)/2, PC.y0-16, '700 16px '+CV_FONT, C().cvTextDim, 'center', 'middle');
  TX(c, t('cvAxisA'), PC.x1, PC.y1+36, '700 14px '+CV_FONT, C().cvTextDim, 'right', 'middle');
  TX(c, t('cvAxisP'), PC.x0, PC.y0-36, '700 14px '+CV_FONT, C().cvTextDim, 'left', 'middle');

  /* ---- live readout panel under the chart ---- */
  const lvCol = levelOf(p)==='hi' ? C().force : levelOf(p)==='mid' ? C().gold : C().area;
  panelLines(c, (PC.x0+PC.x1)/2, 420, [
    {s:tf('cvPnow',{f:ST.F, a:ST.A, p:fmtP(p)}), c:lvCol},
    {s:tf('cvPa',{pa:grp(paOf(ST.F,ST.A))}), c:C().cvTextDim},
    {s:tf('cvDentLv',{lv:t(lvKey(p))}), c:C().cvText}
  ], '700 16px '+CV_FONT, 23, W_W, W_H);
}
function easeVis(dt){
  const k = Math.min(1, dt*6);
  VIS.d  += (depth(curP()) - VIS.d)*k;
  VIS.bw += (bwOf(ST.A) - VIS.bw)*k;
}

const CM_W = 440, CM_H = 380;
const CSP = { x0:26, x1:414, top:245, h:88 };
function depthC(p){ return clamp(p*5.8, 3, 70); }
function bwC(a){ return 17*Math.sqrt(a); }
const CMP_PRESETS = [
  { id:0, a:{F:30, A:10, nameK:'cp1a'}, b:{F:30, A:50, nameK:'cp1b'}, concl:'cc_1' },
  { id:1, a:{F:20, A:20, nameK:'cp2a'}, b:{F:60, A:20, nameK:'cp2b'}, concl:'cc_2' },
  { id:2, a:{F:20, A:5,  nameK:'cp3a'}, b:{F:60, A:20, nameK:'cp3b'}, concl:'cc_3' },
];
const CMP = { preset:0, p:0, running:false, guess:null };
const cvA = $('cv-ca'), ctxA = cvA.getContext('2d');
const cvB = $('cv-cb'), ctxB = cvB.getContext('2d');
function side(which){ return CMP_PRESETS[CMP.preset][which]; }

function drawCmpSide(ctx, s, prog){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,CM_W*SC,CM_H*SC);
  ctx.setTransform(SC,0,0,SC,0,0);
  const e = prog*prog*(3-2*prog);
  const pFull = pressure(s.F, s.A);
  const d = depthC(pFull)*e;
  const drop = (1-e)*16;

  drawScene(ctx, {
    W:CM_W, H:CM_H, x0:CSP.x0, x1:CSP.x1, top:CSP.top, h:CSP.h,
    d:d, bw:bwC(s.A), F:s.F, A:s.A, drop:drop,

  });

  const col = e>0.98 ? (levelOf(pFull)==='hi'?C().force:levelOf(pFull)==='mid'?C().gold:C().area) : C().cvTextDim;
  TX(ctx, tf('cvPbig',{p:fmtP(Math.round(shown*10)/10)}), CM_W/2, 352, '900 26px '+CV_FONT, col, 'center', 'middle');

function drawCmpBoth(){

function updateCmpSide(){

}
function cmpLabels(){

  $('ca-name').textContent = t(a.nameK);
  $('cb-name').textContent = t(b.nameK);
  $('ca-cond').textContent = tf('condLine',{f:a.F, a:a.A});

}
function presetCmp(i){

  document.querySelectorAll('#ctl-cmp .btn.ghost').forEach((b,k)=>b.style.opacity = (k===i?'1':'.6'));

}
function cmpReset(){

  CMP.p = 0;
  cmpLabels(); drawCmpBoth();
  $('cmp-fb').textContent=''; $('cmp-fb').className='feedback';
  $('cmp-conclude').classList.remove('on');
}
function pickGuess(btn){
  document.querySelectorAll('#ctl-cmp .sbtn[data-g]').forEach(b=>b.classList.remove('pick'));
  btn.classList.add('pick');
  CMP.guess = btn.dataset.g;
  $('cmp-run').disabled = false;
}
function clearGuess(){
  document.querySelectorAll('#ctl-cmp .sbtn[data-g]').forEach(b=>b.classList.remove('pick'));
  CMP.guess = null; $('cmp-run').disabled = true;
}
function runCmp(){
  if(CMP.running) return;
  CMP.p = 0; CMP.running = true;
  $('cmp-run').disabled = true;
}
function finishCmp(){
  const a = side('a'), b = side('b');
  const pa = pressure(a.F,a.A), pb = pressure(b.F,b.A);
  const real = Math.abs(pa-pb) < 1e-9 ? 'same' : (pa>pb ? 'a' : 'b');
  const nA = LANG==='zh' ? '甲' : 'A', nB = LANG==='zh' ? '乙' : 'B';
  const detail = '（'+nA+' '+fmtP(pa)+' · '+nB+' '+fmtP(pb)+' N/cm²）';
  const fb = $('cmp-fb');
  if(CMP.guess === real){ fb.innerHTML = t('fbRight')+detail; fb.className='feedback good'; }
  else { fb.innerHTML = t('fbWrong')+detail; fb.className='feedback bad'; }

  box.classList.add('on');

}

/* ============================================================
   Tab 3: Class quiz
============================================================ */
const QUIZ_TIME = 20;
let qIdx = 0, qScore = 0, qDone = [], qTimer = null, qLeft = 0;
function stopTimer(){ if(qTimer){ clearInterval(qTimer); qTimer=null; } }
function startTimer(){
  stopTimer();
  qLeft = QUIZ_TIME;
  const bar = $('q-timer-bar');
  bar.style.width = '100%';
  $('q-timer').classList.remove('low');
  qTimer = setInterval(()=>{
    qLeft -= 0.1;
    bar.style.width = Math.max(0, qLeft/QUIZ_TIME*100)+'%';
    if(qLeft <= 5) $('q-timer').classList.add('low');
    if(qLeft <= 0){ stopTimer(); timeUpQ(); }
  }, 100);
}
function renderQ(){
  const item = QUIZ()[qIdx];
  $('q-emoji').textContent = item.e;
  $('q-text').innerHTML = (qIdx+1)+'. '+item.q;
  $('q-exp').innerHTML = '';
  $('q-next').style.display='none';
  $('q-restart').style.display='none';
  const box = $('q-opts');
  box.innerHTML = '';
  item.o.forEach((opt,i)=>{
    const b = document.createElement('button');
    b.className='qbtn';
    b.textContent = 'ABC'[i]+'. '+opt;
    b.onclick = ()=>answerQ(i,b);
    box.appendChild(b);
  });
  renderProg();
  $('q-score-n').textContent = qScore;
  if(qDone[qIdx] !== undefined){
    const btns=[...box.children];
    btns.forEach(b=>b.disabled=true);
    btns[item.a].classList.add('right');
    $('q-exp').innerHTML = item.x;
    if(qIdx < QUIZ().length-1) $('q-next').style.display='inline-block';
    else $('q-restart').style.display='inline-block';
  } else startTimer();
}
function renderProg(){
  $('q-prog').innerHTML = QUIZ().map((_,i)=>
    '<div class="qdot '+(i===qIdx?'cur ':'')+(qDone[i]===true?'right':qDone[i]===false?'wrong':'')+'"></div>').join('');
}
function finishQ(prefix, correct){
  stopTimer();
  const item = QUIZ()[qIdx];
  qDone[qIdx] = correct;
  if(correct) qScore++;
  const btns = [...$('q-opts').children];
  btns.forEach(b=>b.disabled=true);
  btns[item.a].classList.add('right');
  $('q-exp').innerHTML = prefix + item.x;
  renderProg();
  $('q-score-n').textContent = qScore;
  if(qIdx < QUIZ().length-1) $('q-next').style.display='inline-block';
  else {
    const pct = qScore/QUIZ().length;
    const msg = pct===1 ? t('resGold') : pct>=0.7 ? t('resGood') : t('resTry');
    $('q-exp').innerHTML += '<br><em>'+qScore+' / '+QUIZ().length+' — '+msg+'</em>';
    $('q-restart').style.display='inline-block';
  }
}
function answerQ(i, btn){
  if(qDone[qIdx] !== undefined) return;
  const item = QUIZ()[qIdx];
  const correct = i===item.a;
  if(!correct) btn.classList.add('wrong');
  finishQ(correct ? t('rRight')+' ' : t('rWrong')+' ', correct);
}
function timeUpQ(){
  if(qDone[qIdx] !== undefined) return;
  finishQ(t('timeUp')+' ', false);
}
function nextQ(){ qIdx++; renderQ(); }
function restartQ(){ qIdx=0; qScore=0; qDone=[]; renderQ(); }

/* ============================================================
   Tab 4: Target challenge (reuses the demo-lab engine & canvas)
============================================================ */
const GAME_ROUNDS = 3, GAME_TIME = 30;
const GOAL_POOL = [2, 1, 3, 0.6, 4, 1.5, 6, 2.5];
const GAME = { round:0, score:0, goal:2, phase:'aim', left:GAME_TIME, timer:null, order:[] };
function stopGTimer(){ if(GAME.timer){ clearInterval(GAME.timer); GAME.timer=null; } }
function startGame(){
  GAME.round = 0; GAME.score = 0;
  $('g-score').textContent = 0;
  const idx = GOAL_POOL.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const tmp=idx[i]; idx[i]=idx[j]; idx[j]=tmp; }
  GAME.order = idx.slice(0, GAME_ROUNDS);
  nextRound();
}
function nextRound(){
  GAME.round++;
  GAME.phase = 'aim';
  GAME.left = GAME_TIME;
  GAME.goal = GOAL_POOL[GAME.order[GAME.round-1]];
  ST.F = 10; ST.A = 20;
  FLASH = null; CONCL = null;
  VIS.d = depth(curP()); VIS.bw = bwOf(ST.A);
  syncAll();
  $('g-status').innerHTML = tf('gGo', {g:fmtP(GAME.goal)});
  gameSync();
  stopGTimer();
  GAME.timer = setInterval(()=>{
    GAME.left--;
    $('g-time').textContent = Math.max(0, GAME.left);
    $('g-time').classList.toggle('low', GAME.left<=10);
    if(GAME.left<=0) lockP(true);
  }, 1000);
}
function lockP(timedOut){
  if(GAME.phase==='aim'){
    stopGTimer();
    const p = curP();
    const err = Math.abs(p-GAME.goal)/GAME.goal;
    const pts = err<=0.001 ? 100 : err<=0.1 ? 80 : err<=0.25 ? 50 : err<=0.5 ? 20 : 5;
    GAME.score += pts;
    const msg = (timedOut===true ? t('gTimeUp')+' ' : '') +
      (err<=0.001 ? t('gPerfect') : err<=0.1 ? t('gGood') : err<=0.25 ? t('gOk') : t('gMiss'));
    GAME.phase = GAME.round >= GAME_ROUNDS ? 'done' : 'next';
    const tail = '（'+fmtP(p)+' vs '+fmtP(GAME.goal)+' · +'+pts+'）';
    if(GAME.phase==='done'){
      const rk = GAME.score>=270 ? t('gRank1') : GAME.score>=180 ? t('gRank2') : t('gRank3');
      $('g-status').innerHTML = msg+tail+'<br>'+t('gFinal')+' '+GAME.score+' — '+rk;
    } else {
      $('g-status').innerHTML = msg+tail;
    }
    gameSync();
  } else if(GAME.phase==='next'){
    nextRound();
  } else {
    startGame();
  }
}
function syncGameBtn(){
  const b = $('g-lock');
  if(!b) return;
  b.textContent = GAME.phase==='aim' ? '🎯 '+t('gLock')
                : GAME.phase==='next' ? t('gNextRound')+' ➜'
                : '🔄 '+t('gPlayAgain');
}
function gameSync(){
  $('g-round').textContent = Math.max(1, GAME.round);
  $('g-time').textContent = Math.max(0, GAME.left);
  $('g-goal-hud').textContent = fmtP(GAME.goal);
  $('g-goal-side').textContent = fmtP(GAME.goal)+' N/cm²';
  $('g-cur-hud').textContent = fmtP(curP());
  $('g-cur-side').textContent = fmtP(curP());
  $('g-score').textContent = GAME.score;
  syncGameBtn();
  const frozen = GAME.phase!=='aim';
  document.querySelectorAll('#ctl-game .sbtn[data-ga]').forEach(b=>{ b.disabled = frozen; });
  if($('g-s-f')) $('g-s-f').disabled = frozen;
}

/* ============================================================
   Main loop & mode switching
============================================================ */
let lastT = performance.now();
function mainLoop(now){
  const dt = Math.min(0.04, (now-lastT)/1000);
  lastT = now;
  const labOn = $('panel-lab').classList.contains('on');
  const gameOn = $('panel-game').classList.contains('on');
  if(labOn || gameOn){
    easeVis(dt);
    drawLab();
  } else if($('panel-cmp').classList.contains('on')){
    if(CMP.running){
      CMP.p += dt/2.4;
      if(CMP.p >= 1){ CMP.p = 1; CMP.running = false; drawCmpBoth(); finishCmp(); }
      else drawCmpBoth();
    }
  }
  requestAnimationFrame(mainLoop);
}
function setMode(m){
  stopTimer(); stopGTimer(); stopLife();
  CMP.running = false;
  for(const id of ['lab','cmp','quiz','game']){
    $('tab-'+id).classList.toggle('on', id===m);
    $('panel-'+id).classList.toggle('on', id===m);
    $('ctl-'+id).classList.toggle('on', id===m);
    $('sb-'+id).classList.toggle('on', id===m);
  }
  if(m==='lab'){ ($('panel-lab').querySelector('.cvarea')||$('panel-lab')).appendChild(labCv); if($('s-f')) $('s-f').disabled=false; syncAll(); }
  if(m==='cmp'){ cmpLabels(); cmpReset(); }
  if(m==='quiz') renderQ();
  if(m==='game'){ $('game-cvhost').appendChild(labCv); startGame(); }
}

/* ---------- boot ---------- */
applyTheme();
applyLang();
syncExplain();
labReset();
presetCmp(0);
renderQ();
setMode('lab');
requestAnimationFrame(mainLoop);
</script>

/* ============================================================
   Shared drawing helpers
============================================================ */
const CV_FONT = '"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
function rrect(c,x,y,w,h,r){
  c.beginPath();
  if(c.roundRect){ c.roundRect(x,y,w,h,r); return; }
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}
function circle(c,x,y,r,fill,stroke,lw){
  c.beginPath(); c.arc(x,y,r,0,Math.PI*2);
  if(fill){ c.fillStyle=fill; c.fill(); }
  if(stroke){ c.strokeStyle=stroke; c.lineWidth=lw||1.5; c.stroke(); }
}
function line(c,x1,y1,x2,y2,col,lw,dash){
  c.beginPath();
  if(c.setLineDash) c.setLineDash(dash||[]);
  c.moveTo(x1,y1); c.lineTo(x2,y2);
  c.strokeStyle=col; c.lineWidth=lw||1.5; c.stroke();
  if(c.setLineDash) c.setLineDash([]);
}
function TX(c,s,x,y,font,color,align,base){
  c.font=font; c.fillStyle=color; c.textAlign=align||'left'; c.textBaseline=base||'middle';
  if(!isFinite(x)||!isFinite(y)) return;
  c.fillText(s,x,y);
}
/* pill-backed text, clamped inside the canvas */
function tchip(c,s,x,y,font,color,align,W,H){
  c.font=font;
  const w=c.measureText(s).width;
  const m=/([\d.]+)px/.exec(font), fs=m?parseFloat(m[1]):14, h=fs+14;
  const al=align||'center';
  let x0 = al==='left' ? x : (al==='right' ? x-w : x-w/2);
  x0 = clamp(x0, 10, Math.max(10, (W||1000)-w-10));
  const yy = clamp(y, h/2+4, (H||500)-h/2-4);
  rrect(c,x0-11,yy-h/2,w+22,h,9);
  c.fillStyle=C().pill; c.fill();
  c.strokeStyle=C().pillLine; c.lineWidth=1.2; c.stroke();
  TX(c,s,x0+w/2,yy,font,color,'center','middle');
}
function panelLines(c, cx, yBottom, lines, font, gap, W, H){
  const F=font||('700 14px '+CV_FONT), G=gap||21;
  c.font=F;
  let w=0;
  for(let i=0;i<lines.length;i++) w=Math.max(w, c.measureText(lines[i].s).width);
  const n=lines.length;
  const x0 = clamp(cx-w/2-12, 8, Math.max(8,(W||1000)-w-32));
  const cxx = x0+w/2+12;
  const top = clamp(yBottom-(n-1)*G, G, (H||500)-8);
  rrect(c, cxx-w/2-12, top-G*0.6-4, w+24, (n-1)*G+G*1.2+8, 10);
  c.fillStyle=C().panel; c.fill();
  c.strokeStyle=C().panelLine; c.lineWidth=1.3; c.stroke();
  for(let i=0;i<n;i++) TX(c, lines[i].s, cxx, top+i*G, F, lines[i].c, 'center', 'middle');
}
function mix(c1,c2,k){
  const p = h => [parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)];
  const a=p(c1), b=p(c2), f=clamp(k,0,1);
  return 'rgb('+Math.round(a[0]+(b[0]-a[0])*f)+','+Math.round(a[1]+(b[1]-a[1])*f)+','+Math.round(a[2]+(b[2]-a[2])*f)+')';
}
function prand(i){ const v=Math.sin(i*127.1+311.7)*43758.5453; return v-Math.floor(v); }
function grp(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

/* ============================================================
   Physics (ported verbatim from the self-study version)
   P = F / A  (N/cm²) ;  Pa = F / (A/10000)
============================================================ */
const AREAS = [5, 10, 20, 50];
const FMIN = 10, FMAX = 60, FSTEP = 10;
function pressure(F,A){ return F/A; }
function paOf(F,A){ return Math.round(F/(A/10000)); }
function fmtP(v){ return Number.isInteger(v) ? String(v) : v.toFixed(1); }
function levelOf(p){ return p>=4 ? 'hi' : (p>=1.5 ? 'mid' : 'lo'); }
function lvKey(p){ const l=levelOf(p); return l==='hi'?'lvHi':(l==='mid'?'lvMid':'lvLo'); }
/* visual dent depth, world px — same shape as the source (depth ∝ P, capped) */
function depth(p){ return clamp(p*8, 4, 96); }
function bwOf(a){ return 25*Math.sqrt(a); }

/* ============================================================
   Tab 1: Demo lab (world 1000 x 500, canvas at 2x)
============================================================ */
const SC = 2, W_W = 1000, W_H = 500;
const SP = { x0:70, x1:580, top:320, h:120 };
const SCX = (SP.x0+SP.x1)/2;
const TBY = SP.top + SP.h;
const PC = { x0:660, x1:962, y0:96, y1:300 };
const P_YMAX = 12.6, A_XMAX = 56;

const labCv = $('cv-lab'), labCtx = labCv.getContext('2d');
const ST = { F:30, A:20 };
const VIS = { d:depth(1.5), bw:bwOf(20) };
let FLASH = null, CONCL = null;

function curP(){ return pressure(ST.F, ST.A); }

function drawScene(c, o){
  /* o = {W,H, x0,x1,top,h, d, bw, F, A, drop, wH, blockH, small} */
  const cx = (o.x0+o.x1)/2, top = o.top, d = o.d, half = o.bw/2 + o.shoulder;
  const tableY = top + o.h;

  /* table */
  c.fillStyle = C().table;
  c.fillRect(0, tableY, o.W, o.H-tableY);
  line(c, 0, tableY, o.W, tableY, C().tableLine, 2.2);

  /* sponge body with the dented top */
  c.beginPath();
  c.moveTo(o.x0, top);
  c.lineTo(cx-half-o.shoulder*1.6, top);
  c.bezierCurveTo(cx-half, top, cx-half, top+d, cx-half+o.shoulder, top+d);
  c.lineTo(cx+half-o.shoulder, top+d);
  c.bezierCurveTo(cx+half, top+d, cx+half, top, cx+half+o.shoulder*1.6, top);
  c.lineTo(o.x1, top);
  c.lineTo(o.x1, tableY);
  c.lineTo(o.x0, tableY);
  c.closePath();
  c.fillStyle = C().sponge; c.fill();
  c.strokeStyle = C().spongeDark; c.lineWidth = o.small?2.2:3; c.lineJoin='round'; c.stroke();

  /* pores */
  const nPore = o.small ? 12 : 18;
  for(let i=0;i<nPore;i++){
    const px = o.x0+18 + prand(i*2+1)*(o.x1-o.x0-36);
    const py = top+22 + prand(i*2+2)*(o.h-40);
    if(py < top + d + 14 && Math.abs(px-cx) < half) continue;
    c.beginPath();
    c.ellipse(px, py, 3.5+(i%3), 2.8+(i%2), 0, 0, Math.PI*2);
    c.fillStyle = C().pore; c.fill();
  }

  /* compressed zone: hotter colour as P grows */
  const heat = clamp(pressure(o.F,o.A)/10, 0, 1);
  const hotCol = mix(C().sponge, C().spongeHot, heat);
  rrect(c, cx-half+o.shoulder, top+d, (half-o.shoulder)*2, o.small?8:11, 4);
  c.fillStyle = hotCol; c.globalAlpha = 0.9; c.fill(); c.globalAlpha = 1;

  /* pressure plate */
  const blockTop = top + d - o.blockH;
  rrect(c, cx-o.bw/2, blockTop, o.bw, o.blockH, 4);
  c.fillStyle = C().block; c.fill();
  c.strokeStyle = C().blockEdge; c.lineWidth = o.small?1.8:2.4; c.stroke();

  /* weight stack */
  const n = Math.round(o.F/FSTEP);
  const wW = o.small ? 62 : 88, wH = o.wH;
  let stackTop = blockTop;
  for(let i=0;i<n;i++){
    const y = blockTop - (i+1)*wH - 2 - o.drop;
    stackTop = y;
    rrect(c, cx-wW/2, y, wW, wH-3, 5);
    c.fillStyle = C().weight; c.fill();
    c.strokeStyle = C().weightEdge; c.lineWidth = 1.6; c.stroke();
    rrect(c, cx-wW/2+6, y+3, wW-12, 4, 2);
    c.fillStyle = C().weightGloss; c.fill();
    TX(c, '10N', cx, y+wH/2-1, '700 13px '+CV_FONT, C().weightText, 'center', 'middle');
  }

  /* downward force arrow */
  const aLen = o.small ? (14+n*5) : (20+n*6);
  const aBot = stackTop - (o.small?8:12);
  const aTop = aBot - aLen;
  line(c, cx, aTop, cx, aBot, C().force, o.small?4:5);
  c.beginPath();
  c.moveTo(cx-(o.small?7:9), aBot-3);
  c.lineTo(cx, aBot+(o.small?8:11));
  c.lineTo(cx+(o.small?7:9), aBot-3);
  c.closePath();
  c.fillStyle = C().force; c.fill();
  TX(c, tf('cvForce',{f:o.F}), cx+(o.small?12:16), (aTop+aBot)/2, (o.small?'900 14px ':'900 18px ')+CV_FONT, C().force, 'left', 'middle');

  /* dent gauge */
  if(d > (o.small?8:10)){
    const gx = cx + half + (o.small?26:40);
    line(c, gx, top, gx, top+d, C().gauge, 1.6);
    line(c, gx-6, top, gx+6, top, C().gauge, 1.6);
    line(c, gx-6, top+d, gx+6, top+d, C().gauge, 1.6);
    TX(c, t('cvDent'), gx+9, top+d/2, (o.small?'700 13px ':'700 15px ')+CV_FONT, C().cvTextDim, 'left', 'middle');
  }
  return { cx:cx, tableY:tableY };
}

function drawLab(){
  const c = labCtx;
  c.setTransform(1,0,0,1,0,0);
  c.clearRect(0,0,labCv.width,labCv.height);
  c.setTransform(SC,0,0,SC,0,0);
  const p = curP();

  drawScene(c, {
    W:W_W, H:W_H, x0:SP.x0, x1:SP.x1, top:SP.top, h:SP.h,
    d:VIS.d, bw:VIS.bw, F:ST.F, A:ST.A, drop:0,
    wH:26, blockH:20, shoulder:18, small:false
  });

  /* captions */
  tchip(c, tf('cvTitle',{f:ST.F, a:ST.A}), SP.x0-6, 28, '700 18px '+CV_FONT, C().cvText, 'left', W_W, W_H);
  tchip(c, tf('cvArea',{a:ST.A}), SCX, 470, '900 18px '+CV_FONT, C().area, 'center', W_W, W_H);

  /* ---- P–A chart at fixed F ---- */
  const GX = a => PC.x0 + clamp(a,0,A_XMAX)/A_XMAX*(PC.x1-PC.x0);
  const GY = v => PC.y1 - clamp(v,0,P_YMAX)/P_YMAX*(PC.y1-PC.y0);
  rrect(c, PC.x0, PC.y0, PC.x1-PC.x0, PC.y1-PC.y0, 8);
  c.fillStyle=C().panel; c.fill(); c.strokeStyle=C().panelLine; c.lineWidth=1.3; c.stroke();
  [0,3,6,9,12].forEach(v=>{
    const yy = GY(v);
    line(c, PC.x0, yy, PC.x1, yy, v===0?C().axis:C().grid, v===0?1.8:1);
    TX(c, String(v), PC.x0-8, yy, '700 13px '+CV_FONT, C().cvTextDim, 'right', 'middle');
  });
  [0,10,20,30,40,50].forEach(a=>{
    line(c, GX(a), PC.y0, GX(a), PC.y1, a===0?C().axis:C().grid, a===0?1.8:1);
    TX(c, String(a), GX(a), PC.y1+16, '700 13px '+CV_FONT, C().cvTextDim, 'center', 'middle');
  });
  c.beginPath();
  const aStart = Math.max(3, ST.F/P_YMAX);
  for(let i=0;i<=70;i++){
    const a = aStart + (A_XMAX-aStart)*i/70;
    const x = GX(a), y = GY(ST.F/a);
    if(i===0) c.moveTo(x,y); else c.lineTo(x,y);
  }
  c.strokeStyle=C().gold; c.lineWidth=3.2; c.lineCap='round'; c.stroke();
  AREAS.forEach(a=>{
    circle(c, GX(a), GY(ST.F/a), 4.4, C().panel, C().gold, 2);
  });
  line(c, GX(ST.A), PC.y0, GX(ST.A), GY(p), C().force, 1.6, [5,4]);
  circle(c, GX(ST.A), GY(p), 7.5, C().force, C().pill, 2.6);
  TX(c, t('cvCurve'), (PC.x0+PC.x1)/2, PC.y0-16, '700 16px '+CV_FONT, C().cvTextDim, 'center', 'middle');
  TX(c, t('cvAxisA'), PC.x1, PC.y1+36, '700 14px '+CV_FONT, C().cvTextDim, 'right', 'middle');
  TX(c, t('cvAxisP'), PC.x0, PC.y0-36, '700 14px '+CV_FONT, C().cvTextDim, 'left', 'middle');

  /* ---- live readout panel under the chart ---- */
  const lvCol = levelOf(p)==='hi' ? C().force : levelOf(p)==='mid' ? C().gold : C().area;
  panelLines(c, (PC.x0+PC.x1)/2, 420, [
    {s:tf('cvPnow',{f:ST.F, a:ST.A, p:fmtP(p)}), c:lvCol},
    {s:tf('cvPa',{pa:grp(paOf(ST.F,ST.A))}), c:C().cvTextDim},
    {s:tf('cvDentLv',{lv:t(lvKey(p))}), c:C().cvText}
  ], '700 16px '+CV_FONT, 23, W_W, W_H);
}
function easeVis(dt){
  const k = Math.min(1, dt*6);
  VIS.d  += (depth(curP()) - VIS.d)*k;
  VIS.bw += (bwOf(ST.A) - VIS.bw)*k;
}

/* ---------- sidebar messages ---------- */
function renderMsg(){
  const p = curP(), lv = levelOf(p);
  const flash = FLASH ? '<em>'+t(FLASH.k)+'</em><br>' : '';
  const formula = tf('f_formula', {f:ST.F, a:ST.A, p:fmtP(p)});
  const conv = tf('f_convert', {a:ST.A, m:String(ST.A/10000), f:ST.F, pa:grp(paOf(ST.F,ST.A))});
  const live = lv==='hi' ? t('live_hi') : lv==='mid' ? t('live_mid') : t('live_lo');
  const tip = ST.A===AREAS[0] ? t('tip_small') : ST.A===AREAS[AREAS.length-1] ? t('tip_big') : t('tip_mid');
  const box = $('l-status');
  if(box) box.innerHTML = flash + formula + '<br>' + conv + '<br>' + live + ' ' + tip;
  const cb = $('l-conclude');
  if(cb){
    if(CONCL){ cb.innerHTML = t(CONCL); cb.classList.add('on'); }
    else cb.classList.remove('on');
  }
}

/* ---------- shared setters (lab + game share one state) ---------- */
function afterChange(oldP){
  const p = curP();
  if(levelOf(p) !== levelOf(oldP)) FLASH = (p>oldP) ? {k:'r_up'} : {k:'r_down'};
}
function setF(v){
  const oldP = curP();
  ST.F = clamp(Math.round(v/FSTEP)*FSTEP, FMIN, FMAX);
  afterChange(oldP);
  CONCL = 'c_force';
  clearLifePick();
  syncAll();
  if(GAME.phase==='aim' && $('panel-game').classList.contains('on')) gameSync();
}
function setArea(a){
  if(AREAS.indexOf(a) < 0) return;
  const oldP = curP();
  ST.A = a;
  afterChange(oldP);
  CONCL = 'c_area';
  clearLifePick();
  syncAll();
  if(GAME.phase==='aim' && $('panel-game').classList.contains('on')) gameSync();
}
function clearLifePick(){
  document.querySelectorAll('[data-life]').forEach(b=>b.classList.remove('pick'));
}
function syncControls(){
  const sf = $('s-f'), gf = $('g-s-f');
  if(sf){ sf.value = ST.F; }
  if(gf){ gf.value = ST.F; }
  if($('s-f-o')) $('s-f-o').textContent = ST.F + ' N';
  if($('g-s-f-o')) $('g-s-f-o').textContent = ST.F + ' N';
  document.querySelectorAll('.sbtn[data-a]').forEach(b=>b.classList.toggle('pick', +b.dataset.a === ST.A));
  document.querySelectorAll('.sbtn[data-ga]').forEach(b=>b.classList.toggle('pick', +b.dataset.ga === ST.A));
}
function syncAll(){
  const p = curP(), lv = levelOf(p);
  if($('l-p')) $('l-p').textContent = fmtP(p);
  if($('l-f')) $('l-f').textContent = ST.F;
  if($('l-a')) $('l-a').textContent = ST.A;
  if($('l-pa')) $('l-pa').textContent = grp(paOf(ST.F,ST.A));
  const bd = $('l-state');
  if(bd){
    bd.innerHTML = lv==='hi' ? t('stHi')+'<small>'+t('stHiSub')+'</small>'
                 : lv==='mid' ? t('stMid')+'<small>'+t('stMidSub')+'</small>'
                 : t('stLo')+'<small>'+t('stLoSub')+'</small>';
    bd.style.color = lv==='hi' ? '#b8432f' : lv==='mid' ? 'var(--gold-ink)' : '#2f6690';
    bd.style.borderColor = lv==='hi' ? 'var(--pos)' : lv==='mid' ? 'var(--gold-ink)' : '#2f6690';
  }
  if($('g-cur-side')) $('g-cur-side').textContent = fmtP(p);
  if($('g-cur-hud')) $('g-cur-hud').textContent = fmtP(p);
  syncControls();
  renderMsg();
}
function labReset(){
  ST.F = 30; ST.A = 20;
  FLASH = null; CONCL = null;
  clearLifePick();
  VIS.d = depth(curP()); VIS.bw = bwOf(ST.A);
  syncAll();
}

/* ---------- one-click real-life presets (was the "生活中的压强" cards) ---------- */
const LIFE = {
  lf1:{ from:{F:60,A:5},  to:{F:60,A:50}, c:'c_lf1' },
  lf2:{ from:{F:10,A:50}, to:{F:10,A:5},  c:'c_lf2' },
  lf3:{ from:{F:40,A:5},  to:{F:40,A:50}, c:'c_lf3' },
};
let lifeTimer = null;
function stopLife(){ if(lifeTimer){ clearTimeout(lifeTimer); lifeTimer=null; } }
function lifeDemo(id){
  const L = LIFE[id];
  if(!L) return;
  setMode('lab');
  stopLife();
  ST.F = L.from.F; ST.A = L.from.A;
  FLASH = null; CONCL = null;
  VIS.d = depth(curP()); VIS.bw = bwOf(ST.A);
  syncAll();
  document.querySelectorAll('[data-life]').forEach(b=>b.classList.toggle('pick', b.dataset.life===id));
  const btn = document.querySelector('.rail [data-life="'+id+'"]');
  if(btn){ btn.classList.remove('flash'); void btn.offsetWidth; btn.classList.add('flash');
    setTimeout(()=>btn.classList.remove('flash'), 1800); }
  lifeTimer = setTimeout(()=>{
    const oldP = curP();
    ST.F = L.to.F; ST.A = L.to.A;
    afterChange(oldP);
    CONCL = L.c;
    syncAll();
    document.querySelectorAll('[data-life]').forEach(b=>b.classList.toggle('pick', b.dataset.life===id));
    lifeTimer = null;
  }, 1100);
}

/* ---------- data recording ---------- */
let recRows = [];
function recordData(){
  recRows.push({ F:ST.F, A:ST.A, p:curP() });
  if(recRows.length > 7) recRows.shift();
  renderRec();
}
function clearRec(){ recRows = []; renderRec(); }
function renderRec(){
  const body = $('rec-body');
  if(!body) return;
  let top = 0;
  recRows.forEach(r=>{ top = Math.max(top, r.p); });
  body.innerHTML = recRows.map(r=>{
    const pct = top>1e-6 ? Math.max(6, r.p/top*100) : 0;
    const cls = levelOf(r.p)==='hi' ? 'hi' : levelOf(r.p)==='lo' ? 'lo' : '';
    return '<tr><td>'+r.F+'</td><td>'+r.A+'</td><td>'+fmtP(r.p)+'</td>'+
      '<td><div class="bar '+cls+'"><i style="width:'+pct+'%"></i></div></td></tr>';
  }).join('');
}

/* ============================================================
   Tab 2: Compare (two sponges, world 440 x 380)
============================================================ */
const CM_W = 440, CM_H = 380;
const CSP = { x0:26, x1:414, top:245, h:88 };
function depthC(p){ return clamp(p*5.8, 3, 70); }
function bwC(a){ return 17*Math.sqrt(a); }
const CMP_PRESETS = [
  { id:0, a:{F:30, A:10, nameK:'cp1a'}, b:{F:30, A:50, nameK:'cp1b'}, concl:'cc_1' },
  { id:1, a:{F:20, A:20, nameK:'cp2a'}, b:{F:60, A:20, nameK:'cp2b'}, concl:'cc_2' },
  { id:2, a:{F:20, A:5,  nameK:'cp3a'}, b:{F:60, A:20, nameK:'cp3b'}, concl:'cc_3' },
];
const CMP = { preset:0, p:0, running:false, guess:null };
const cvA = $('cv-ca'), ctxA = cvA.getContext('2d');
const cvB = $('cv-cb'), ctxB = cvB.getContext('2d');
function side(which){ return CMP_PRESETS[CMP.preset][which]; }

function drawCmpSide(ctx, s, prog){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,CM_W*SC,CM_H*SC);
  ctx.setTransform(SC,0,0,SC,0,0);
  const e = prog*prog*(3-2*prog);
  const pFull = pressure(s.F, s.A);
  const d = depthC(pFull)*e;
  const drop = (1-e)*16;

  drawScene(ctx, {
    W:CM_W, H:CM_H, x0:CSP.x0, x1:CSP.x1, top:CSP.top, h:CSP.h,
    d:d, bw:bwC(s.A), F:s.F, A:s.A, drop:drop,
    wH:19, blockH:15, shoulder:12, small:true
  });

  tchip(ctx, tf('cvSide',{f:s.F, a:s.A}), CM_W/2, 18, '700 15px '+CV_FONT, C().cvText, 'center', CM_W, CM_H);
  const shown = pFull*e;
  const col = e>0.98 ? (levelOf(pFull)==='hi'?C().force:levelOf(pFull)==='mid'?C().gold:C().area) : C().cvTextDim;
  TX(ctx, tf('cvPbig',{p:fmtP(Math.round(shown*10)/10)}), CM_W/2, 352, '900 26px '+CV_FONT, col, 'center', 'middle');
}
function drawCmpBoth(){
  drawCmpSide(ctxA, side('a'), CMP.p);
  drawCmpSide(ctxB, side('b'), CMP.p);
  updateCmpSide();
}
function updateCmpSide(){
  const a = side('a'), b = side('b');
  $('c-p-a').textContent = fmtP(pressure(a.F,a.A));
  $('c-p-b').textContent = fmtP(pressure(b.F,b.A));
  $('c-f-a').textContent = a.F;
  $('c-a-a').textContent = a.A;
  $('c-pa-a').textContent = grp(paOf(a.F,a.A));
  $('c-f-b').textContent = b.F;
  $('c-a-b').textContent = b.A;
  $('c-pa-b').textContent = grp(paOf(b.F,b.A));
}
function cmpLabels(){
  const a = side('a'), b = side('b');
  $('ca-name').textContent = t(a.nameK);
  $('cb-name').textContent = t(b.nameK);
  $('ca-cond').textContent = tf('condLine',{f:a.F, a:a.A});
  $('cb-cond').textContent = tf('condLine',{f:b.F, a:b.A});
  $('s-ca-name').textContent = LANG==='zh' ? '甲' : 'A';
  $('s-cb-name').textContent = LANG==='zh' ? '乙' : 'B';
}
function presetCmp(i){
  CMP.preset = i; CMP.p = 0; CMP.running = false;
  document.querySelectorAll('#ctl-cmp .btn.ghost').forEach((b,k)=>b.style.opacity = (k===i?'1':'.6'));
  clearGuess(); cmpLabels(); drawCmpBoth();
  $('cmp-fb').textContent=''; $('cmp-fb').className='feedback';
  $('cmp-conclude').classList.remove('on');
}
function cmpReset(){
  if(CMP.running) return;
  CMP.p = 0;
  cmpLabels(); drawCmpBoth();
  $('cmp-fb').textContent=''; $('cmp-fb').className='feedback';
  $('cmp-conclude').classList.remove('on');
}
function pickGuess(btn){
  document.querySelectorAll('#ctl-cmp .sbtn[data-g]').forEach(b=>b.classList.remove('pick'));
  btn.classList.add('pick');
  CMP.guess = btn.dataset.g;
  $('cmp-run').disabled = false;
}
function clearGuess(){
  document.querySelectorAll('#ctl-cmp .sbtn[data-g]').forEach(b=>b.classList.remove('pick'));
  CMP.guess = null; $('cmp-run').disabled = true;
}
function runCmp(){
  if(CMP.running) return;
  CMP.p = 0; CMP.running = true;
  $('cmp-run').disabled = true;
}
function finishCmp(){
  const a = side('a'), b = side('b');
  const pa = pressure(a.F,a.A), pb = pressure(b.F,b.A);
  const real = Math.abs(pa-pb) < 1e-9 ? 'same' : (pa>pb ? 'a' : 'b');
  const nA = LANG==='zh' ? '甲' : 'A', nB = LANG==='zh' ? '乙' : 'B';
  const detail = '（'+nA+' '+fmtP(pa)+' · '+nB+' '+fmtP(pb)+' N/cm²）';
  const fb = $('cmp-fb');
  if(CMP.guess === real){ fb.innerHTML = t('fbRight')+detail; fb.className='feedback good'; }
  else { fb.innerHTML = t('fbWrong')+detail; fb.className='feedback bad'; }
  const box = $('cmp-conclude');
  box.innerHTML = t(CMP_PRESETS[CMP.preset].concl);
  box.classList.add('on');
  clearGuess();
}

/* ============================================================
   Tab 3: Class quiz
============================================================ */
const QUIZ_TIME = 20;
let qIdx = 0, qScore = 0, qDone = [], qTimer = null, qLeft = 0;
function stopTimer(){ if(qTimer){ clearInterval(qTimer); qTimer=null; } }
function startTimer(){
  stopTimer();
  qLeft = QUIZ_TIME;
  const bar = $('q-timer-bar');
  bar.style.width = '100%';
  $('q-timer').classList.remove('low');
  qTimer = setInterval(()=>{
    qLeft -= 0.1;
    bar.style.width = Math.max(0, qLeft/QUIZ_TIME*100)+'%';
    if(qLeft <= 5) $('q-timer').classList.add('low');
    if(qLeft <= 0){ stopTimer(); timeUpQ(); }
  }, 100);
}
function renderQ(){
  const item = QUIZ()[qIdx];
  $('q-emoji').textContent = item.e;
  $('q-text').innerHTML = (qIdx+1)+'. '+item.q;
  $('q-exp').innerHTML = '';
  $('q-next').style.display='none';
  $('q-restart').style.display='none';
  const box = $('q-opts');
  box.innerHTML = '';
  item.o.forEach((opt,i)=>{
    const b = document.createElement('button');
    b.className='qbtn';
    b.textContent = 'ABC'[i]+'. '+opt;
    b.onclick = ()=>answerQ(i,b);
    box.appendChild(b);
  });
  renderProg();
  $('q-score-n').textContent = qScore;
  if(qDone[qIdx] !== undefined){
    const btns=[...box.children];
    btns.forEach(b=>b.disabled=true);
    btns[item.a].classList.add('right');
    $('q-exp').innerHTML = item.x;
    if(qIdx < QUIZ().length-1) $('q-next').style.display='inline-block';
    else $('q-restart').style.display='inline-block';
  } else startTimer();
}
function renderProg(){
  $('q-prog').innerHTML = QUIZ().map((_,i)=>
    '<div class="qdot '+(i===qIdx?'cur ':'')+(qDone[i]===true?'right':qDone[i]===false?'wrong':'')+'"></div>').join('');
}
function finishQ(prefix, correct){
  stopTimer();
  const item = QUIZ()[qIdx];
  qDone[qIdx] = correct;
  if(correct) qScore++;
  const btns = [...$('q-opts').children];
  btns.forEach(b=>b.disabled=true);
  btns[item.a].classList.add('right');
  $('q-exp').innerHTML = prefix + item.x;
  renderProg();
  $('q-score-n').textContent = qScore;
  if(qIdx < QUIZ().length-1) $('q-next').style.display='inline-block';
  else {
    const pct = qScore/QUIZ().length;
    const msg = pct===1 ? t('resGold') : pct>=0.7 ? t('resGood') : t('resTry');
    $('q-exp').innerHTML += '<br><em>'+qScore+' / '+QUIZ().length+' — '+msg+'</em>';
    $('q-restart').style.display='inline-block';
  }
}
function answerQ(i, btn){
  if(qDone[qIdx] !== undefined) return;
  const item = QUIZ()[qIdx];
  const correct = i===item.a;
  if(!correct) btn.classList.add('wrong');
  finishQ(correct ? t('rRight')+' ' : t('rWrong')+' ', correct);
}
function timeUpQ(){
  if(qDone[qIdx] !== undefined) return;
  finishQ(t('timeUp')+' ', false);
}
function nextQ(){ qIdx++; renderQ(); }
function restartQ(){ qIdx=0; qScore=0; qDone=[]; renderQ(); }

/* ============================================================
   Tab 4: Target challenge (reuses the demo-lab engine & canvas)
============================================================ */
const GAME_ROUNDS = 3, GAME_TIME = 30;
const GOAL_POOL = [2, 1, 3, 0.6, 4, 1.5, 6, 2.5];
const GAME = { round:0, score:0, goal:2, phase:'aim', left:GAME_TIME, timer:null, order:[] };
function stopGTimer(){ if(GAME.timer){ clearInterval(GAME.timer); GAME.timer=null; } }
function startGame(){
  GAME.round = 0; GAME.score = 0;
  $('g-score').textContent = 0;
  const idx = GOAL_POOL.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const tmp=idx[i]; idx[i]=idx[j]; idx[j]=tmp; }
  GAME.order = idx.slice(0, GAME_ROUNDS);
  nextRound();
}
function nextRound(){
  GAME.round++;
  GAME.phase = 'aim';
  GAME.left = GAME_TIME;
  GAME.goal = GOAL_POOL[GAME.order[GAME.round-1]];
  ST.F = 10; ST.A = 20;
  FLASH = null; CONCL = null;
  VIS.d = depth(curP()); VIS.bw = bwOf(ST.A);
  syncAll();
  $('g-status').innerHTML = tf('gGo', {g:fmtP(GAME.goal)});
  gameSync();
  stopGTimer();
  GAME.timer = setInterval(()=>{
    GAME.left--;
    $('g-time').textContent = Math.max(0, GAME.left);
    $('g-time').classList.toggle('low', GAME.left<=10);
    if(GAME.left<=0) lockP(true);
  }, 1000);
}
function lockP(timedOut){
  if(GAME.phase==='aim'){
    stopGTimer();
    const p = curP();
    const err = Math.abs(p-GAME.goal)/GAME.goal;
    const pts = err<=0.001 ? 100 : err<=0.1 ? 80 : err<=0.25 ? 50 : err<=0.5 ? 20 : 5;
    GAME.score += pts;
    const msg = (timedOut===true ? t('gTimeUp')+' ' : '') +
      (err<=0.001 ? t('gPerfect') : err<=0.1 ? t('gGood') : err<=0.25 ? t('gOk') : t('gMiss'));
    GAME.phase = GAME.round >= GAME_ROUNDS ? 'done' : 'next';
    const tail = '（'+fmtP(p)+' vs '+fmtP(GAME.goal)+' · +'+pts+'）';
    if(GAME.phase==='done'){
      const rk = GAME.score>=270 ? t('gRank1') : GAME.score>=180 ? t('gRank2') : t('gRank3');
      $('g-status').innerHTML = msg+tail+'<br>'+t('gFinal')+' '+GAME.score+' — '+rk;
    } else {
      $('g-status').innerHTML = msg+tail;
    }
    gameSync();
  } else if(GAME.phase==='next'){
    nextRound();
  } else {
    startGame();
  }
}
function syncGameBtn(){
  const b = $('g-lock');
  if(!b) return;
  b.textContent = GAME.phase==='aim' ? '🎯 '+t('gLock')
                : GAME.phase==='next' ? t('gNextRound')+' ➜'
                : '🔄 '+t('gPlayAgain');
}
function gameSync(){
  $('g-round').textContent = Math.max(1, GAME.round);
  $('g-time').textContent = Math.max(0, GAME.left);
  $('g-goal-hud').textContent = fmtP(GAME.goal);
  $('g-goal-side').textContent = fmtP(GAME.goal)+' N/cm²';
  $('g-cur-hud').textContent = fmtP(curP());
  $('g-cur-side').textContent = fmtP(curP());
  $('g-score').textContent = GAME.score;
  syncGameBtn();
  const frozen = GAME.phase!=='aim';
  document.querySelectorAll('#ctl-game .sbtn[data-ga]').forEach(b=>{ b.disabled = frozen; });
  if($('g-s-f')) $('g-s-f').disabled = frozen;
}

/* ============================================================
   Main loop & mode switching
============================================================ */
let lastT = performance.now();
function mainLoop(now){
  const dt = Math.min(0.04, (now-lastT)/1000);
  lastT = now;
  const labOn = $('panel-lab').classList.contains('on');
  const gameOn = $('panel-game').classList.contains('on');
  if(labOn || gameOn){
    easeVis(dt);
    drawLab();
  } else if($('panel-cmp').classList.contains('on')){
    if(CMP.running){
      CMP.p += dt/2.4;
      if(CMP.p >= 1){ CMP.p = 1; CMP.running = false; drawCmpBoth(); finishCmp(); }
      else drawCmpBoth();
    }
  }
  requestAnimationFrame(mainLoop);
}
function setMode(m){
  stopTimer(); stopGTimer(); stopLife();
  CMP.running = false;
  for(const id of ['lab','cmp','quiz','game']){
    $('tab-'+id).classList.toggle('on', id===m);
    $('panel-'+id).classList.toggle('on', id===m);
    $('ctl-'+id).classList.toggle('on', id===m);
    $('sb-'+id).classList.toggle('on', id===m);
  }
  if(m==='lab'){ ($('panel-lab').querySelector('.cvarea')||$('panel-lab')).appendChild(labCv); if($('s-f')) $('s-f').disabled=false; syncAll(); }
  if(m==='cmp'){ cmpLabels(); cmpReset(); }
  if(m==='quiz') renderQ();
  if(m==='game'){ $('game-cvhost').appendChild(labCv); startGame(); }
}

/* ---------- boot ---------- */
applyTheme();
applyLang();
syncExplain();
labReset();
presetCmp(0);
renderQ();
setMode('lab');
requestAnimationFrame(mainLoop);

</script>
