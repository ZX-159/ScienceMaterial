function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function frac(x){return x-Math.floor(x)}
function rnd(k,s){return frac(Math.sin(k*127.1+s*311.7)*43758.5453)}
function lum(hex){
  if(hex[0]!=='#')return 0.5;
  var r=parseInt(hex.substr(1,2),16)/255,g=parseInt(hex.substr(3,2),16)/255,b=parseInt(hex.substr(5,2),16)/255;
  return 0.299*r+0.587*g+0.114*b;
}
var DARK=false;

'#DA9526':'#FFB84D','#3B6EA5':'#7FB2E0'};
function THX(c){return (DARK&&THMAP[c])?THMAP[c]:c}
function PAINT(str){
  if(!DARK)return str;
  return str.replace(/(fill|stroke)="(#[0-9A-Fa-f]{6})"/g,function(m,a,c){
    var mm=THMAP[c.toUpperCase()];
    return mm?(a+'="'+mm+'"'):m;
  });
}
function tl(x,y,size,fill,txt,anchor,weight){
  fill=THX(fill);
  var halo=lum(fill)>0.5?'#26221B':'#FFFFFF';
  return '<text x="'+Math.round(x)+'" y="'+Math.round(y)+'" font-size="'+Math.round(size)+
   '" font-weight="'+(weight||700)+'" fill="'+fill+'" text-anchor="'+(anchor||'middle')+
   '" style="paint-order:stroke;stroke:'+halo+';stroke-width:3px;stroke-linejoin:round">'+txt+'</text>';
}
function tlplain(x,y,size,fill,txt,anchor,weight){
  fill=THX(fill);
  return '<text x="'+Math.round(x)+'" y="'+Math.round(y)+'" font-size="'+Math.round(size)+
   '" font-weight="'+(weight||700)+'" fill="'+fill+'" text-anchor="'+(anchor||'middle')+'">'+txt+'</text>';

function showTab(i){

/* resistivity in Ω·mm²/m (relative teaching values) */
var RHO=[0.017,0.44,1.10];
var MATN=['mt_cu','mt_mn','mt_ni'];
var MATC=['#B5652A','#8A5A2B','#6B6252'];
var VSRC=3.0, RBASE=2.0;
function RES(mat,L,A){return RHO[mat]*L/A}
function RTEMP(R,T){return R*(1+0.004*(T-20))}
function AMPS(R){return VSRC/(RBASE+R)}

/* ---- ① bench state ---- */
var B={mat:2,L:1.0,A:1.0};
function initB(){B.mat=2;B.L=1.0;B.A=1.0}

/* ---- ② fair test ---- */
var F={mat:0,len:0,area:0};      /* 乙 config; 甲 = [0,0,0] = 铜/短/细 */
var FJIA=[0,0,0];
function fairDiff(){
  var d=[];
  if(F.mat!==FJIA[0])d.push('mat');
  if(F.len!==FJIA[1])d.push('len');
  if(F.area!==FJIA[2])d.push('area');
  return d;
}
function initF(){F.mat=2;F.len=0;F.area=0}

/* ---- ③ micro state ---- */
var M={L:1.0,lanes:2,T:20,cols:0,colRate:0,ex:[]};
function microR(){return RTEMP(1.1*M.L/(M.lanes*0.5),M.T)}
function initMicroE(){
  M.ex=[];
  var k;
  for(k=0;k<14;k++){
    M.ex.push({u:rnd(k,601),lane:k%M.lanes,off:rnd(k,607)});
  }
}
function initM(){M.L=1.0;M.lanes=2;M.T=20;M.cols=0;M.colRate=0;initMicroE()}
/* electron drift speed: slower when R bigger (fixed V) */
function eSpeed(){return 0.14/(0.6+microR()*0.35)}
function collideP(){return 0.25+0.55*(M.T-20)/180}

/* ---- ④ graph state ---- */
var G={mode:'L',pts:[]};   /* pts: [x,R] */
function gCurX(){return G.mode==='L'?B.L:B.A}
function initG(){G.mode='L';G.pts=[]}
'use strict';
function benchBG(w,h){
  return '<rect x="0" y="0" width="'+w+'" height="'+h+'" rx="14" fill="#FBF7EC"/>';
}
function arrowHead(x,y,vx,vy,col,w){
  var vd=Math.hypot(vx,vy)||1;vx/=vd;vy/=vd;
  var lx=-vy,ly=vx;

   ' l '+(-vx*10+lx*5.5).toFixed(1)+' '+(-vy*10+ly*5.5).toFixed(1)+
   ' M '+x.toFixed(1)+' '+y.toFixed(1)+
   ' l '+(-vx*10-lx*5.5).toFixed(1)+' '+(-vy*10-ly*5.5).toFixed(1)+
   '" stroke="'+col+'" stroke-width="'+(w||3)+'" fill="none" stroke-linecap="round"/>';
}

/* ================= ③ micro ================= */
var MC={x0:70,x1:590,y0:120,y1:360};
function microStep(dt){
  var k;
  var newCols=0;
  for(k=0;k<M.ex.length;k++){
    var e=M.ex[k];
    var du=eSpeed()*dt*3*(0.9+0.2*rnd(k,613));
    e.u+=du;
    if(e.u>=1){e.u-=1;e.lane=Math.floor(rnd(k,617)*M.lanes+CLK)%M.lanes}
    /* collision events at ion columns */
    var ncol=Math.floor(4+M.L*6);
    var prevCol=Math.floor((e.u-du)*ncol),nowCol=Math.floor(e.u*ncol);
    if(nowCol>prevCol&&rnd(k*7+nowCol,631)<collideP())newCols++;
  }
  M.colRate=M.colRate*0.96+newCols*0.04/dt;
}
function drawM(){
  var s=benchBG(660,470);
  /* wire cross-section chamber sized by L (width) and lanes (height) */
  var wLen=(MC.x1-MC.x0)*(0.45+0.55*M.L/2);
  var x1=MC.x0+wLen;
  var laneH=44;
  var h=M.lanes*laneH+24;
  var y0=240-h/2,y1=240+h/2;
  s+='<rect x="'+MC.x0+'" y="'+y0.toFixed(0)+'" width="'+wLen.toFixed(0)+'" height="'+h+'" rx="12" fill="#F3EDDD" stroke="#B5652A" stroke-width="3"/>';
  /* ions vibrating on a grid */
  var ncol=Math.floor(4+M.L*6),k,j;
  var amp=1+ (M.T-20)/180*5.5;
  for(k=0;k<ncol;k++){
    for(j=0;j<M.lanes+1;j++){
      var ix=MC.x0+24+(wLen-48)*k/(ncol-1);
      var iy=y0+16+(h-32)*j/M.lanes;
      var jx=Math.sin(CLK*7+k*2.1+j*3.7)*amp,jy=Math.cos(CLK*8.3+k*1.3+j*2.9)*amp;
      s+='<circle cx="'+(ix+jx).toFixed(1)+'" cy="'+(iy+jy).toFixed(1)+'" r="7" fill="#9A938A" stroke="#6B655C" stroke-width="1.5"/>';
      s+=tlplain(ix+jx,iy+jy+4,10,'#F3EDDD','+');
    }
  }
  /* electrons drifting in lanes */
  for(k=0;k<M.ex.length;k++){
    var e=M.ex[k];
    var exx=MC.x0+14+(wLen-28)*e.u;
    var eyy=y0+16+(h-32)*(e.lane+0.5)/M.lanes + Math.sin(CLK*5+k)*4;
    s+='<circle cx="'+exx.toFixed(1)+'" cy="'+eyy.toFixed(1)+'" r="5.5" fill="#3B6EA5" stroke="#7FB2E0" stroke-width="1.5"/>';
    /* collision flash */
    var ncol2=Math.floor(4+M.L*6);
    var cc=Math.floor(e.u*ncol2);
    if(rnd(k*7+cc,631)<collideP()&&frac(e.u*ncol2)<0.25){
      s+='<circle cx="'+exx.toFixed(1)+'" cy="'+eyy.toFixed(1)+'" r="10" fill="none" stroke="#D9542B" stroke-width="2.5" opacity="0.8"/>';
    }
  }
  /* drift direction */
  s+=arrowHead(x1+34,240,1,0,'#3B6EA5',4);
  s+=tlplain(x1+34,214,13,'#3B6EA5','e⁻→');
  /* labels */
  s+=tl(MC.x0+wLen/2,y0-14,14,'#8A5A2B',T('dk_len')+' '+M.L.toFixed(1)+' m · '+M.lanes+' '+T('m_lane'));
  var R=microR();
  s+=tl(150,64,16,'#2C7D8C','R ≈ '+R.toFixed(2)+' Ω','start');
  s+=tl(150,92,14,'#D9542B','💥 '+T('m_col')+' ≈ '+Math.round(M.colRate),'start');
  if(M.T>90)s+=tl(470,64,14,'#D9542B','🔥 '+T('m_hotter'),'start');
  s+=tlplain(330,440,13,'#8A8070','T = '+Math.round(M.T)+' °C');
  $('svgm').innerHTML=PAINT(s);
  $('qb2').innerHTML='<span class="qtag">'+T('qtag')+'</span>'+T('mqb');
}

var QZi=0,QZpick=[],QZdone=[],QZfirst=[];
function drawQZ(){buildQuiz()}
function qzHead(){
  var data=QZdata(),N=data.length,nf=0,k;
  for(k=0;k<N;k++)if(QZfirst[k]===true)nf++;
  $('qzprog').textContent=(LANG==='en'?'Q ':'第 ')+Math.min(QZi+1,N)+' / '+N+(LANG==='en'?'':' 题');
  $('qzscore').textContent=(LANG==='en'?'first try ':'一次答对 ')+nf+' / '+N;
  return nf;
}
function buildQuiz(){
  var data=QZdata(),h='',k,j,N=data.length;
  var nf=qzHead();
  if(QZi>=N){
    $('quiz').innerHTML='<div class="q"><div class="qt">'+(LANG==='en'?'🎉 Done! First-try score: ':'🎉 全部完成！一次答对：')+nf+' / '+N+'</div></div>';
    return;
  }
  var d=data[QZi];
  h+='<div class="q"><div class="qt">'+d.q+'</div>';
  for(j=0;j<d.o.length;j++){
    h+='<button class="opt" data-o="'+j+'">'+String.fromCharCode(65+j)+'. '+d.o[j][0]+'</button>';
    h+='<div class="fb" id="fbq_'+j+'">'+d.o[j][2]+'</div>';
  }
  h+='</div>';
  h+='<button class="dbtn" id="qznext" style="display:none">'+(QZi===N-1?(LANG==='en'?'Finish ✔':'完成 ✔'):(LANG==='en'?'Next ▶':'下一题 ▶'))+'</button>';
  $('quiz').innerHTML=h;
  var ops=document.querySelectorAll('#quiz .opt');
  for(k=0;k<ops.length;k++){
    ops[k].addEventListener('click',function(){
      if(QZdone[QZi])return;
      pickQ(+this.getAttribute('data-o'));
    });
  }
  var nb=$('qznext');
  if(nb)nb.addEventListener('click',function(){QZi++;buildQuiz();updSummary()});
  if(QZpick[QZi]!==undefined)restoreQ();
}
function pickQ(oi){
  var data=QZdata(),d=data[QZi];
  QZpick[QZi]=oi;
  if(QZfirst[QZi]===undefined)QZfirst[QZi]=(d.o[oi][1]===1);
  if(d.o[oi][1]===1)QZdone[QZi]=true;
  restoreQ();
  qzHead();
}
function restoreQ(){
  var data=QZdata(),d=data[QZi],j;
  var ops=document.querySelectorAll('#quiz .opt');
  var oi=QZpick[QZi];
  for(j=0;j<ops.length;j++){
    ops[j].classList.remove('ok');ops[j].classList.remove('bad');
    var f=$('fbq_'+j);if(f)f.classList.remove('show');
  }
  if(oi===undefined||!ops[oi])return;
  var right=d.o[oi][1]===1;
  ops[oi].classList.add(right?'ok':'bad');
  var fb=$('fbq_'+oi);if(fb)fb.classList.add('show');
  var nb=$('qznext');
  if(nb)nb.style.display=QZdone[QZi]?'':'none';
}

  CLK+=0.016;

}

function selFMat(i){
  F.mat=i;

}

  });
  initExp();
  applyI18n();
  selMat(2);selFMat(2);
  buildQuiz();
  showTab(0);
  AMB=requestAnimationFrame(ambLoop);

function lum(hex){
  if(hex[0]!=='#')return 0.5;
  var r=parseInt(hex.substr(1,2),16)/255,g=parseInt(hex.substr(3,2),16)/255,b=parseInt(hex.substr(5,2),16)/255;
  return 0.299*r+0.587*g+0.114*b;
}
var DARK=false;
var THMAP={'#FBF7EC':'#1A2130','#FFFDF7':'#1E2637','#F3EDDD':'#2A3348','#FFFFFF':'#2E3850',
'#26221B':'#EDE7D6','#4B4437':'#D2CCBC','#6B6252':'#5A605D','#8A8070':'#9AA2B4','#B9AE95':'#66708A',
'#E3DCCB':'#39435C','#D8D0BC':'#39435C','#E8E2D4':'#39415A','#9A938A':'#8F97A8','#6B655C':'#B8BECE',
'#2C7D8C':'#5FC8DE','#B5652A':'#E0904E','#8A5A2B':'#C98F52','#2F7D4F':'#52B87C','#D9542B':'#FF7A50',
'#DA9526':'#FFB84D','#3B6EA5':'#7FB2E0'};
function THX(c){return (DARK&&THMAP[c])?THMAP[c]:c}
function PAINT(str){
  if(!DARK)return str;
  return str.replace(/(fill|stroke)="(#[0-9A-Fa-f]{6})"/g,function(m,a,c){
    var mm=THMAP[c.toUpperCase()];
    return mm?(a+'="'+mm+'"'):m;
  });
}
function tl(x,y,size,fill,txt,anchor,weight){
  fill=THX(fill);
  var halo=lum(fill)>0.5?'#26221B':'#FFFFFF';
  return '<text x="'+Math.round(x)+'" y="'+Math.round(y)+'" font-size="'+Math.round(size)+
   '" font-weight="'+(weight||700)+'" fill="'+fill+'" text-anchor="'+(anchor||'middle')+
   '" style="paint-order:stroke;stroke:'+halo+';stroke-width:3px;stroke-linejoin:round">'+txt+'</text>';
}
function tlplain(x,y,size,fill,txt,anchor,weight){
  fill=THX(fill);
  return '<text x="'+Math.round(x)+'" y="'+Math.round(y)+'" font-size="'+Math.round(size)+
   '" font-weight="'+(weight||700)+'" fill="'+fill+'" text-anchor="'+(anchor||'middle')+'">'+txt+'</text>';
}

/* ================= tabs & dock ================= */
var CUR=0;
var RENDER=[];
var SUMMARY=[];
var TABN=5;
var CLK=0;
function showTab(i){
  CUR=i;
  var tabs=document.querySelectorAll('.tab'),k;
  for(k=0;k<tabs.length;k++)tabs[k].classList.toggle('on',+tabs[k].getAttribute('data-tab')===i);
  for(k=0;k<TABN;k++){
    $('p'+k).classList.toggle('on',k===i);
    $('d'+k).classList.toggle('on',k===i);
  }
  RENDER[i]();
  updSummary();
}
function updSummary(){ $('docksum').textContent=SUMMARY[CUR]?SUMMARY[CUR]():''; }
function initTabs(){
  var tabs=document.querySelectorAll('.tab'),k;
  for(k=0;k<tabs.length;k++){
    tabs[k].addEventListener('click',function(){showTab(+this.getAttribute('data-tab'))});
  }
  $('dockfold').addEventListener('click',function(){
    var d=$('dock'); d.classList.toggle('folded');
    this.textContent=d.classList.contains('folded')?'⌃':'⌄';
    updSummary();
  });
}
function applyI18n(){
  var els=document.querySelectorAll('[data-i18n]'),k;
  for(k=0;k<els.length;k++)els[k].textContent=T(els[k].getAttribute('data-i18n'));
  els=document.querySelectorAll('[data-i18n-html]');
  for(k=0;k<els.length;k++){
    var tgt=(els[k].querySelector)?els[k].querySelector('.kin'):null;
    (tgt||els[k]).innerHTML=T(els[k].getAttribute('data-i18n-html'));
  }
}
function initExp(){
  var kbs=document.querySelectorAll('.kbox'),k;
  for(k=0;k<kbs.length;k++){
    var kb=kbs[k];
    if(kb.hasAttribute('data-dyn'))continue;
    kb.classList.add('exp');
    kb.innerHTML='<button class="expbtn2" data-i18n="exp_off">💬 点我看解释</button><div class="kin">'+kb.innerHTML+'</div>';
  }
  var bs=document.querySelectorAll('.expbtn2');
  for(k=0;k<bs.length;k++){
    bs[k].addEventListener('click',function(){
      var kb=this.parentNode;
      var open=kb.classList.toggle('open');
      this.setAttribute('data-i18n',open?'exp_on':'exp_off');
      this.textContent=T(open?'exp_on':'exp_off');
    });
  }
}



/* ================= resistance model ================= */
/* resistivity in Ω·mm²/m (relative teaching values) */
var RHO=[0.017,0.44,1.10];
var MATN=['mt_cu','mt_mn','mt_ni'];
var MATC=['#B5652A','#8A5A2B','#6B6252'];
var VSRC=3.0, RBASE=2.0;
function RES(mat,L,A){return RHO[mat]*L/A}
function RTEMP(R,T){return R*(1+0.004*(T-20))}
function AMPS(R){return VSRC/(RBASE+R)}

/* ---- ① bench state ---- */
var B={mat:2,L:1.0,A:1.0};
function initB(){B.mat=2;B.L=1.0;B.A=1.0}

/* ---- ② fair test ---- */
var F={mat:0,len:0,area:0};      /* 乙 config; 甲 = [0,0,0] = 铜/短/细 */
var FJIA=[0,0,0];
function fairDiff(){
  var d=[];
  if(F.mat!==FJIA[0])d.push('mat');
  if(F.len!==FJIA[1])d.push('len');
  if(F.area!==FJIA[2])d.push('area');
  return d;
}
function initF(){F.mat=2;F.len=0;F.area=0}

/* ---- ③ micro state ---- */
var M={L:1.0,lanes:2,T:20,cols:0,colRate:0,ex:[]};
function microR(){return RTEMP(1.1*M.L/(M.lanes*0.5),M.T)}
function initMicroE(){
  M.ex=[];
  var k;
  for(k=0;k<14;k++){
    M.ex.push({u:rnd(k,601),lane:k%M.lanes,off:rnd(k,607)});
  }
}
function initM(){M.L=1.0;M.lanes=2;M.T=20;M.cols=0;M.colRate=0;initMicroE()}
/* electron drift speed: slower when R bigger (fixed V) */
function eSpeed(){return 0.14/(0.6+microR()*0.35)}
function collideP(){return 0.25+0.55*(M.T-20)/180}

/* ---- ④ graph state ---- */
var G={mode:'L',pts:[]};   /* pts: [x,R] */
function gCurX(){return G.mode==='L'?B.L:B.A}
function initG(){G.mode='L';G.pts=[]}
'use strict';
function benchBG(w,h){
  return '<rect x="0" y="0" width="'+w+'" height="'+h+'" rx="14" fill="#FBF7EC"/>';
}
function arrowHead(x,y,vx,vy,col,w){
  var vd=Math.hypot(vx,vy)||1;vx/=vd;vy/=vd;
  var lx=-vy,ly=vx;
  return '<path d="M '+x.toFixed(1)+' '+y.toFixed(1)+
   ' l '+(-vx*10+lx*5.5).toFixed(1)+' '+(-vy*10+ly*5.5).toFixed(1)+
   ' M '+x.toFixed(1)+' '+y.toFixed(1)+
   ' l '+(-vx*10-lx*5.5).toFixed(1)+' '+(-vy*10-ly*5.5).toFixed(1)+
   '" stroke="'+col+'" stroke-width="'+(w||3)+'" fill="none" stroke-linecap="round"/>';
}

  var wx0=190,wx1max=470;

  if(wx1<wx1max-8)s+='<line x1="'+wx1.toFixed(1)+'" y1="120" x2="'+wx1max+'" y2="120" stroke="#8A8070" stroke-width="4" stroke-dasharray="3 5"/>';

  s+=tlplain((wx0+wx1max)/2,152,13,'#6B6252',T('b_wire'));
  /* marching current dots (speed ∝ I) */

/* ================= ③ micro ================= */
var MC={x0:70,x1:590,y0:120,y1:360};
function microStep(dt){
  var k;
  var newCols=0;
  for(k=0;k<M.ex.length;k++){
    var e=M.ex[k];
    var du=eSpeed()*dt*3*(0.9+0.2*rnd(k,613));
    e.u+=du;
    if(e.u>=1){e.u-=1;e.lane=Math.floor(rnd(k,617)*M.lanes+CLK)%M.lanes}
    /* collision events at ion columns */
    var ncol=Math.floor(4+M.L*6);
    var prevCol=Math.floor((e.u-du)*ncol),nowCol=Math.floor(e.u*ncol);
    if(nowCol>prevCol&&rnd(k*7+nowCol,631)<collideP())newCols++;
  }
  M.colRate=M.colRate*0.96+newCols*0.04/dt;
}
function drawM(){
  var s=benchBG(660,470);
  /* wire cross-section chamber sized by L (width) and lanes (height) */
  var wLen=(MC.x1-MC.x0)*(0.45+0.55*M.L/2);
  var x1=MC.x0+wLen;
  var laneH=44;
  var h=M.lanes*laneH+24;
  var y0=240-h/2,y1=240+h/2;
  s+='<rect x="'+MC.x0+'" y="'+y0.toFixed(0)+'" width="'+wLen.toFixed(0)+'" height="'+h+'" rx="12" fill="#F3EDDD" stroke="#B5652A" stroke-width="3"/>';
  /* ions vibrating on a grid */
  var ncol=Math.floor(4+M.L*6),k,j;
  var amp=1+ (M.T-20)/180*5.5;
  for(k=0;k<ncol;k++){
    for(j=0;j<M.lanes+1;j++){
      var ix=MC.x0+24+(wLen-48)*k/(ncol-1);
      var iy=y0+16+(h-32)*j/M.lanes;
      var jx=Math.sin(CLK*7+k*2.1+j*3.7)*amp,jy=Math.cos(CLK*8.3+k*1.3+j*2.9)*amp;
      s+='<circle cx="'+(ix+jx).toFixed(1)+'" cy="'+(iy+jy).toFixed(1)+'" r="7" fill="#9A938A" stroke="#6B655C" stroke-width="1.5"/>';
      s+=tlplain(ix+jx,iy+jy+4,10,'#F3EDDD','+');
    }
  }
  /* electrons drifting in lanes */
  for(k=0;k<M.ex.length;k++){
    var e=M.ex[k];
    var exx=MC.x0+14+(wLen-28)*e.u;
    var eyy=y0+16+(h-32)*(e.lane+0.5)/M.lanes + Math.sin(CLK*5+k)*4;
    s+='<circle cx="'+exx.toFixed(1)+'" cy="'+eyy.toFixed(1)+'" r="5.5" fill="#3B6EA5" stroke="#7FB2E0" stroke-width="1.5"/>';
    /* collision flash */
    var ncol2=Math.floor(4+M.L*6);
    var cc=Math.floor(e.u*ncol2);
    if(rnd(k*7+cc,631)<collideP()&&frac(e.u*ncol2)<0.25){
      s+='<circle cx="'+exx.toFixed(1)+'" cy="'+eyy.toFixed(1)+'" r="10" fill="none" stroke="#D9542B" stroke-width="2.5" opacity="0.8"/>';
    }
  }
  /* drift direction */
  s+=arrowHead(x1+34,240,1,0,'#3B6EA5',4);
  s+=tlplain(x1+34,214,13,'#3B6EA5','e⁻→');
  /* labels */
  s+=tl(MC.x0+wLen/2,y0-14,14,'#8A5A2B',T('dk_len')+' '+M.L.toFixed(1)+' m · '+M.lanes+' '+T('m_lane'));
  var R=microR();
  s+=tl(150,64,16,'#2C7D8C','R ≈ '+R.toFixed(2)+' Ω','start');
  s+=tl(150,92,14,'#D9542B','💥 '+T('m_col')+' ≈ '+Math.round(M.colRate),'start');
  if(M.T>90)s+=tl(470,64,14,'#D9542B','🔥 '+T('m_hotter'),'start');
  s+=tlplain(330,440,13,'#8A8070','T = '+Math.round(M.T)+' °C');
  $('svgm').innerHTML=PAINT(s);
  $('qb2').innerHTML='<span class="qtag">'+T('qtag')+'</span>'+T('mqb');
}

/* ================= ④ graphs ================= */
var GC={x0:120,x1:600,y0:60,y1:360};
function gMaxX(){return G.mode==='L'?2.2:2.2}
function gMaxY(){return 2.6}
function gX(v){return GC.x0+(v/gMaxX())*(GC.x1-GC.x0)}
function gY(v){return GC.y1-(v/gMaxY())*(GC.y1-GC.y0)}
function drawG(){
  var s=benchBG(660,470);
  /* axes */
  s+='<line x1="'+GC.x0+'" y1="'+GC.y1+'" x2="'+GC.x1+'" y2="'+GC.y1+'" stroke="#4B4437" stroke-width="2.5"/>';
  s+='<line x1="'+GC.x0+'" y1="'+GC.y1+'" x2="'+GC.x0+'" y2="'+GC.y0+'" stroke="#4B4437" stroke-width="2.5"/>';
  s+=arrowHead(GC.x1+8,GC.y1,1,0,'#4B4437',2.5);
  s+=arrowHead(GC.x0,GC.y0-8,0,-1,'#4B4437',2.5);
  var k;
  for(k=0;k<=4;k++){
    var xv=k*0.5;
    s+=tlplain(gX(xv),GC.y1+22,13,'#6B6252',xv.toFixed(1));
    if(k>0)s+='<line x1="'+gX(xv).toFixed(0)+'" y1="'+GC.y1+'" x2="'+gX(xv).toFixed(0)+'" y2="'+GC.y0+'" stroke="#E8E2D4" stroke-width="1"/>';
  }
  for(k=0;k<=5;k++){
    var yv=k*0.5;
    s+=tlplain(GC.x0-16,gY(yv)+5,13,'#6B6252',yv.toFixed(1),'end');
    if(k>0)s+='<line x1="'+GC.x0+'" y1="'+gY(yv).toFixed(0)+'" x2="'+GC.x1+'" y2="'+gY(yv).toFixed(0)+'" stroke="#E8E2D4" stroke-width="1"/>';
  }
  s+=tl(GC.x1-10,GC.y1+44,14,'#26221B',G.mode==='L'?T('g_L'):T('g_A'),'end');
  s+=tl(GC.x0+8,GC.y0-16,14,'#26221B',T('g_R'),'start');
  /* theory curve */
  var pth='',n=60;
  for(k=0;k<=n;k++){
    var xv2=0.2+(gMaxX()-0.25)*k/n;
    var Rv=G.mode==='L'?RES(B.mat,xv2,B.A):RES(B.mat,B.L,xv2);
    if(Rv>gMaxY())continue;
    pth+=(pth?' L ':'M ')+gX(xv2).toFixed(1)+' '+gY(Rv).toFixed(1);
  }
  s+='<path d="'+pth+'" fill="none" stroke="#B9AE95" stroke-width="2" stroke-dasharray="5 6"/>';
  /* recorded points */
  for(k=0;k<G.pts.length;k++){
    s+='<circle cx="'+gX(G.pts[k][0]).toFixed(1)+'" cy="'+gY(G.pts[k][1]).toFixed(1)+'" r="6" fill="#D9542B" stroke="#FFFDF7" stroke-width="2"/>';
  }
  /* current position marker */
  var curR=G.mode==='L'?RES(B.mat,B.L,B.A):RES(B.mat,B.L,B.A);
  var curX=gCurX();
  if(curR<=gMaxY())s+='<circle cx="'+gX(curX).toFixed(1)+'" cy="'+gY(curR).toFixed(1)+'" r="7" fill="none" stroke="#2C7D8C" stroke-width="2.5" stroke-dasharray="3 3"/>';
  s+=tl(GC.x0+14,84,14,'#2C7D8C',(G.mode==='L'?T('g_line'):T('g_hyp')),'start');
  s+=tl(GC.x1-6,84,13,'#8A5A2B',T(MATN[B.mat])+' · '+(G.mode==='L'?('A='+B.A.toFixed(1)+' mm²'):('L='+B.L.toFixed(1)+' m')),'end');
  $('svgg').innerHTML=PAINT(s);

  $('g_n').textContent=T('g_pts')+' '+G.pts.length+' '+T('g_ptsu');
}

var QZi=0,QZpick=[],QZdone=[],QZfirst=[];
function drawQZ(){buildQuiz()}
function qzHead(){
  var data=QZdata(),N=data.length,nf=0,k;
  for(k=0;k<N;k++)if(QZfirst[k]===true)nf++;
  $('qzprog').textContent=(LANG==='en'?'Q ':'第 ')+Math.min(QZi+1,N)+' / '+N+(LANG==='en'?'':' 题');
  $('qzscore').textContent=(LANG==='en'?'first try ':'一次答对 ')+nf+' / '+N;
  return nf;
}
function buildQuiz(){
  var data=QZdata(),h='',k,j,N=data.length;
  var nf=qzHead();
  if(QZi>=N){
    $('quiz').innerHTML='<div class="q"><div class="qt">'+(LANG==='en'?'🎉 Done! First-try score: ':'🎉 全部完成！一次答对：')+nf+' / '+N+'</div></div>';
    return;
  }
  var d=data[QZi];
  h+='<div class="q"><div class="qt">'+d.q+'</div>';
  for(j=0;j<d.o.length;j++){
    h+='<button class="opt" data-o="'+j+'">'+String.fromCharCode(65+j)+'. '+d.o[j][0]+'</button>';
    h+='<div class="fb" id="fbq_'+j+'">'+d.o[j][2]+'</div>';
  }
  h+='</div>';
  h+='<button class="dbtn" id="qznext" style="display:none">'+(QZi===N-1?(LANG==='en'?'Finish ✔':'完成 ✔'):(LANG==='en'?'Next ▶':'下一题 ▶'))+'</button>';
  $('quiz').innerHTML=h;
  var ops=document.querySelectorAll('#quiz .opt');
  for(k=0;k<ops.length;k++){
    ops[k].addEventListener('click',function(){
      if(QZdone[QZi])return;
      pickQ(+this.getAttribute('data-o'));
    });
  }
  var nb=$('qznext');
  if(nb)nb.addEventListener('click',function(){QZi++;buildQuiz();updSummary()});
  if(QZpick[QZi]!==undefined)restoreQ();
}
function pickQ(oi){
  var data=QZdata(),d=data[QZi];
  QZpick[QZi]=oi;
  if(QZfirst[QZi]===undefined)QZfirst[QZi]=(d.o[oi][1]===1);
  if(d.o[oi][1]===1)QZdone[QZi]=true;
  restoreQ();
  qzHead();
}
function restoreQ(){
  var data=QZdata(),d=data[QZi],j;
  var ops=document.querySelectorAll('#quiz .opt');
  var oi=QZpick[QZi];
  for(j=0;j<ops.length;j++){
    ops[j].classList.remove('ok');ops[j].classList.remove('bad');
    var f=$('fbq_'+j);if(f)f.classList.remove('show');
  }
  if(oi===undefined||!ops[oi])return;
  var right=d.o[oi][1]===1;
  ops[oi].classList.add(right?'ok':'bad');
  var fb=$('fbq_'+oi);if(fb)fb.classList.add('show');
  var nb=$('qznext');
  if(nb)nb.style.display=QZdone[QZi]?'':'none';
}

/* ================= boot ================= */
function setLang(l){
  LANG=l;
  $('langbtn').textContent=(l==='zh')?'EN':'中';
  document.documentElement.setAttribute('lang',l==='zh'?'zh':'en');
  applyI18n();
  buildQuiz();
  RENDER[CUR](); updSummary();
}
var AMB=0;
function ambLoop(){
  CLK+=0.016;
  if(CUR===0){ drawB(); }
  else if(CUR===2){ microStep(0.016); drawM(); }
  updSummary();
  AMB=requestAnimationFrame(ambLoop);
}
function selMat(i){
  B.mat=i;
  var k;
  for(k=0;k<3;k++)$('bm'+k).classList.toggle('on',k===i);
}
function selFMat(i){
  F.mat=i;
  var k;
  for(k=0;k<3;k++)$('fm'+k).classList.toggle('on',k===i);
}
function gSlideApply(){
  var v=+$('gv').value;
  if(G.mode==='L')B.L=v; else B.A=v;
  $('gvlab').textContent=v.toFixed(1)+(G.mode==='L'?' m':' mm²');
  drawG();
}
function boot(){
  RENDER=[drawB,drawF,drawM,drawG,drawQZ];
  SUMMARY=[
    function(){return 'R='+RES(B.mat,B.L,B.A).toFixed(2)+'Ω · I='+AMPS(RES(B.mat,B.L,B.A)).toFixed(2)+'A'},
    function(){var d=fairDiff();return d.length===1?'✓':(d.length===0?'⚠':'✗')},
    function(){return 'R≈'+microR().toFixed(2)+'Ω · '+Math.round(M.colRate)+'/s'},
    function(){return (G.mode==='L'?'R∝L':'R∝1/A')+' · '+G.pts.length},
    function(){return T('qz_title')+' '+$('qzscore').textContent}
  ];
  initTabs(); initB(); initF(); initM(); initG();
  /* --- ① --- */
  var k;
  for(k=0;k<3;k++)(function(i){$('bm'+i).addEventListener('click',function(){selMat(i);drawB();updSummary()})})(k);
  $('bL').addEventListener('input',function(){B.L=+this.value;$('bLlab').textContent=B.L.toFixed(1)+' m';drawB();updSummary()});
  $('bA').addEventListener('input',function(){B.A=+this.value;$('bAlab').textContent=B.A.toFixed(1)+' mm²';drawB();updSummary()});
  $('breset').addEventListener('click',function(){initB();selMat(2);$('bL').value=1;$('bA').value=1;$('bLlab').textContent='1.0 m';$('bAlab').textContent='1.0 mm²';drawB();updSummary()});
  /* --- ② --- */
  for(k=0;k<3;k++)(function(i){$('fm'+i).addEventListener('click',function(){selFMat(i);drawF();updSummary()})})(k);
  $('flen').addEventListener('click',function(){F.len=1-F.len;this.classList.toggle('on',F.len===1);drawF();updSummary()});
  $('farea').addEventListener('click',function(){F.area=1-F.area;this.classList.toggle('on',F.area===1);drawF();updSummary()});
  $('ftrap').addEventListener('click',function(){selFMat(2);F.len=1;$('flen').classList.add('on');drawF();updSummary()});
  $('freset').addEventListener('click',function(){initF();selFMat(2);F.len=0;F.area=0;$('flen').classList.remove('on');$('farea').classList.remove('on');drawF();updSummary()});
  /* --- ③ --- */
  $('mL').addEventListener('input',function(){M.L=+this.value;$('mLlab').textContent=M.L.toFixed(1)+' m';drawM();updSummary()});
  $('mlanes').addEventListener('input',function(){M.lanes=+this.value;$('mlaneslab').textContent=M.lanes+' '+T('m_lane');initMicroE();drawM();updSummary()});
  $('mT').addEventListener('input',function(){M.T=+this.value;$('mTlab').textContent=Math.round(M.T)+' °C';drawM();updSummary()});
  $('mreset').addEventListener('click',function(){initM();$('mL').value=1;$('mlanes').value=2;$('mT').value=20;$('mLlab').textContent='1.0 m';$('mlaneslab').textContent='2 '+T('m_lane');$('mTlab').textContent='20 °C';drawM();updSummary()});
  /* --- ④ --- */
  $('gmodeL').addEventListener('click',function(){G.mode='L';this.classList.add('on');$('gmodeA').classList.remove('on');$('gv').value=B.L;gSlideApply();updSummary()});
  $('gmodeA').addEventListener('click',function(){G.mode='A';this.classList.add('on');$('gmodeL').classList.remove('on');$('gv').value=B.A;gSlideApply();updSummary()});
  $('gv').addEventListener('input',function(){gSlideApply();updSummary()});
  $('grec').addEventListener('click',function(){
    var x=gCurX(),R=RES(B.mat,B.L,B.A),j,dup=false;
    for(j=0;j<G.pts.length;j++)if(Math.abs(G.pts[j][0]-x)<1e-9)dup=true;
    if(!dup)G.pts.push([x,R]);
    drawG();updSummary();
  });
  $('gclr').addEventListener('click',function(){G.pts=[];drawG();updSummary()});
  /* --- chrome --- */
  $('qzreset').addEventListener('click',function(){QZpick=[];QZdone=[];QZfirst=[];QZi=0;buildQuiz();updSummary()});
  $('langbtn').addEventListener('click',function(){setLang(LANG==='zh'?'en':'zh')});
  $('thmbtn').addEventListener('click',function(){
    DARK=!DARK;
    if(document.body)document.body.classList.toggle('dark',DARK);
    this.textContent=DARK?'☀️':'🌙';
    RENDER[CUR]();updSummary();
  });
  initExp();
  applyI18n();
  selMat(2);selFMat(2);
  buildQuiz();
  showTab(0);
  AMB=requestAnimationFrame(ambLoop);
}
boot();
