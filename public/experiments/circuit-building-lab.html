/* ================= helpers ================= */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function d2r(d){return d*Math.PI/180}
function lum(hex){
  if(hex[0]!=='#')return 0.5;
  var r=parseInt(hex.substr(1,2),16)/255,g=parseInt(hex.substr(3,2),16)/255,b=parseInt(hex.substr(5,2),16)/255;
  return 0.299*r+0.587*g+0.114*b;
}
/* ===== theme ===== */
var DARK=false;
var THMAP={'#FBF7EC':'#1A2130','#FFFDF7':'#1E2637','#F3EDDD':'#2A3348','#FFFFFF':'#2E3850',
'#26221B':'#EDE7D6','#4B4437':'#D2CCBC','#6B6252':'#5A605D','#8A8070':'#9AA2B4','#B9AE95':'#66708A',
'#E3DCCB':'#39435C','#5B6770':'#A9BAC8','#D8D0BC':'#39435C'};
function THX(c){return (DARK&&THMAP[c])?THMAP[c]:c}
function PAINT(str){
  if(!DARK)return str;
  return str.replace(/(fill|stroke)="(#[0-9A-Fa-f]{6})"/g,function(m,a,c){
    var mm=THMAP[c.toUpperCase()];
    return mm?(a+'="'+mm+'"'):m;
  });
}
function tl(x,y,size,fill,txt,anchor,weight){
  fill=THX(fill);
  var halo=lum(fill)>0.5?'#26221B':'#FFFFFF';
  return '<text x="'+Math.round(x)+'" y="'+Math.round(y)+'" font-size="'+Math.round(size)+
   '" font-weight="'+(weight||700)+'" fill="'+fill+'" text-anchor="'+(anchor||'middle')+
   '" style="paint-order:stroke;stroke:'+halo+';stroke-width:3px;stroke-linejoin:round">'+txt+'</text>';
}
function tlplain(x,y,size,fill,txt,anchor,weight){
  fill=THX(fill);
  return '<text x="'+Math.round(x)+'" y="'+Math.round(y)+'" font-size="'+Math.round(size)+
   '" font-weight="'+(weight||700)+'" fill="'+fill+'" text-anchor="'+(anchor||'middle')+'">'+txt+'</text>';
}
function svgPt(svg,ev,vw,vh){
  var r=svg.getBoundingClientRect();
  return {x:(ev.clientX-r.left)*vw/r.width, y:(ev.clientY-r.top)*vh/r.height};
}
function makeDrag(svg,vw,vh,onmove,onup){
  var down=false;
  svg.addEventListener('pointerdown',function(e){
    e.preventDefault(); down=true;
    try{svg.setPointerCapture(e.pointerId)}catch(err){}
    onmove(svgPt(svg,e,vw,vh),true);
  });
  svg.addEventListener('pointermove',function(e){
    if(!down)return; e.preventDefault();
    onmove(svgPt(svg,e,vw,vh),false);
  });

/* ================= circuit model ================= */
var COLS=10, ROWS=6, GX0=52, GY0=64, STEP=62;
function nx(n){return GX0+(n%COLS)*STEP}
function ny(n){return GY0+Math.floor(n/COLS)*STEP}
function nid(r,c){return r*COLS+c}
function adjacent(a,b){
  var dc=Math.abs(a%COLS-b%COLS), dr=Math.abs(Math.floor(a/COLS)-Math.floor(b/COLS));
  return a!==b&&dc<=1&&dr<=1;
}
function ekey(a,b){return a<b?(a+'_'+b):(b+'_'+a)}
var DEF={wire:{R:0.02},batt:{R:0.3,E:3},bulb:{R:6},res:{R:5},sw:{R:0.02},amm:{R:0.02}};
var CT={els:[],next:1};
var SEL=0, PALETTE='wire';
var PH={};        // per-element current-dot phase
var SOLV={V:[],cur:{},sh:false,any:false};
var PR=[{x:440,y:90,node:-1},{x:600,y:90,node:-1}];   // red, black probes
var VM={on:false,x:520,y:150};                             // draggable voltmeter body

function edgeUsed(a,b){
  var k=ekey(a,b),i;
  for(i=0;i<CT.els.length;i++){
    if(ekey(CT.els[i].a,CT.els[i].b)===k)return true;
  }
  return false;
}
function addEl(t,a,b){
  if(!adjacent(a,b)||edgeUsed(a,b))return 0;
  var e={id:CT.next++,t:t,a:a,b:b,val:(t==='batt'?DEF.batt.E:(t==='bulb'?DEF.bulb.R:DEF.res.R)),closed:1,flip:0};
  CT.els.push(e); PH[e.id]=0;
  return e.id;
}
function delEl(id){
  var i;
  for(i=0;i<CT.els.length;i++){
    if(CT.els[i].id===id){CT.els.splice(i,1);break}
  }
  if(SEL===id)SEL=0;
}
function elR(e){
  if(e.t==='batt')return DEF.batt.R;
  if(e.t==='res'||e.t==='bulb')return e.val;
  return DEF[e.t].R;
}
/* MNA (pure conductance + Norton sources), Gaussian elimination */
function solveCircuit(els){
  var N=COLS*ROWS, i, j, k, e;
  var G=[], Ivec=[];
  for(i=0;i<N;i++){
    G.push(new Array(N));
    for(j=0;j<N;j++)G[i][j]=0;
    G[i][i]=1e-9;
    Ivec.push(0);
  }
  var anySrc=false;
  for(k=0;k<els.length;k++){
    e=els[k];
    if(e.t==='sw'&&!e.closed)continue;
    var g=1/elR(e);
    G[e.a][e.a]+=g; G[e.b][e.b]+=g;
    G[e.a][e.b]-=g; G[e.b][e.a]-=g;
    if(e.t==='batt'){
      anySrc=true;
      var E=e.flip?-e.val:e.val;   // + terminal at b when !flip
      Ivec[e.a]-=E*g; Ivec[e.b]+=E*g;
    }
  }
  // gaussian elimination with partial pivot
  var V=new Array(N);
  for(i=0;i<N;i++)V[i]=0;
  if(anySrc){
    for(i=0;i<N;i++){
      var p=i, m=Math.abs(G[i][i]);
      for(j=i+1;j<N;j++){ if(Math.abs(G[j][i])>m){m=Math.abs(G[j][i]);p=j} }
      if(p!==i){var tr=G[i];G[i]=G[p];G[p]=tr; var tv=Ivec[i];Ivec[i]=Ivec[p];Ivec[p]=tv}
      var pv=G[i][i];
      if(Math.abs(pv)<1e-14)continue;
      for(j=i+1;j<N;j++){
        var f=G[j][i]/pv;
        if(f===0)continue;
        for(k=i;k<N;k++)G[j][k]-=f*G[i][k];
        Ivec[j]-=f*Ivec[i];
      }
    }
    for(i=N-1;i>=0;i--){
      var s=Ivec[i];
      for(j=i+1;j<N;j++)s-=G[i][j]*V[j];
      V[i]=Math.abs(G[i][i])<1e-14?0:s/G[i][i];
    }
  }
  var cur={}, sh=false;
  for(k=0;k<els.length;k++){
    e=els[k];
    if(e.t==='sw'&&!e.closed){cur[e.id]=0;continue}
    var g2=1/elR(e);
    var Ie=(V[e.a]-V[e.b])*g2;
    if(e.t==='batt'){
      var E2=e.flip?-e.val:e.val;
      Ie=(V[e.a]-V[e.b]+E2)*g2;
      if(Math.abs(Ie)>6)sh=true;
    }
    cur[e.id]=Ie;
  }
  return {V:V,cur:cur,sh:sh,any:anySrc};
}
function solve(){ SOLV=solveCircuit(CT.els); }
function elById(id){
  for(var i=0;i<CT.els.length;i++)if(CT.els[i].id===id)return CT.els[i];
  return null;
}
function bulbP(e){ var Ie=SOLV.cur[e.id]||0; return Ie*Ie*e.val; }
/* presets */
function preset(p){
  CT.els=[];SEL=0;
  function W(r1,c1,r2,c2,t){addEl(t||'wire',nid(r1,c1),nid(r2,c2))}
  if(p===0){
    // his series demo: big loop, 2 batteries on top, ammeter left, switch right, 2 bulbs on the bottom
    W(0,1,0,2);W(0,2,0,3);W(0,3,0,4,'batt');W(0,4,0,5,'batt');W(0,5,0,6);W(0,6,0,7);W(0,7,0,8);
    W(0,1,1,1);W(1,1,2,1,'amm');W(2,1,3,1);W(3,1,4,1);
    W(0,8,1,8);W(1,8,2,8,'sw');W(2,8,3,8);W(3,8,4,8);
    W(4,1,4,2);W(4,2,4,3);W(4,3,4,4,'bulb');W(4,4,4,5);W(4,5,4,6);W(4,6,4,7,'bulb');W(4,7,4,8);
    var k;for(k=0;k<CT.els.length;k++)if(CT.els[k].t==='sw')CT.els[k].closed=0;
  }else{
    // his parallel demo: battery row on top, main ammeter top-left, two switch+bulb+ammeter branches
    W(0,1,0,2);W(0,2,0,3);W(0,3,0,4,'batt');W(0,4,0,5,'batt');W(0,5,0,6);W(0,6,0,7);W(0,7,0,8);
    W(0,1,1,1,'amm');W(1,1,2,1);W(2,1,3,1);W(3,1,4,1);
    W(0,8,1,8);W(1,8,2,8);W(2,8,3,8);W(3,8,4,8);
    W(2,1,2,2,'sw');W(2,2,2,3);W(2,3,2,4);W(2,4,2,5,'bulb');W(2,5,2,6);W(2,6,2,7,'amm');W(2,7,2,8);
    W(4,1,4,2,'sw');W(4,2,4,3);W(4,3,4,4);W(4,4,4,5,'bulb');W(4,5,4,6);W(4,6,4,7,'amm');W(4,7,4,8);
    var j;for(j=0;j<CT.els.length;j++)if(CT.els[j].t==='sw')CT.els[j].closed=0;
  }
  solve();
}

function pickNode(pt){

  for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++){
    var d=Math.abs(pt.x-(GX0+c*STEP))+Math.abs(pt.y-(GY0+r*STEP));

function pickEl(pt){

    if(Math.abs(pt.x-mx)<20&&Math.abs(pt.y-my)<20)return e;

function pickProbe(pt){

function initCanvas(svgid){

      mode=0;
      return;
    }
    if(Math.abs(pt.x-downPt.x)+Math.abs(pt.y-downPt.y)>8)moved=true;
    if(mode===1){
      PR[probeI].x=clamp(pt.x,16,644);PR[probeI].y=clamp(pt.y,16,462);
      PR[probeI].node=pickNode(pt);
      drawBoth();

    }else if(mode===3){

        }else if(PALETTE==='wire'||PALETTE==='batt'){
          LAY.cur=n;   // walk along existing elements while wiring
        }
      }
      drawBoth();
    }
  },function(){
    if(mode===2&&hitEl&&!moved){
      SEL=hitEl.id;
      if(hitEl.t==='sw'){hitEl.closed=hitEl.closed?0:1;solve()}

var CH={i:0,done:[]};
function litBulbs(sol){
  var out=[],k;
  for(k=0;k<CT.els.length;k++){
    var e=CT.els[k];
    if(e.t!=='bulb')continue;
    var Ie=sol.cur[e.id]||0;
    if(Ie*Ie*e.val>0.05)out.push({e:e,I:Math.abs(Ie)});
  }
  return out;
}
function battI(sol){
  var mx=0,k;
  for(k=0;k<CT.els.length;k++){
    var e=CT.els[k];
    if(e.t==='batt')mx=Math.max(mx,Math.abs(sol.cur[e.id]||0));
  }
  return mx;
}
function chCheck(i){
  var sol=SOLV, lb=litBulbs(sol), k;
  if(i===0){ return lb.length>=1; }
  if(i===1){
    // some switch such that toggling changes some bulb's lit state
    for(k=0;k<CT.els.length;k++){
      var sw=CT.els[k];
      if(sw.t!=='sw')continue;
      var keep=sw.closed;
      sw.closed=1; var s1=solveCircuit(CT.els); var l1=litBulbs(s1).length;
      sw.closed=0; var s0=solveCircuit(CT.els); var l0=litBulbs(s0).length;
      sw.closed=keep;
      if(l1>l0)return true;
    }
    return false;
  }
  if(i===2){
    if(lb.length<2)return false;
    var Ib=battI(sol);
    for(k=1;k<lb.length;k++){
      if(Math.abs(lb[k].I-lb[0].I)>0.02)return false;
    }
    return Math.abs(lb[0].I-Ib)<0.05&&Ib>0.05;
  }
  if(i===3){
    if(lb.length<2)return false;
    var Ib2=battI(sol);
    var v1=Math.abs(sol.V[lb[0].e.a]-sol.V[lb[0].e.b]);
    var v2=Math.abs(sol.V[lb[1].e.a]-sol.V[lb[1].e.b]);
    return Math.abs(v1-v2)<0.08&&Ib2>1.3*lb[0].I;
  }
  if(i===4){
    if(lb.length<1)return false;
    for(k=0;k<CT.els.length;k++){
      var am=CT.els[k];
      if(am.t==='amm'&&Math.abs(sol.cur[am.id]||0)>0.05)return true;
    }
    return false;
  }
  if(i===5){ return sol.sh; }
  return false;
}

function T(k){return (I[LANG][k]!==undefined)?I[LANG][k]:k}

/* ================= helpers ================= */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function d2r(d){return d*Math.PI/180}
function lum(hex){
  if(hex[0]!=='#')return 0.5;
  var r=parseInt(hex.substr(1,2),16)/255,g=parseInt(hex.substr(3,2),16)/255,b=parseInt(hex.substr(5,2),16)/255;
  return 0.299*r+0.587*g+0.114*b;
}
/* ===== theme ===== */
var DARK=false;
var THMAP={'#FBF7EC':'#1A2130','#FFFDF7':'#1E2637','#F3EDDD':'#2A3348','#FFFFFF':'#2E3850',
'#26221B':'#EDE7D6','#4B4437':'#D2CCBC','#6B6252':'#5A605D','#8A8070':'#9AA2B4','#B9AE95':'#66708A',
'#E3DCCB':'#39435C','#5B6770':'#A9BAC8','#D8D0BC':'#39435C'};
function THX(c){return (DARK&&THMAP[c])?THMAP[c]:c}
function PAINT(str){
  if(!DARK)return str;
  return str.replace(/(fill|stroke)="(#[0-9A-Fa-f]{6})"/g,function(m,a,c){
    var mm=THMAP[c.toUpperCase()];
    return mm?(a+'="'+mm+'"'):m;
  });
}
function tl(x,y,size,fill,txt,anchor,weight){
  fill=THX(fill);
  var halo=lum(fill)>0.5?'#26221B':'#FFFFFF';
  return '<text x="'+Math.round(x)+'" y="'+Math.round(y)+'" font-size="'+Math.round(size)+
   '" font-weight="'+(weight||700)+'" fill="'+fill+'" text-anchor="'+(anchor||'middle')+
   '" style="paint-order:stroke;stroke:'+halo+';stroke-width:3px;stroke-linejoin:round">'+txt+'</text>';
}
function tlplain(x,y,size,fill,txt,anchor,weight){
  fill=THX(fill);
  return '<text x="'+Math.round(x)+'" y="'+Math.round(y)+'" font-size="'+Math.round(size)+
   '" font-weight="'+(weight||700)+'" fill="'+fill+'" text-anchor="'+(anchor||'middle')+'">'+txt+'</text>';
}
function svgPt(svg,ev,vw,vh){
  var r=svg.getBoundingClientRect();
  return {x:(ev.clientX-r.left)*vw/r.width, y:(ev.clientY-r.top)*vh/r.height};
}
function makeDrag(svg,vw,vh,onmove,onup){
  var down=false;
  svg.addEventListener('pointerdown',function(e){
    e.preventDefault(); down=true;
    try{svg.setPointerCapture(e.pointerId)}catch(err){}
    onmove(svgPt(svg,e,vw,vh),true);
  });
  svg.addEventListener('pointermove',function(e){
    if(!down)return; e.preventDefault();
    onmove(svgPt(svg,e,vw,vh),false);
  });
  svg.addEventListener('pointerup',function(){down=false;if(onup)onup()});
  svg.addEventListener('pointercancel',function(){down=false;if(onup)onup()});
}

/* ================= circuit model ================= */
var COLS=10, ROWS=6, GX0=52, GY0=64, STEP=62;
function nx(n){return GX0+(n%COLS)*STEP}
function ny(n){return GY0+Math.floor(n/COLS)*STEP}
function nid(r,c){return r*COLS+c}
function adjacent(a,b){
  var dc=Math.abs(a%COLS-b%COLS), dr=Math.abs(Math.floor(a/COLS)-Math.floor(b/COLS));
  return a!==b&&dc<=1&&dr<=1;
}
function ekey(a,b){return a<b?(a+'_'+b):(b+'_'+a)}
var DEF={wire:{R:0.02},batt:{R:0.3,E:3},bulb:{R:6},res:{R:5},sw:{R:0.02},amm:{R:0.02}};
var CT={els:[],next:1};
var SEL=0, PALETTE='wire';
var PH={};        // per-element current-dot phase
var SOLV={V:[],cur:{},sh:false,any:false};
var PR=[{x:440,y:90,node:-1},{x:600,y:90,node:-1}];   // red, black probes
var VM={on:false,x:520,y:150};                             // draggable voltmeter body

function edgeUsed(a,b){
  var k=ekey(a,b),i;
  for(i=0;i<CT.els.length;i++){
    if(ekey(CT.els[i].a,CT.els[i].b)===k)return true;
  }
  return false;
}
function addEl(t,a,b){
  if(!adjacent(a,b)||edgeUsed(a,b))return 0;
  var e={id:CT.next++,t:t,a:a,b:b,val:(t==='batt'?DEF.batt.E:(t==='bulb'?DEF.bulb.R:DEF.res.R)),closed:1,flip:0};
  CT.els.push(e); PH[e.id]=0;
  return e.id;
}
function delEl(id){
  var i;
  for(i=0;i<CT.els.length;i++){
    if(CT.els[i].id===id){CT.els.splice(i,1);break}
  }
  if(SEL===id)SEL=0;
}
function elR(e){
  if(e.t==='batt')return DEF.batt.R;
  if(e.t==='res'||e.t==='bulb')return e.val;
  return DEF[e.t].R;
}
/* MNA (pure conductance + Norton sources), Gaussian elimination */
function solveCircuit(els){
  var N=COLS*ROWS, i, j, k, e;
  var G=[], Ivec=[];
  for(i=0;i<N;i++){
    G.push(new Array(N));
    for(j=0;j<N;j++)G[i][j]=0;
    G[i][i]=1e-9;
    Ivec.push(0);
  }
  var anySrc=false;
  for(k=0;k<els.length;k++){
    e=els[k];
    if(e.t==='sw'&&!e.closed)continue;
    var g=1/elR(e);
    G[e.a][e.a]+=g; G[e.b][e.b]+=g;
    G[e.a][e.b]-=g; G[e.b][e.a]-=g;
    if(e.t==='batt'){
      anySrc=true;
      var E=e.flip?-e.val:e.val;   // + terminal at b when !flip
      Ivec[e.a]-=E*g; Ivec[e.b]+=E*g;
    }
  }
  // gaussian elimination with partial pivot
  var V=new Array(N);
  for(i=0;i<N;i++)V[i]=0;
  if(anySrc){
    for(i=0;i<N;i++){
      var p=i, m=Math.abs(G[i][i]);
      for(j=i+1;j<N;j++){ if(Math.abs(G[j][i])>m){m=Math.abs(G[j][i]);p=j} }
      if(p!==i){var tr=G[i];G[i]=G[p];G[p]=tr; var tv=Ivec[i];Ivec[i]=Ivec[p];Ivec[p]=tv}
      var pv=G[i][i];
      if(Math.abs(pv)<1e-14)continue;
      for(j=i+1;j<N;j++){
        var f=G[j][i]/pv;
        if(f===0)continue;
        for(k=i;k<N;k++)G[j][k]-=f*G[i][k];
        Ivec[j]-=f*Ivec[i];
      }
    }
    for(i=N-1;i>=0;i--){
      var s=Ivec[i];
      for(j=i+1;j<N;j++)s-=G[i][j]*V[j];
      V[i]=Math.abs(G[i][i])<1e-14?0:s/G[i][i];
    }
  }
  var cur={}, sh=false;
  for(k=0;k<els.length;k++){
    e=els[k];
    if(e.t==='sw'&&!e.closed){cur[e.id]=0;continue}
    var g2=1/elR(e);
    var Ie=(V[e.a]-V[e.b])*g2;
    if(e.t==='batt'){
      var E2=e.flip?-e.val:e.val;
      Ie=(V[e.a]-V[e.b]+E2)*g2;
      if(Math.abs(Ie)>6)sh=true;
    }
    cur[e.id]=Ie;
  }
  return {V:V,cur:cur,sh:sh,any:anySrc};
}
function solve(){ SOLV=solveCircuit(CT.els); }
function elById(id){
  for(var i=0;i<CT.els.length;i++)if(CT.els[i].id===id)return CT.els[i];
  return null;
}
function bulbP(e){ var Ie=SOLV.cur[e.id]||0; return Ie*Ie*e.val; }
/* presets */
function preset(p){
  CT.els=[];SEL=0;
  function W(r1,c1,r2,c2,t){addEl(t||'wire',nid(r1,c1),nid(r2,c2))}
  if(p===0){
    // his series demo: big loop, 2 batteries on top, ammeter left, switch right, 2 bulbs on the bottom
    W(0,1,0,2);W(0,2,0,3);W(0,3,0,4,'batt');W(0,4,0,5,'batt');W(0,5,0,6);W(0,6,0,7);W(0,7,0,8);
    W(0,1,1,1);W(1,1,2,1,'amm');W(2,1,3,1);W(3,1,4,1);

function pickNode(pt){
  var best=-1,bd=26,r,c;
  for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++){
    var d=Math.abs(pt.x-(GX0+c*STEP))+Math.abs(pt.y-(GY0+r*STEP));
    if(d<bd){bd=d;best=nid(r,c)}
  }
  return best;
}
function pickEl(pt){
  var k;
  for(k=CT.els.length-1;k>=0;k--){
    var e=CT.els[k];
    var mx=(nx(e.a)+nx(e.b))/2, my=(ny(e.a)+ny(e.b))/2;
    if(Math.abs(pt.x-mx)<20&&Math.abs(pt.y-my)<20)return e;
  }
  return null;
}
function pickProbe(pt){
  for(var pi=0;pi<2;pi++){
    var P=PR[pi];
    var px2=P.node>=0?nx(P.node):P.x, py2=P.node>=0?ny(P.node):P.y;
    if(Math.abs(pt.x-px2)<18&&Math.abs(pt.y-py2)<18)return pi;
  }
  return -1;
}
function initCanvas(svgid){
  var mode=0, probeI=-1, hitEl=null, downPt=null, moved=false;
  makeDrag($(svgid),660,470,function(pt,isdown){
    if(isdown){
      moved=false; downPt=pt;
      probeI=VM.on?pickProbe(pt):-1;
      if(probeI>=0){mode=1;return}
      if(VM.on&&Math.abs(pt.x-VM.x)<48&&Math.abs(pt.y-VM.y)<22){mode=4;return}
      hitEl=pickEl(pt);
      if(hitEl){mode=2;return}
      var n=pickNode(pt);
      if(n>=0){mode=3;LAY.on=true;LAY.cur=n;LAY.px=pt.x;LAY.py=pt.y;drawBoth();return}
      mode=0;
      return;
    }
    if(Math.abs(pt.x-downPt.x)+Math.abs(pt.y-downPt.y)>8)moved=true;
    if(mode===1){
      PR[probeI].x=clamp(pt.x,16,644);PR[probeI].y=clamp(pt.y,16,462);
      PR[probeI].node=pickNode(pt);
      drawBoth();
    }else if(mode===4){
      VM.x=clamp(pt.x,50,610);VM.y=clamp(pt.y,26,444);
      drawBoth();
    }else if(mode===3){
      LAY.px=pt.x;LAY.py=pt.y;
      var n=pickNode(pt);
      if(n>=0&&n!==LAY.cur&&adjacent(LAY.cur,n)){
        if(!edgeUsed(LAY.cur,n)){
          var id=addEl(PALETTE,LAY.cur,n);
          if(id){
            SEL=id; solve();
            if(PALETTE==='wire'||PALETTE==='batt'){LAY.cur=n}
            else{LAY.on=false;mode=0}
          }
        }else if(PALETTE==='wire'||PALETTE==='batt'){
          LAY.cur=n;   // walk along existing elements while wiring
        }
      }
      drawBoth();
    }
  },function(){
    if(mode===2&&hitEl&&!moved){
      SEL=hitEl.id;
      if(hitEl.t==='sw'){hitEl.closed=hitEl.closed?0:1;solve()}
      drawBoth();updSummary();
    }
    if(mode===3){LAY.on=false;drawBoth()}
    mode=0;hitEl=null;
  });
}

var CH={i:0,done:[]};
function litBulbs(sol){
  var out=[],k;
  for(k=0;k<CT.els.length;k++){
    var e=CT.els[k];
    if(e.t!=='bulb')continue;
    var Ie=sol.cur[e.id]||0;
    if(Ie*Ie*e.val>0.05)out.push({e:e,I:Math.abs(Ie)});
  }
  return out;
}
function battI(sol){
  var mx=0,k;
  for(k=0;k<CT.els.length;k++){
    var e=CT.els[k];
    if(e.t==='batt')mx=Math.max(mx,Math.abs(sol.cur[e.id]||0));
  }
  return mx;
}
function chCheck(i){
  var sol=SOLV, lb=litBulbs(sol), k;
  if(i===0){ return lb.length>=1; }
  if(i===1){
    // some switch such that toggling changes some bulb's lit state
    for(k=0;k<CT.els.length;k++){
      var sw=CT.els[k];
      if(sw.t!=='sw')continue;
      var keep=sw.closed;
      sw.closed=1; var s1=solveCircuit(CT.els); var l1=litBulbs(s1).length;
      sw.closed=0; var s0=solveCircuit(CT.els); var l0=litBulbs(s0).length;
      sw.closed=keep;
      if(l1>l0)return true;
    }
    return false;
  }
  if(i===2){
    if(lb.length<2)return false;
    var Ib=battI(sol);
    for(k=1;k<lb.length;k++){
      if(Math.abs(lb[k].I-lb[0].I)>0.02)return false;
    }
    return Math.abs(lb[0].I-Ib)<0.05&&Ib>0.05;
  }
  if(i===3){
    if(lb.length<2)return false;
    var Ib2=battI(sol);
    var v1=Math.abs(sol.V[lb[0].e.a]-sol.V[lb[0].e.b]);
    var v2=Math.abs(sol.V[lb[1].e.a]-sol.V[lb[1].e.b]);
    return Math.abs(v1-v2)<0.08&&Ib2>1.3*lb[0].I;
  }
  if(i===4){
    if(lb.length<1)return false;
    for(k=0;k<CT.els.length;k++){
      var am=CT.els[k];
      if(am.t==='amm'&&Math.abs(sol.cur[am.id]||0)>0.05)return true;
    }
    return false;
  }
  if(i===5){ return sol.sh; }
  return false;
}

   {q:'2. 并联电路中，每条支路相同的是……',o:[
    ['电流',0,'各支路电流可以不同——由各自的电阻决定。'],
    ['电压',1,'正确——每条支路都直接跨在电源两端。'],
    ['电阻',0,'各支路电阻完全可以不一样。'],
    ['功率',0,'电阻不同功率就不同。']]},
   {q:'3. 两颗灯串联，其中一颗烧坏了，另一颗……',o:[
    ['变得更亮',0,'唯一的通路断了，什么都流不动。'],
    ['照常亮',0,'烧坏的灯把唯一的路断开了。'],
    ['也熄灭',1,'正确——一条路断了，全部电流停止。'],
    ['闪烁',0,'没有通路就没有电流——直接熄灭。']]},
   {q:'4. 家里再多插上一个电器（并联），干路电流……',o:[
    ['变小',0,'多一条支路就多一份电流要供。'],
    ['完全不变',0,'干路电流 = 各支路之和——会变大。'],
    ['变大',1,'正确——干路电流等于各支路之和。这就是插线板不能超载的原因。'],
    ['变为零',0,'多接一条支路不会让其他支路停。']]},
   {q:'5. 短路危险的原因是……',o:[
    ['电压变得太高',0,'电源电压没有升高——是电阻塌掉了。'],
    ['电阻几乎为零，电流变得极大',1,'正确——I=V/R，R 极小时电流巨大，导线发热起火。'],
    ['电流变为零',0,'恰恰相反——电流会变得极大。'],
    ['电池正负极对调',0,'极性不会翻转——是电流的大小失控。']]},
   {q:'6. 两种电表的接法是……',o:[
    ['电流表并联，电压表串联',0,'正好接反——轻则读零，重则烧电流表。'],
    ['电流表串联，电压表并联',1,'正确——电流表当自己是导线串进去；电压表跨在元件两端。'],
    ['都串联',0,'电压表电阻极大，串联会把电路"堵死"。'],
    ['都并联',0,'电流表电阻极小，并联等于给电路加了条短路支路。']]},
   {q:'7. 同样两颗灯接同一个电池：串联和并联，哪种更亮？',o:[
    ['串联',0,'串联时每颗只分到一半电压。'],
    ['并联',1,'正确——并联时每颗独享全电压，所以每颗都更亮。'],
    ['一样亮',0,'半电压对全电压——差得远。'],
    ['都不亮',0,'两种接法都亮，只是并联更亮。']]}
  ];
}
var QZi=0,QZpick=[],QZdone=[],QZfirst=[];
function drawQZ(){buildQuiz()}
function qzHead(){
  var data=QZdata(),N=data.length,nf=0,k;
  for(k=0;k<N;k++)if(QZfirst[k]===true)nf++;
  $('qzprog').textContent=(LANG==='en'?'Q ':'第 ')+Math.min(QZi+1,N)+' / '+N+(LANG==='en'?'':' 题');
  $('qzscore').textContent=(LANG==='en'?'first try ':'一次答对 ')+nf+' / '+N;
  return nf;
}
function buildQuiz(){
  var data=QZdata(),h='',k,j,N=data.length;
  var nf=qzHead();
  if(QZi>=N){
    $('quiz').innerHTML='<div class="q"><div class="qt">'+(LANG==='en'?'🎉 Done! First-try score: ':'🎉 全部完成！一次答对：')+nf+' / '+N+'</div></div>';
    return;
  }
  var d=data[QZi];
  h+='<div class="q"><div class="qt">'+d.q+'</div>';
  for(j=0;j<d.o.length;j++){
    h+='<button class="opt" data-o="'+j+'">'+String.fromCharCode(65+j)+'. '+d.o[j][0]+'</button>';
    h+='<div class="fb" id="fbq_'+j+'">'+d.o[j][2]+'</div>';
  }
  h+='</div>';
  h+='<button class="dbtn" id="qznext" style="display:none">'+(QZi===N-1?(LANG==='en'?'Finish ✔':'完成 ✔'):(LANG==='en'?'Next ▶':'下一题 ▶'))+'</button>';
  $('quiz').innerHTML=h;
  var ops=document.querySelectorAll('#quiz .opt');
  for(k=0;k<ops.length;k++){
    ops[k].addEventListener('click',function(){
      if(QZdone[QZi])return;
      pickQ(+this.getAttribute('data-o'));
    });
  }
  var nb=$('qznext');
  if(nb)nb.addEventListener('click',function(){QZi++;buildQuiz();updSummary()});
  if(QZpick[QZi]!==undefined)restoreQ();
}
function pickQ(oi){
  var data=QZdata(),d=data[QZi];
  QZpick[QZi]=oi;
  if(QZfirst[QZi]===undefined)QZfirst[QZi]=(d.o[oi][1]===1);
  if(d.o[oi][1]===1)QZdone[QZi]=true;
  restoreQ();
  qzHead();
}
function restoreQ(){
  var data=QZdata(),d=data[QZi],j;
  var ops=document.querySelectorAll('#quiz .opt');
  var oi=QZpick[QZi];
  for(j=0;j<ops.length;j++){
    ops[j].classList.remove('ok');ops[j].classList.remove('bad');
    var f=$('fbq_'+j);if(f)f.classList.remove('show');
  }
  if(oi===undefined||!ops[oi])return;
  var right=d.o[oi][1]===1;
  ops[oi].classList.add(right?'ok':'bad');
  var fb=$('fbq_'+oi);if(fb)fb.classList.add('show');
  var nb=$('qznext');
  if(nb)nb.style.display=QZdone[QZi]?'':'none';
}

/* ================= boot ================= */
function setLang(l){
  LANG=l;
  $('langbtn').textContent=(l==='zh')?'EN':'中';
  document.documentElement.setAttribute('lang',l==='zh'?'zh':'en');
  applyI18n();
  buildCmp(); buildQuiz(); buildCH('');
  RENDER[CUR](); updSummary();
}
function boot(){
  RENDER=[drawBoth,drawCH,drawP2,drawQZ];
  SUMMARY=[
    function(){return drawStatus()},
    function(){var chs=T('chs'),nd=0,k;for(k=0;k<chs.length;k++)if(CH.done[k])nd++;return T('chprog')+' '+nd+' / '+chs.length},
    function(){return T('cmp_title')},
    function(){return T('qz_title')+' '+$('qzscore').textContent}
  ];
  initTabs(); initCanvas('svgcc'); initCanvas('svgcc2');
  var k;
  var cp=document.querySelectorAll('.compP');
  for(k=0;k<cp.length;k++)cp[k].addEventListener('click',function(){
    PALETTE=this.getAttribute('data-t');
    var bs=document.querySelectorAll('.compP');
    for(var j=0;j<bs.length;j++)bs[j].classList.toggle('on',bs[j].getAttribute('data-t')===PALETTE);
  });
  $('vsel').addEventListener('input',function(){
    var se=elById(SEL);
    if(!se)return;
    se.val=+this.value;
    $('vsellab').textContent=se.t==='batt'?se.val.toFixed(1)+' V':se.val+' Ω';
    solve();drawBoth();
  });
  $('flipbtn').addEventListener('click',function(){
    var se=elById(SEL);
    if(se&&se.t==='batt'){se.flip=se.flip?0:1;solve();drawBoth()}
  });
  $('delbtn').addEventListener('click',function(){
    if(SEL){delEl(SEL);solve();drawBoth();updSummary()}
  });
  var vb=document.querySelectorAll('.vmbtn');
  for(k=0;k<vb.length;k++)vb[k].addEventListener('click',function(){
    VM.on=!VM.on;
    var bs=document.querySelectorAll('.vmbtn');
    for(var j=0;j<bs.length;j++)bs[j].classList.toggle('on',VM.on);
    if(VM.on){VM.x=520;VM.y=150;PR[0].x=440;PR[0].y=90;PR[0].node=-1;PR[1].x=600;PR[1].y=90;PR[1].node=-1}
    drawBoth();updSummary();
  });
  var CLRARM=0;
  $('clrbtn').addEventListener('click',function(){
    var self=this;
    if(!CLRARM){
      this.textContent=T('clr_conf');
      this.classList.add('warn');
      CLRARM=setTimeout(function(){
        CLRARM=0;
        self.textContent=T('dk_clr');
        self.classList.remove('warn');
      },2600);
      return;
    }
    clearTimeout(CLRARM);CLRARM=0;
    this.textContent=T('dk_clr');
    this.classList.remove('warn');
    CT.els=[];SEL=0;solve();drawBoth();updSummary();
    if(CUR===1)buildCH('');
  });
  var pr=document.querySelectorAll('.prep');
  for(k=0;k<pr.length;k++)pr[k].addEventListener('click',function(){
    preset(+this.getAttribute('data-p'));drawBoth();updSummary();
  });
  $('chprev').addEventListener('click',function(){
    CH.i=Math.max(0,CH.i-1);buildCH('');updSummary();
  });
  $('chnext').addEventListener('click',function(){
    CH.i=Math.min(T('chs').length-1,CH.i+1);buildCH('');updSummary();
  });
  $('chcheck').addEventListener('click',function(){
    solve();
    var ok=chCheck(CH.i);
    if(ok)CH.done[CH.i]=true;
    buildCH(ok?'ok':'no');
    drawBoth();updSummary();
  });
  $('qzreset').addEventListener('click',function(){QZpick=[];QZdone=[];QZfirst=[];QZi=0;buildQuiz();updSummary()});
  $('langbtn').addEventListener('click',function(){setLang(LANG==='zh'?'en':'zh')});
  $('thmbtn').addEventListener('click',function(){
    DARK=!DARK;
    if(document.body)document.body.classList.toggle('dark',DARK);
    this.textContent=DARK?'☀️':'🌙';
    RENDER[CUR]();updSummary();
  });
  initExp();
  applyI18n();
  buildCmp(); buildQuiz(); buildCH('');
  solve();
  showTab(0);
  AMB=requestAnimationFrame(ambLoop);
}
function drawStatus(){
  if(CT.els.length===0)return T('st_empty');
  if(SOLV.sh)return T('st_short');
  var k;
  for(k=0;k<CT.els.length;k++){
    if(Math.abs(SOLV.cur[CT.els[k].id]||0)>0.02)return T('st_ok');
  }
  return T('st_open2');
}
boot();

/* test hook */
window.__test=function(){
  var i;
  for(i=0;i<TABN;i++){showTab(i)}
  // build a series circuit programmatically and solve
  preset(0);drawBoth();
  // toggle its switch
  for(i=0;i<CT.els.length;i++){if(CT.els[i].t==='sw'){CT.els[i].closed=0;break}}
  solve();drawBoth();
  for(i=0;i<CT.els.length;i++){if(CT.els[i].t==='sw'){CT.els[i].closed=1;break}}
  solve();drawBoth();
  // parallel preset + probes + ammeter + value edits
  preset(1);
  VM.on=true;
  PR[0].node=nid(2,4);PR[1].node=nid(3,4);
  VM.x=400;VM.y=220;drawBoth();
  addEl('amm',nid(2,5),nid(2,6));
  solve();drawBoth();
  var se=null;
  for(i=0;i<CT.els.length;i++){if(CT.els[i].t==='batt'){se=CT.els[i];break}}
  if(se){SEL=se.id;se.val=6;solve();drawBoth();se.flip=1;solve();drawBoth();se.flip=0}
  var bl=null;
  for(i=0;i<CT.els.length;i++){if(CT.els[i].t==='bulb'){bl=CT.els[i];break}}
  if(bl){SEL=bl.id;bl.val=12;solve();drawBoth();bl.val=6}
  VM.on=false;
  // challenges: check all on suitable circuits
  preset(0);solve();
  for(i=0;i<6;i++){CH.i=i;buildCH(chCheck(i)?'ok':'no')}
  preset(1);solve();
  for(i=0;i<6;i++){CH.i=i;buildCH(chCheck(i)?'ok':'no')}
  // short circuit test
  CT.els=[];addEl('batt',nid(2,2),nid(2,3));addEl('wire',nid(2,3),nid(3,3));
  addEl('wire',nid(3,3),nid(3,2));addEl('wire',nid(3,2),nid(2,2));
  solve();drawBoth();
  CH.i=5;buildCH(chCheck(5)?'ok':'no');
  // laying preview branch
  LAY.on=true;LAY.cur=nid(0,0);LAY.px=100;LAY.py=100;drawBoth();LAY.on=false;
  // deletion + clear
  if(CT.els.length){SEL=CT.els[0].id;delEl(SEL);solve();drawBoth()}
  CT.els=[];solve();drawBoth();
  // quiz sweep
  for(i=0;i<7;i++){QZi=i;buildQuiz();pickQ(i%4)}
  QZi=7;buildQuiz();
  QZi=0;QZpick=[];QZdone=[];QZfirst=[];buildQuiz();
  DARK=true;for(i=0;i<TABN;i++){RENDER[i]()}
  DARK=false;
  setLang('en');for(i=0;i<TABN;i++){RENDER[i]()}
  setLang('zh');
  preset(0);showTab(0);
};
