<script>
'use strict';
const $ = id => document.getElementById(id);
function clamp(v,a,b){ if(!isFinite(v)) return a; return v<a?a:(v>b?b:v); }

/* ============================================================
   Quiz bank (from the source file, trimmed to 3 options each)
============================================================ */
const QUIZ_ZH = [
  { e:'💧', q:'水力发电中，水库里高处的水一开始储存的是什么能？',
    o:['动能','重力势能','化学能'], a:1,
    x:'水被拦蓄在高处，储存<em>重力势能</em>；落下时转化为<em>动能</em>，冲击水轮机变成<em>机械能</em>，最后由发电机转化为电能。切回「演示实验」按 💧 水力，看画面里的落差 h。' },
  { e:'🌬️', q:'风力发电的能量转化顺序是？',
    o:['动能 → 机械能 → 电能','重力势能 → 动能 → 电能','化学能 → 内能 → 电能'], a:0,
    x:'风本来就在<em>流动</em>，一开始就具有<em>动能</em>，不需要先被举高，所以链条只有 <em>3 段</em>。演示实验里选风力，看画面下方的转化链。' },
  { e:'🔥', q:'火力发电完整的能量转化链是？',
    o:['重力势能 → 动能 → 机械能 → 电能','内能 → 化学能 → 机械能 → 电能','化学能 → 内能 → 机械能 → 电能'], a:2,
    x:'煤储存<em>化学能</em>；燃烧放热 → <em>内能</em>（高温高压蒸汽）；蒸汽推动汽轮机 → <em>机械能</em>；发电机 → 电能。注意顺序不能颠倒：先燃烧才有内能。' },
  { e:'⚙️', q:'水力、风力、火力发电共同的最后一步是什么？',
    o:['锅炉把化学能转化为内能','发电机利用电磁感应把机械能转化为电能','水轮机把动能转化为机械能'], a:1,
    x:'三种方式最后一步<em>完全相同</em>——都是发电机靠<em>电磁感应</em>把机械能转化为电能。区别只在前半段：用落下的水、流动的风，还是高温蒸汽去推涡轮。' },
  { e:'♻️', q:'某火力发电厂输入 100 份化学能，只有约 40 份变成有用电能，其余 60 份到哪里去了？',
    o:['凭空消失了','变成废热（冷却水、烟气带走）散失到环境中，总量仍然守恒','又变回了额外的电能'], a:1,
    x:'能量<em>不会消失</em>：40 份电能 ＋ 60 份废热 ＝ <em>100 份</em>。废热主要被冷却塔的冷却水和烟囱的高温烟气带走。回演示实验看侧栏那条守恒式。' },
  { e:'💡', q:'既然能量是守恒的、总量不会减少，为什么还要节约能源？',
    o:['因为每次转化都有一部分变成散失的废热，这部分很难再被利用','因为能量会越用越少，总量会减少','因为能量守恒定律在生活中不成立'], a:0,
    x:'能量<em>总量</em>确实守恒，但每次转化都有一部分变成<em>散失到环境中的废热</em>，分散开来后很难再收集利用——能量转化是<em>有方向性</em>的。节能节的是「还能用的那部分」。' },
  { e:'🌍', q:'下列关于三种发电方式的说法，正确的是？',
    o:['风力发电的效率比水力发电高','水力和风力用的是可再生能源，发电时基本不排放 CO₂','火力发电用的煤属于可再生能源'], a:1,
    x:'水力、风力属于<em>可再生</em>能源，发电时基本不排放 CO₂；火力烧的煤是<em>不可再生</em>的，会排放 CO₂，但输出稳定可控。效率上水力约 85%，风力约 40%。' },
  { e:'🔄', q:'摇手摇发电机时，摇得越快灯越亮，手也越费力。为什么会越费力？',
    o:['因为要输出更多电能，就必须从手臂拿走更多机械能','因为电能会凭空产生，手只是引子','因为转得快时磁铁会变重'], a:0,
    x:'灯亮起来的电能<em>不是凭空冒出来的</em>，全部来自你手臂做功的<em>机械能</em>。输出电能越多，每秒要消耗的机械能就越多，自然越费力——这正是<em>能量守恒</em>。' },
];
const QUIZ_EN = [
  { e:'💧', q:'In a hydro plant, what energy does the water stored high in the reservoir have first?',
    o:['Kinetic energy','Gravitational potential energy','Chemical energy'], a:1,
    x:'Water held high stores <em>gravitational PE</em>; falling turns it into <em>kinetic energy</em>, the turbine turns it into <em>mechanical energy</em>, the generator into electrical. Switch to the Demo Lab and look at the head h.' },
  { e:'🌬️', q:'What is the energy conversion order for wind power?',
    o:['Kinetic → mechanical → electrical','Gravitational PE → kinetic → electrical','Chemical → internal → electrical'], a:0,
    x:'Wind is <em>already moving</em>, so it starts with <em>kinetic energy</em> — nothing has to be lifted first, so the chain has only <em>3 links</em>. Pick Wind in the Demo Lab and read the chain.' },
  { e:'🔥', q:'What is the full energy chain of a thermal (coal) power station?',
    o:['Grav. PE → kinetic → mechanical → electrical','Internal → chemical → mechanical → electrical','Chemical → internal → mechanical → electrical'], a:2,
    x:'Coal stores <em>chemical energy</em>; burning releases heat → <em>internal energy</em> (high-pressure steam); steam drives the turbine → <em>mechanical</em>; generator → electrical. The order cannot be swapped.' },
  { e:'⚙️', q:'What is the LAST step shared by hydro, wind and thermal power?',
    o:['The boiler turns chemical energy into internal energy','The generator uses induction to turn mechanical energy into electrical energy','The turbine turns kinetic energy into mechanical energy'], a:1,
    x:'The last step is <em>identical</em> in all three — the generator uses <em>electromagnetic induction</em>. Only the first half differs: falling water, moving air, or hot steam driving the turbine.' },
  { e:'♻️', q:'A coal plant takes in 100 units of chemical energy but only ~40 become useful electricity. Where do the other 60 go?',
    o:['They simply vanish','They become waste heat (cooling water, flue gas) spread into the surroundings — the total is still conserved','They turn back into extra electricity'], a:1,
    x:'Energy <em>never vanishes</em>: 40 units of electricity ＋ 60 units of waste heat ＝ <em>100 units</em>. Most waste heat leaves via the cooling tower and the chimney. Check the conservation line in the sidebar.' },
  { e:'💡', q:'If energy is conserved and never decreases, why do we still need to save energy?',
    o:['Because every conversion turns part of it into scattered waste heat that is very hard to use again','Because energy really does get used up and the total shrinks','Because conservation of energy does not hold in real life'], a:0,
    x:'The <em>total</em> is conserved, but each conversion spills part of it as <em>waste heat spread into the surroundings</em>, which is very hard to collect again — conversion has a <em>direction</em>. Saving energy means saving the usable part.' },
  { e:'🌍', q:'Which statement about the three ways of generating power is correct?',
    o:['Wind power is more efficient than hydro power','Hydro and wind use renewable sources and emit almost no CO₂ while generating','The coal used in thermal plants is a renewable resource'], a:1,
    x:'Hydro and wind are <em>renewable</em> and emit almost no CO₂ while running; coal is <em>non-renewable</em> and emits CO₂, but its output is steady and controllable. Hydro ≈ 85% efficient, wind ≈ 40%.' },
  { e:'🔄', q:'Cranking a hand generator faster makes the lamp brighter AND makes your arm work harder. Why harder?',
    o:['Because more electrical output must be taken from more mechanical energy in your arm','Because electricity appears from nothing and your hand only triggers it','Because the magnet gets heavier when it spins fast'], a:0,
    x:'The electrical energy lighting the lamp does <em>not</em> come from nowhere — it all comes from the <em>mechanical work</em> of your arm. More output per second means more mechanical energy per second: <em>conservation of energy</em>.' },
];

/* ============================================================
   Shared drawing helpers
============================================================ */
const CV_FONT = '"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
function rrect(c,x,y,w,h,r){
  c.beginPath();
  if(c.roundRect){ c.roundRect(x,y,w,h,r); return; }
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}
function circle(c,x,y,r,fill,stroke,lw){
  c.beginPath(); c.arc(x,y,r,0,Math.PI*2);
  if(fill){ c.fillStyle=fill; c.fill(); }
  if(stroke){ c.strokeStyle=stroke; c.lineWidth=lw||1.5; c.stroke(); }
}
function line(c,x1,y1,x2,y2,col,lw,dash){
  c.beginPath();
  if(c.setLineDash) c.setLineDash(dash||[]);
  c.moveTo(x1,y1); c.lineTo(x2,y2);
  c.strokeStyle=col; c.lineWidth=lw||1.5; c.stroke();
  if(c.setLineDash) c.setLineDash([]);
}
function TX(c,s,x,y,font,color,align,base){
  c.font=font; c.fillStyle=color; c.textAlign=align||'left'; c.textBaseline=base||'middle';
  if(!isFinite(x)||!isFinite(y)) return;
  c.fillText(s,x,y);
}
/* pill-backed text, clamped inside the canvas */
function tchip(c,s,x,y,font,color,align,W,H){
  c.font=font;
  const w=c.measureText(s).width;
  const m=/([\d.]+)px/.exec(font), fs=m?parseFloat(m[1]):14, h=fs+13;
  const al=align||'center';
  let x0 = al==='left' ? x : (al==='right' ? x-w : x-w/2);
  x0 = clamp(x0, 10, Math.max(10, (W||1000)-w-10));
  const yy = clamp(y, h/2+4, (H||500)-h/2-4);
  rrect(c,x0-10,yy-h/2,w+20,h,9);
  c.fillStyle=C().pill; c.fill();
  c.strokeStyle=C().pillLine; c.lineWidth=1.2; c.stroke();
  TX(c,s,x0+w/2,yy,font,color,'center','middle');
}
function ribbon(c,x0,aT,aB,x1,bT,bB,fill){
  const d=(x1-x0)*0.45;
  c.beginPath();
  c.moveTo(x0,aT);
  c.bezierCurveTo(x0+d,aT,x1-d,bT,x1,bT);
  c.lineTo(x1,bB);
  c.bezierCurveTo(x1-d,bB,x0+d,aB,x0,aB);
  c.closePath(); c.fillStyle=fill; c.fill();
}
function bez(x0,y0,x1,y1,u){
  const d=(x1-x0)*0.45;
  const c1x=x0+d, c2x=x1-d, v=1-u;
  return [v*v*v*x0+3*v*v*u*c1x+3*v*u*u*c2x+u*u*u*x1,
          v*v*v*y0+3*v*v*u*y0+3*v*u*u*y1+u*u*u*y1];
}
function prand(i){ const v=Math.sin(i*127.1+311.7)*43758.5453; return v-Math.floor(v); }

/* ============================================================
   Physics model (kept from the source file's numbers)
   - each plant fixes the input energy form and the whole-plant efficiency
   - generator: emf ∝ N·B·n  →  P_out ∝ (N·B·n)²   (source: 越快越费力 �� 电流²)
   - P_in = P_out / η ,  P_loss = P_in − P_out  ⇒  P_in ≡ P_out + P_loss
============================================================ */
const PLANTS = {
  hydro:{ key:'hydro', eff:0.85,
    chain:['e_gpe','e_ke','e_me','e_ee'], via:['v_fall','v_hit','v_gen'],
    capt:['cap_h0','cap_h1','cap_h2','cap_h3'], renew:true },
  wind:{ key:'wind', eff:0.40,
    chain:['e_ke','e_me','e_ee'], via:['v_blow','v_gen'],
    capt:['cap_w0','cap_w1','cap_w2'], renew:true },
  thermal:{ key:'thermal', eff:0.40,
    chain:['e_ce','e_ie','e_me','e_ee'], via:['v_burn','v_steam','v_gen'],
    capt:['cap_t0','cap_t1','cap_t2','cap_t3'], renew:false },
};
const N0 = 1500, T0 = 200, B0 = 0.5, P0 = 40;   /* reference point → 40.0 kW */
const LAB = { plant:'hydro', n:1500, turns:200, B:0.5 };
const VIS = { rot:0, out:0, phase:0, stage:0, time:0 };

function pl(){ return PLANTS[LAB.plant]; }
function uOf(){ return (LAB.n/N0)*(LAB.turns/T0)*(LAB.B/B0); }
function pOut(){ const u=uOf(); return P0*u*u; }
function effOf(){ return pl().eff; }
function pIn(){ return pOut()/effOf(); }
/* displayed numbers: derive loss from the two rounded values so the
   equation on screen always balances exactly */
function readings(){
  const po = +pOut().toFixed(1);
  const pi = +pIn().toFixed(1);
  const plo = +(pi-po).toFixed(1);
  return { po:po, pi:pi, pl:plo, eff:Math.round(effOf()*100) };
}

   Tab 3: Class quiz
============================================================ */
const QUIZ_TIME = 20;
let qIdx = 0, qScore = 0, qDone = [], qTimer = null, qLeft = 0;
function stopTimer(){ if(qTimer){ clearInterval(qTimer); qTimer=null; } }
function startTimer(){
  stopTimer();
  qLeft = QUIZ_TIME;
  const bar = $('q-timer-bar');
  bar.style.width = '100%';
  $('q-timer').classList.remove('low');
  qTimer = setInterval(()=>{
    qLeft -= 0.1;
    bar.style.width = Math.max(0, qLeft/QUIZ_TIME*100)+'%';
    if(qLeft <= 5) $('q-timer').classList.add('low');
    if(qLeft <= 0){ stopTimer(); timeUpQ(); }
  }, 100);
}
function renderQ(){
  const item = QUIZ()[qIdx];
  $('q-emoji').textContent = item.e;
  $('q-text').innerHTML = (qIdx+1)+'. '+item.q;
  $('q-exp').innerHTML = '';
  $('q-next').style.display='none';
  $('q-restart').style.display='none';
  const box = $('q-opts');
  box.innerHTML = '';
  item.o.forEach((opt,i)=>{
    const b = document.createElement('button');
    b.className='qbtn';
    b.textContent = 'ABC'[i]+'. '+opt;
    b.onclick = ()=>answerQ(i,b);
    box.appendChild(b);
  });
  renderProg();
  $('q-score-n').textContent = qScore;
  if(qDone[qIdx] !== undefined){
    const btns=[...box.children];
    btns.forEach(b=>b.disabled=true);
    btns[item.a].classList.add('right');
    $('q-exp').innerHTML = item.x;
    if(qIdx < QUIZ().length-1) $('q-next').style.display='inline-block';
    else $('q-restart').style.display='inline-block';
  } else startTimer();
}
function renderProg(){
  $('q-prog').innerHTML = QUIZ().map((_,i)=>
    '<div class="qdot '+(i===qIdx?'cur ':'')+(qDone[i]===true?'right':qDone[i]===false?'wrong':'')+'"></div>').join('');
}
function finishQ(prefix, correct){
  stopTimer();
  const item = QUIZ()[qIdx];
  qDone[qIdx] = correct;
  if(correct) qScore++;
  const btns = [...$('q-opts').children];
  btns.forEach(b=>b.disabled=true);
  btns[item.a].classList.add('right');
  $('q-exp').innerHTML = prefix + item.x;
  renderProg();
  $('q-score-n').textContent = qScore;
  if(qIdx < QUIZ().length-1) $('q-next').style.display='inline-block';
  else {
    const pct = qScore/QUIZ().length;
    const msg = pct===1 ? t('resGold') : pct>=0.7 ? t('resGood') : t('resTry');
    $('q-exp').innerHTML += '<br><em>'+qScore+' / '+QUIZ().length+' — '+msg+'</em>';
    $('q-restart').style.display='inline-block';
  }
}
function answerQ(i, btn){
  if(qDone[qIdx] !== undefined) return;
  const item = QUIZ()[qIdx];
  const correct = i===item.a;
  if(!correct) btn.classList.add('wrong');
  finishQ(correct ? t('rRight')+' ' : t('rWrong')+' ', correct);
}
function timeUpQ(){
  if(qDone[qIdx] !== undefined) return;
  finishQ(t('timeUp')+' ', false);
}
function nextQ(){ qIdx++; renderQ(); }
function restartQ(){ qIdx=0; qScore=0; qDone=[]; renderQ(); }

/* ============================================================
   Tab 4: Power challenge (target output under an input cap)
   — reuses the demo-lab engine and canvas, no duplicated physics
============================================================ */
const GAME_ROUNDS = 3, GAME_TIME = 45;
const GAME_POOL = [
  { tgt:60,  cap:75  },   /* needs eff >= 80%  → hydro only */
  { tgt:120, cap:320 },   /* eff >= 37.5%      → any source */
  { tgt:300, cap:360 },   /* eff >= 83%        → hydro only */
  { tgt:24,  cap:60  },   /* eff >= 40%        → wind/coal just make it */
  { tgt:400, cap:500 },   /* eff >= 80%        → hydro only */
];
const GAME = { round:0, score:0, tgt:0, cap:0, phase:'aim', left:GAME_TIME, timer:null, order:[] };
function stopGTimer(){ if(GAME.timer){ clearInterval(GAME.timer); GAME.timer=null; } }
function startGame(){
  GAME.round = 0; GAME.score = 0;
  $('g-score').textContent = 0;
  const idx = GAME_POOL.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const tmp=idx[i]; idx[i]=idx[j]; idx[j]=tmp; }
  GAME.order = idx.slice(0, GAME_ROUNDS);
  nextRound();
}
function nextRound(){
  GAME.round++;
  GAME.phase = 'aim';
  GAME.left = GAME_TIME;
  const r = GAME_POOL[GAME.order[GAME.round-1]];
  GAME.tgt = r.tgt; GAME.cap = r.cap;
  labSet('thermal', 1000, 200, 0.5);
  FLASH = null; CONCL = null;
  $('g-status').innerHTML = tf('gGo',{t:GAME.tgt, c:GAME.cap});
  gameSync();
  stopGTimer();
  GAME.timer = setInterval(()=>{
    GAME.left--;
    $('g-time').textContent = Math.max(0, GAME.left);
    $('g-time').classList.toggle('low', GAME.left<=10);
    if(GAME.left<=0) endRound('time');
  }, 1000);
}
function endRound(how){
  stopGTimer();
  const r = readings();
  let pts = 0;
  if(how==='lock'){
    if(r.pi > GAME.cap + 1e-6){
      $('g-status').innerHTML = tf('gOver',{i:r.pi.toFixed(1), c:GAME.cap});
    } else {
      const err = Math.abs(r.po-GAME.tgt)/GAME.tgt;
      pts = err<=0.02 ? 100 : err<=0.05 ? 80 : err<=0.10 ? 50 : err<=0.20 ? 20 : 5;
      GAME.score += pts;
      $('g-status').innerHTML = tf('gWin',{o:r.po.toFixed(1), t:GAME.tgt, i:r.pi.toFixed(1), p:pts});
    }
  } else {
    $('g-status').innerHTML = t('gTimeUp');
  }
  $('g-score').textContent = GAME.score;
  GAME.phase = GAME.round >= GAME_ROUNDS ? 'done' : 'next';
  if(GAME.phase === 'done'){
    const rk = GAME.score>=260 ? t('gRank1') : GAME.score>=150 ? t('gRank2') : t('gRank3');
    $('g-status').innerHTML += '<br>' + t('gFinal')+' '+GAME.score+' — '+rk;
  }
  gameSync();
}
function gameAct(){
  if(GAME.phase==='aim') endRound('lock');
  else if(GAME.phase==='next') nextRound();
  else startGame();
}
function gameSync(){
  const r = readings();
  $('g-round').textContent = GAME.round;
  $('g-time').textContent = Math.max(0, GAME.left);
  $('g-tgt').textContent = GAME.tgt;
  $('g-cap').textContent = GAME.cap;
  $('g-out').textContent = r.po.toFixed(1);
  $('g-in').textContent = r.pi.toFixed(1);
  $('g-goal-hud').innerHTML = t('gTgt')+' <b>'+GAME.tgt+'</b>';
  $('g-cap-hud').innerHTML = t('gCap')+' <b>'+GAME.cap+'</b>';
  $('g-act').textContent = GAME.phase==='aim' ? t('gLock') : GAME.phase==='next' ? t('gNextRound') : t('gPlayAgain');
  $('g-score').textContent = GAME.score;
  document.querySelectorAll('#ctl-game [data-src]').forEach(b=>{ b.disabled = GAME.phase!=='aim'; });
  document.querySelectorAll('#ctl-game input[type=range]').forEach(b=>{ b.disabled = GAME.phase!=='aim'; });
}

/* ============================================================
   Main loop & mode switching
============================================================ */
let lastT = performance.now();
function mainLoop(now){
  const dt = Math.min(0.04, (now-lastT)/1000);
  lastT = now;
  const labOn = $('panel-lab').classList.contains('on');
  const gameOn = $('panel-game').classList.contains('on');
  if(labOn || gameOn){
    VIS.time += dt;
    VIS.rot += dt * (LAB.n/N0) * (LAB.plant==='wind' ? 2.1 : 3.0);
    if(VIS.rot>1e5) VIS.rot = VIS.rot % 6.283185;
    VIS.phase += dt;
    if(VIS.phase > 2.0){ VIS.phase = 0; VIS.stage = (VIS.stage+1) % pl().chain.length; }
    if(VIS.stage >= pl().chain.length) VIS.stage = 0;
    drawLab();
  } else if($('panel-cmp').classList.contains('on')){
    VIS.time += dt;
    if(CMP.running){
      CMP.p += dt/5;
      if(CMP.p >= 1){ CMP.p = 1; CMP.running = false; drawCmpBoth(); finishCmp(); }
      else drawCmpBoth();
    } else if(CMP.p > 0) drawCmpBoth();
  }
  requestAnimationFrame(mainLoop);
}
function setMode(m){
  stopTimer(); stopGTimer();
  CMP.running = false;
  for(const id of ['lab','cmp','quiz','game']){
    $('tab-'+id).classList.toggle('on', id===m);
    $('panel-'+id).classList.toggle('on', id===m);
    $('ctl-'+id).classList.toggle('on', id===m);
    $('sb-'+id).classList.toggle('on', id===m);
  }
  if(m==='lab'){ ($('panel-lab').querySelector('.cvarea')||$('panel-lab')).appendChild(labCv); labSync(); }
  if(m==='cmp'){ cmpLabels(); cmpReset(); }
  if(m==='quiz') renderQ();
  if(m==='game'){ $('game-cvhost').appendChild(labCv); startGame(); }
}

/* ============================================================
   Shared drawing helpers
============================================================ */
const CV_FONT = '"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
function rrect(c,x,y,w,h,r){
  c.beginPath();
  if(c.roundRect){ c.roundRect(x,y,w,h,r); return; }
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}
function circle(c,x,y,r,fill,stroke,lw){
  c.beginPath(); c.arc(x,y,r,0,Math.PI*2);
  if(fill){ c.fillStyle=fill; c.fill(); }
  if(stroke){ c.strokeStyle=stroke; c.lineWidth=lw||1.5; c.stroke(); }
}
function line(c,x1,y1,x2,y2,col,lw,dash){
  c.beginPath();
  if(c.setLineDash) c.setLineDash(dash||[]);
  c.moveTo(x1,y1); c.lineTo(x2,y2);
  c.strokeStyle=col; c.lineWidth=lw||1.5; c.stroke();
  if(c.setLineDash) c.setLineDash([]);
}
function TX(c,s,x,y,font,color,align,base){
  c.font=font; c.fillStyle=color; c.textAlign=align||'left'; c.textBaseline=base||'middle';
  if(!isFinite(x)||!isFinite(y)) return;
  c.fillText(s,x,y);
}
/* pill-backed text, clamped inside the canvas */
function tchip(c,s,x,y,font,color,align,W,H){
  c.font=font;
  const w=c.measureText(s).width;
  const m=/([\d.]+)px/.exec(font), fs=m?parseFloat(m[1]):14, h=fs+13;
  const al=align||'center';
  let x0 = al==='left' ? x : (al==='right' ? x-w : x-w/2);
  x0 = clamp(x0, 10, Math.max(10, (W||1000)-w-10));
  const yy = clamp(y, h/2+4, (H||500)-h/2-4);
  rrect(c,x0-10,yy-h/2,w+20,h,9);
  c.fillStyle=C().pill; c.fill();
  c.strokeStyle=C().pillLine; c.lineWidth=1.2; c.stroke();
  TX(c,s,x0+w/2,yy,font,color,'center','middle');
}
function ribbon(c,x0,aT,aB,x1,bT,bB,fill){
  const d=(x1-x0)*0.45;
  c.beginPath();
  c.moveTo(x0,aT);
  c.bezierCurveTo(x0+d,aT,x1-d,bT,x1,bT);
  c.lineTo(x1,bB);
  c.bezierCurveTo(x1-d,bB,x0+d,aB,x0,aB);
  c.closePath(); c.fillStyle=fill; c.fill();
}
function bez(x0,y0,x1,y1,u){
  const d=(x1-x0)*0.45;
  const c1x=x0+d, c2x=x1-d, v=1-u;
  return [v*v*v*x0+3*v*v*u*c1x+3*v*u*u*c2x+u*u*u*x1,
          v*v*v*y0+3*v*v*u*y0+3*v*u*u*y1+u*u*u*y1];
}
function prand(i){ const v=Math.sin(i*127.1+311.7)*43758.5453; return v-Math.floor(v); }

/* ============================================================
   Physics model (kept from the source file's numbers)
   - each plant fixes the input energy form and the whole-plant efficiency
   - generator: emf ∝ N·B·n  →  P_out ∝ (N·B·n)²   (source: 越快越费力 �� 电流²)
   - P_in = P_out / η ,  P_loss = P_in − P_out  ⇒  P_in ≡ P_out + P_loss
============================================================ */
const PLANTS = {
  hydro:{ key:'hydro', eff:0.85,
    chain:['e_gpe','e_ke','e_me','e_ee'], via:['v_fall','v_hit','v_gen'],
    capt:['cap_h0','cap_h1','cap_h2','cap_h3'], renew:true },
  wind:{ key:'wind', eff:0.40,
    chain:['e_ke','e_me','e_ee'], via:['v_blow','v_gen'],
    capt:['cap_w0','cap_w1','cap_w2'], renew:true },
  thermal:{ key:'thermal', eff:0.40,
    chain:['e_ce','e_ie','e_me','e_ee'], via:['v_burn','v_steam','v_gen'],
    capt:['cap_t0','cap_t1','cap_t2','cap_t3'], renew:false },
};
const N0 = 1500, T0 = 200, B0 = 0.5, P0 = 40;   /* reference point → 40.0 kW */
const LAB = { plant:'hydro', n:1500, turns:200, B:0.5 };
const VIS = { rot:0, out:0, phase:0, stage:0, time:0 };

function pl(){ return PLANTS[LAB.plant]; }
function uOf(){ return (LAB.n/N0)*(LAB.turns/T0)*(LAB.B/B0); }
function pOut(){ const u=uOf(); return P0*u*u; }
function effOf(){ return pl().eff; }
function pIn(){ return pOut()/effOf(); }
/* displayed numbers: derive loss from the two rounded values so the
   equation on screen always balances exactly */
function readings(){
  const po = +pOut().toFixed(1);
  const pi = +pIn().toFixed(1);
  const plo = +(pi-po).toFixed(1);
  return { po:po, pi:pi, pl:plo, eff:Math.round(effOf()*100) };
}

/* ---------- setters (shared by lab + game control bars) ---------- */
function syncSliders(){
  const pairs = [['s-n','g-s-n',LAB.n],['s-t','g-s-t',LAB.turns],['s-b','g-s-b',LAB.B]];
  pairs.forEach(function(p){
    const a=$(p[0]), b=$(p[1]);
    if(a && +a.value!==p[2]) a.value=p[2];
    if(b && +b.value!==p[2]) b.value=p[2];
  });
  const nTxt = LAB.n, tTxt = LAB.turns, bTxt = LAB.B.toFixed(2)+' T';
  ['s-n-o','g-s-n-o'].forEach(function(id){ if($(id)) $(id).textContent = nTxt; });
  ['s-t-o','g-s-t-o'].forEach(function(id){ if($(id)) $(id).textContent = tTxt; });
  ['s-b-o','g-s-b-o'].forEach(function(id){ if($(id)) $(id).textContent = bTxt; });
}
function labSync(){
  const r = readings();
  if($('l-out')) $('l-out').textContent = r.po.toFixed(1);
  if($('l-eff')) $('l-eff').textContent = r.eff;
  if($('l-in')) $('l-in').textContent = r.pi.toFixed(1);
  if($('l-loss')) $('l-loss').textContent = r.pl.toFixed(1);
  const bd = $('l-state');
  if(bd){
    bd.innerHTML = t('n_'+LAB.plant)+'<small>'+t('sub_'+LAB.plant)+'</small>';
    bd.style.color = pl().renew ? '#1d7a3a' : '#b8432f';
    bd.style.borderColor = pl().renew ? '#2e9e52' : 'var(--pos)';
  }
  if($('g-out')) $('g-out').textContent = r.po.toFixed(1);
  if($('g-in')) $('g-in').textContent = r.pi.toFixed(1);
  syncSliders();
  renderMsg();
}
function setPlant(k){
  if(!PLANTS[k] || LAB.plant===k) { if(PLANTS[k]) labSync(); return; }
  LAB.plant = k;
  VIS.stage = 0; VIS.phase = 0;
  FLASH = 'r_switch'; CONCL = 'c_same';

function setN(v){

/* ---------- data recording ---------- */
let recRows = [];
function recordData(){
  const r = readings();
  recRows.push({ p:LAB.plant, n:LAB.n, out:r.po, eff:r.eff, renew:pl().renew });
  if(recRows.length > 7) recRows.shift();
  renderRec();
}
function clearRec(){ recRows = []; renderRec(); }
function renderRec(){
  const body = $('rec-body');
  if(!body) return;
  let top = 0;
  recRows.forEach(r=>{ top = Math.max(top, r.out); });
  body.innerHTML = recRows.map(function(r){
    const pct = top>1e-6 ? Math.max(6, r.out/top*100) : 0;
    const nm = t('b_'+r.p);
    return '<tr><td>'+nm+'</td><td>'+r.n+'</td><td>'+r.out.toFixed(1)+'</td><td>'+r.eff+'%</td>'+
      '<td><div class="bar '+(r.renew?'re':'nre')+'"><i style="width:'+pct+'%"></i></div></td></tr>';
  }).join('');
}

      const q1=bez(x1+3,inTop+H*v.eff/200,xr,uTop+H*v.eff/200,u);
      circle(c,q1[0],q1[1],3,'rgba(255,255,255,.85)',null,0);
      const q2=bez(x1+3,inTop+H*(1+v.eff/100)/2,xr,wTop+H*(1-v.eff/100)/2,u);
      circle(c,q2[0],q2[1],3,'rgba(255,255,255,.8)',null,0);
    }
    c.fillStyle=C().useful; c.fillRect(xr,uTop,xo-xr,hU);
    c.fillStyle=C().loss;   c.fillRect(xr,wTop,xo-xr,hL);
  }
  TX(c, t('cvUse'), 302, uTop+H*v.eff/200-10, '700 13px '+CV_FONT, C().useful,'left','middle');
  TX(c, (v.po*p).toFixed(1)+' kW', 302, uTop+H*v.eff/200+11, '900 15px '+CV_FONT, C().useful,'left','middle');
  TX(c, t('cvLoss'), 302, wTop+H*(1-v.eff/100)/2-10, '700 13px '+CV_FONT, C().loss,'left','middle');
  TX(c, (v.pl*p).toFixed(1)+' kW', 302, wTop+H*(1-v.eff/100)/2+11, '900 15px '+CV_FONT, C().loss,'left','middle');

  TX(c, (v.po*p).toFixed(1)+' kW', CM_W/2, 320, '900 27px '+CV_FONT, C().useful,'center','middle');
  TX(c, v.pin.toFixed(1)+' ＝ '+(v.po).toFixed(1)+' ＋ '+(v.pl).toFixed(1)+'  (kW)',
     CM_W/2, 350, '700 14px '+CV_FONT, C().cvTextDim,'center','middle');
}
function drawCmpBoth(){
  drawCmpSide(ctxA, side('a'), CMP.p);
  drawCmpSide(ctxB, side('b'), CMP.p);
  updateCmpSide();
}
function updateCmpSide(){
  const a = sideVals(side('a')), b = sideVals(side('b'));
  $('c-out-a').textContent = (a.po*CMP.p).toFixed(1);
  $('c-out-b').textContent = (b.po*CMP.p).toFixed(1);
  $('c-in-a').textContent = a.pin.toFixed(0);
  $('c-eff-a').textContent = a.eff;
  $('c-loss-a').textContent = (a.pl*CMP.p).toFixed(1);
  $('c-in-b').textContent = b.pin.toFixed(0);
  $('c-eff-b').textContent = b.eff;
  $('c-loss-b').textContent = (b.pl*CMP.p).toFixed(1);
}
function cmpLabels(){
  $('ca-name').textContent = t(side('a').nameK);
  $('cb-name').textContent = t(side('b').nameK);
  $('ca-cond').textContent = t(side('a').condK);
  $('cb-cond').textContent = t(side('b').condK);
  $('s-ca-name').textContent = LANG==='zh' ? '甲' : 'A';
  $('s-cb-name').textContent = LANG==='zh' ? '乙' : 'B';
}
function presetCmp(i){
  CMP.preset = i; CMP.p = 0; CMP.running = false;
  document.querySelectorAll('#ctl-cmp .btn.ghost').forEach((b,k)=>b.style.opacity = (k===i?'1':'.6'));
  clearGuess(); cmpLabels(); drawCmpBoth();
  $('cmp-fb').textContent=''; $('cmp-fb').className='feedback';
  $('cmp-conclude').classList.remove('on');
}
function cmpReset(){
  if(CMP.running) return;
  CMP.p = 0;
  cmpLabels(); drawCmpBoth();
  $('cmp-fb').textContent=''; $('cmp-fb').className='feedback';
  $('cmp-conclude').classList.remove('on');
}
function pickGuess(btn){
  document.querySelectorAll('#ctl-cmp .sbtn[data-g]').forEach(b=>b.classList.remove('pick'));
  btn.classList.add('pick');
  CMP.guess = btn.dataset.g;
  $('cmp-run').disabled = false;
}
function clearGuess(){
  document.querySelectorAll('#ctl-cmp .sbtn[data-g]').forEach(b=>b.classList.remove('pick'));
  CMP.guess = null; $('cmp-run').disabled = true;
}
function runCmp(){
  if(CMP.running) return;
  CMP.p = 0; CMP.running = true;
  $('cmp-run').disabled = true;
}
function finishCmp(){
  const a = sideVals(side('a')), b = sideVals(side('b'));
  const real = Math.abs(a.po-b.po) < 0.05 ? 'same' : (a.po>b.po ? 'a' : 'b');
  const detail = '（'+(LANG==='zh'?'甲':'A')+' '+a.po.toFixed(1)+' kW · '+
                 (LANG==='zh'?'乙':'B')+' '+b.po.toFixed(1)+' kW）';
  const fb = $('cmp-fb');
  if(CMP.guess === real){ fb.innerHTML = t('fbRight')+detail; fb.className='feedback good'; }
  else { fb.innerHTML = t('fbWrong')+detail; fb.className='feedback bad'; }
  const box = $('cmp-conclude');
  box.innerHTML = t(CMP_PRESETS[CMP.preset].concl);
  box.classList.add('on');
  clearGuess();
}

/* ============================================================
   Tab 3: Class quiz
============================================================ */
const QUIZ_TIME = 20;
let qIdx = 0, qScore = 0, qDone = [], qTimer = null, qLeft = 0;
function stopTimer(){ if(qTimer){ clearInterval(qTimer); qTimer=null; } }
function startTimer(){
  stopTimer();
  qLeft = QUIZ_TIME;
  const bar = $('q-timer-bar');
  bar.style.width = '100%';
  $('q-timer').classList.remove('low');
  qTimer = setInterval(()=>{
    qLeft -= 0.1;
    bar.style.width = Math.max(0, qLeft/QUIZ_TIME*100)+'%';
    if(qLeft <= 5) $('q-timer').classList.add('low');
    if(qLeft <= 0){ stopTimer(); timeUpQ(); }
  }, 100);
}
function renderQ(){
  const item = QUIZ()[qIdx];
  $('q-emoji').textContent = item.e;
  $('q-text').innerHTML = (qIdx+1)+'. '+item.q;
  $('q-exp').innerHTML = '';
  $('q-next').style.display='none';
  $('q-restart').style.display='none';
  const box = $('q-opts');
  box.innerHTML = '';
  item.o.forEach((opt,i)=>{
    const b = document.createElement('button');
    b.className='qbtn';
    b.textContent = 'ABC'[i]+'. '+opt;
    b.onclick = ()=>answerQ(i,b);
    box.appendChild(b);
  });
  renderProg();
  $('q-score-n').textContent = qScore;
  if(qDone[qIdx] !== undefined){
    const btns=[...box.children];
    btns.forEach(b=>b.disabled=true);
    btns[item.a].classList.add('right');
    $('q-exp').innerHTML = item.x;
    if(qIdx < QUIZ().length-1) $('q-next').style.display='inline-block';
    else $('q-restart').style.display='inline-block';
  } else startTimer();
}
function renderProg(){
  $('q-prog').innerHTML = QUIZ().map((_,i)=>
    '<div class="qdot '+(i===qIdx?'cur ':'')+(qDone[i]===true?'right':qDone[i]===false?'wrong':'')+'"></div>').join('');
}
function finishQ(prefix, correct){
  stopTimer();
  const item = QUIZ()[qIdx];
  qDone[qIdx] = correct;
  if(correct) qScore++;
  const btns = [...$('q-opts').children];
  btns.forEach(b=>b.disabled=true);
  btns[item.a].classList.add('right');
  $('q-exp').innerHTML = prefix + item.x;
  renderProg();
  $('q-score-n').textContent = qScore;
  if(qIdx < QUIZ().length-1) $('q-next').style.display='inline-block';
  else {
    const pct = qScore/QUIZ().length;
    const msg = pct===1 ? t('resGold') : pct>=0.7 ? t('resGood') : t('resTry');
    $('q-exp').innerHTML += '<br><em>'+qScore+' / '+QUIZ().length+' — '+msg+'</em>';
    $('q-restart').style.display='inline-block';
  }
}
function answerQ(i, btn){
  if(qDone[qIdx] !== undefined) return;
  const item = QUIZ()[qIdx];
  const correct = i===item.a;
  if(!correct) btn.classList.add('wrong');
  finishQ(correct ? t('rRight')+' ' : t('rWrong')+' ', correct);
}
function timeUpQ(){
  if(qDone[qIdx] !== undefined) return;
  finishQ(t('timeUp')+' ', false);
}
function nextQ(){ qIdx++; renderQ(); }
function restartQ(){ qIdx=0; qScore=0; qDone=[]; renderQ(); }

/* ============================================================
   Tab 4: Power challenge (target output under an input cap)
   — reuses the demo-lab engine and canvas, no duplicated physics
============================================================ */
const GAME_ROUNDS = 3, GAME_TIME = 45;
const GAME_POOL = [
  { tgt:60,  cap:75  },   /* needs eff >= 80%  → hydro only */
  { tgt:120, cap:320 },   /* eff >= 37.5%      → any source */
  { tgt:300, cap:360 },   /* eff >= 83%        → hydro only */
  { tgt:24,  cap:60  },   /* eff >= 40%        → wind/coal just make it */
  { tgt:400, cap:500 },   /* eff >= 80%        → hydro only */
];
const GAME = { round:0, score:0, tgt:0, cap:0, phase:'aim', left:GAME_TIME, timer:null, order:[] };
function stopGTimer(){ if(GAME.timer){ clearInterval(GAME.timer); GAME.timer=null; } }
function startGame(){
  GAME.round = 0; GAME.score = 0;
  $('g-score').textContent = 0;
  const idx = GAME_POOL.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const tmp=idx[i]; idx[i]=idx[j]; idx[j]=tmp; }
  GAME.order = idx.slice(0, GAME_ROUNDS);
  nextRound();
}
function nextRound(){
  GAME.round++;
  GAME.phase = 'aim';
  GAME.left = GAME_TIME;
  const r = GAME_POOL[GAME.order[GAME.round-1]];
  GAME.tgt = r.tgt; GAME.cap = r.cap;
  labSet('thermal', 1000, 200, 0.5);
  FLASH = null; CONCL = null;
  $('g-status').innerHTML = tf('gGo',{t:GAME.tgt, c:GAME.cap});
  gameSync();
  stopGTimer();
  GAME.timer = setInterval(()=>{
    GAME.left--;
    $('g-time').textContent = Math.max(0, GAME.left);
    $('g-time').classList.toggle('low', GAME.left<=10);
    if(GAME.left<=0) endRound('time');
  }, 1000);
}
function endRound(how){
  stopGTimer();
  const r = readings();
  let pts = 0;
  if(how==='lock'){
    if(r.pi > GAME.cap + 1e-6){
      $('g-status').innerHTML = tf('gOver',{i:r.pi.toFixed(1), c:GAME.cap});
    } else {
      const err = Math.abs(r.po-GAME.tgt)/GAME.tgt;
      pts = err<=0.02 ? 100 : err<=0.05 ? 80 : err<=0.10 ? 50 : err<=0.20 ? 20 : 5;
      GAME.score += pts;
      $('g-status').innerHTML = tf('gWin',{o:r.po.toFixed(1), t:GAME.tgt, i:r.pi.toFixed(1), p:pts});
    }
  } else {
    $('g-status').innerHTML = t('gTimeUp');
  }
  $('g-score').textContent = GAME.score;
  GAME.phase = GAME.round >= GAME_ROUNDS ? 'done' : 'next';
  if(GAME.phase === 'done'){
    const rk = GAME.score>=260 ? t('gRank1') : GAME.score>=150 ? t('gRank2') : t('gRank3');
    $('g-status').innerHTML += '<br>' + t('gFinal')+' '+GAME.score+' — '+rk;
  }
  gameSync();
}
function gameAct(){
  if(GAME.phase==='aim') endRound('lock');
  else if(GAME.phase==='next') nextRound();
  else startGame();
}
function gameSync(){
  const r = readings();
  $('g-round').textContent = GAME.round;
  $('g-time').textContent = Math.max(0, GAME.left);
  $('g-tgt').textContent = GAME.tgt;
  $('g-cap').textContent = GAME.cap;
  $('g-out').textContent = r.po.toFixed(1);
  $('g-in').textContent = r.pi.toFixed(1);
  $('g-goal-hud').innerHTML = t('gTgt')+' <b>'+GAME.tgt+'</b>';
  $('g-cap-hud').innerHTML = t('gCap')+' <b>'+GAME.cap+'</b>';
  $('g-act').textContent = GAME.phase==='aim' ? t('gLock') : GAME.phase==='next' ? t('gNextRound') : t('gPlayAgain');
  $('g-score').textContent = GAME.score;
  document.querySelectorAll('#ctl-game [data-src]').forEach(b=>{ b.disabled = GAME.phase!=='aim'; });
  document.querySelectorAll('#ctl-game input[type=range]').forEach(b=>{ b.disabled = GAME.phase!=='aim'; });
}

/* ============================================================
   Main loop & mode switching
============================================================ */
let lastT = performance.now();
function mainLoop(now){
  const dt = Math.min(0.04, (now-lastT)/1000);
  lastT = now;
  const labOn = $('panel-lab').classList.contains('on');
  const gameOn = $('panel-game').classList.contains('on');
  if(labOn || gameOn){
    VIS.time += dt;
    VIS.rot += dt * (LAB.n/N0) * (LAB.plant==='wind' ? 2.1 : 3.0);
    if(VIS.rot>1e5) VIS.rot = VIS.rot % 6.283185;
    VIS.phase += dt;
    if(VIS.phase > 2.0){ VIS.phase = 0; VIS.stage = (VIS.stage+1) % pl().chain.length; }
    if(VIS.stage >= pl().chain.length) VIS.stage = 0;
    drawLab();
  } else if($('panel-cmp').classList.contains('on')){
    VIS.time += dt;
    if(CMP.running){
      CMP.p += dt/5;
      if(CMP.p >= 1){ CMP.p = 1; CMP.running = false; drawCmpBoth(); finishCmp(); }
      else drawCmpBoth();
    } else if(CMP.p > 0) drawCmpBoth();
  }
  requestAnimationFrame(mainLoop);
}
function setMode(m){
  stopTimer(); stopGTimer();
  CMP.running = false;
  for(const id of ['lab','cmp','quiz','game']){
    $('tab-'+id).classList.toggle('on', id===m);
    $('panel-'+id).classList.toggle('on', id===m);
    $('ctl-'+id).classList.toggle('on', id===m);
    $('sb-'+id).classList.toggle('on', id===m);
  }
  if(m==='lab'){ ($('panel-lab').querySelector('.cvarea')||$('panel-lab')).appendChild(labCv); labSync(); }
  if(m==='cmp'){ cmpLabels(); cmpReset(); }
  if(m==='quiz') renderQ();
  if(m==='game'){ $('game-cvhost').appendChild(labCv); startGame(); }
}

/* ---------- boot ---------- */
applyTheme();
applyLang();
syncExplain();
labSet('hydro',1500,200,0.5);
presetCmp(0);
renderQ();
setMode('lab');
requestAnimationFrame(mainLoop);

</script>

(function(){
  const setVH=()=>{const h=window.visualViewport?window.visualViewport.height:window.innerHeight;document.documentElement.style.setProperty('--app-height',h+'px')};
  setVH(); window.addEventListener('resize',setVH); if(window.visualViewport) window.visualViewport.addEventListener('resize',setVH);
  window.addEventListener('message',e=>{const d=e.data;if(!d)return;if(d==='reset'||d.type==='reset')location.reload()});
  try{parent.postMessage({type:'ready',id:window.LAB_SLUG},'*')}catch{}
})();
</script>
