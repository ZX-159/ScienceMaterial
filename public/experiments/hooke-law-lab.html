<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>胡克定律实验室 · Hooke's Law Lab</title>
<style>
:root{
  --bg:#FFFEFB; --bg2:#F2F1E9; --card:#FFFEFB; --surface:#FFFFFF;
  --ink:#1C2C42; --ink2:#68786F; --ink3:#5A605D; --line:#DDD9CF; --line2:#EDE9E0;
  --hot:#D9542B; --warm:#B88A43; --cool:#2C7D8C; --green:#2F7D4F; --gold:#C9A227;
  --teal:#146E61; --tealSoft:#E4EEE4; --teal2:#0F4A42;
  --app-height:100vh;
</style>
<style>

.wrap{max-width:100%!important;box-sizing:border-box!important;overflow-x:hidden!important;padding:10px 12px 4px!important}
header{padding:6px 0 10px!important;gap:8px!important;flex-wrap:nowrap!important;align-items:center!important;overflow:hidden!important}
.hleft{min-width:0!important;flex:1!important;overflow:hidden!important}
h1{font-size:16px!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;max-width:100%!important}
h1 span.en{font-size:11px!important;display:inline!important}
.sub{font-size:11px!important;line-height:1.4!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;max-width:100%!important;display:block!important}
.topright{flex:none!important;gap:6px!important}
.badge{font-size:10px!important;padding:4px 8px!important;max-width:180px!important;overflow:hidden!important;text-overflow:ellipsis!important}
.tabs{gap:4px!important;margin:8px 0 10px!important;flex-wrap:nowrap!important;overflow-x:auto!important;scrollbar-width:none!important}
.tabs::-webkit-scrollbar{display:none!important}
.tab{font-size:11px!important;padding:6px 10px!important;white-space:nowrap!important;flex:none!important}
.cols{gap:10px!important}
.card{overflow:hidden!important;min-width:0!important}
.figwrap{min-width:0!important;overflow:hidden!important}
svg{max-width:100%!important;overflow:hidden!important}
#dock{overflow:hidden!important}
#dock .din{max-width:100%!important;box-sizing:border-box!important}
.dsec{flex-wrap:wrap!important;gap:6px 10px!important}
.dl{font-size:10px!important}
input[type=range]{width:110px!important}
@media(max-width:640px){
  header{flex-wrap:wrap!important}
  .sub{white-space:normal!important;display:-webkit-box!important;-webkit-line-clamp:2!important;-webkit-box-orient:vertical!important;overflow:hidden!important}
  .tabs{flex-wrap:wrap!important}
}
</style></head>
<body>

<div class="wrap">
<header>
  <div class="hleft">
    <h1>胡克定律实验室<span class="en">Hooke's Law Lab</span></h1>
    <div class="sub">Stretch a spring, measure force — F=kx holds until elastic limit. Energy stored </div>
  </div>
  <div class="topright">
    <button class="langbtn" id="thmbtn">🌙</button>
    
  </div>
</header>

<div class="tabs">
  <button class="tab on" data-tab="0">① 实验台</button>
  <button class="tab" data-tab="1">② 图表·数据</button>
  <button class="tab" data-tab="2">③ 要点·公式</button>
  <button class="tab" data-tab="3">④ 测验</button>
</div>

<div class="panel on" id="p0">
 <div class="cols">
  <div class="card figwrap">
    <div class="qbox" id="qb0">—</div>
    <svg id="svg0" viewBox="0 0 660 460"></svg>
    <div class="note" id="note0"></div>
  </div>
  <div class="card side">
    <h3>实时数据 · Live</h3>
    <div class="statline" id="chips0"></div>
    <div class="kbox teal" id="kbox0a"></div>
    <div class="kbox" id="kbox0b"></div>
    <div class="kbox blue" id="kbox0c" style="display:none"></div>
  </div>
 </div>
</div>

<div class="panel" id="p1">
 <div class="cols">
  <div class="card figwrap">
    <h3 id="gtitle">数据图表</h3>
    <svg id="svg1" viewBox="0 0 660 420"></svg>
    <div class="note" id="note1"></div>
  </div>
  <div class="card side">
    <h3>怎么读图</h3>
    <div class="kbox grn" id="kbox1a"></div>
    <div class="kbox red" id="kbox1b"></div>
    <div class="statline" id="chips1"></div>
  </div>
 </div>
</div>

<div class="panel" id="p2">
 <div class="cols">
  <div class="card figwrap">
    <h3>要点总表</h3>
    <div id="cmpwrap"></div>
  </div>
  <div class="card side">
    <h3>一句话总结</h3>
    <div class="kbox grn" id="kbox2a"></div>
    <div class="kbox" id="kbox2b"></div>
  </div>
 </div>
</div>

<div class="panel" id="p3">
 <div class="card">
  <h3>🎯 课堂小测验 <button class="tgl" id="qzreset" style="float:right">重新开始</button></h3>
  <div class="statline"><span class="chip" id="qzprog">—</span><span class="chip grn" id="qzscore">—</span></div>
  <div id="quiz" style="margin-top:10px"></div>
 </div>
</div>

<div id="dock">
 <div class="din">
  <button id="dockfold">⌄</button>
  <div id="docksum"></div>
  <div class="dsec on" id="d0"></div>
  <div class="dsec" id="d1"><span class="dl">💡 图表随实验实时绘制，拖动或调参可重绘</span></div>
  <div class="dsec" id="d2"><span class="dl">💡 表格按“条件→现象→规律”三步走</span></div>
  <div class="dsec" id="d3"><span class="dl">💡 答对解锁下一题，错题有解析</span></div>
 </div>
</div>

</div>
<footer style="padding:8px 12px;font-size:11px;color:#5A605D;display:flex;justify-content:space-between;font-family:ui-monospace"><span>© 2026 ScienceMaterial</span><span>ScienceMaterial</span></footer>

<script>window.LAB_SLUG='hooke-law-lab';
'use strict';
const LAB_SLUG='hooke-law-lab';
const SUBJECT='physics';
let LANG='zh';
let DARK=false;
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
function svgEl(svg, x, y, size, fill, txt, anchor, weight){
  const halo = (()=>{
    const hex=fill; if(!hex||hex[0]!=='#') return '#FFFEFB';
    const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    const lum=0.299*r+0.587*g+0.114*b; return lum>140?'#1C2C42':'#FFFEFB';
  })();
  return '<text x="'+Math.round(x)+'" y="'+Math.round(y)+'" font-size="'+Math.round(size)+'" font-weight="'+(weight||700)+'" fill="'+fill+'" text-anchor="'+(anchor||'middle')+'" style="paint-order:stroke;stroke:'+halo+';stroke-width:3px;stroke-linejoin:round">'+txt+'</text>';
}
function plain(x,y,size,fill,txt,anchor,w){return '<text x="'+Math.round(x)+'" y="'+Math.round(y)+'" font-size="'+Math.round(size)+'" font-weight="'+(w||600)+'" fill="'+fill+'" text-anchor="'+(anchor||'middle')+'">'+txt+'</text>';}
function svgPt(svg,ev,vw,vh){
  const r=svg.getBoundingClientRect();
  return {x:(ev.clientX-r.left)*vw/r.width, y:(ev.clientY-r.top)*vh/r.height};
}
function makeDrag(svg,vw,vh,onmove,onup){
  let down=false;
  svg.addEventListener('pointerdown',e=>{
    e.preventDefault(); down=true;
    try{svg.setPointerCapture(e.pointerId)}catch{}
    onmove(svgPt(svg,e,vw,vh),true);
  });
  svg.addEventListener('pointermove',e=>{
    if(!down) return; e.preventDefault();
    onmove(svgPt(svg,e,vw,vh),false);
  });
  const end=()=>{down=false; if(onup) onup();};
  svg.addEventListener('pointerup',end);
  svg.addEventListener('pointercancel',end);
}
let CUR=0;
const TABN=4;
const RENDER=[], SUMMARY=[];
function showTab(i){
  CUR=i;
  document.querySelectorAll('.tab').forEach((t,k)=>t.classList.toggle('on',k===i));
  for(let k=0;k<TABN;k++){
    $('p'+k).classList.toggle('on',k===i);
    $('d'+k).classList.toggle('on',k===i);
  }
  if(RENDER[i]) RENDER[i]();
  updSummary();
}
function updSummary(){ const el=$('docksum'); if(el && SUMMARY[CUR]) el.textContent=SUMMARY[CUR](); }
function initTabs(){
  document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>showTab(+t.dataset.tab)));
  $('dockfold').addEventListener('click',function(){
    const d=$('dock'); d.classList.toggle('folded');
    this.textContent=d.classList.contains('folded')?'⌃':'⌄';
    updSummary();
  });
}
function applyTheme(){
  document.body.classList.toggle('dark',DARK);
  $('thmbtn').textContent=DARK?'☀️':'🌙';
}

// === LAB SPECIFIC PHYSICS ===

let summary0, summary1;
let CMP_H=[], CMP_R=[];
let QUIZ=[];
let resetLab, getLabState, setLabState;

let k=20, x=0.1, m=0.5;
function F(){ return k*x; }
function E(){ return 0.5*k*x*x; }
function updateChips(){
  $('qb0').innerHTML='<span class="qtag">题目</span>弹簧 k=<b>'+k+' N/m</b>，伸长 <b>'+(x*100).toFixed(0)+' cm</b>，拉力多大？弹性势能多大？';
  $('chips0').innerHTML='<span class="chip hl big">F='+(F()).toFixed(2)+'N</span><span class="chip grn">Ep='+(E()).toFixed(3)+'J</span><span class="chip">k='+k+'N/m</span><span class="chip blu">x='+(x*100).toFixed(1)+'cm</span>';
  $('kbox0a').innerHTML='胡克定律：<b>F = kx</b>，弹性限度内正比。';
  $('kbox0b').innerHTML='弹性势能 <b>Ep = ½kx²</b>，图像为抛物线。';
}
function draw0(){
  const s=[];
  s.push('<rect x="0" y="0" width="660" height="460" rx="14" fill="#FFFBEB"/>');
  s.push('<rect x="200" y="40" width="200" height="12" fill="#B9AE95"/>');
  const len=80+x*300;
  s.push('<path d="M 300 52 Q 280 '+(52+len/6)+' 320 '+(52+len/3)+' Q 280 '+(52+len/2)+' 320 '+(52+len*0.66)+' Q 300 '+(52+len*0.85)+' 300 '+(52+len)+'" fill="none" stroke="#146E61" stroke-width="3"/>');
  s.push('<rect x="270" y="'+(52+len)+'" width="60" height="30" rx="6" fill="#D9542B"/>');
  s.push(plain(300, 52+len+50, 11, '#D9542B', 'F='+F().toFixed(2)+'N', 'middle'));
  $('svg0').innerHTML=s.join('');
}
function draw1(){
  const s=[];
  s.push('<rect x="0" y="0" width="660" height="420" rx="14" fill="#FFFBEB"/>');
  const gx0=60,gx1=620,gy0=360,gy1=40;
  s.push('<line x1="'+gx0+'" y1="'+gy0+'" x2="'+gx1+'" y2="'+gy0+'" stroke="#1C2C42" stroke-width="2"/>');
  s.push('<line x1="'+gx0+'" y1="'+gy0+'" x2="'+gx0+'" y2="'+gy1+'" stroke="#1C2C42" stroke-width="2"/>');
  let path='';
  for(let i=0;i<=100;i++){
    const xi=i/100*0.3;
    const Fi=k*xi;
    const x=gx0+(gx1-gx0)*i/100;
    const y=gy0-(gy0-gy1)*clamp(Fi/15,0,1);
    path+=(i?' L ':'M ')+x.toFixed(1)+' '+y.toFixed(1);
  }
  s.push('<path d="'+path+'" fill="none" stroke="#146E61" stroke-width="3"/>');
  s.push(plain(320, 30, 12, '#146E61', 'F=kx 线性', 'middle',700));
  $('svg1').innerHTML=s.join('');
  $('kbox1a').innerHTML='F-x 图像为直线，斜率=k。';
  $('kbox1b').innerHTML='超过弹性限度，偏离直线，弹簧损坏。';
}
CMP_H=['量','公式','图像'];
CMP_R=[['弹力','F=kx','直线'],['势能','½kx²','抛物线'],['超限','非线性','损坏']];
QUIZ=[
{q:'1. k=10N/m x=0.2m F？',o:[['2N',1,'正确：F=kx'],['0.5N',0,'不是。'],['5N',0,'不是。'],['20N',0,'不是。']]},
];
function bootLab(){
  const dock=$('d0');
  dock.innerHTML='<span class="dl">k<input type="range" id="sk" min="5" max="100" step="5" value="20"><span class="mono" id="lk">20N/m</span></span><span class="dl">x<input type="range" id="sx" min="0.01" max="0.3" step="0.01" value="0.1"><span class="mono" id="lx">10cm</span></span>';
  $('sk').addEventListener('input',e=>{k=+e.target.value; $('lk').textContent=k+'N/m'; updateChips(); draw0(); draw1();});
  $('sx').addEventListener('input',e=>{x=+e.target.value; $('lx').textContent=(x*100).toFixed(0)+'cm'; updateChips(); draw0(); draw1();});
  updateChips(); draw0(); draw1();
  summary0=()=> 'F='+F().toFixed(2)+'N';
}
resetLab=bootLab;
getLabState=()=>({k,x});
setLabState=s=>{if(s.k) k=s.k; if(s.x) x=s.x; updateChips(); draw0(); draw1();};


function buildCmp(){
  const H=CMP_H, R=CMP_R;
  let h='<table class="cmp"><tr>'; H.forEach(c=>h+='<th>'+c+'</th>'); h+='</tr>';
  R.forEach(row=>{h+='<tr>'; row.forEach(c=>h+='<td>'+c+'</td>'); h+='</tr>';});
  h+='</table>';
  $('cmpwrap').innerHTML=h;
}

// Quiz
let QZi=0, QZpick=[], QZdone=[], QZfirst=[];
function QZdata(){ return QUIZ; }
function qzHead(){
  const N=QZdata().length; let nf=0; for(let k=0;k<N;k++) if(QZfirst[k]===true) nf++;
  $('qzprog').textContent='第 '+(Math.min(QZi+1,N))+' / '+N+' 题';
  $('qzscore').textContent='一次答对 '+nf+' / '+N;
  return nf;
}
function buildQuiz(){
  const data=QZdata(); let h=''; const N=data.length; qzHead();
  if(QZi>=N){ $('quiz').innerHTML='<div class="q"><div class="qt">🎉 全部完成！一次答对：'+qzHead()+' / '+N+'</div></div>'; return; }
  const d=data[QZi];
  h+='<div class="q"><div class="qt">'+d.q+'</div>';
  d.o.forEach((o,j)=>{
    h+='<button class="opt" data-o="'+j+'">'+String.fromCharCode(65+j)+'. '+o[0]+'</button>';
    h+='<div class="fb" id="fbq_'+j+'">'+o[2]+'</div>';
  });
  h+='</div><button class="dbtn" id="qznext" style="display:none;margin-top:12px">'+(QZi===N-1?'完成 ✔':'下一题 ▶')+'</button>';
  $('quiz').innerHTML=h;
  document.querySelectorAll('#quiz .opt').forEach(op=>op.addEventListener('click',function(){
    if(QZdone[QZi]) return; const oi=+this.dataset.o; QZpick[QZi]=oi;
    if(QZfirst[QZi]===undefined) QZfirst[QZi]=(data[QZi].o[oi][1]===1);
    if(data[QZi].o[oi][1]===1) QZdone[QZi]=true;
    restoreQ(); qzHead();
  }));
  const nb=$('qznext'); if(nb) nb.addEventListener('click',()=>{QZi++; buildQuiz(); updSummary();});
  if(QZpick[QZi]!==undefined) restoreQ();
}
function restoreQ(){
  const data=QZdata(), d=data[QZi]; const ops=document.querySelectorAll('#quiz .opt');
  const oi=QZpick[QZi]; ops.forEach((o,j)=>{o.classList.remove('ok','bad'); const f=$('fbq_'+j); if(f) f.classList.remove('show');});
  if(oi===undefined) return; const right=d.o[oi][1]===1; ops[oi].classList.add(right?'ok':'bad'); const fb=$('fbq_'+oi); if(fb) fb.classList.add('show');
  const nb=$('qznext'); if(nb) nb.style.display=QZdone[QZi]?'':'none';
}

function boot(){
  initTabs();
  applyTheme();
  bootLab();
  buildCmp();
  buildQuiz();
  RENDER[0]=draw0; RENDER[1]=draw1; RENDER[2]=()=>{buildCmp();}; RENDER[3]=buildQuiz;
  SUMMARY[0]=()=>summary0?summary0():'实验台';
  SUMMARY[1]=()=>summary1?summary1():'图表·数据';
  SUMMARY[2]=()=>'要点·公式';
  SUMMARY[3]=()=>{const N=QZdata().length; let nf=0; for(let k=0;k<N;k++) if(QZfirst[k]===true) nf++; return '测验 '+nf+'/'+N;};
  showTab(0);
  $('thmbtn').addEventListener('click',()=>{DARK=!DARK; applyTheme(); RENDER[CUR]();});
  $('qzreset').addEventListener('click',()=>{QZpick=[]; QZdone=[]; QZfirst=[]; QZi=0; buildQuiz();});
    const setVH=()=>{ const h=window.visualViewport?window.visualViewport.height:window.innerHeight; document.documentElement.style.setProperty('--app-height', h+'px'); };
  setVH(); window.addEventListener('resize',setVH); if(window.visualViewport) window.visualViewport.addEventListener('resize',setVH);
}
boot();

window.SCIENCEMATERIAL={reset:()=>{if(window.resetLab) resetLab();}, getState:()=>{return window.getLabState?getLabState():{};}};

// parent iframe messaging
window.addEventListener('message',e=>{
  const d=e.data; if(!d) return;
  if(d==='reset' || d.type==='reset'){ if(window.resetLab) resetLab(); }
  if(d.type==='setState' && window.setLabState) setLabState(d.data);
});
function notifyReady(){
  try{ parent.postMessage({type:'ready', id:LAB_SLUG}, '*'); }catch{}
}
setTimeout(notifyReady, 300);
</script>


<script>
(function(){
  const setVH=()=>{ const h=window.visualViewport?window.visualViewport.height:window.innerHeight; document.documentElement.style.setProperty('--app-height', h+'px'); };
  setVH(); window.addEventListener('resize',setVH); if(window.visualViewport) window.visualViewport.addEventListener('resize',setVH);
  window.addEventListener('message',e=>{
    const d=e.data; if(!d) return;
    if(d==='reset' || d.type==='reset'){ if(window.resetLab) resetLab(); if(window.SCIENCEMATERIAL && window.SCIENCEMATERIAL.reset) window.SCIENCEMATERIAL.reset(); const ev=new Event('reset'); window.dispatchEvent(ev); }
    if(d.type==='pause'){ if(window.pauseLab) pauseLab(); }
    if(d.type==='resume'){ if(window.resumeLab) resumeLab(); }
    if(d.type==='getState' && window.getLabState){ try{ parent.postMessage({type:'state', id:window.LAB_SLUG||'lab', data:getLabState()}, '*'); }catch{} }
    if(d.type==='setState' && window.setLabState){ setLabState(d.data); }
  });
  function notifyReady(){ try{ parent.postMessage({type:'ready', id:window.LAB_SLUG||document.title||'lab'}, '*'); }catch{} }
  setTimeout(notifyReady, 400);
  window.SCIENCEMATERIAL = window.SCIENCEMATERIAL || {};
  window.SCIENCEMATERIAL.reset = window.SCIENCEMATERIAL.reset || function(){ if(window.resetLab) resetLab(); location.reload(); };
})();
</script>

</body>
</html>
