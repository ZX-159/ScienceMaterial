/* ================= helpers (shared conventions) ================= */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function frac(x){return x-Math.floor(x)}
function rnd(k,s){return frac(Math.sin(k*127.1+s*311.7)*43758.5453)}
function lum(hex){
  if(hex[0]!=='#')return 0.5;
  var r=parseInt(hex.substr(1,2),16)/255,g=parseInt(hex.substr(3,2),16)/255,b=parseInt(hex.substr(5,2),16)/255;
  return 0.299*r+0.587*g+0.114*b;
}
var DARK=false;
var THMAP={'#FBF7EC':'#1A2130','#FFFDF7':'#1E2637','#F3EDDD':'#2A3348','#FFFFFF':'#2E3850',
'#26221B':'#EDE7D6','#4B4437':'#D2CCBC','#6B6252':'#5A605D','#8A8070':'#9AA2B4','#B9AE95':'#66708A',
'#E3DCCB':'#39435C','#D8D0BC':'#39435C','#E8E2D4':'#39415A','#9A938A':'#8F97A8','#6B655C':'#B8BECE',
'#2C7D8C':'#5FC8DE','#B5652A':'#E0904E','#8A5A2B':'#C98F52','#2F7D4F':'#52B87C'};
function THX(c){return (DARK&&THMAP[c])?THMAP[c]:c}
function PAINT(str){
  if(!DARK)return str;
  return str.replace(/(fill|stroke)="(#[0-9A-Fa-f]{6})"/g,function(m,a,c){
    var mm=THMAP[c.toUpperCase()];
    return mm?(a+'="'+mm+'"'):m;
  });
}
function tl(x,y,size,fill,txt,anchor,weight){
  fill=THX(fill);
  var halo=lum(fill)>0.5?'#26221B':'#FFFFFF';
  return '<text x="'+Math.round(x)+'" y="'+Math.round(y)+'" font-size="'+Math.round(size)+
   '" font-weight="'+(weight||700)+'" fill="'+fill+'" text-anchor="'+(anchor||'middle')+
   '" style="paint-order:stroke;stroke:'+halo+';stroke-width:3px;stroke-linejoin:round">'+txt+'</text>';
}
function tlplain(x,y,size,fill,txt,anchor,weight){
  fill=THX(fill);
  return '<text x="'+Math.round(x)+'" y="'+Math.round(y)+'" font-size="'+Math.round(size)+
   '" font-weight="'+(weight||700)+'" fill="'+fill+'" text-anchor="'+(anchor||'middle')+'">'+txt+'</text>';
}

function showTab(i){
  CUR=i;

  for(k=0;k<TABN;k++){
    $('p'+k).classList.toggle('on',k===i);
    $('d'+k).classList.toggle('on',k===i);
  }
  RENDER[i]();
  updSummary();
}

  var tabs=document.querySelectorAll('.tab'),k;

  $('dockfold').addEventListener('click',function(){
    var d=$('dock'); d.classList.toggle('folded');
    this.textContent=d.classList.contains('folded')?'⌃':'⌄';
    updSummary();

}

/* ================= ① two-beaker race model ================= */
var DF={t:0,dropped:false,TA:15,TB:85,doneA:0,doneB:0};
var NW=34,NI=30;
var WA=[],WB=[],IA=[],IB=[];
function bk(i){ return i?{x0:356,x1:608,y0:148,y1:436}:{x0:52,x1:304,y0:148,y1:436}; }
function initDF(){
  var k;
  WA=[];WB=[];IA=[];IB=[];
  DF.t=0;DF.dropped=false;DF.doneA=0;DF.doneB=0;
  for(k=0;k<NW;k++){
    var a=bk(0),b=bk(1);
    WA.push({x:a.x0+14+rnd(k,11)*(a.x1-a.x0-28),y:a.y0+14+rnd(k,12)*(a.y1-a.y0-28),vx:0,vy:0});
    WB.push({x:b.x0+14+rnd(k,13)*(b.x1-b.x0-28),y:b.y0+14+rnd(k,14)*(b.y1-b.y0-28),vx:0,vy:0});
  }
  for(k=0;k<NI;k++){
    IA.push({x:0,y:0,vx:0,vy:0});
    IB.push({x:0,y:0,vx:0,vy:0});
  }
}
function dfDrop(){
  var k;
  DF.dropped=true;DF.t=0;DF.doneA=0;DF.doneB=0;
  for(k=0;k<NI;k++){
    var a=bk(0),b=bk(1);
    var cxa=(a.x0+a.x1)/2,cxb=(b.x0+b.x1)/2;
    IA[k].x=cxa+(rnd(k,21)-0.5)*30; IA[k].y=a.y0+12+rnd(k,22)*22; IA[k].vx=0; IA[k].vy=0.3;
    IB[k].x=cxb+(rnd(k,23)-0.5)*30; IB[k].y=b.y0+12+rnd(k,24)*22; IB[k].vx=0; IB[k].vy=0.3;
  }
}
function walk(list,b,cap,noise,off){
  var k,fr=Math.floor(CLK*30);
  for(k=0;k<list.length;k++){
    var p=list[k];
    p.vx+=(rnd(k+off,fr)-0.5)*noise;
    p.vy+=(rnd(k+off,fr+500)-0.5)*noise;
    var v=Math.sqrt(p.vx*p.vx+p.vy*p.vy)||1;
    if(v>cap){p.vx*=cap/v;p.vy*=cap/v}
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<b.x0+9){p.x=b.x0+9;p.vx=Math.abs(p.vx)}
    if(p.x>b.x1-9){p.x=b.x1-9;p.vx=-Math.abs(p.vx)}
    if(p.y<b.y0+9){p.y=b.y0+9;p.vy=Math.abs(p.vy)}
    if(p.y>b.y1-9){p.y=b.y1-9;p.vy=-Math.abs(p.vy)}
  }
}
function mixOf(list,b){
  /* 3x3 coarse grid: with 30 ink particles a uniform spread leaves a cell
     empty only ~3% of the time, so full mixing really does read ~100% */
  var cells={},k;
  for(k=0;k<list.length;k++){
    var cx=Math.floor((list[k].x-b.x0)/((b.x1-b.x0)/3));
    var cy=Math.floor((list[k].y-b.y0)/((b.y1-b.y0)/3));
    cells[clamp(cx,0,2)+'_'+clamp(cy,0,2)]=1;
  }
  var n=0,key;
  for(key in cells)n++;
  return n/9;
}
function inkCap(t){ return 0.5+t/100*1.5; }
function dfStep(dt){
  CLK+=dt;
  walk(WA,bk(0),0.3+DF.TA/100*1.1,0.35,100);
  walk(WB,bk(1),0.3+DF.TB/100*1.1,0.35,300);
  if(!DF.dropped)return;
  DF.t+=dt;
  walk(IA,bk(0),inkCap(DF.TA),0.5,500);
  walk(IB,bk(1),inkCap(DF.TB),0.5,700);
  if(!DF.doneA&&mixOf(IA,bk(0))>=0.88)DF.doneA=DF.t;
  if(!DF.doneB&&mixOf(IB,bk(1))>=0.88)DF.doneB=DF.t;
}

/* ================= ② three-state diffusion model ================= */
var S3={run:false,t:0};
var HG=[],HL=[],HS=[],D3=[[],[],[]];
function s3box(b){ return {ox:16+b*216, oy:64, w:196, h:250}; }
function initS3(){
  var k,b;
  S3.run=false;S3.t=0;
  HG=[];HL=[];HS=[];D3=[[],[],[]];
  for(k=0;k<9;k++){
    var a=rnd(k,31)*6.28;
    HG.push({x:24+rnd(k,32)*156,y:20+rnd(k,33)*208,vx:Math.cos(a)*1.6,vy:Math.sin(a)*1.6});
  }
  // liquid & solid media FILL the whole box: the dye must burrow THROUGH them
  for(k=0;k<35;k++)HL.push({hx:24+(k%5)*38+(rnd(k,34)-0.5)*12, hy:26+Math.floor(k/5)*33+(rnd(k,35)-0.5)*10});
  for(k=0;k<35;k++)HS.push({hx:30+(k%5)*34, hy:24+Math.floor(k/5)*33});
  for(b=0;b<3;b++){
    for(k=0;k<8;k++){
      D3[b].push({x:16,y:52+k*22,sx:16,sy:52+k*22,ox:16,vx:0,vy:0});
    }
  }
}
function s3Step(dt){
  var k,fr=Math.floor(CLK*30);
  for(k=0;k<HG.length;k++){
    var g=HG[k];
    g.x+=g.vx;g.y+=g.vy;
    if(g.x<12){g.x=12;g.vx=Math.abs(g.vx)}
    if(g.x>184){g.x=184;g.vx=-Math.abs(g.vx)}
    if(g.y<12){g.y=12;g.vy=Math.abs(g.vy)}
    if(g.y>238){g.y=238;g.vy=-Math.abs(g.vy)}
  }
  if(!S3.run)return;
  S3.t+=dt;
  // gas dye: ballistic
  for(k=0;k<8;k++){
    var p=D3[0][k];
    if(p.vx===0&&p.vy===0){var a=rnd(k,41)*3.14-1.57;p.vx=Math.cos(a)*2.2;p.vy=Math.sin(a)*2.2}
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<12){p.x=12;p.vx=Math.abs(p.vx)}
    if(p.x>184){p.x=184;p.vx=-Math.abs(p.vx)}
    if(p.y<12){p.y=12;p.vy=Math.abs(p.vy)}
    if(p.y>238){p.y=238;p.vy=-Math.abs(p.vy)}
  }
  // liquid dye: slow squeeze random walk
  for(k=0;k<8;k++){
    var q=D3[1][k];
    q.vx+=(rnd(k,fr+30)-0.5)*0.32;
    q.vy+=(rnd(k,fr+80)-0.5)*0.32;
    var v=Math.sqrt(q.vx*q.vx+q.vy*q.vy)||1;
    if(v>0.42){q.vx*=0.42/v;q.vy*=0.42/v}
    q.x+=q.vx;q.y+=q.vy;
    if(q.x<12){q.x=12;q.vx=Math.abs(q.vx)}
    if(q.x>184){q.x=184;q.vx=-Math.abs(q.vx)}
    if(q.y<12){q.y=12;q.vy=Math.abs(q.vy)}
    if(q.y>238){q.y=238;q.vy=-Math.abs(q.vy)}
  }
  // solid dye: vibrate in place, imperceptible creep
  for(k=0;k<8;k++){
    var s=D3[2][k];
    s.sx+=0.004;
    s.x=s.sx+1.3*Math.sin(CLK*5+k);
    s.y=s.sy+1.3*Math.cos(CLK*4.3+k);
  }
}
function s3disp(b){
  var k,s=0;
  for(k=0;k<8;k++)s+=D3[b][k].x-D3[b][k].ox;
  return s/8;
}

/* ================= ③ concentration-gradient model ================= */
var GR={wall:true,cl:0,cr:0,Tl:40,Tr:40,n0l:20,n0r:20};
var GX0=60,GX1=600,GY0=150,GY1=400,GW=330;
var GP=[],WG=[];
function grCap(T){ return 0.45+T/100*1.3; }
function initGR(){
  var k;
  GR.wall=true;GR.cl=0;GR.cr=0;
  GP=[];WG=[];
  // chocolate substance fills the LEFT, grey substance fills the RIGHT
  for(k=0;k<GR.n0l;k++)GP.push({x:GX0+16+rnd(k,51)*(GW-GX0-40),y:GY0+16+rnd(k,52)*(GY1-GY0-32),vx:0,vy:0});
  for(k=0;k<GR.n0r;k++)WG.push({x:GW+16+rnd(k,53)*(GX1-GW-40),y:GY0+16+rnd(k,54)*(GY1-GY0-32),vx:0,vy:0});
}
function grPop(list,off,T){
  var k,fr=Math.floor(CLK*30);
  for(k=0;k<list.length;k++){
    var p=list[k],px=p.x;
    p.vx+=(rnd(k,fr+off)-0.5)*0.5;
    p.vy+=(rnd(k,fr+off+60)-0.5)*0.5;
    var v=Math.sqrt(p.vx*p.vx+p.vy*p.vy)||1;
    var cap=grCap(T);
    if(v>cap){p.vx*=cap/v;p.vy*=cap/v}
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<GX0+9){p.x=GX0+9;p.vx=Math.abs(p.vx)}
    if(p.x>GX1-9){p.x=GX1-9;p.vx=-Math.abs(p.vx)}
    if(p.y<GY0+9){p.y=GY0+9;p.vy=Math.abs(p.vy)}
    if(p.y>GY1-9){p.y=GY1-9;p.vy=-Math.abs(p.vy)}
    if(GR.wall){
      if(px<GW&&p.x>=GW-8){p.x=GW-8;p.vx=-Math.abs(p.vx)}
      if(px>GW&&p.x<=GW+8){p.x=GW+8;p.vx=Math.abs(p.vx)}
    }else{
      if(px<GW&&p.x>=GW)GR.cl++;
      if(px>=GW&&p.x<GW)GR.cr++;
    }
  }
}
function grStep(dt){
  // each substance carries its own side's temperature
  grPop(GP,200,GR.Tl);
  grPop(WG,900,GR.Tr);
}
function chocRight(){
  var k,n=0;
  for(k=0;k<GP.length;k++)if(GP[k].x>=GW)n++;
  return n;
}
function greyLeft(){
  var k,n=0;
  for(k=0;k<WG.length;k++)if(WG[k].x<GW)n++;
  return n;
}
function grNL(){ return GP.length-chocRight(); }

function netRow(y,col,name,nl,nr,n){
  // net diffusion always runs from the fuller compartment to the emptier one:
  // arrow length is PROPORTIONAL to |nl-nr|/n, direction follows the sign
  var aw=Math.round(90*Math.abs(nl-nr)/Math.max(n,1));
  var s='';
  if(aw>=10){
    s+='<line x1="'+(330-aw)+'" y1="'+y+'" x2="'+(330+aw)+'" y2="'+y+'" stroke="'+col+'" stroke-width="6"/>';
    if(nl>nr)s+='<path d="M '+(330+aw)+' '+y+' l -12 -7 m 12 7 l -12 7" stroke="'+col+'" stroke-width="6" fill="none"/>';
    else s+='<path d="M '+(330-aw)+' '+y+' l 12 -7 m -12 7 l 12 7" stroke="'+col+'" stroke-width="6" fill="none"/>';
    s+=tl(330-aw-14,y+5,14,col,name+' '+nl,'end');
    s+=tl(330+aw+14,y+5,14,col,nr+'','start');
  }else{
    s+=tl(330,y+5,14,col,name+' '+nl+' \u21cc '+nr);
  }
  return s;
}

var QZi=0,QZpick=[],QZdone=[],QZfirst=[];
function drawQZ(){buildQuiz()}
function qzHead(){
  var data=QZdata(),N=data.length,nf=0,k;
  for(k=0;k<N;k++)if(QZfirst[k]===true)nf++;
  $('qzprog').textContent=(LANG==='en'?'Q ':'第 ')+Math.min(QZi+1,N)+' / '+N+(LANG==='en'?'':' 题');
  $('qzscore').textContent=(LANG==='en'?'first try ':'一次答对 ')+nf+' / '+N;
  return nf;
}
function buildQuiz(){
  var data=QZdata(),h='',k,j,N=data.length;
  var nf=qzHead();
  if(QZi>=N){
    $('quiz').innerHTML='<div class="q"><div class="qt">'+(LANG==='en'?'🎉 Done! First-try score: ':'🎉 全部完成！一次答对：')+nf+' / '+N+'</div></div>';
    return;
  }
  var d=data[QZi];
  h+='<div class="q"><div class="qt">'+d.q+'</div>';
  for(j=0;j<d.o.length;j++){
    h+='<button class="opt" data-o="'+j+'">'+String.fromCharCode(65+j)+'. '+d.o[j][0]+'</button>';
    h+='<div class="fb" id="fbq_'+j+'">'+d.o[j][2]+'</div>';
  }
  h+='</div>';
  h+='<button class="dbtn" id="qznext" style="display:none">'+(QZi===N-1?(LANG==='en'?'Finish ✔':'完成 ✔'):(LANG==='en'?'Next ▶':'下一题 ▶'))+'</button>';
  $('quiz').innerHTML=h;
  var ops=document.querySelectorAll('#quiz .opt');
  for(k=0;k<ops.length;k++){
    ops[k].addEventListener('click',function(){
      if(QZdone[QZi])return;
      pickQ(+this.getAttribute('data-o'));
    });
  }
  var nb=$('qznext');
  if(nb)nb.addEventListener('click',function(){QZi++;buildQuiz();updSummary()});
  if(QZpick[QZi]!==undefined)restoreQ();
}
function pickQ(oi){
  var data=QZdata(),d=data[QZi];
  QZpick[QZi]=oi;
  if(QZfirst[QZi]===undefined)QZfirst[QZi]=(d.o[oi][1]===1);
  if(d.o[oi][1]===1)QZdone[QZi]=true;
  restoreQ();
  qzHead();
}
function restoreQ(){
  var data=QZdata(),d=data[QZi],j;
  var ops=document.querySelectorAll('#quiz .opt');
  var oi=QZpick[QZi];
  for(j=0;j<ops.length;j++){
    ops[j].classList.remove('ok');ops[j].classList.remove('bad');
    var f=$('fbq_'+j);if(f)f.classList.remove('show');
  }
  if(oi===undefined||!ops[oi])return;
  var right=d.o[oi][1]===1;
  ops[oi].classList.add(right?'ok':'bad');
  var fb=$('fbq_'+oi);if(fb)fb.classList.add('show');
  var nb=$('qznext');
  if(nb)nb.style.display=QZdone[QZi]?'':'none';
}

function lum(hex){
  if(hex[0]!=='#')return 0.5;
  var r=parseInt(hex.substr(1,2),16)/255,g=parseInt(hex.substr(3,2),16)/255,b=parseInt(hex.substr(5,2),16)/255;
  return 0.299*r+0.587*g+0.114*b;
}

/* ================= ① two-beaker race model ================= */
var DF={t:0,dropped:false,TA:15,TB:85,doneA:0,doneB:0};
var NW=34,NI=30;
var WA=[],WB=[],IA=[],IB=[];
function bk(i){ return i?{x0:356,x1:608,y0:148,y1:436}:{x0:52,x1:304,y0:148,y1:436}; }
function initDF(){
  var k;
  WA=[];WB=[];IA=[];IB=[];
  DF.t=0;DF.dropped=false;DF.doneA=0;DF.doneB=0;
  for(k=0;k<NW;k++){
    var a=bk(0),b=bk(1);
    WA.push({x:a.x0+14+rnd(k,11)*(a.x1-a.x0-28),y:a.y0+14+rnd(k,12)*(a.y1-a.y0-28),vx:0,vy:0});
    WB.push({x:b.x0+14+rnd(k,13)*(b.x1-b.x0-28),y:b.y0+14+rnd(k,14)*(b.y1-b.y0-28),vx:0,vy:0});
  }
  for(k=0;k<NI;k++){
    IA.push({x:0,y:0,vx:0,vy:0});
    IB.push({x:0,y:0,vx:0,vy:0});
  }
}
function dfDrop(){
  var k;
  DF.dropped=true;DF.t=0;DF.doneA=0;DF.doneB=0;
  for(k=0;k<NI;k++){
    var a=bk(0),b=bk(1);
    var cxa=(a.x0+a.x1)/2,cxb=(b.x0+b.x1)/2;
    IA[k].x=cxa+(rnd(k,21)-0.5)*30; IA[k].y=a.y0+12+rnd(k,22)*22; IA[k].vx=0; IA[k].vy=0.3;
    IB[k].x=cxb+(rnd(k,23)-0.5)*30; IB[k].y=b.y0+12+rnd(k,24)*22; IB[k].vx=0; IB[k].vy=0.3;
  }
}
function walk(list,b,cap,noise,off){
  var k,fr=Math.floor(CLK*30);
  for(k=0;k<list.length;k++){
    var p=list[k];
    p.vx+=(rnd(k+off,fr)-0.5)*noise;
    p.vy+=(rnd(k+off,fr+500)-0.5)*noise;
    var v=Math.sqrt(p.vx*p.vx+p.vy*p.vy)||1;
    if(v>cap){p.vx*=cap/v;p.vy*=cap/v}
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<b.x0+9){p.x=b.x0+9;p.vx=Math.abs(p.vx)}
    if(p.x>b.x1-9){p.x=b.x1-9;p.vx=-Math.abs(p.vx)}
    if(p.y<b.y0+9){p.y=b.y0+9;p.vy=Math.abs(p.vy)}
    if(p.y>b.y1-9){p.y=b.y1-9;p.vy=-Math.abs(p.vy)}
  }
}
function mixOf(list,b){
  /* 3x3 coarse grid: with 30 ink particles a uniform spread leaves a cell
     empty only ~3% of the time, so full mixing really does read ~100% */
  var cells={},k;
  for(k=0;k<list.length;k++){
    var cx=Math.floor((list[k].x-b.x0)/((b.x1-b.x0)/3));
    var cy=Math.floor((list[k].y-b.y0)/((b.y1-b.y0)/3));
    cells[clamp(cx,0,2)+'_'+clamp(cy,0,2)]=1;
  }
  var n=0,key;
  for(key in cells)n++;
  return n/9;
}
function inkCap(t){ return 0.5+t/100*1.5; }
function dfStep(dt){
  CLK+=dt;
  walk(WA,bk(0),0.3+DF.TA/100*1.1,0.35,100);
  walk(WB,bk(1),0.3+DF.TB/100*1.1,0.35,300);
  if(!DF.dropped)return;
  DF.t+=dt;
  walk(IA,bk(0),inkCap(DF.TA),0.5,500);
  walk(IB,bk(1),inkCap(DF.TB),0.5,700);
  if(!DF.doneA&&mixOf(IA,bk(0))>=0.88)DF.doneA=DF.t;
  if(!DF.doneB&&mixOf(IB,bk(1))>=0.88)DF.doneB=DF.t;
}

/* ================= ② three-state diffusion model ================= */
var S3={run:false,t:0};
var HG=[],HL=[],HS=[],D3=[[],[],[]];
function s3box(b){ return {ox:16+b*216, oy:64, w:196, h:250}; }
function initS3(){
  var k,b;
  S3.run=false;S3.t=0;
  HG=[];HL=[];HS=[];D3=[[],[],[]];
  for(k=0;k<9;k++){
    var a=rnd(k,31)*6.28;
    HG.push({x:24+rnd(k,32)*156,y:20+rnd(k,33)*208,vx:Math.cos(a)*1.6,vy:Math.sin(a)*1.6});
  }
  // liquid & solid media FILL the whole box: the dye must burrow THROUGH them
  for(k=0;k<35;k++)HL.push({hx:24+(k%5)*38+(rnd(k,34)-0.5)*12, hy:26+Math.floor(k/5)*33+(rnd(k,35)-0.5)*10});
  for(k=0;k<35;k++)HS.push({hx:30+(k%5)*34, hy:24+Math.floor(k/5)*33});
  for(b=0;b<3;b++){
    for(k=0;k<8;k++){
      D3[b].push({x:16,y:52+k*22,sx:16,sy:52+k*22,ox:16,vx:0,vy:0});
    }
  }
}
function s3Step(dt){
  var k,fr=Math.floor(CLK*30);
  for(k=0;k<HG.length;k++){
    var g=HG[k];
    g.x+=g.vx;g.y+=g.vy;
    if(g.x<12){g.x=12;g.vx=Math.abs(g.vx)}
    if(g.x>184){g.x=184;g.vx=-Math.abs(g.vx)}
    if(g.y<12){g.y=12;g.vy=Math.abs(g.vy)}
    if(g.y>238){g.y=238;g.vy=-Math.abs(g.vy)}
  }
  if(!S3.run)return;
  S3.t+=dt;
  // gas dye: ballistic
  for(k=0;k<8;k++){
    var p=D3[0][k];
    if(p.vx===0&&p.vy===0){var a=rnd(k,41)*3.14-1.57;p.vx=Math.cos(a)*2.2;p.vy=Math.sin(a)*2.2}
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<12){p.x=12;p.vx=Math.abs(p.vx)}
    if(p.x>184){p.x=184;p.vx=-Math.abs(p.vx)}
    if(p.y<12){p.y=12;p.vy=Math.abs(p.vy)}
    if(p.y>238){p.y=238;p.vy=-Math.abs(p.vy)}
  }
  // liquid dye: slow squeeze random walk
  for(k=0;k<8;k++){
    var q=D3[1][k];
    q.vx+=(rnd(k,fr+30)-0.5)*0.32;
    q.vy+=(rnd(k,fr+80)-0.5)*0.32;
    var v=Math.sqrt(q.vx*q.vx+q.vy*q.vy)||1;
    if(v>0.42){q.vx*=0.42/v;q.vy*=0.42/v}
    q.x+=q.vx;q.y+=q.vy;
    if(q.x<12){q.x=12;q.vx=Math.abs(q.vx)}
    if(q.x>184){q.x=184;q.vx=-Math.abs(q.vx)}
    if(q.y<12){q.y=12;q.vy=Math.abs(q.vy)}
    if(q.y>238){q.y=238;q.vy=-Math.abs(q.vy)}
  }
  // solid dye: vibrate in place, imperceptible creep
  for(k=0;k<8;k++){
    var s=D3[2][k];
    s.sx+=0.004;
    s.x=s.sx+1.3*Math.sin(CLK*5+k);
    s.y=s.sy+1.3*Math.cos(CLK*4.3+k);
  }
}
function s3disp(b){
  var k,s=0;
  for(k=0;k<8;k++)s+=D3[b][k].x-D3[b][k].ox;
  return s/8;
}

/* ================= ③ concentration-gradient model ================= */
var GR={wall:true,cl:0,cr:0,Tl:40,Tr:40,n0l:20,n0r:20};
var GX0=60,GX1=600,GY0=150,GY1=400,GW=330;
var GP=[],WG=[];
function grCap(T){ return 0.45+T/100*1.3; }
function initGR(){
  var k;
  GR.wall=true;GR.cl=0;GR.cr=0;
  GP=[];WG=[];
  // chocolate substance fills the LEFT, grey substance fills the RIGHT
  for(k=0;k<GR.n0l;k++)GP.push({x:GX0+16+rnd(k,51)*(GW-GX0-40),y:GY0+16+rnd(k,52)*(GY1-GY0-32),vx:0,vy:0});
  for(k=0;k<GR.n0r;k++)WG.push({x:GW+16+rnd(k,53)*(GX1-GW-40),y:GY0+16+rnd(k,54)*(GY1-GY0-32),vx:0,vy:0});
}
function grPop(list,off,T){
  var k,fr=Math.floor(CLK*30);
  for(k=0;k<list.length;k++){
    var p=list[k],px=p.x;
    p.vx+=(rnd(k,fr+off)-0.5)*0.5;
    p.vy+=(rnd(k,fr+off+60)-0.5)*0.5;
    var v=Math.sqrt(p.vx*p.vx+p.vy*p.vy)||1;
    var cap=grCap(T);
    if(v>cap){p.vx*=cap/v;p.vy*=cap/v}
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<GX0+9){p.x=GX0+9;p.vx=Math.abs(p.vx)}
    if(p.x>GX1-9){p.x=GX1-9;p.vx=-Math.abs(p.vx)}
    if(p.y<GY0+9){p.y=GY0+9;p.vy=Math.abs(p.vy)}
    if(p.y>GY1-9){p.y=GY1-9;p.vy=-Math.abs(p.vy)}
    if(GR.wall){
      if(px<GW&&p.x>=GW-8){p.x=GW-8;p.vx=-Math.abs(p.vx)}
      if(px>GW&&p.x<=GW+8){p.x=GW+8;p.vx=Math.abs(p.vx)}
    }else{
      if(px<GW&&p.x>=GW)GR.cl++;
      if(px>=GW&&p.x<GW)GR.cr++;
    }
  }
}
function grStep(dt){
  // each substance carries its own side's temperature
  grPop(GP,200,GR.Tl);
  grPop(WG,900,GR.Tr);
}
function chocRight(){
  var k,n=0;
  for(k=0;k<GP.length;k++)if(GP[k].x>=GW)n++;
  return n;
}
function greyLeft(){
  var k,n=0;
  for(k=0;k<WG.length;k++)if(WG[k].x<GW)n++;
  return n;
}
function grNL(){ return GP.length-chocRight(); }

/* ---------- ③ two substances interdiffusing ---------- */
function netRow(y,col,name,nl,nr,n){
  // net diffusion always runs from the fuller compartment to the emptier one:
  // arrow length is PROPORTIONAL to |nl-nr|/n, direction follows the sign
  var aw=Math.round(90*Math.abs(nl-nr)/Math.max(n,1));
  var s='';
  if(aw>=10){
    s+='<line x1="'+(330-aw)+'" y1="'+y+'" x2="'+(330+aw)+'" y2="'+y+'" stroke="'+col+'" stroke-width="6"/>';
    if(nl>nr)s+='<path d="M '+(330+aw)+' '+y+' l -12 -7 m 12 7 l -12 7" stroke="'+col+'" stroke-width="6" fill="none"/>';
    else s+='<path d="M '+(330-aw)+' '+y+' l 12 -7 m -12 7 l 12 7" stroke="'+col+'" stroke-width="6" fill="none"/>';
    s+=tl(330-aw-14,y+5,14,col,name+' '+nl,'end');
    s+=tl(330+aw+14,y+5,14,col,nr+'','start');
  }else{
    s+=tl(330,y+5,14,col,name+' '+nl+' \u21cc '+nr);
  }
  return s;
}

var QZi=0,QZpick=[],QZdone=[],QZfirst=[];
function drawQZ(){buildQuiz()}
function qzHead(){
  var data=QZdata(),N=data.length,nf=0,k;
  for(k=0;k<N;k++)if(QZfirst[k]===true)nf++;
  $('qzprog').textContent=(LANG==='en'?'Q ':'第 ')+Math.min(QZi+1,N)+' / '+N+(LANG==='en'?'':' 题');
  $('qzscore').textContent=(LANG==='en'?'first try ':'一次答对 ')+nf+' / '+N;
  return nf;
}
function buildQuiz(){
  var data=QZdata(),h='',k,j,N=data.length;
  var nf=qzHead();
  if(QZi>=N){
    $('quiz').innerHTML='<div class="q"><div class="qt">'+(LANG==='en'?'🎉 Done! First-try score: ':'🎉 全部完成！一次答对：')+nf+' / '+N+'</div></div>';
    return;
  }
  var d=data[QZi];
  h+='<div class="q"><div class="qt">'+d.q+'</div>';
  for(j=0;j<d.o.length;j++){
    h+='<button class="opt" data-o="'+j+'">'+String.fromCharCode(65+j)+'. '+d.o[j][0]+'</button>';
    h+='<div class="fb" id="fbq_'+j+'">'+d.o[j][2]+'</div>';
  }
  h+='</div>';
  h+='<button class="dbtn" id="qznext" style="display:none">'+(QZi===N-1?(LANG==='en'?'Finish ✔':'完成 ✔'):(LANG==='en'?'Next ▶':'下一题 ▶'))+'</button>';
  $('quiz').innerHTML=h;
  var ops=document.querySelectorAll('#quiz .opt');
  for(k=0;k<ops.length;k++){
    ops[k].addEventListener('click',function(){
      if(QZdone[QZi])return;
      pickQ(+this.getAttribute('data-o'));
    });
  }
  var nb=$('qznext');
  if(nb)nb.addEventListener('click',function(){QZi++;buildQuiz();updSummary()});
  if(QZpick[QZi]!==undefined)restoreQ();
}
function pickQ(oi){
  var data=QZdata(),d=data[QZi];
  QZpick[QZi]=oi;
  if(QZfirst[QZi]===undefined)QZfirst[QZi]=(d.o[oi][1]===1);
  if(d.o[oi][1]===1)QZdone[QZi]=true;
  restoreQ();
  qzHead();
}
function restoreQ(){
  var data=QZdata(),d=data[QZi],j;
  var ops=document.querySelectorAll('#quiz .opt');
  var oi=QZpick[QZi];
  for(j=0;j<ops.length;j++){
    ops[j].classList.remove('ok');ops[j].classList.remove('bad');
    var f=$('fbq_'+j);if(f)f.classList.remove('show');
  }
  if(oi===undefined||!ops[oi])return;
  var right=d.o[oi][1]===1;
  ops[oi].classList.add(right?'ok':'bad');
  var fb=$('fbq_'+oi);if(fb)fb.classList.add('show');
  var nb=$('qznext');
  if(nb)nb.style.display=QZdone[QZi]?'':'none';
}

  $('grreset').addEventListener('click',function(){initGR();$('grpull').classList.remove('on');drawGR();updSummary()});
  function grParam(id,lab,key,unit){
    $(id).addEventListener('input',function(){
      GR[key]=+this.value;$(lab).textContent=this.value+unit;
      initGR();$('grpull').classList.remove('on');
    });
  }
  // temperature changes apply LIVE (no reset); count changes re-init
  function grTemp(id,lab,key){
    $(id).addEventListener('input',function(){
      GR[key]=+this.value;$(lab).textContent=this.value+' °C';
    });
  }
  grTemp('grtl','grtllab','Tl');
  grTemp('grtr','grtrlab','Tr');
  grParam('grnl','grnllab','n0l','');
  grParam('grnr','grnrlab','n0r','');
  $('qzreset').addEventListener('click',function(){QZpick=[];QZdone=[];QZfirst=[];QZi=0;buildQuiz();updSummary()});
  $('langbtn').addEventListener('click',function(){setLang(LANG==='zh'?'en':'zh')});
  $('thmbtn').addEventListener('click',function(){
    DARK=!DARK;
    if(document.body)document.body.classList.toggle('dark',DARK);
    this.textContent=DARK?'☀️':'🌙';
    RENDER[CUR]();updSummary();
  });
  initExp();
  applyI18n();
  buildEXT(); buildQuiz();
  showTab(0);
  AMB=requestAnimationFrame(ambLoop);
}
boot();

/* test hook */
window.__test=function(){
  var i;
  for(i=0;i<TABN;i++){showTab(i)}
  showTab(0);
  dfDrop();
  for(i=0;i<400;i++){dfStep(0.016);if(i%100===0)drawDF()}
  initDF();drawDF();
  showTab(1);
  S3.run=true;
  for(i=0;i<300;i++){CLK+=0.016;s3Step(0.016);if(i%100===0)drawS3()}
  initS3();drawS3();
  showTab(2);
  for(i=0;i<60;i++){CLK+=0.016;grStep(0.016)}
  GR.wall=false;
  for(i=0;i<300;i++){CLK+=0.016;grStep(0.016);if(i%100===0)drawGR()}
  initGR();drawGR();
  showTab(3);for(i=0;i<40;i++){CLK+=0.016;drawEX()}
  showTab(4);
  for(i=0;i<7;i++){QZi=i;buildQuiz();pickQ(i%4)}
  QZi=7;buildQuiz();
  QZi=0;QZpick=[];QZdone=[];QZfirst=[];buildQuiz();
  DARK=true;for(i=0;i<TABN;i++){RENDER[i]()}
  DARK=false;
  setLang('en');for(i=0;i<TABN;i++){RENDER[i]()}
  setLang('zh');
  showTab(0);
};
