<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>气体压强探究实验室 · Gas Pressure · ScienceMaterial</title>
<style>
:root{
  color-scheme:light;
  --paper:#fffefb; --bg:#f2f1e9; --card:#FFFEFB; --surface:#FFFFFF;
  --ink:#1c2c42; --muted:#68786f; --line:#DDD9CF; --line2:#EDE9E0;
  --teal:#146e61; --teal-soft:#e4eee4; --gold:#b88a43; --red:#bd6151; --hot:#D9542B; --warm:#B88A43; --cool:#2C7D8C; --green:#2F7D4F;
  --app-height:100vh;
</style>
</head>
<body>

<header class="toolbar">
  <div class="hleft">
    <div class="brand">ScienceMaterial</div>
    <h1><svg width="20" height="20" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex:none;display:inline-block;vertical-align:middle"><rect width="28" height="28" rx="6" fill="#1C2C42"/><path d="M9 9H19L17.5 19C17.5 19 16 21 14 21C12 21 10.5 19 10.5 19L9 9Z" fill="#FFFEFB"/><circle cx="14" cy="14" r="2" fill="#146E61"/></svg> 💨 <span data-i="title"></span></h1>
    <div class="sub">Gas Pressure · chu-er-shang/b3-c4 · ScienceMaterial</div>
  </div>
  <div class="chips">
    <span data-i="chip1"></span>
    <span data-i="chip2"></span>
    <span style="color:var(--neg); border-color:rgba(63,208,108,.55)" data-i="chip3"></span>
  </div>
  <div class="hbtns">
    <button class="hbtn lang" id="langBtn" onclick="toggleLang()">EN</button>
    <button class="hbtn" id="themeBtn" onclick="toggleTheme()"></button>
    <button class="hbtn" onclick="toggleFull()"><span data-i="btnFull"></span></button>
    <button class="hbtn" onclick="resetActive()">↺ <span data-i="btnReset"></span></button>
  </div>
</header>

<main>
  <div class="left">
    <nav class="tabs">
      <button id="tab-lab" class="on" onclick="setMode('lab')"><span data-i="tabLab"></span></button>
      <button id="tab-cmp" onclick="setMode('cmp')"><span data-i="tabCmp"></span></button>
      <button id="tab-quiz" onclick="setMode('quiz')"><span data-i="tabQuiz"></span></button>
      <button id="tab-game" onclick="setMode('game')"><span data-i="tabGame"></span></button>
    </nav>

    <div class="stage">
      <section class="panel on" id="panel-lab">
        <div class="cvarea"><canvas id="cv-lab" width="2000" height="1000"></canvas></div>
        <div class="rail">
          <div class="rail-t" data-i="sceLabel"></div>
          <button class="railbtn" data-sc="sc1" onclick="playScene('sc1')"><span data-i="sc1"></span></button>
          <button class="railbtn" data-sc="sc2" onclick="playScene('sc2')"><span data-i="sc2"></span></button>
          <button class="railbtn" data-sc="sc3" onclick="playScene('sc3')"><span data-i="sc3"></span></button>
          <button class="railbtn" data-sc="sc4" onclick="playScene('sc4')"><span data-i="sc4"></span></button>
          <button class="railbtn" data-sc="sc5" onclick="playScene('sc5')"><span data-i="sc5"></span></button>
        </div>
      </section>

      <section class="panel" id="panel-cmp">
        <div class="duo">
          <div class="box">
            <div class="track-label" id="ca-name"></div>
            <div class="cvwrap"><canvas id="cv-ca" width="880" height="760"></canvas></div>
            <div class="minictl" id="ca-cond"></div>
          </div>
          <div class="box">
            <div class="track-label" id="cb-name"></div>
            <div class="cvwrap"><canvas id="cv-cb" width="880" height="760"></canvas></div>
            <div class="minictl" id="cb-cond"></div>
          </div>
        </div>
      </section>

      <section class="panel" id="panel-quiz">
        <div class="quiz-wrap">
          <div class="q-timer" id="q-timer"><i id="q-timer-bar"></i></div>
          <div class="quiz-emoji" id="q-emoji"></div>
          <div class="quiz-q" id="q-text"></div>
          <div class="quiz-btns" id="q-opts"></div>
          <div class="quiz-exp" id="q-exp"></div>
          <div class="quiz-nav">
            <button class="btn" id="q-next" style="display:none" onclick="nextQ()"><span data-i="next"></span> ➜</button>
            <button class="btn ghost" id="q-restart" style="display:none" onclick="restartQ()">🔄 <span data-i="again"></span></button>
          </div>
        </div>
      </section>

      <section class="panel" id="panel-game">
        <div class="gamehud">
          <span class="gt"><span data-i="gTarget"></span> <b id="g-target">--</b> kPa</span>
          <span class="gt"><span data-i="gRound"></span> <b id="g-round" style="font-size:18px">1</b>/3</span>
          <span class="gt"><span data-i="gNow"></span> <b id="g-cur-hud">--</b></span>
          <span class="gtime" id="g-time">40</span>
        </div>
        <div id="game-cvhost"></div>
      </section>
    </div>

    <div class="ctlbar">
      <div class="ctl-group on" id="ctl-lab">
        <div class="rowline">
          <label class="ctl"><span data-i="slN"></span>
            <input type="range" id="s-n" min="5" max="60" step="5" value="20" oninput="setN(+this.value,1)">
            <output id="s-n-o">20</output>
          </label>
          <label class="ctl"><span data-i="slT"></span>
            <input type="range" id="s-t" min="-20" max="100" step="10" value="20" oninput="setT(+this.value,1)">
            <output id="s-t-o">20 ℃</output>
          </label>
          <label class="ctl"><span data-i="slV"></span>
            <input type="range" id="s-v" min="45" max="100" step="5" value="100" oninput="setV(+this.value,1)">
            <output id="s-v-o">100 %</output>
          </label>
        </div>
        <div class="hint-line" data-i="labHint"></div>
      </div>

      <div class="ctl-group" id="ctl-cmp">
        <button class="btn ghost" style="font-size:14px; letter-spacing:0" onclick="presetCmp(0)">📕 <span data-i="cp1"></span></button>
        <button class="btn ghost" style="font-size:14px; letter-spacing:0" onclick="presetCmp(1)">📗 <span data-i="cp2"></span></button>
        <button class="btn ghost" style="font-size:14px; letter-spacing:0" onclick="presetCmp(2)">📙 <span data-i="cp3"></span></button>
        <span class="ctl-label" data-i="guessQ"></span>
        <button class="sbtn" data-g="a" onclick="pickGuess(this)"><span data-i="gMoreA"></span></button>
        <button class="sbtn" data-g="same" onclick="pickGuess(this)"><span data-i="gSame"></span></button>
        <button class="sbtn" data-g="b" onclick="pickGuess(this)"><span data-i="gMoreB"></span></button>
        <button class="btn" id="cmp-run" onclick="runCmp()" disabled>⏱ <span data-i="runCmp"></span></button>
        <div class="hint-line" data-i="cmpHint"></div>
      </div>

      <div class="ctl-group" id="ctl-quiz">
        <div class="hint-line" data-i="quizHint"></div>
      </div>

      <div class="ctl-group" id="ctl-game">
        <div class="rowline">
          <label class="ctl"><span data-i="slN"></span>
            <input type="range" id="g-n" min="5" max="60" step="5" value="20" oninput="setN(+this.value,1)">
            <output id="g-n-o">20</output>
          </label>
          <label class="ctl"><span data-i="slT"></span>
            <input type="range" id="g-t" min="-20" max="100" step="10" value="20" oninput="setT(+this.value,1)">
            <output id="g-t-o">20 ℃</output>
          </label>
          <label class="ctl"><span data-i="slV"></span>
            <input type="range" id="g-v" min="45" max="100" step="5" value="100" oninput="setV(+this.value,1)">
            <output id="g-v-o">100 %</output>
          </label>
        </div>
        <div class="rowline">
          <button class="btn" id="g-lock" onclick="lockP()">🎯</button>
        </div>
        <div class="hint-line" data-i="gHint"></div>
      </div>
    </div>
  </div>

  <aside>
    <div class="sb on" id="sb-lab">
      <div>
        <div class="sb-title" data-i="pLabel"></div>
        <div class="bigang"><b id="l-p">200</b><i> kPa</i></div>
      </div>
      <span class="netchip" id="l-state"></span>
      <div class="mini3">
        <div><span data-i="kHits"></span><b id="l-hits">0</b></div>
        <div><span data-i="kTK"></span><b id="l-tk">293</b></div>
        <div><span data-i="kV"></span><b id="l-v">100</b></div>
      </div>
      <button class="explain-btn" data-exp="l" onclick="toggleExplain('l')"><span data-i="expOpen"></span></button>
      <div class="explain" id="exp-l">
        <div class="statusbox" id="l-status"></div>
        <div class="concl" id="l-conclude"></div>
      </div>
      <div class="rec-head">
        <button class="rec-btn" onclick="recordData()">📌 <span data-i="recBtn"></span></button>
        <button class="rec-clear" onclick="clearRec()" data-i="recClear"></button>
      </div>
      <table class="rec">
        <thead><tr><th data-i="thN"></th><th data-i="thT"></th><th data-i="thV"></th><th data-i="thP"></th><th style="width:26%"></th></tr></thead>
        <tbody id="rec-body"></tbody>
      </table>
    </div>

    <div class="sb" id="sb-cmp">
      <div class="sb-title" data-i="outLabel"></div>
      <div class="cmp-angs">
        <div class="one"><span id="s-ca-name"></span><b id="c-p-a">0</b><em> kPa</em></div>
        <div class="one"><span id="s-cb-name"></span><b id="c-p-b">0</b><em> kPa</em></div>
      </div>
      <div class="mini3">
        <div><span data-i="kN"></span><b id="c-n-a">--</b></div>
        <div><span data-i="kT"></span><b id="c-t-a">--</b></div>
        <div><span data-i="kV"></span><b id="c-v-a">--</b></div>
      </div>
      <div class="mini3">
        <div><span data-i="kN"></span><b id="c-n-b">--</b></div>
        <div><span data-i="kT"></span><b id="c-t-b">--</b></div>
        <div><span data-i="kV"></span><b id="c-v-b">--</b></div>
      </div>
      <div class="feedback" id="cmp-fb"></div>
      <div class="concl" id="cmp-conclude"></div>
    </div>

    <div class="sb" id="sb-quiz">
      <div class="sb-title" data-i="score"></div>
      <div class="scorebig"><b id="q-score-n">0</b><span> / 8</span></div>
      <div class="qdots" id="q-prog"></div>
      <div class="statusbox" id="q-side-hint"></div>
    </div>

    <div class="sb" id="sb-game">
      <div>
        <div class="sb-title" data-i="gTargetLabel"></div>
        <div class="goalbig" id="g-target-side">--</div>
      </div>
      <div>
        <div class="sb-title" data-i="gNowLabel"></div>
        <div class="bigang"><b id="g-cur">200</b><i> kPa</i></div>
      </div>
      <div>
        <div class="sb-title" data-i="score"></div>
        <div class="scorebig"><b id="g-score">0</b></div>
      </div>
      <div class="statusbox" id="g-status"></div>
    </div>

    <footer id="credit"></footer>
  </aside>
</main>

<script>
'use strict';
const $ = id => document.getElementById(id);

/* ============================================================
   Shared drawing helpers
============================================================ */
const CV_FONT = '"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
function ptr(ev, cv, sc){
  const r = cv.getBoundingClientRect();
  return { x:(ev.clientX-r.left)*cv.width/r.width/(sc||1),
           y:(ev.clientY-r.top)*cv.height/r.height/(sc||1) };
}
function rrect(c,x,y,w,h,r){
  c.beginPath();
  if(c.roundRect){ c.roundRect(x,y,w,h,r); return; }
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}
function circle(c,x,y,r,fill,stroke,lw){
  c.beginPath(); c.arc(x,y,r,0,Math.PI*2);
  if(fill){ c.fillStyle=fill; c.fill(); }
  if(stroke){ c.strokeStyle=stroke; c.lineWidth=lw||1.5; c.stroke(); }
}
function line(c,x1,y1,x2,y2,col,lw,dash){
  c.beginPath();
  if(c.setLineDash) c.setLineDash(dash||[]);
  c.moveTo(x1,y1); c.lineTo(x2,y2);
  c.strokeStyle=col; c.lineWidth=lw||1.5; c.stroke();
  if(c.setLineDash) c.setLineDash([]);
}
function TX(c,s,x,y,font,color,align,base){
  if(!isFinite(x)||!isFinite(y)) return;
  c.font=font; c.fillStyle=color; c.textAlign=align||'left'; c.textBaseline=base||'middle';
  c.fillText(s,x,y);
}
/* pill-backed text, clamped inside the canvas */
function tchip(c,s,x,y,font,color,align,W,H){
  c.font=font;
  const w=c.measureText(s).width;
  const m=/([\d.]+)px/.exec(font), fs=m?parseFloat(m[1]):14, h=fs+14;
  const al=align||'center';
  let x0 = al==='left' ? x : (al==='right' ? x-w : x-w/2);
  x0 = clamp(x0, 10, Math.max(10, (W||1000)-w-10));
  const yy = clamp(y, h/2+4, (H||500)-h/2-4);
  rrect(c,x0-11,yy-h/2,w+22,h,9);
  c.fillStyle=C().pill; c.fill();
  c.strokeStyle=C().pillLine; c.lineWidth=1.2; c.stroke();
  TX(c,s,x0+w/2,yy,font,color,'center','middle');
}

/* ============================================================
   Gas engine (shared by lab / compare / game)
   p(kPa) = 200 × (N/20) × (T_K/293) ÷ (V/100)
   — identical to the source model (gauge 2.0 → 200 kPa)
============================================================ */
const P_REF = 200, P_MAX = 600;
function tK(T){ return T + 273; }
function pressureOf(N,T,V){ return P_REF * (N/20) * (tK(T)/293) / (V/100); }
/* classroom-visible temperature→speed map (from the source file) */
function tempFactor(T){ return 0.35 + 1.65 * ((T + 20) / 120); }

function makeGas(N,T,V,base){
  return { N:N, T:T, V:V, base:base, parts:[], flashes:[], hits:0, hitDisp:0, hitTimer:0 };
}
function gasP(g){ return pressureOf(g.N, g.T, g.V); }
function pistonX(g, geo){ return geo.left + (geo.right-geo.left)*g.V/100; }
function meanSpeed(g){ return g.base * tempFactor(g.T); }
function spawnPart(g, geo){
  const px = pistonX(g, geo), ang = Math.random()*Math.PI*2;
  const sp = meanSpeed(g) * (0.7 + Math.random()*0.6);
  return {
    x: geo.left+geo.r+2 + Math.random()*Math.max(6, px-geo.left-2*geo.r-4),
    y: geo.top+geo.r+2 + Math.random()*Math.max(6, geo.bot-geo.top-2*geo.r-4),
    vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp,
  };
}
function syncParts(g, geo){
  const n = Math.round(g.N);
  while(g.parts.length < n) g.parts.push(spawnPart(g, geo));
  while(g.parts.length > n) g.parts.pop();
  const px = pistonX(g, geo);
  for(const p of g.parts){
    p.x = clamp(p.x, geo.left+geo.r, px-geo.r);
    p.y = clamp(p.y, geo.top+geo.r, geo.bot-geo.r);
  }
}
function rescaleSpeeds(g){
  const target = meanSpeed(g);
  for(const p of g.parts){
    const sp = Math.hypot(p.vx,p.vy) || 1;
    const ns = target * (0.7 + Math.random()*0.6);
    p.vx = p.vx/sp*ns; p.vy = p.vy/sp*ns;
  }
}
function gasHit(g,x,y){ g.hits++; if(g.flashes.length < 90) g.flashes.push({x:x, y:y, life:0.25}); }
function gasStep(g, geo, dt){
  const px = pistonX(g, geo), R = geo.r;
  for(const p of g.parts){
    p.x += p.vx*dt; p.y += p.vy*dt;
    if(p.x < geo.left+R){ p.x = geo.left+R; p.vx = Math.abs(p.vx); gasHit(g, geo.left, p.y); }
    if(p.x > px-R){ p.x = px-R; p.vx = -Math.abs(p.vx); gasHit(g, px, p.y); }
    if(p.y < geo.top+R){ p.y = geo.top+R; p.vy = Math.abs(p.vy); gasHit(g, p.x, geo.top); }
    if(p.y > geo.bot-R){ p.y = geo.bot-R; p.vy = -Math.abs(p.vy); gasHit(g, p.x, geo.bot); }
  }
  g.hitTimer += dt;
  if(g.hitTimer >= 1){ g.hitDisp = g.hits; g.hits = 0; g.hitTimer = 0; }
  for(const f of g.flashes) f.life -= dt;
  g.flashes = g.flashes.filter(f=>f.life > 0);
}
function partColor(T){
  const k = clamp((T + 20) / 120, 0, 1);
  return 'rgb('+Math.round(90+k*160)+','+Math.round(140-k*60)+','+Math.round(215-k*150)+')';
}
function drawGas(c, g, geo){
  const px = pistonX(g, geo), over = gasP(g) > P_MAX;
  /* gas volume */
  c.fillStyle = C().gasFill;
  c.fillRect(geo.left, geo.top, px-geo.left, geo.bot-geo.top);
  /* collision flashes */
  for(const f of g.flashes){
    circle(c, f.x, f.y, geo.r*1.3*f.life/0.25 + 3, 'rgba('+C().flash+','+(f.life/0.25*0.7)+')', null, 0);
  }
  /* particles + velocity arrows */
  const col = partColor(g.T);
  for(const p of g.parts){
    circle(c, p.x, p.y, geo.r, col, C().partEdge, 1.2);
    const sp = Math.hypot(p.vx,p.vy) || 1;
    line(c, p.x + p.vx/sp*geo.r*1.1, p.y + p.vy/sp*geo.r*1.1,
            p.x + p.vx/sp*geo.r*2.3, p.y + p.vy/sp*geo.r*2.3, C().arrow, 2);
  }
  /* walls (open on the piston side) */
  c.beginPath();
  c.moveTo(px, geo.top); c.lineTo(geo.left, geo.top);
  c.lineTo(geo.left, geo.bot); c.lineTo(px, geo.bot);
  c.strokeStyle = over ? C().wallHot : C().wall;
  c.lineWidth = geo.lw; c.lineJoin='round'; c.lineCap='round'; c.stroke();
  return px;
}
function drawPiston(c, px, geo, tagText){
  const mid = (geo.top+geo.bot)/2, w = geo.pw;
  c.fillStyle = C().piston;
  c.fillRect(px, geo.top-4, w, geo.bot-geo.top+8);
  c.fillStyle = C().pistonHi;
  c.fillRect(px+w*0.22, geo.top+4, w*0.3, geo.bot-geo.top-8);
  c.fillStyle = C().handle;
  c.fillRect(px+w, mid-w*0.3, geo.hl, w*0.6);
  c.fillRect(px+w+geo.hl, mid-w*1.4, w*0.6, w*2.8);
  if(tagText) TX(c, tagText, px+w, geo.top-16, '700 14px '+CV_FONT, C().pistonTag, 'left', 'middle');
}

function drawGauge(c, cx, cy, r, p){
  const over = p > P_MAX;
  circle(c, cx, cy, r, C().gaugeFace, over ? C().wallHot : C().gaugeRim, 6);
  for(let i=0;i<=6;i++){
    const ang = (210 - i*40) * Math.PI/180;
    const big = (i%2===0);
    line(c, cx+Math.cos(ang)*(r-7), cy-Math.sin(ang)*(r-7),
            cx+Math.cos(ang)*(r-(big?18:13)), cy-Math.sin(ang)*(r-(big?18:13)),
            C().gaugeRim, big?2.4:1.6);
    if(big){
      TX(c, String(i*100), cx+Math.cos(ang)*(r-30), cy-Math.sin(ang)*(r-30)+1,
         '700 13px '+CV_FONT, C().gaugeInk, 'center', 'middle');
    }
  }
  const shown = Math.min(P_MAX, p)/100 + (over ? Math.sin(Date.now()/40)*0.12 : Math.sin(Date.now()/300)*0.03);
  const ang = (210 - shown*40) * Math.PI/180;
  line(c, cx-Math.cos(ang)*10, cy+Math.sin(ang)*10,
          cx+Math.cos(ang)*(r-22), cy-Math.sin(ang)*(r-22),

const SCENES = {
  sc1:{ start:{N:10, T:20, V:100}, key:'N', to:45,  dur:3.0, why:'sc1why' },
  sc2:{ start:{N:20, T:20, V:100}, key:'T', to:90,  dur:3.0, why:'sc2why' },
  sc3:{ start:{N:20, T:20, V:100}, key:'V', to:50,  dur:3.0, why:'sc3why' },
  sc4:{ start:{N:20, T:30, V:100}, key:'T', to:-20, dur:3.0, why:'sc4why' },
  sc5:{ start:{N:20, T:20, V:100}, key:null, to:0,  dur:0,   why:'sc5why' },
};
let SCENE = null;
function stopScene(){
  if(SCENE){
    document.querySelectorAll('.railbtn[data-sc]').forEach(b=>b.classList.remove('pick'));
    SCENE = null;
  }
}
function playScene(id){
  const s = SCENES[id];
  if(!s) return;
  setMode('lab');
  stopScene();
  LG.N = s.start.N; LG.T = s.start.T; LG.V = s.start.V;
  syncParts(LG, LGEO); rescaleSpeeds(LG);
  FLASH = null; CONCL = s.why;
  TIPK = s.key==='N' ? 'tipN' : s.key==='T' ? 'tipT' : s.key==='V' ? 'tipV' : 'tipIdle';
  if(s.key){
    SCENE = { id:id, key:s.key, from:s.start[s.key], to:s.to, tt:0, dur:s.dur };
    document.querySelectorAll('.railbtn[data-sc]').forEach(b=>b.classList.toggle('pick', b.dataset.sc===id));
  }
  syncLab();
}
function stepScene(dt){
  if(!SCENE) return;
  SCENE.tt += dt;
  const k = clamp(SCENE.tt/SCENE.dur, 0, 1);
  const e = k<0.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2;
  const raw = SCENE.from + (SCENE.to-SCENE.from)*e;
  if(SCENE.key==='N'){ LG.N = clamp(Math.round(raw/5)*5, 5, 60); syncParts(LG, LGEO); }
  else if(SCENE.key==='T'){ LG.T = clamp(Math.round(raw/10)*10, -20, 100); rescaleSpeeds(LG); }
  else { LG.V = clamp(Math.round(raw/5)*5, 45, 100); syncParts(LG, LGEO); }
  if(k >= 1){
    FLASH = 'r_'+SCENE.key+(SCENE.to>SCENE.from?'up':'dn');
    const done = SCENE.id;
    document.querySelectorAll('.railbtn[data-sc]').forEach(b=>b.classList.remove('pick'));
    SCENE = null;
    CONCL = SCENES[done].why;
  }
  syncLab();
}

  let top = 0;

  body.innerHTML = recRows.map(r=>{

      '<td><div class="bar '+cls+'"><i style="width:'+pct+'%"></i></div></td></tr>';
  }).join('');
}

const cvB = $('cv-cb'), ctxB = cvB.getContext('2d');
const CA = makeGas(20, 20, 100, 110), CB = makeGas(20, 20, 100, 110);
function side(which){ return CMP_PRESETS[CMP.preset][which]; }
function sideAt(s, p0){
  const prog = clamp(p0, 0, 1);
  return { N: Math.round(s.N0 + (s.N1-s.N0)*prog),
           T: Math.round((s.T0 + (s.T1-s.T0)*prog)/2)*2,
           V: Math.round(s.V0 + (s.V1-s.V0)*prog) };
}
function applySide(g, s, prog){
  const st = sideAt(s, prog);
  const dT = st.T !== g.T;
  g.N = st.N; g.T = st.T; g.V = st.V;
  syncParts(g, CGEO);
  if(dT) rescaleSpeeds(g);
}
function drawCmpSide(c, g, cv){

  const bx = 36, bw = CM_W-72, by = 48;
  rrect(c, bx, by, bw, 18, 9); c.fillStyle = C().panel; c.fill();
  c.strokeStyle = C().panelLine; c.lineWidth = 1.2; c.stroke();
  rrect(c, bx+2, by+2, Math.max(3, clamp(p/P_MAX,0,1)*(bw-4)), 14, 7);
  c.fillStyle = over ? C().barHot : C().bar; c.fill();
  TX(c, '0', bx, by+30, '700 14px '+CV_FONT, C().cvTextDim, 'left', 'middle');

  const px = drawGas(c, g, CGEO);
  drawPiston(c, px, CGEO, null);
  /* conditions */
  TX(c, tf('cvNTV',{n:g.N, t:g.T, v:g.V}), CM_W/2, 348, '700 16px '+CV_FONT, C().cvText, 'center', 'middle');
  TX(c, tf('cvHits',{h:g.hitDisp}), CM_W/2, 370, '700 14px '+CV_FONT, C().cvTextDim, 'center', 'middle');

function drawCmpBoth(){
  drawCmpSide(ctxA, CA, cvA);
  drawCmpSide(ctxB, CB, cvB);

}
function updateCmpSide(){
  const pa = gasP(CA), pb = gasP(CB);
  $('c-p-a').textContent = pa > P_MAX ? '600+' : pShow(pa);
  $('c-p-b').textContent = pb > P_MAX ? '600+' : pShow(pb);
  $('c-n-a').textContent = CA.N; $('c-t-a').textContent = CA.T; $('c-v-a').textContent = CA.V;

  const a = side('a'), b = side('b');
  if($('ca-name')) $('ca-name').textContent = t(a.nameK);
  if($('cb-name')) $('cb-name').textContent = t(b.nameK);
  if($('ca-cond')) $('ca-cond').textContent = t(a.condK);
  if($('cb-cond')) $('cb-cond').textContent = t(b.condK);

function presetCmp(i){
  CMP.preset = i; CMP.p = 0; CMP.running = false;
  document.querySelectorAll('#ctl-cmp .btn.ghost').forEach((b,k)=>b.style.opacity = (k===i?'1':'.6'));

function cmpReset(){
  if(CMP.running) return;
  CMP.p = 0;
  cmpLabels();
  applySide(CA, side('a'), 0); applySide(CB, side('b'), 0);
  rescaleSpeeds(CA); rescaleSpeeds(CB);
  drawCmpBoth();
  $('cmp-fb').textContent=''; $('cmp-fb').className='feedback';
  $('cmp-conclude').classList.remove('on');

function pickGuess(btn){
  document.querySelectorAll('#ctl-cmp .sbtn[data-g]').forEach(b=>b.classList.remove('pick'));
  btn.classList.add('pick');
  CMP.guess = btn.dataset.g;

function clearGuess(){
  document.querySelectorAll('#ctl-cmp .sbtn[data-g]').forEach(b=>b.classList.remove('pick'));
  CMP.guess = null; $('cmp-run').disabled = true;
}
function runCmp(){
  if(CMP.running) return;
  CMP.p = 0; CMP.running = true;
  $('cmp-run').disabled = true;

function finishCmp(){
  const a = sideAt(side('a'),1), b = sideAt(side('b'),1);
  const pa = pressureOf(a.N,a.T,a.V), pb = pressureOf(b.N,b.T,b.V);
  const real = Math.abs(pa-pb) < Math.max(pa,pb)*0.03 ? 'same' : (pa>pb ? 'a' : 'b');
  const detail = '（'+(LANG==='zh'?'甲':'A')+' '+pShow(pa)+' kPa · '+(LANG==='zh'?'乙':'B')+' '+pShow(pb)+' kPa）';
  const fb = $('cmp-fb');
  if(CMP.guess === real){ fb.innerHTML = t('fbRight')+detail; fb.className='feedback good'; }
  else { fb.innerHTML = t('fbWrong')+detail; fb.className='feedback bad'; }
  const box = $('cmp-conclude');
  box.innerHTML = t(CMP_PRESETS[CMP.preset].concl);
  box.classList.add('on');
  clearGuess();
}

/* ============================================================
   Tab 3: Class quiz
============================================================ */
const QUIZ_TIME = 20;
let qIdx = 0, qScore = 0, qDone = [], qTimer = null, qLeft = 0;
function stopTimer(){ if(qTimer){ clearInterval(qTimer); qTimer=null; } }
function startTimer(){
  stopTimer();
  qLeft = QUIZ_TIME;
  const bar = $('q-timer-bar');
  bar.style.width = '100%';
  $('q-timer').classList.remove('low');
  qTimer = setInterval(()=>{
    qLeft -= 0.1;
    bar.style.width = Math.max(0, qLeft/QUIZ_TIME*100)+'%';
    if(qLeft <= 5) $('q-timer').classList.add('low');
    if(qLeft <= 0){ stopTimer(); timeUpQ(); }
  }, 100);
}
function renderQ(){
  const item = QUIZ()[qIdx];
  $('q-emoji').textContent = item.e;
  $('q-text').innerHTML = (qIdx+1)+'. '+item.q;
  $('q-exp').innerHTML = '';
  $('q-next').style.display='none';
  $('q-restart').style.display='none';
  const box = $('q-opts');
  box.innerHTML = '';
  item.o.forEach((opt,i)=>{
    const b = document.createElement('button');
    b.className='qbtn';
    b.textContent = 'ABC'[i]+'. '+opt;
    b.onclick = ()=>answerQ(i,b);
    box.appendChild(b);
  });
  renderProg();
  $('q-score-n').textContent = qScore;
  if(qDone[qIdx] !== undefined){
    const btns=[...box.children];
    btns.forEach(b=>b.disabled=true);
    btns[item.a].classList.add('right');
    $('q-exp').innerHTML = item.x;
    if(qIdx < QUIZ().length-1) $('q-next').style.display='inline-block';
    else $('q-restart').style.display='inline-block';
  } else startTimer();
}
function renderProg(){
  $('q-prog').innerHTML = QUIZ().map((_,i)=>
    '<div class="qdot '+(i===qIdx?'cur ':'')+(qDone[i]===true?'right':qDone[i]===false?'wrong':'')+'"></div>').join('');
}
function finishQ(prefix, correct){
  stopTimer();
  const item = QUIZ()[qIdx];
  qDone[qIdx] = correct;
  if(correct) qScore++;
  const btns = [...$('q-opts').children];
  btns.forEach(b=>b.disabled=true);
  btns[item.a].classList.add('right');
  $('q-exp').innerHTML = prefix + item.x;
  renderProg();
  $('q-score-n').textContent = qScore;
  if(qIdx < QUIZ().length-1) $('q-next').style.display='inline-block';
  else {
    const pct = qScore/QUIZ().length;
    const msg = pct===1 ? t('resGold') : pct>=0.7 ? t('resGood') : t('resTry');
    $('q-exp').innerHTML += '<br><em>'+qScore+' / '+QUIZ().length+' — '+msg+'</em>';
    $('q-restart').style.display='inline-block';
  }
}
function answerQ(i, btn){
  if(qDone[qIdx] !== undefined) return;
  const item = QUIZ()[qIdx];
  const correct = i===item.a;
  if(!correct) btn.classList.add('wrong');
  finishQ(correct ? t('rRight')+' ' : t('rWrong')+' ', correct);
}
function timeUpQ(){
  if(qDone[qIdx] !== undefined) return;
  finishQ(t('timeUp')+' ', false);
}
function nextQ(){ qIdx++; renderQ(); }
function restartQ(){ qIdx=0; qScore=0; qDone=[]; renderQ(); }

/* ============================================================
   Tab 4: Pressure sniper (target challenge — reuses the lab engine)
============================================================ */
const GAME_ROUNDS = 3, GAME_TIME = 40;
const GAME_TARGETS = [120, 150, 180, 250, 300, 350, 400, 450, 500];
const GAME = { round:0, score:0, target:0, phase:'aim', left:GAME_TIME, timer:null, order:[] };
function stopGTimer(){ if(GAME.timer){ clearInterval(GAME.timer); GAME.timer=null; } }
function startGame(){
  GAME.round = 0; GAME.score = 0;
  $('g-score').textContent = 0;
  const idx = GAME_TARGETS.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const tmp=idx[i]; idx[i]=idx[j]; idx[j]=tmp; }
  GAME.order = idx.slice(0, GAME_ROUNDS);
  nextRound();
}
function nextRound(){
  GAME.round++;
  GAME.phase = 'aim';
  GAME.left = GAME_TIME;
  GAME.target = GAME_TARGETS[GAME.order[GAME.round-1]];
  LG.N = 20; LG.T = 20; LG.V = 100;
  syncParts(LG, LGEO); rescaleSpeeds(LG);
  FLASH = null; CONCL = null; TIPK = 'tipIdle';
  stopScene();
  syncLab();
  $('g-status').innerHTML = tf('gGo', {p:GAME.target});
  gameSync();
  stopGTimer();
  GAME.timer = setInterval(()=>{
    GAME.left--;
    $('g-time').textContent = Math.max(0, GAME.left);
    $('g-time').classList.toggle('low', GAME.left<=10);
    if(GAME.left<=0) lockP(true);
  }, 1000);
}
function lockP(timedOut){
  if(GAME.phase === 'aim'){
    stopGTimer();
    const cur = labP();
    const diff = Math.abs(cur - GAME.target);
    const pts = diff<=5?100 : diff<=15?80 : diff<=30?50 : diff<=60?20 : 5;
    GAME.score += pts;
    const msg = (timedOut===true ? t('gTimeUp')+' ' : '') +
      (diff<=5?t('gPerfect') : diff<=15?t('gGood') : diff<=30?t('gOk') : t('gMiss'));
    GAME.phase = GAME.round >= GAME_ROUNDS ? 'done' : 'next';
    let html = msg+'（'+pShow(cur)+' kPa · ±'+Math.round(diff)+' · +'+pts+'）';
    if(GAME.phase === 'done'){
      const rk = GAME.score>=270 ? t('gRank1') : GAME.score>=180 ? t('gRank2') : t('gRank3');
      html += '<br>' + t('gFinal')+' '+GAME.score+' — '+rk;
    }
    $('g-status').innerHTML = html;
    gameSync();
  } else if(GAME.phase === 'next'){
    nextRound();
  } else {
    startGame();
  }
}
function syncGameBtn(){
  $('g-lock').textContent = GAME.phase==='aim' ? '🎯 '+t('gLock')
                          : GAME.phase==='next' ? t('gNextRound') : t('gPlayAgain');
}
function gameSync(){
  $('g-round').textContent = GAME.round;
  $('g-target').textContent = GAME.target;
  $('g-target-side').textContent = GAME.target + ' kPa';
  $('g-time').textContent = Math.max(0, GAME.left);
  $('g-score').textContent = GAME.score;
  syncGameBtn();
  document.querySelectorAll('#ctl-game input[type=range]').forEach(el=>{ el.disabled = GAME.phase!=='aim'; });
}
function gameLive(){
  const p = labP();
  $('g-cur').textContent = p > P_MAX ? '600+' : pShow(p);
  $('g-cur-hud').textContent = (p > P_MAX ? '600+' : pShow(p)) + ' kPa';
}

/* ============================================================
   Main loop & mode switching
============================================================ */
let lastT = performance.now(), lastHits = -1;
function mainLoop(now){
  const dt = Math.min(0.04, (now-lastT)/1000);
  lastT = now;
  const labOn = $('panel-lab').classList.contains('on');
  const gameOn = $('panel-game').classList.contains('on');
  if(labOn || gameOn){
    if(labOn && SCENE) stepScene(dt);
    gasStep(LG, LGEO, dt);
    drawLab();
    /* the sidebar is rebuilt by the setters; here only the once-a-second hit count moves */
    if(labOn){ if(LG.hitDisp !== lastHits){ lastHits = LG.hitDisp; syncLab(); } }
    else gameLive();
  } else if($('panel-cmp').classList.contains('on')){
    if(CMP.running){
      CMP.p += dt/5;
      if(CMP.p >= 1){ CMP.p = 1; CMP.running = false; }
      applySide(CA, side('a'), CMP.p);
      applySide(CB, side('b'), CMP.p);
      if(!CMP.running) finishCmp();
    }
    gasStep(CA, CGEO, dt);
    gasStep(CB, CGEO, dt);
    drawCmpBoth();
  }
  requestAnimationFrame(mainLoop);
}
function setMode(m){
  stopTimer(); stopGTimer();
  CMP.running = false;
  for(const id of ['lab','cmp','quiz','game']){
    $('tab-'+id).classList.toggle('on', id===m);
    $('panel-'+id).classList.toggle('on', id===m);
    $('ctl-'+id).classList.toggle('on', id===m);
    $('sb-'+id).classList.toggle('on', id===m);
  }
  if(m==='lab'){ ($('panel-lab').querySelector('.cvarea')||$('panel-lab')).appendChild(labCv); syncLab(); }
  if(m==='cmp'){ cmpLabels(); cmpReset(); }
  if(m==='quiz') renderQ();
  if(m==='game'){ $('game-cvhost').appendChild(labCv); startGame(); }
}

/* ---------- boot ---------- */
syncParts(LG, LGEO);
applyTheme();
applyLang();
syncExplain();
playScene('sc5');
presetCmp(0);
renderQ();
setMode('lab');
requestAnimationFrame(mainLoop);
</script>

/* ============================================================
   Shared drawing helpers
============================================================ */
const CV_FONT = '"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
function ptr(ev, cv, sc){
  const r = cv.getBoundingClientRect();
  return { x:(ev.clientX-r.left)*cv.width/r.width/(sc||1),
           y:(ev.clientY-r.top)*cv.height/r.height/(sc||1) };
}
function rrect(c,x,y,w,h,r){
  c.beginPath();
  if(c.roundRect){ c.roundRect(x,y,w,h,r); return; }
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}
function circle(c,x,y,r,fill,stroke,lw){
  c.beginPath(); c.arc(x,y,r,0,Math.PI*2);
  if(fill){ c.fillStyle=fill; c.fill(); }
  if(stroke){ c.strokeStyle=stroke; c.lineWidth=lw||1.5; c.stroke(); }
}
function line(c,x1,y1,x2,y2,col,lw,dash){
  c.beginPath();
  if(c.setLineDash) c.setLineDash(dash||[]);
  c.moveTo(x1,y1); c.lineTo(x2,y2);
  c.strokeStyle=col; c.lineWidth=lw||1.5; c.stroke();
  if(c.setLineDash) c.setLineDash([]);
}
function TX(c,s,x,y,font,color,align,base){
  if(!isFinite(x)||!isFinite(y)) return;
  c.font=font; c.fillStyle=color; c.textAlign=align||'left'; c.textBaseline=base||'middle';
  c.fillText(s,x,y);
}
/* pill-backed text, clamped inside the canvas */
function tchip(c,s,x,y,font,color,align,W,H){
  c.font=font;
  const w=c.measureText(s).width;
  const m=/([\d.]+)px/.exec(font), fs=m?parseFloat(m[1]):14, h=fs+14;
  const al=align||'center';
  let x0 = al==='left' ? x : (al==='right' ? x-w : x-w/2);
  x0 = clamp(x0, 10, Math.max(10, (W||1000)-w-10));
  const yy = clamp(y, h/2+4, (H||500)-h/2-4);
  rrect(c,x0-11,yy-h/2,w+22,h,9);
  c.fillStyle=C().pill; c.fill();
  c.strokeStyle=C().pillLine; c.lineWidth=1.2; c.stroke();
  TX(c,s,x0+w/2,yy,font,color,'center','middle');
}

/* ============================================================
   Gas engine (shared by lab / compare / game)
   p(kPa) = 200 × (N/20) × (T_K/293) ÷ (V/100)
   — identical to the source model (gauge 2.0 → 200 kPa)
============================================================ */
const P_REF = 200, P_MAX = 600;
function tK(T){ return T + 273; }
function pressureOf(N,T,V){ return P_REF * (N/20) * (tK(T)/293) / (V/100); }
/* classroom-visible temperature→speed map (from the source file) */
function tempFactor(T){ return 0.35 + 1.65 * ((T + 20) / 120); }

function makeGas(N,T,V,base){
  return { N:N, T:T, V:V, base:base, parts:[], flashes:[], hits:0, hitDisp:0, hitTimer:0 };
}
function gasP(g){ return pressureOf(g.N, g.T, g.V); }
function pistonX(g, geo){ return geo.left + (geo.right-geo.left)*g.V/100; }
function meanSpeed(g){ return g.base * tempFactor(g.T); }
function spawnPart(g, geo){
  const px = pistonX(g, geo), ang = Math.random()*Math.PI*2;
  const sp = meanSpeed(g) * (0.7 + Math.random()*0.6);
  return {
    x: geo.left+geo.r+2 + Math.random()*Math.max(6, px-geo.left-2*geo.r-4),
    y: geo.top+geo.r+2 + Math.random()*Math.max(6, geo.bot-geo.top-2*geo.r-4),
    vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp,
  };
}
function syncParts(g, geo){
  const n = Math.round(g.N);
  while(g.parts.length < n) g.parts.push(spawnPart(g, geo));
  while(g.parts.length > n) g.parts.pop();
  const px = pistonX(g, geo);
  for(const p of g.parts){
    p.x = clamp(p.x, geo.left+geo.r, px-geo.r);
    p.y = clamp(p.y, geo.top+geo.r, geo.bot-geo.r);
  }
}
function rescaleSpeeds(g){
  const target = meanSpeed(g);
  for(const p of g.parts){
    const sp = Math.hypot(p.vx,p.vy) || 1;
    const ns = target * (0.7 + Math.random()*0.6);
    p.vx = p.vx/sp*ns; p.vy = p.vy/sp*ns;
  }
}
function gasHit(g,x,y){ g.hits++; if(g.flashes.length < 90) g.flashes.push({x:x, y:y, life:0.25}); }
function gasStep(g, geo, dt){
  const px = pistonX(g, geo), R = geo.r;
  for(const p of g.parts){
    p.x += p.vx*dt; p.y += p.vy*dt;
    if(p.x < geo.left+R){ p.x = geo.left+R; p.vx = Math.abs(p.vx); gasHit(g, geo.left, p.y); }
    if(p.x > px-R){ p.x = px-R; p.vx = -Math.abs(p.vx); gasHit(g, px, p.y); }
    if(p.y < geo.top+R){ p.y = geo.top+R; p.vy = Math.abs(p.vy); gasHit(g, p.x, geo.top); }
    if(p.y > geo.bot-R){ p.y = geo.bot-R; p.vy = -Math.abs(p.vy); gasHit(g, p.x, geo.bot); }
  }
  g.hitTimer += dt;
  if(g.hitTimer >= 1){ g.hitDisp = g.hits; g.hits = 0; g.hitTimer = 0; }
  for(const f of g.flashes) f.life -= dt;
  g.flashes = g.flashes.filter(f=>f.life > 0);
}
function partColor(T){
  const k = clamp((T + 20) / 120, 0, 1);
  return 'rgb('+Math.round(90+k*160)+','+Math.round(140-k*60)+','+Math.round(215-k*150)+')';
}
function drawGas(c, g, geo){
  const px = pistonX(g, geo), over = gasP(g) > P_MAX;
  /* gas volume */
  c.fillStyle = C().gasFill;
  c.fillRect(geo.left, geo.top, px-geo.left, geo.bot-geo.top);
  /* collision flashes */
  for(const f of g.flashes){
    circle(c, f.x, f.y, geo.r*1.3*f.life/0.25 + 3, 'rgba('+C().flash+','+(f.life/0.25*0.7)+')', null, 0);
  }
  /* particles + velocity arrows */
  const col = partColor(g.T);
  for(const p of g.parts){
    circle(c, p.x, p.y, geo.r, col, C().partEdge, 1.2);
    const sp = Math.hypot(p.vx,p.vy) || 1;
    line(c, p.x + p.vx/sp*geo.r*1.1, p.y + p.vy/sp*geo.r*1.1,
            p.x + p.vx/sp*geo.r*2.3, p.y + p.vy/sp*geo.r*2.3, C().arrow, 2);
  }
  /* walls (open on the piston side) */
  c.beginPath();
  c.moveTo(px, geo.top); c.lineTo(geo.left, geo.top);
  c.lineTo(geo.left, geo.bot); c.lineTo(px, geo.bot);
  c.strokeStyle = over ? C().wallHot : C().wall;
  c.lineWidth = geo.lw; c.lineJoin='round'; c.lineCap='round'; c.stroke();
  return px;
}
function drawPiston(c, px, geo, tagText){
  const mid = (geo.top+geo.bot)/2, w = geo.pw;
  c.fillStyle = C().piston;
  c.fillRect(px, geo.top-4, w, geo.bot-geo.top+8);
  c.fillStyle = C().pistonHi;
  c.fillRect(px+w*0.22, geo.top+4, w*0.3, geo.bot-geo.top-8);
  c.fillStyle = C().handle;
  c.fillRect(px+w, mid-w*0.3, geo.hl, w*0.6);
  c.fillRect(px+w+geo.hl, mid-w*1.4, w*0.6, w*2.8);
  if(tagText) TX(c, tagText, px+w, geo.top-16, '700 14px '+CV_FONT, C().pistonTag, 'left', 'middle');
}

/* ---------- gauge ---------- */
function drawGauge(c, cx, cy, r, p){
  const over = p > P_MAX;
  circle(c, cx, cy, r, C().gaugeFace, over ? C().wallHot : C().gaugeRim, 6);
  for(let i=0;i<=6;i++){
    const ang = (210 - i*40) * Math.PI/180;
    const big = (i%2===0);
    line(c, cx+Math.cos(ang)*(r-7), cy-Math.sin(ang)*(r-7),
            cx+Math.cos(ang)*(r-(big?18:13)), cy-Math.sin(ang)*(r-(big?18:13)),
            C().gaugeRim, big?2.4:1.6);
    if(big){
      TX(c, String(i*100), cx+Math.cos(ang)*(r-30), cy-Math.sin(ang)*(r-30)+1,
         '700 13px '+CV_FONT, C().gaugeInk, 'center', 'middle');
    }
  }
  const shown = Math.min(P_MAX, p)/100 + (over ? Math.sin(Date.now()/40)*0.12 : Math.sin(Date.now()/300)*0.03);
  const ang = (210 - shown*40) * Math.PI/180;
  line(c, cx-Math.cos(ang)*10, cy+Math.sin(ang)*10,
          cx+Math.cos(ang)*(r-22), cy-Math.sin(ang)*(r-22),
          over ? C().wallHot : C().gaugeInk, 3.5);
  circle(c, cx, cy, 5, C().gaugeInk, null, 0);
  TX(c, t('cvGauge'), cx, cy+r+15, '700 13px '+CV_FONT, C().cvTextDim, 'center', 'middle');
}

function drawLab(){

  /* container + gas */
  const px = drawGas(c, LG, LGEO);

  c.fillStyle = C().wall;
  c.fillRect(gx-9, GA.cy+GA.r-6, 18, LGEO.top-GA.cy-GA.r+10);

  TX(c, tf('cvTemp',{t:LG.T, k:tK(LG.T)}), cx, IP.y+88, '700 15px '+CV_FONT,
     LG.T>=40 ? C().hot : LG.T<=0 ? C().cold : C().cvText, 'center', 'middle');

/* ---------- piston dragging ---------- */
let dragPiston = false;
labCv.addEventListener('pointerdown', ev=>{

});
labCv.addEventListener('pointerup', ()=>{ dragPiston = false; });
labCv.addEventListener('pointercancel', ()=>{ dragPiston = false; });

function syncSliders(){

/* ---------- one-click scenarios (was the source's missions + life cards) ---------- */
const SCENES = {
  sc1:{ start:{N:10, T:20, V:100}, key:'N', to:45,  dur:3.0, why:'sc1why' },
  sc2:{ start:{N:20, T:20, V:100}, key:'T', to:90,  dur:3.0, why:'sc2why' },
  sc3:{ start:{N:20, T:20, V:100}, key:'V', to:50,  dur:3.0, why:'sc3why' },
  sc4:{ start:{N:20, T:30, V:100}, key:'T', to:-20, dur:3.0, why:'sc4why' },
  sc5:{ start:{N:20, T:20, V:100}, key:null, to:0,  dur:0,   why:'sc5why' },
};
let SCENE = null;
function stopScene(){
  if(SCENE){
    document.querySelectorAll('.railbtn[data-sc]').forEach(b=>b.classList.remove('pick'));
    SCENE = null;
  }
}
function playScene(id){
  const s = SCENES[id];
  if(!s) return;
  setMode('lab');
  stopScene();
  LG.N = s.start.N; LG.T = s.start.T; LG.V = s.start.V;
  syncParts(LG, LGEO); rescaleSpeeds(LG);
  FLASH = null; CONCL = s.why;
  TIPK = s.key==='N' ? 'tipN' : s.key==='T' ? 'tipT' : s.key==='V' ? 'tipV' : 'tipIdle';
  if(s.key){
    SCENE = { id:id, key:s.key, from:s.start[s.key], to:s.to, tt:0, dur:s.dur };
    document.querySelectorAll('.railbtn[data-sc]').forEach(b=>b.classList.toggle('pick', b.dataset.sc===id));
  }
  syncLab();
}
function stepScene(dt){
  if(!SCENE) return;
  SCENE.tt += dt;
  const k = clamp(SCENE.tt/SCENE.dur, 0, 1);
  const e = k<0.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2;
  const raw = SCENE.from + (SCENE.to-SCENE.from)*e;
  if(SCENE.key==='N'){ LG.N = clamp(Math.round(raw/5)*5, 5, 60); syncParts(LG, LGEO); }
  else if(SCENE.key==='T'){ LG.T = clamp(Math.round(raw/10)*10, -20, 100); rescaleSpeeds(LG); }
  else { LG.V = clamp(Math.round(raw/5)*5, 45, 100); syncParts(LG, LGEO); }
  if(k >= 1){
    FLASH = 'r_'+SCENE.key+(SCENE.to>SCENE.from?'up':'dn');
    const done = SCENE.id;
    document.querySelectorAll('.railbtn[data-sc]').forEach(b=>b.classList.remove('pick'));
    SCENE = null;
    CONCL = SCENES[done].why;
  }
  syncLab();
}

let recRows = [];
function recordData(){
  recRows.push({ N:LG.N, T:LG.T, V:LG.V, p:labP() });

}
function clearRec(){ recRows = []; renderRec(); }
function renderRec(){
  const body = $('rec-body');
  if(!body) return;
  let top = 0;
  recRows.forEach(r=>{ top = Math.max(top, r.p); });
  body.innerHTML = recRows.map(r=>{
    const pct = top>1e-6 ? Math.max(6, r.p/top*100) : 0;
    const cls = r.p > P_MAX ? 'hi' : r.p < 140 ? 'lo' : '';
    return '<tr><td>'+r.N+'</td><td>'+r.T+'</td><td>'+r.V+'</td><td>'+(r.p>P_MAX?'600+':pShow(r.p))+'</td>'+
      '<td><div class="bar '+cls+'"><i style="width:'+pct+'%"></i></div></td></tr>';
  }).join('');
}

const CM_W = 440, CM_H = 380;
const CGEO = { left:36, top:120, bot:320, right:356, r:6, lw:4, pw:14, hl:32 };
const CMP_PRESETS = [
  { id:0, concl:'cc_1',
    a:{ N0:20, N1:20, T0:20, T1:20, V0:100, V1:50,  nameK:'cp1a', condK:'cp1ac' },
    b:{ N0:20, N1:20, T0:20, T1:40, V0:100, V1:100, nameK:'cp1b', condK:'cp1bc' } },
  { id:1, concl:'cc_2',
    a:{ N0:20, N1:20, T0:20, T1:100, V0:100, V1:100, nameK:'cp2a', condK:'cp2ac' },
    b:{ N0:20, N1:40, T0:20, T1:20,  V0:100, V1:100, nameK:'cp2b', condK:'cp2bc' } },
  { id:2, concl:'cc_3',
    a:{ N0:20, N1:20, T0:20, T1:20, V0:50,  V1:100, nameK:'cp3a', condK:'cp3ac' },
    b:{ N0:40, N1:20, T0:20, T1:20, V0:100, V1:100, nameK:'cp3b', condK:'cp3bc' } },
];
const CMP = { preset:0, p:0, running:false, guess:null };
const cvA = $('cv-ca'), ctxA = cvA.getContext('2d');
const cvB = $('cv-cb'), ctxB = cvB.getContext('2d');
const CA = makeGas(20, 20, 100, 110), CB = makeGas(20, 20, 100, 110);
function side(which){ return CMP_PRESETS[CMP.preset][which]; }
function sideAt(s, p0){
  const prog = clamp(p0, 0, 1);
  return { N: Math.round(s.N0 + (s.N1-s.N0)*prog),
           T: Math.round((s.T0 + (s.T1-s.T0)*prog)/2)*2,
           V: Math.round(s.V0 + (s.V1-s.V0)*prog) };
}
function applySide(g, s, prog){
  const st = sideAt(s, prog);
  const dT = st.T !== g.T;
  g.N = st.N; g.T = st.T; g.V = st.V;
  syncParts(g, CGEO);
  if(dT) rescaleSpeeds(g);
}
function drawCmpSide(c, g, cv){
  c.setTransform(1,0,0,1,0,0);
  c.clearRect(0,0,cv.width,cv.height);
  c.setTransform(SC,0,0,SC,0,0);
  const p = gasP(g), over = p > P_MAX;
  /* pressure headline + bar */
  TX(c, tf('cvP',{p:pShow(p)}), CM_W/2, 24, '900 26px '+CV_FONT, over ? C().wallHot : C().amber, 'center', 'middle');
  const bx = 36, bw = CM_W-72, by = 48;
  rrect(c, bx, by, bw, 18, 9); c.fillStyle = C().panel; c.fill();
  c.strokeStyle = C().panelLine; c.lineWidth = 1.2; c.stroke();
  rrect(c, bx+2, by+2, Math.max(3, clamp(p/P_MAX,0,1)*(bw-4)), 14, 7);
  c.fillStyle = over ? C().barHot : C().bar; c.fill();
  TX(c, '0', bx, by+30, '700 14px '+CV_FONT, C().cvTextDim, 'left', 'middle');
  TX(c, '600 kPa', bx+bw, by+30, '700 14px '+CV_FONT, C().cvTextDim, 'right', 'middle');
  /* container */
  const px = drawGas(c, g, CGEO);
  drawPiston(c, px, CGEO, null);
  /* conditions */
  TX(c, tf('cvNTV',{n:g.N, t:g.T, v:g.V}), CM_W/2, 348, '700 16px '+CV_FONT, C().cvText, 'center', 'middle');
  TX(c, tf('cvHits',{h:g.hitDisp}), CM_W/2, 370, '700 14px '+CV_FONT, C().cvTextDim, 'center', 'middle');
}
function drawCmpBoth(){
  drawCmpSide(ctxA, CA, cvA);
  drawCmpSide(ctxB, CB, cvB);
  updateCmpSide();
}
function updateCmpSide(){
  const pa = gasP(CA), pb = gasP(CB);
  $('c-p-a').textContent = pa > P_MAX ? '600+' : pShow(pa);
  $('c-p-b').textContent = pb > P_MAX ? '600+' : pShow(pb);
  $('c-n-a').textContent = CA.N; $('c-t-a').textContent = CA.T; $('c-v-a').textContent = CA.V;
  $('c-n-b').textContent = CB.N; $('c-t-b').textContent = CB.T; $('c-v-b').textContent = CB.V;
}
function cmpLabels(){
  const a = side('a'), b = side('b');
  if($('ca-name')) $('ca-name').textContent = t(a.nameK);
  if($('cb-name')) $('cb-name').textContent = t(b.nameK);
  if($('ca-cond')) $('ca-cond').textContent = t(a.condK);
  if($('cb-cond')) $('cb-cond').textContent = t(b.condK);
  if($('s-ca-name')) $('s-ca-name').textContent = LANG==='zh' ? '甲' : 'A';
  if($('s-cb-name')) $('s-cb-name').textContent = LANG==='zh' ? '乙' : 'B';
}
function presetCmp(i){
  CMP.preset = i; CMP.p = 0; CMP.running = false;
  document.querySelectorAll('#ctl-cmp .btn.ghost').forEach((b,k)=>b.style.opacity = (k===i?'1':'.6'));
  clearGuess(); cmpLabels();
  applySide(CA, side('a'), 0); applySide(CB, side('b'), 0);
  rescaleSpeeds(CA); rescaleSpeeds(CB);
  drawCmpBoth();
  $('cmp-fb').textContent=''; $('cmp-fb').className='feedback';
  $('cmp-conclude').classList.remove('on');
}
function cmpReset(){
  if(CMP.running) return;
  CMP.p = 0;
  cmpLabels();
  applySide(CA, side('a'), 0); applySide(CB, side('b'), 0);
  rescaleSpeeds(CA); rescaleSpeeds(CB);
  drawCmpBoth();
  $('cmp-fb').textContent=''; $('cmp-fb').className='feedback';
  $('cmp-conclude').classList.remove('on');
}
function pickGuess(btn){
  document.querySelectorAll('#ctl-cmp .sbtn[data-g]').forEach(b=>b.classList.remove('pick'));
  btn.classList.add('pick');
  CMP.guess = btn.dataset.g;
  $('cmp-run').disabled = false;
}
function clearGuess(){
  document.querySelectorAll('#ctl-cmp .sbtn[data-g]').forEach(b=>b.classList.remove('pick'));
  CMP.guess = null; $('cmp-run').disabled = true;
}
function runCmp(){
  if(CMP.running) return;
  CMP.p = 0; CMP.running = true;
  $('cmp-run').disabled = true;
}
function finishCmp(){
  const a = sideAt(side('a'),1), b = sideAt(side('b'),1);
  const pa = pressureOf(a.N,a.T,a.V), pb = pressureOf(b.N,b.T,b.V);
  const real = Math.abs(pa-pb) < Math.max(pa,pb)*0.03 ? 'same' : (pa>pb ? 'a' : 'b');
  const detail = '（'+(LANG==='zh'?'甲':'A')+' '+pShow(pa)+' kPa · '+(LANG==='zh'?'乙':'B')+' '+pShow(pb)+' kPa）';
  const fb = $('cmp-fb');
  if(CMP.guess === real){ fb.innerHTML = t('fbRight')+detail; fb.className='feedback good'; }
  else { fb.innerHTML = t('fbWrong')+detail; fb.className='feedback bad'; }
  const box = $('cmp-conclude');
  box.innerHTML = t(CMP_PRESETS[CMP.preset].concl);
  box.classList.add('on');
  clearGuess();
}

============================================================ */
const QUIZ_TIME = 20;
let qIdx = 0, qScore = 0, qDone = [], qTimer = null, qLeft = 0;
function stopTimer(){ if(qTimer){ clearInterval(qTimer); qTimer=null; } }
function startTimer(){
  stopTimer();
  qLeft = QUIZ_TIME;
  const bar = $('q-timer-bar');
  bar.style.width = '100%';
  $('q-timer').classList.remove('low');
  qTimer = setInterval(()=>{
    qLeft -= 0.1;
    bar.style.width = Math.max(0, qLeft/QUIZ_TIME*100)+'%';
    if(qLeft <= 5) $('q-timer').classList.add('low');
    if(qLeft <= 0){ stopTimer(); timeUpQ(); }
  }, 100);
}
function renderQ(){
  const item = QUIZ()[qIdx];
  $('q-emoji').textContent = item.e;
  $('q-text').innerHTML = (qIdx+1)+'. '+item.q;
  $('q-exp').innerHTML = '';
  $('q-next').style.display='none';
  $('q-restart').style.display='none';
  const box = $('q-opts');
  box.innerHTML = '';
  item.o.forEach((opt,i)=>{
    const b = document.createElement('button');
    b.className='qbtn';
    b.textContent = 'ABC'[i]+'. '+opt;
    b.onclick = ()=>answerQ(i,b);
    box.appendChild(b);
  });
  renderProg();
  $('q-score-n').textContent = qScore;
  if(qDone[qIdx] !== undefined){
    const btns=[...box.children];
    btns.forEach(b=>b.disabled=true);
    btns[item.a].classList.add('right');
    $('q-exp').innerHTML = item.x;
    if(qIdx < QUIZ().length-1) $('q-next').style.display='inline-block';
    else $('q-restart').style.display='inline-block';
  } else startTimer();
}
function renderProg(){
  $('q-prog').innerHTML = QUIZ().map((_,i)=>
    '<div class="qdot '+(i===qIdx?'cur ':'')+(qDone[i]===true?'right':qDone[i]===false?'wrong':'')+'"></div>').join('');
}
function finishQ(prefix, correct){
  stopTimer();
  const item = QUIZ()[qIdx];
  qDone[qIdx] = correct;
  if(correct) qScore++;
  const btns = [...$('q-opts').children];
  btns.forEach(b=>b.disabled=true);
  btns[item.a].classList.add('right');
  $('q-exp').innerHTML = prefix + item.x;
  renderProg();
  $('q-score-n').textContent = qScore;
  if(qIdx < QUIZ().length-1) $('q-next').style.display='inline-block';
  else {
    const pct = qScore/QUIZ().length;
    const msg = pct===1 ? t('resGold') : pct>=0.7 ? t('resGood') : t('resTry');
    $('q-exp').innerHTML += '<br><em>'+qScore+' / '+QUIZ().length+' — '+msg+'</em>';
    $('q-restart').style.display='inline-block';
  }
}
function answerQ(i, btn){
  if(qDone[qIdx] !== undefined) return;
  const item = QUIZ()[qIdx];
  const correct = i===item.a;
  if(!correct) btn.classList.add('wrong');
  finishQ(correct ? t('rRight')+' ' : t('rWrong')+' ', correct);
}
function timeUpQ(){
  if(qDone[qIdx] !== undefined) return;
  finishQ(t('timeUp')+' ', false);
}
function nextQ(){ qIdx++; renderQ(); }
function restartQ(){ qIdx=0; qScore=0; qDone=[]; renderQ(); }

/* ============================================================
   Tab 4: Pressure sniper (target challenge — reuses the lab engine)
============================================================ */
const GAME_ROUNDS = 3, GAME_TIME = 40;
const GAME_TARGETS = [120, 150, 180, 250, 300, 350, 400, 450, 500];
const GAME = { round:0, score:0, target:0, phase:'aim', left:GAME_TIME, timer:null, order:[] };
function stopGTimer(){ if(GAME.timer){ clearInterval(GAME.timer); GAME.timer=null; } }
function startGame(){
  GAME.round = 0; GAME.score = 0;
  $('g-score').textContent = 0;
  const idx = GAME_TARGETS.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const tmp=idx[i]; idx[i]=idx[j]; idx[j]=tmp; }
  GAME.order = idx.slice(0, GAME_ROUNDS);
  nextRound();
}
function nextRound(){
  GAME.round++;
  GAME.phase = 'aim';
  GAME.left = GAME_TIME;
  GAME.target = GAME_TARGETS[GAME.order[GAME.round-1]];
  LG.N = 20; LG.T = 20; LG.V = 100;
  syncParts(LG, LGEO); rescaleSpeeds(LG);
  FLASH = null; CONCL = null; TIPK = 'tipIdle';
  stopScene();
  syncLab();
  $('g-status').innerHTML = tf('gGo', {p:GAME.target});
  gameSync();
  stopGTimer();
  GAME.timer = setInterval(()=>{
    GAME.left--;
    $('g-time').textContent = Math.max(0, GAME.left);
    $('g-time').classList.toggle('low', GAME.left<=10);
    if(GAME.left<=0) lockP(true);
  }, 1000);
}
function lockP(timedOut){
  if(GAME.phase === 'aim'){
    stopGTimer();
    const cur = labP();
    const diff = Math.abs(cur - GAME.target);
    const pts = diff<=5?100 : diff<=15?80 : diff<=30?50 : diff<=60?20 : 5;
    GAME.score += pts;
    const msg = (timedOut===true ? t('gTimeUp')+' ' : '') +
      (diff<=5?t('gPerfect') : diff<=15?t('gGood') : diff<=30?t('gOk') : t('gMiss'));
    GAME.phase = GAME.round >= GAME_ROUNDS ? 'done' : 'next';
    let html = msg+'（'+pShow(cur)+' kPa · ±'+Math.round(diff)+' · +'+pts+'）';
    if(GAME.phase === 'done'){
      const rk = GAME.score>=270 ? t('gRank1') : GAME.score>=180 ? t('gRank2') : t('gRank3');
      html += '<br>' + t('gFinal')+' '+GAME.score+' — '+rk;
    }
    $('g-status').innerHTML = html;
    gameSync();
  } else if(GAME.phase === 'next'){
    nextRound();
  } else {
    startGame();
  }
}
function syncGameBtn(){
  $('g-lock').textContent = GAME.phase==='aim' ? '🎯 '+t('gLock')
                          : GAME.phase==='next' ? t('gNextRound') : t('gPlayAgain');
}
function gameSync(){
  $('g-round').textContent = GAME.round;
  $('g-target').textContent = GAME.target;
  $('g-target-side').textContent = GAME.target + ' kPa';
  $('g-time').textContent = Math.max(0, GAME.left);
  $('g-score').textContent = GAME.score;
  syncGameBtn();
  document.querySelectorAll('#ctl-game input[type=range]').forEach(el=>{ el.disabled = GAME.phase!=='aim'; });
}
function gameLive(){
  const p = labP();
  $('g-cur').textContent = p > P_MAX ? '600+' : pShow(p);
  $('g-cur-hud').textContent = (p > P_MAX ? '600+' : pShow(p)) + ' kPa';
}

/* ============================================================
   Main loop & mode switching
============================================================ */
let lastT = performance.now(), lastHits = -1;
function mainLoop(now){
  const dt = Math.min(0.04, (now-lastT)/1000);
  lastT = now;
  const labOn = $('panel-lab').classList.contains('on');
  const gameOn = $('panel-game').classList.contains('on');
  if(labOn || gameOn){
    if(labOn && SCENE) stepScene(dt);
    gasStep(LG, LGEO, dt);
    drawLab();
    /* the sidebar is rebuilt by the setters; here only the once-a-second hit count moves */
    if(labOn){ if(LG.hitDisp !== lastHits){ lastHits = LG.hitDisp; syncLab(); } }
    else gameLive();
  } else if($('panel-cmp').classList.contains('on')){
    if(CMP.running){
      CMP.p += dt/5;
      if(CMP.p >= 1){ CMP.p = 1; CMP.running = false; }
      applySide(CA, side('a'), CMP.p);
      applySide(CB, side('b'), CMP.p);
      if(!CMP.running) finishCmp();
    }
    gasStep(CA, CGEO, dt);
    gasStep(CB, CGEO, dt);
    drawCmpBoth();
  }
  requestAnimationFrame(mainLoop);
}
function setMode(m){
  stopTimer(); stopGTimer();
  CMP.running = false;
  for(const id of ['lab','cmp','quiz','game']){
    $('tab-'+id).classList.toggle('on', id===m);
    $('panel-'+id).classList.toggle('on', id===m);
    $('ctl-'+id).classList.toggle('on', id===m);
    $('sb-'+id).classList.toggle('on', id===m);
  }
  if(m==='lab'){ ($('panel-lab').querySelector('.cvarea')||$('panel-lab')).appendChild(labCv); syncLab(); }
  if(m==='cmp'){ cmpLabels(); cmpReset(); }
  if(m==='quiz') renderQ();
  if(m==='game'){ $('game-cvhost').appendChild(labCv); startGame(); }
}

/* ---------- boot ---------- */
syncParts(LG, LGEO);
applyTheme();
applyLang();
syncExplain();
playScene('sc5');
presetCmp(0);
renderQ();
setMode('lab');
requestAnimationFrame(mainLoop);

</script>
