/* ================= helpers ================= */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function frac(x){return x-Math.floor(x)}
function rnd(k,s){return frac(Math.sin(k*127.1+s*311.7)*43758.5453)}
function lum(hex){
  if(hex[0]!=='#')return 0.5;
  var r=parseInt(hex.substr(1,2),16)/255,g=parseInt(hex.substr(3,2),16)/255,b=parseInt(hex.substr(5,2),16)/255;
  return 0.299*r+0.587*g+0.114*b;
}
var DARK=false;
var THMAP={'#FBF7EC':'#1A2130','#FFFDF7':'#1E2637','#F3EDDD':'#2A3348','#FFFFFF':'#2E3850',
'#26221B':'#EDE7D6','#4B4437':'#D2CCBC','#6B6252':'#5A605D','#8A8070':'#9AA2B4','#B9AE95':'#66708A',
'#E3DCCB':'#39435C','#D8D0BC':'#39435C','#E8E2D4':'#39415A','#9A938A':'#8F97A8','#6B655C':'#B8BECE',
'#2C7D8C':'#5FC8DE','#B5652A':'#E0904E','#8A5A2B':'#C98F52','#2F7D4F':'#52B87C'};
function THX(c){return (DARK&&THMAP[c])?THMAP[c]:c}
function PAINT(str){
  if(!DARK)return str;
  return str.replace(/(fill|stroke)="(#[0-9A-Fa-f]{6})"/g,function(m,a,c){
    var mm=THMAP[c.toUpperCase()];
    return mm?(a+'="'+mm+'"'):m;
  });
}
function tl(x,y,size,fill,txt,anchor,weight){
  fill=THX(fill);
  var halo=lum(fill)>0.5?'#26221B':'#FFFFFF';
  return '<text x="'+Math.round(x)+'" y="'+Math.round(y)+'" font-size="'+Math.round(size)+
   '" font-weight="'+(weight||700)+'" fill="'+fill+'" text-anchor="'+(anchor||'middle')+
   '" style="paint-order:stroke;stroke:'+halo+';stroke-width:3px;stroke-linejoin:round">'+txt+'</text>';
}
function tlplain(x,y,size,fill,txt,anchor,weight){
  fill=THX(fill);
  return '<text x="'+Math.round(x)+'" y="'+Math.round(y)+'" font-size="'+Math.round(size)+
   '" font-weight="'+(weight||700)+'" fill="'+fill+'" text-anchor="'+(anchor||'middle')+'">'+txt+'</text>';
}
function stl(x,y,size,fill,txt,anchor){
  return '<text x="'+Math.round(x)+'" y="'+Math.round(y)+'" font-size="'+Math.round(size)+
   '" font-weight="700" fill="'+fill+'" text-anchor="'+(anchor||'middle')+
   '" style="paint-order:stroke;stroke:#0B1220;stroke-width:3px;stroke-linejoin:round">'+txt+'</text>';
}

function showTab(i){
  CUR=i;

    $('p'+k).classList.toggle('on',k===i);
    $('d'+k).classList.toggle('on',k===i);
  }
  RENDER[i]();
  updSummary();
}

/* ================= atom model ================= */
var ELEM=[
 ['H','氢','Hydrogen'],['He','氦','Helium'],['Li','锂','Lithium'],['Be','铍','Beryllium'],
 ['B','硼','Boron'],['C','碳','Carbon'],['N','氮','Nitrogen'],['O','氧','Oxygen'],
 ['F','氟','Fluorine'],['Ne','氖','Neon'],['Na','钠','Sodium'],['Mg','镁','Magnesium'],
 ['Al','铝','Aluminium'],['Si','硅','Silicon'],['P','磷','Phosphorus'],['S','硫','Sulfur'],
 ['Cl','氯','Chlorine'],['Ar','氩','Argon'],['K','钾','Potassium'],['Ca','钙','Calcium']
];
/* most common neutron count for Z=1..20 */
var NCOMMON=[0,2,4,5,6,6,7,8,10,10,12,12,14,14,16,16,18,22,20,20];
var SHCAP=[2,8,8,2];
var SHR=[46,76,106,132];
function shellsOf(e){
  var out=[],k,left=e;
  for(k=0;k<SHCAP.length&&left>0;k++){
    var take=Math.min(SHCAP[k],left);
    out.push(take);left-=take;
  }
  return out;
}
function chargeOf(p,e){return p-e}
var SUPD={'0':'\u2070','1':'\u00B9','2':'\u00B2','3':'\u00B3','4':'\u2074','5':'\u2075','6':'\u2076','7':'\u2077','8':'\u2078','9':'\u2079'};
function ionTxt(sym,ch){
  var m=Math.abs(ch);
  if(m===0)return sym;
  var d=(m===1)?'':String(m).replace(/[0-9]/g,function(c){return SUPD[c]});
  return sym+d+(ch>0?'\u207A':'\u207B');
}
function elemOf(p){return ELEM[p-1]}
/* electron position: shell si, index j of nj, animated by CLK */
function ePos(cx,cy,si,j,nj,scale,clk){
  var w=(0.9-0.16*si);           /* inner shells whirl faster */
  var a=clk*w+j*6.28318/nj+si*0.7;
  var R=SHR[si]*scale;
  return {x:cx+R*Math.cos(a),y:cy-R*Math.sin(a)};
}
/* nucleon packing: golden-angle spiral, protons/neutrons interleaved */
function nucPos(cx,cy,k,total,scale){
  var r=(total<=1)?0:(4.6*Math.sqrt(k)*scale);
  var a=k*2.39996;
  return {x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)};
}
function nucR(total,scale){return (total<=1)?7*scale:(4.6*Math.sqrt(total)*scale+7*scale)}

/* ionic-compound presets: cs=atoms, fl=electron flights [from,to] */
var TRPRE=[
 {k:'nacl', cs:[{Z:11,N:12},{Z:17,N:18}],            fl:[[0,1]],        f2:'NaCl',  nz:'\u6c2f\u5316\u94a0', ne:'sodium chloride'},
 {k:'mgo',  cs:[{Z:12,N:12},{Z:8,N:8}],              fl:[[0,1],[0,1]],  f2:'MgO',   nz:'\u6c27\u5316\u9541', ne:'magnesium oxide'},
 {k:'mgcl2',cs:[{Z:17,N:18},{Z:12,N:12},{Z:17,N:18}],fl:[[1,0],[1,2]],  f2:'MgCl\u2082', nz:'\u6c2f\u5316\u9541', ne:'magnesium chloride'},
 {k:'na2o', cs:[{Z:11,N:12},{Z:8,N:8},{Z:11,N:12}],  fl:[[0,1],[2,1]],  f2:'Na\u2082O',  nz:'\u6c27\u5316\u94a0', ne:'sodium oxide'}
];
var TR={pre:0,st:'idle',t:0,k:0};   /* idle | fly | done; k = active flight */
function trEOf(i){
  var P=TRPRE[TR.pre],given=0,taken=0,j;
  var upto=(TR.st==='done')?P.fl.length:((TR.st==='fly')?TR.k:0);
  for(j=0;j<P.fl.length;j++){
    if(P.fl[j][0]===i && (j<upto || (TR.st==='fly'&&j===TR.k)))given++;   /* departed leaves giver */
    if(P.fl[j][1]===i && j<upto)taken++;                                   /* only landed counts */
  }
  return P.cs[i].Z-given+taken;
}
function trLayout(){
  var n=TRPRE[TR.pre].cs.length;
  if(n===2)return {xs:[170,490],cy:245,s:1.24};
  return {xs:[110,330,550],cy:245,s:0.86};
}

/* ================= shared atom renderer ================= */
function atomBG(w,h){
  return '<rect x="0" y="0" width="'+w+'" height="'+h+'" rx="14" fill="#0E1626"/>';
}
function drawAtomSVG(cx,cy,p,n,e,scale,clk,opts){
  opts=opts||{};
  var s='',k;
  var sh=shellsOf(e);
  /* shells */
  for(k=0;k<sh.length;k++){
    var hot=(opts.outer&&k===sh.length-1);
    s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(SHR[k]*scale).toFixed(1)+'" fill="none" stroke="'+(hot?'#DA9526':'#3A4A66')+'" stroke-width="'+(hot?2.5:1.5)+'" stroke-dasharray="4 6"/>';
  }
  /* nucleus: interleave p red / n grey deterministically */
  var tot=p+n;
  var seq=[];
  var pi=0,ni=0;
  for(k=0;k<tot;k++){
    var wantP=(pi/Math.max(p,1))<=(ni/Math.max(n,1));
    if(pi>=p)wantP=false;
    if(ni>=n)wantP=true;
    seq.push(wantP?'p':'n');
    if(wantP)pi++;else ni++;
  }
  for(k=0;k<tot;k++){
    var q=nucPos(cx,cy,k,tot,scale);
    var jx=(rnd(k,31)-0.5)*1.6*Math.sin(clk*3+k),jy=(rnd(k,37)-0.5)*1.6*Math.cos(clk*3+k*2);
    var col=(seq[k]==='p')?'#D9542B':'#8F96A4';
    s+='<circle cx="'+(q.x+jx).toFixed(1)+'" cy="'+(q.y+jy).toFixed(1)+'" r="'+(6*scale).toFixed(1)+'" fill="'+col+'" stroke="#0E1626" stroke-width="1"/>';
    if(seq[k]==='p'&&scale>=0.55)s+=stl(q.x+jx,q.y+jy+4*scale,Math.max(10,11*scale),'#FFE3D6','+');
  }
  /* electrons */
  var placedCap=(opts.maxPlaced===undefined)?e:opts.maxPlaced;
  var idx=0;
  for(k=0;k<sh.length;k++){
    var nj=sh[k];
    for(var j=0;j<nj;j++){
      if(idx>=placedCap)break;
      var pe=ePos(cx,cy,k,j,nj,scale,clk);
      s+='<circle cx="'+pe.x.toFixed(1)+'" cy="'+pe.y.toFixed(1)+'" r="'+(5*scale).toFixed(1)+'" fill="#4C8DBF" stroke="#9CC3E8" stroke-width="1.5"/>';
      if(scale>=0.55)s+=stl(pe.x,pe.y+4*scale,Math.max(10,11*scale),'#DDEBFA','−');
      idx++;
    }
  }
  return s;
}
/* isotope notation  A over Z, then symbol */
function notation(cx,cy,A,Z,sym,size){
  var s='';
  s+=stl(cx-size*0.42,cy-size*0.34,Math.round(size*0.52),'#E8C97A',A,'end');
  s+=stl(cx-size*0.42,cy+size*0.42,Math.round(size*0.52),'#9CC3E8',Z,'end');
  s+=stl(cx,cy+size*0.18,size,'#F1F4F9',sym,'start');
  return s;
}

/* ================= ② electron filling ================= */
function drawEP(){
  var s=atomBG(660,470);
  var cx=250,cy=225;
  var e=EP.p;
  var sh=shellsOf(e);
  s+=drawAtomSVG(cx,cy,EP.p,NCOMMON[EP.p-1],e,1.12,CLK,{maxPlaced:EP.placed,outer:EP.placed>=e});
  /* flying electron */
  if(EP.fly>=0){
    var tgt=slotOf(EP.fly,sh);
    var pe=ePos(cx,cy,tgt.si,tgt.j,sh[tgt.si],1.12,CLK);
    var t=EP.ft;
    var sx=630,sy=60;
    var fx=sx+(pe.x-sx)*t,fy=sy+(pe.y-sy)*t;
    s+='<circle cx="'+fx.toFixed(1)+'" cy="'+fy.toFixed(1)+'" r="6" fill="#4C8DBF" stroke="#9CC3E8" stroke-width="2"/>';
  }
  /* shell capacity tags */
  var tags=['ep_shellK','ep_shellL','ep_shellM','ep_shellN'];
  for(var k=0;k<Math.max(sh.length, Math.min(3,e>0?3:1));k++){
    if(k>3)break;
    s+=stl(cx+SHR[k]*1.12*0.7071+8,cy-SHR[k]*1.12*0.7071-6,12,'#8FA3C4',T(tags[k]),'start');
  }

  s+=notation(520,90,EP.p+NCOMMON[EP.p-1],EP.p,el[0],38);
  var placedSh=shellsOf(Math.min(EP.placed,e));
  s+=stl(556,168,15,'#D8DEEA',T('bd_cfg'),'middle');
  s+=stl(556,196,22,'#E8C97A',placedSh.join(', ')||'—');
  if(EP.placed>=e&&e>0){
    var outer=sh[sh.length-1];

    s+=stl(556,236,14,'#D8DEEA',T('ep_outer')+'：'+outer+' '+T('ep_count'));
    if(stable)s+=stl(556,262,13,'#52B87C',T('ep_stable'));
  }

function slotOf(idx,sh){
  var k,acc=0;
  for(k=0;k<sh.length;k++){
    if(idx<acc+sh[k])return {si:k,j:idx-acc};
    acc+=sh[k];
  }
  return {si:sh.length-1,j:0};
}
function epTick(dt){
  if(!EP.run)return;
  var e=EP.p;
  if(EP.fly<0){
    if(EP.placed>=e){EP.run=false;return}
    EP.fly=EP.placed;EP.ft=0;
  }else{
    EP.ft+=dt*2.4;
    if(EP.ft>=1){EP.placed++;EP.fly=-1;EP.ft=0}
  }
}

/* ================= ③ ion transfer (multi-preset, multi-flight) ================= */
function drawTR(){
  var s=atomBG(660,470);
  var P=TRPRE[TR.pre],L=trLayout(),i;
  var n=P.cs.length;
  /* atoms — as large as the canvas allows */
  for(i=0;i<n;i++){
    var e=trEOf(i);
    s+=drawAtomSVG(L.xs[i],L.cy,P.cs[i].Z,P.cs[i].N,e,L.s,CLK,{outer:true});
  }
  /* flying electron along an arc, giver → taker */
  if(TR.st==='fly'){
    var f=P.fl[TR.k];
    var og=SHR[Math.max(shellsOf(trEOf(f[0])).length,1)-0]*0; /* not used */
    var xg=L.xs[f[0]],xt=L.xs[f[1]];
    var dirg=(xt>xg)?1:-1;
    var rg=SHR[Math.max(shellsOf(P.cs[f[0]].Z).length-1,0)]*L.s;
    var rt=SHR[Math.max(shellsOf(P.cs[f[1]].Z).length-1,0)]*L.s;
    var p0x=xg+dirg*rg*0.72, p0y=L.cy-rg*0.7;
    var p1x=xt-dirg*rt*0.72, p1y=L.cy-rt*0.7;
    var t=TR.t;
    var fx=p0x+(p1x-p0x)*t, fy=p0y+(p1y-p0y)*t-64*Math.sin(t*3.1416);
    s+='<circle cx="'+fx.toFixed(1)+'" cy="'+fy.toFixed(1)+'" r="7" fill="#4C8DBF" stroke="#F2C94C" stroke-width="2.5"/>';
  }
  /* labels: symbol becomes ion notation as charge appears */
  for(i=0;i<n;i++){
    var sym=elemOf(P.cs[i].Z)[0];
    var ch=P.cs[i].Z-trEOf(i);
    s+=stl(L.xs[i],50,22,'#F1F4F9',ionTxt(sym,ch));
    s+=stl(L.xs[i],76,13,'#8FA3C4',shellsOf(trEOf(i)).join(', '));
  }
  if(TR.st==='done'){
    for(i=0;i<n;i++)s+=stl(L.xs[i],404,13,'#52B87C',T('tr_stable'));
    /* attraction arrows in every gap between adjacent atoms */
    for(i=0;i<n-1;i++){
      var mx=(L.xs[i]+L.xs[i+1])/2;
      var chL=P.cs[i].Z-trEOf(i);
      var colL=(chL>0)?'#E8934C':'#7FB2E0', colR=(chL>0)?'#7FB2E0':'#E8934C';
      s+='<path d="M '+(mx-58)+' '+L.cy+' l 40 0 m -10 -7 l 10 7 l -10 7" stroke="'+colL+'" stroke-width="3" fill="none"/>';
      s+='<path d="M '+(mx+58)+' '+L.cy+' l -40 0 m 10 -7 l -10 7 l 10 7" stroke="'+colR+'" stroke-width="3" fill="none"/>';
      s+=stl(mx,L.cy-24,14,'#E8C97A','+ \u21C4 \u2212');
    }
    var bal=T('tr_bal_'+P.k);
    if(bal!=='tr_bal_'+P.k)s+=stl(330,420,12,'#8FA3C4',bal);
    s+='<rect x="90" y="428" width="480" height="34" rx="10" fill="#151F33" stroke="#DA9526" stroke-width="2"/>';
    s+=stl(330,450,15,'#E8C97A',T('tr_ban_'+P.k));
  }else{
    s+=stl(330,446,13,'#7C8AA4',T('tr_before'));
  }
  $('svgtr').innerHTML=s;
  $('qb2').innerHTML='<span class="qtag">'+T('qtag')+'</span>'+T('trqb_'+P.k);
}
function trTick(dt){

}

var QZi=0,QZpick=[],QZdone=[],QZfirst=[];
function drawQZ(){buildQuiz()}
function qzHead(){
  var data=QZdata(),N=data.length,nf=0,k;
  for(k=0;k<N;k++)if(QZfirst[k]===true)nf++;
  $('qzprog').textContent=(LANG==='en'?'Q ':'第 ')+Math.min(QZi+1,N)+' / '+N+(LANG==='en'?'':' 题');
  $('qzscore').textContent=(LANG==='en'?'first try ':'一次答对 ')+nf+' / '+N;
  return nf;
}
function buildQuiz(){
  var data=QZdata(),h='',k,j,N=data.length;
  var nf=qzHead();
  if(QZi>=N){
    $('quiz').innerHTML='<div class="q"><div class="qt">'+(LANG==='en'?'🎉 Done! First-try score: ':'🎉 全部完成！一次答对：')+nf+' / '+N+'</div></div>';
    return;
  }
  var d=data[QZi];
  h+='<div class="q"><div class="qt">'+d.q+'</div>';
  for(j=0;j<d.o.length;j++){
    h+='<button class="opt" data-o="'+j+'">'+String.fromCharCode(65+j)+'. '+d.o[j][0]+'</button>';
    h+='<div class="fb" id="fbq_'+j+'">'+d.o[j][2]+'</div>';
  }
  h+='</div>';
  h+='<button class="dbtn" id="qznext" style="display:none">'+(QZi===N-1?(LANG==='en'?'Finish ✔':'完成 ✔'):(LANG==='en'?'Next ▶':'下一题 ▶'))+'</button>';
  $('quiz').innerHTML=h;
  var ops=document.querySelectorAll('#quiz .opt');
  for(k=0;k<ops.length;k++){
    ops[k].addEventListener('click',function(){
      if(QZdone[QZi])return;
      pickQ(+this.getAttribute('data-o'));
    });
  }
  var nb=$('qznext');
  if(nb)nb.addEventListener('click',function(){QZi++;buildQuiz();updSummary()});
  if(QZpick[QZi]!==undefined)restoreQ();
}
function pickQ(oi){
  var data=QZdata(),d=data[QZi];
  QZpick[QZi]=oi;
  if(QZfirst[QZi]===undefined)QZfirst[QZi]=(d.o[oi][1]===1);
  if(d.o[oi][1]===1)QZdone[QZi]=true;
  restoreQ();
  qzHead();
}
function restoreQ(){
  var data=QZdata(),d=data[QZi],j;
  var ops=document.querySelectorAll('#quiz .opt');
  var oi=QZpick[QZi];
  for(j=0;j<ops.length;j++){
    ops[j].classList.remove('ok');ops[j].classList.remove('bad');
    var f=$('fbq_'+j);if(f)f.classList.remove('show');
  }
  if(oi===undefined||!ops[oi])return;
  var right=d.o[oi][1]===1;
  ops[oi].classList.add(right?'ok':'bad');
  var fb=$('fbq_'+oi);if(fb)fb.classList.add('show');
  var nb=$('qznext');
  if(nb)nb.style.display=QZdone[QZi]?'':'none';
}

/* ================= boot ================= */
function setLang(l){
  LANG=l;
  $('langbtn').textContent=(l==='zh')?'EN':'中';
  document.documentElement.setAttribute('lang',l==='zh'?'zh':'en');
  applyI18n();
  buildQuiz();
  RENDER[CUR](); updSummary();
}
var AMB=0;
function ambLoop(){
  CLK+=0.016;
  if(CUR===0){ drawBD(); }
  else if(CUR===1){ epTick(0.016); drawEP(); }
  else if(CUR===2){ trTick(0.016); drawTR(); }
  else if(CUR===3){ drawISO(); }
  updSummary();
  AMB=requestAnimationFrame(ambLoop);
}
function bdSlider(id,key,lab){
  $(id).addEventListener('input',function(){
    BD[key]=+this.value;
    $(lab).textContent=this.value;
    drawBD();updSummary();
  });
}
var PRESETS=[[1,0,1],[2,2,2],[6,6,6],[8,8,8],[11,12,10],[17,18,18]];
function setBD(p,n,e){
  BD.p=p;BD.n=n;BD.e=e;
  $('bdp').value=p;$('bdn').value=n;$('bde').value=e;
  $('bdplab').textContent=p;$('bdnlab').textContent=n;$('bdelab').textContent=e;
  drawBD();updSummary();
}
function boot(){
  RENDER=[drawBD,drawEP,drawTR,drawISO,drawQZ];
  SUMMARY=[
    function(){var el=elemOf(BD.p);return el[0]+' · p'+BD.p+' n'+BD.n+' e'+BD.e},
    function(){return elemOf(EP.p)[0]+' · '+EP.placed+'/'+EP.p},
    function(){return TRPRE[TR.pre].f2+(TR.st==='done'?' ✓':'')},
    function(){return T('iso_figtitle')},
    function(){return T('qz_title')+' '+$('qzscore').textContent}
  ];
  initTabs(); initBD(); initEP(); initTR();
  /* --- ① --- */
  bdSlider('bdp','p','bdplab');
  bdSlider('bdn','n','bdnlab');
  bdSlider('bde','e','bdelab');
  var k;
  for(k=0;k<6;k++)(function(i){
    $('pr'+i).addEventListener('click',function(){
      setBD(PRESETS[i][0],PRESETS[i][1],PRESETS[i][2]);
    });
  })(k);
  $('bdreset').addEventListener('click',function(){setBD(6,6,6)});
  /* --- ② --- */
  $('epp').addEventListener('input',function(){
    EP.p=+this.value;$('epplab').textContent=EP.p+' · '+elemOf(EP.p)[0];
    initEP();drawEP();updSummary();
  });
  $('epfill').addEventListener('click',function(){
    if(EP.placed>=EP.p)initEP();
    EP.run=true;
  });
  $('epreset').addEventListener('click',function(){initEP();drawEP();updSummary()});
  /* --- ③ --- */
  $('trgo').addEventListener('click',function(){
    if(TR.st==='idle'){TR.st='fly';TR.t=0;TR.k=0}
  });
  $('trreset').addEventListener('click',function(){initTR();drawTR();updSummary()});
  var tk;
  for(tk=0;tk<4;tk++)(function(i){
    $('trp'+i).addEventListener('click',function(){
      TR.pre=i;initTR();
      var j;for(j=0;j<4;j++)$('trp'+j).classList.toggle('on',j===i);
      drawTR();updSummary();
    });
  })(tk);
  /* --- ④ --- */
  $('famH').addEventListener('click',function(){ISO.fam='H';this.classList.add('on');$('famC').classList.remove('on');drawISO()});
  $('famC').addEventListener('click',function(){ISO.fam='C';this.classList.add('on');$('famH').classList.remove('on');drawISO()});
  /* --- chrome --- */
  $('qzreset').addEventListener('click',function(){QZpick=[];QZdone=[];QZfirst=[];QZi=0;buildQuiz();updSummary()});
  $('langbtn').addEventListener('click',function(){setLang(LANG==='zh'?'en':'zh')});
  $('thmbtn').addEventListener('click',function(){
    DARK=!DARK;
    if(document.body)document.body.classList.toggle('dark',DARK);
    this.textContent=DARK?'☀️':'🌙';
    RENDER[CUR]();updSummary();
  });
  initExp();
  applyI18n();
  buildQuiz();
  showTab(0);
  AMB=requestAnimationFrame(ambLoop);
}

function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function frac(x){return x-Math.floor(x)}
function rnd(k,s){return frac(Math.sin(k*127.1+s*311.7)*43758.5453)}
function lum(hex){
  if(hex[0]!=='#')return 0.5;
  var r=parseInt(hex.substr(1,2),16)/255,g=parseInt(hex.substr(3,2),16)/255,b=parseInt(hex.substr(5,2),16)/255;
  return 0.299*r+0.587*g+0.114*b;
}
var DARK=false;
var THMAP={'#FBF7EC':'#1A2130','#FFFDF7':'#1E2637','#F3EDDD':'#2A3348','#FFFFFF':'#2E3850',
'#26221B':'#EDE7D6','#4B4437':'#D2CCBC','#6B6252':'#5A605D','#8A8070':'#9AA2B4','#B9AE95':'#66708A',
'#E3DCCB':'#39435C','#D8D0BC':'#39435C','#E8E2D4':'#39415A','#9A938A':'#8F97A8','#6B655C':'#B8BECE',
'#2C7D8C':'#5FC8DE','#B5652A':'#E0904E','#8A5A2B':'#C98F52','#2F7D4F':'#52B87C'};
function THX(c){return (DARK&&THMAP[c])?THMAP[c]:c}
function PAINT(str){
  if(!DARK)return str;
  return str.replace(/(fill|stroke)="(#[0-9A-Fa-f]{6})"/g,function(m,a,c){
    var mm=THMAP[c.toUpperCase()];
    return mm?(a+'="'+mm+'"'):m;
  });
}
function tl(x,y,size,fill,txt,anchor,weight){

  return '<text x="'+Math.round(x)+'" y="'+Math.round(y)+'" font-size="'+Math.round(size)+
   '" font-weight="'+(weight||700)+'" fill="'+fill+'" text-anchor="'+(anchor||'middle')+
   '" style="paint-order:stroke;stroke:'+halo+';stroke-width:3px;stroke-linejoin:round">'+txt+'</text>';
}
function tlplain(x,y,size,fill,txt,anchor,weight){

   '" font-weight="'+(weight||700)+'" fill="'+fill+'" text-anchor="'+(anchor||'middle')+'">'+txt+'</text>';

function stl(x,y,size,fill,txt,anchor){

/* ================= atom model ================= */
var ELEM=[
 ['H','氢','Hydrogen'],['He','氦','Helium'],['Li','锂','Lithium'],['Be','铍','Beryllium'],
 ['B','硼','Boron'],['C','碳','Carbon'],['N','氮','Nitrogen'],['O','氧','Oxygen'],
 ['F','氟','Fluorine'],['Ne','氖','Neon'],['Na','钠','Sodium'],['Mg','镁','Magnesium'],
 ['Al','铝','Aluminium'],['Si','硅','Silicon'],['P','磷','Phosphorus'],['S','硫','Sulfur'],
 ['Cl','氯','Chlorine'],['Ar','氩','Argon'],['K','钾','Potassium'],['Ca','钙','Calcium']
];
/* most common neutron count for Z=1..20 */
var NCOMMON=[0,2,4,5,6,6,7,8,10,10,12,12,14,14,16,16,18,22,20,20];
var SHCAP=[2,8,8,2];
var SHR=[46,76,106,132];
function shellsOf(e){
  var out=[],k,left=e;
  for(k=0;k<SHCAP.length&&left>0;k++){
    var take=Math.min(SHCAP[k],left);
    out.push(take);left-=take;
  }
  return out;
}
function chargeOf(p,e){return p-e}
var SUPD={'0':'\u2070','1':'\u00B9','2':'\u00B2','3':'\u00B3','4':'\u2074','5':'\u2075','6':'\u2076','7':'\u2077','8':'\u2078','9':'\u2079'};
function ionTxt(sym,ch){
  var m=Math.abs(ch);
  if(m===0)return sym;
  var d=(m===1)?'':String(m).replace(/[0-9]/g,function(c){return SUPD[c]});
  return sym+d+(ch>0?'\u207A':'\u207B');
}
function elemOf(p){return ELEM[p-1]}
/* electron position: shell si, index j of nj, animated by CLK */
function ePos(cx,cy,si,j,nj,scale,clk){
  var w=(0.9-0.16*si);           /* inner shells whirl faster */
  var a=clk*w+j*6.28318/nj+si*0.7;
  var R=SHR[si]*scale;
  return {x:cx+R*Math.cos(a),y:cy-R*Math.sin(a)};
}
/* nucleon packing: golden-angle spiral, protons/neutrons interleaved */
function nucPos(cx,cy,k,total,scale){
  var r=(total<=1)?0:(4.6*Math.sqrt(k)*scale);
  var a=k*2.39996;
  return {x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)};
}
function nucR(total,scale){return (total<=1)?7*scale:(4.6*Math.sqrt(total)*scale+7*scale)}

/* ionic-compound presets: cs=atoms, fl=electron flights [from,to] */
var TRPRE=[
 {k:'nacl', cs:[{Z:11,N:12},{Z:17,N:18}],            fl:[[0,1]],        f2:'NaCl',  nz:'\u6c2f\u5316\u94a0', ne:'sodium chloride'},
 {k:'mgo',  cs:[{Z:12,N:12},{Z:8,N:8}],              fl:[[0,1],[0,1]],  f2:'MgO',   nz:'\u6c27\u5316\u9541', ne:'magnesium oxide'},
 {k:'mgcl2',cs:[{Z:17,N:18},{Z:12,N:12},{Z:17,N:18}],fl:[[1,0],[1,2]],  f2:'MgCl\u2082', nz:'\u6c2f\u5316\u9541', ne:'magnesium chloride'},
 {k:'na2o', cs:[{Z:11,N:12},{Z:8,N:8},{Z:11,N:12}],  fl:[[0,1],[2,1]],  f2:'Na\u2082O',  nz:'\u6c27\u5316\u94a0', ne:'sodium oxide'}
];
var TR={pre:0,st:'idle',t:0,k:0};   /* idle | fly | done; k = active flight */
function trEOf(i){
  var P=TRPRE[TR.pre],given=0,taken=0,j;
  var upto=(TR.st==='done')?P.fl.length:((TR.st==='fly')?TR.k:0);
  for(j=0;j<P.fl.length;j++){
    if(P.fl[j][0]===i && (j<upto || (TR.st==='fly'&&j===TR.k)))given++;   /* departed leaves giver */
    if(P.fl[j][1]===i && j<upto)taken++;                                   /* only landed counts */
  }
  return P.cs[i].Z-given+taken;
}
function trLayout(){
  var n=TRPRE[TR.pre].cs.length;
  if(n===2)return {xs:[170,490],cy:245,s:1.24};
  return {xs:[110,330,550],cy:245,s:0.86};
}

function initEP(){EP.placed=0;EP.fly=-1;EP.ft=0;EP.run=false}
function initTR(){TR.st='idle';TR.t=0;TR.k=0}

/* ================= shared atom renderer ================= */
function atomBG(w,h){
  return '<rect x="0" y="0" width="'+w+'" height="'+h+'" rx="14" fill="#0E1626"/>';
}
function drawAtomSVG(cx,cy,p,n,e,scale,clk,opts){
  opts=opts||{};
  var s='',k;
  var sh=shellsOf(e);
  /* shells */
  for(k=0;k<sh.length;k++){
    var hot=(opts.outer&&k===sh.length-1);
    s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(SHR[k]*scale).toFixed(1)+'" fill="none" stroke="'+(hot?'#DA9526':'#3A4A66')+'" stroke-width="'+(hot?2.5:1.5)+'" stroke-dasharray="4 6"/>';
  }
  /* nucleus: interleave p red / n grey deterministically */
  var tot=p+n;
  var seq=[];
  var pi=0,ni=0;
  for(k=0;k<tot;k++){
    var wantP=(pi/Math.max(p,1))<=(ni/Math.max(n,1));
    if(pi>=p)wantP=false;
    if(ni>=n)wantP=true;
    seq.push(wantP?'p':'n');
    if(wantP)pi++;else ni++;
  }
  for(k=0;k<tot;k++){
    var q=nucPos(cx,cy,k,tot,scale);
    var jx=(rnd(k,31)-0.5)*1.6*Math.sin(clk*3+k),jy=(rnd(k,37)-0.5)*1.6*Math.cos(clk*3+k*2);
    var col=(seq[k]==='p')?'#D9542B':'#8F96A4';
    s+='<circle cx="'+(q.x+jx).toFixed(1)+'" cy="'+(q.y+jy).toFixed(1)+'" r="'+(6*scale).toFixed(1)+'" fill="'+col+'" stroke="#0E1626" stroke-width="1"/>';
    if(seq[k]==='p'&&scale>=0.55)s+=stl(q.x+jx,q.y+jy+4*scale,Math.max(10,11*scale),'#FFE3D6','+');
  }
  /* electrons */
  var placedCap=(opts.maxPlaced===undefined)?e:opts.maxPlaced;
  var idx=0;
  for(k=0;k<sh.length;k++){
    var nj=sh[k];
    for(var j=0;j<nj;j++){
      if(idx>=placedCap)break;
      var pe=ePos(cx,cy,k,j,nj,scale,clk);
      s+='<circle cx="'+pe.x.toFixed(1)+'" cy="'+pe.y.toFixed(1)+'" r="'+(5*scale).toFixed(1)+'" fill="#4C8DBF" stroke="#9CC3E8" stroke-width="1.5"/>';
      if(scale>=0.55)s+=stl(pe.x,pe.y+4*scale,Math.max(10,11*scale),'#DDEBFA','−');
      idx++;
    }
  }
  return s;
}
/* isotope notation  A over Z, then symbol */
function notation(cx,cy,A,Z,sym,size){
  var s='';
  s+=stl(cx-size*0.42,cy-size*0.34,Math.round(size*0.52),'#E8C97A',A,'end');
  s+=stl(cx-size*0.42,cy+size*0.42,Math.round(size*0.52),'#9CC3E8',Z,'end');
  s+=stl(cx,cy+size*0.18,size,'#F1F4F9',sym,'start');
  return s;
}

/* ================= ② electron filling ================= */
function drawEP(){
  var s=atomBG(660,470);
  var cx=250,cy=225;
  var e=EP.p;
  var sh=shellsOf(e);
  s+=drawAtomSVG(cx,cy,EP.p,NCOMMON[EP.p-1],e,1.12,CLK,{maxPlaced:EP.placed,outer:EP.placed>=e});
  /* flying electron */
  if(EP.fly>=0){
    var tgt=slotOf(EP.fly,sh);
    var pe=ePos(cx,cy,tgt.si,tgt.j,sh[tgt.si],1.12,CLK);
    var t=EP.ft;
    var sx=630,sy=60;
    var fx=sx+(pe.x-sx)*t,fy=sy+(pe.y-sy)*t;
    s+='<circle cx="'+fx.toFixed(1)+'" cy="'+fy.toFixed(1)+'" r="6" fill="#4C8DBF" stroke="#9CC3E8" stroke-width="2"/>';
  }
  /* shell capacity tags */
  var tags=['ep_shellK','ep_shellL','ep_shellM','ep_shellN'];
  for(var k=0;k<Math.max(sh.length, Math.min(3,e>0?3:1));k++){
    if(k>3)break;
    s+=stl(cx+SHR[k]*1.12*0.7071+8,cy-SHR[k]*1.12*0.7071-6,12,'#8FA3C4',T(tags[k]),'start');
  }
  /* right panel: config + outer shell */
  var el=elemOf(EP.p);
  s+='<rect x="472" y="40" width="168" height="96" rx="12" fill="#151F33" stroke="#3A4A66" stroke-width="1.5"/>';
  s+=notation(520,90,EP.p+NCOMMON[EP.p-1],EP.p,el[0],38);
  var placedSh=shellsOf(Math.min(EP.placed,e));
  s+=stl(556,168,15,'#D8DEEA',T('bd_cfg'),'middle');
  s+=stl(556,196,22,'#E8C97A',placedSh.join(', ')||'—');
  if(EP.placed>=e&&e>0){
    var outer=sh[sh.length-1];
    var stable=(sh.length===1&&outer===2)||(outer===8);
    s+=stl(556,236,14,'#D8DEEA',T('ep_outer')+'：'+outer+' '+T('ep_count'));
    if(stable)s+=stl(556,262,13,'#52B87C',T('ep_stable'));
  }
  s+=stl(556,300,13,'#8FA3C4',EP.placed+' / '+e);
  $('svgep').innerHTML=s;
  $('qb1').innerHTML='<span class="qtag">'+T('qtag')+'</span>'+T('epqb');
}
function slotOf(idx,sh){
  var k,acc=0;
  for(k=0;k<sh.length;k++){
    if(idx<acc+sh[k])return {si:k,j:idx-acc};
    acc+=sh[k];
  }
  return {si:sh.length-1,j:0};
}
function epTick(dt){
  if(!EP.run)return;
  var e=EP.p;
  if(EP.fly<0){
    if(EP.placed>=e){EP.run=false;return}
    EP.fly=EP.placed;EP.ft=0;
  }else{
    EP.ft+=dt*2.4;
    if(EP.ft>=1){EP.placed++;EP.fly=-1;EP.ft=0}
  }
}

/* ================= ③ ion transfer (multi-preset, multi-flight) ================= */
function drawTR(){
  var s=atomBG(660,470);
  var P=TRPRE[TR.pre],L=trLayout(),i;
  var n=P.cs.length;
  /* atoms — as large as the canvas allows */
  for(i=0;i<n;i++){
    var e=trEOf(i);
    s+=drawAtomSVG(L.xs[i],L.cy,P.cs[i].Z,P.cs[i].N,e,L.s,CLK,{outer:true});
  }
  /* flying electron along an arc, giver → taker */
  if(TR.st==='fly'){
    var f=P.fl[TR.k];
    var og=SHR[Math.max(shellsOf(trEOf(f[0])).length,1)-0]*0; /* not used */
    var xg=L.xs[f[0]],xt=L.xs[f[1]];
    var dirg=(xt>xg)?1:-1;
    var rg=SHR[Math.max(shellsOf(P.cs[f[0]].Z).length-1,0)]*L.s;
    var rt=SHR[Math.max(shellsOf(P.cs[f[1]].Z).length-1,0)]*L.s;
    var p0x=xg+dirg*rg*0.72, p0y=L.cy-rg*0.7;
    var p1x=xt-dirg*rt*0.72, p1y=L.cy-rt*0.7;
    var t=TR.t;
    var fx=p0x+(p1x-p0x)*t, fy=p0y+(p1y-p0y)*t-64*Math.sin(t*3.1416);
    s+='<circle cx="'+fx.toFixed(1)+'" cy="'+fy.toFixed(1)+'" r="7" fill="#4C8DBF" stroke="#F2C94C" stroke-width="2.5"/>';
  }
  /* labels: symbol becomes ion notation as charge appears */
  for(i=0;i<n;i++){
    var sym=elemOf(P.cs[i].Z)[0];
    var ch=P.cs[i].Z-trEOf(i);
    s+=stl(L.xs[i],50,22,'#F1F4F9',ionTxt(sym,ch));
    s+=stl(L.xs[i],76,13,'#8FA3C4',shellsOf(trEOf(i)).join(', '));
  }
  if(TR.st==='done'){
    for(i=0;i<n;i++)s+=stl(L.xs[i],404,13,'#52B87C',T('tr_stable'));
    /* attraction arrows in every gap between adjacent atoms */
    for(i=0;i<n-1;i++){
      var mx=(L.xs[i]+L.xs[i+1])/2;
      var chL=P.cs[i].Z-trEOf(i);
      var colL=(chL>0)?'#E8934C':'#7FB2E0', colR=(chL>0)?'#7FB2E0':'#E8934C';
      s+='<path d="M '+(mx-58)+' '+L.cy+' l 40 0 m -10 -7 l 10 7 l -10 7" stroke="'+colL+'" stroke-width="3" fill="none"/>';
      s+='<path d="M '+(mx+58)+' '+L.cy+' l -40 0 m 10 -7 l -10 7 l 10 7" stroke="'+colR+'" stroke-width="3" fill="none"/>';
      s+=stl(mx,L.cy-24,14,'#E8C97A','+ \u21C4 \u2212');
    }
    var bal=T('tr_bal_'+P.k);
    if(bal!=='tr_bal_'+P.k)s+=stl(330,420,12,'#8FA3C4',bal);
    s+='<rect x="90" y="428" width="480" height="34" rx="10" fill="#151F33" stroke="#DA9526" stroke-width="2"/>';
    s+=stl(330,450,15,'#E8C97A',T('tr_ban_'+P.k));
  }else{
    s+=stl(330,446,13,'#7C8AA4',T('tr_before'));
  }
  $('svgtr').innerHTML=s;
  $('qb2').innerHTML='<span class="qtag">'+T('qtag')+'</span>'+T('trqb_'+P.k);
}
function trTick(dt){
  if(TR.st==='fly'){
    TR.t+=dt*1.1;
    if(TR.t>=1){
      TR.k++;TR.t=0;
      if(TR.k>=TRPRE[TR.pre].fl.length){TR.st='done';TR.k=TRPRE[TR.pre].fl.length}
    }
  }
}

/* ================= ④ isotopes ================= */
function drawISO(){
  var s=atomBG(660,400);
  var fam=(ISO.fam==='H');
  var Z=fam?1:6;
  var ns=fam?[0,1,2]:[6,7,8];
  var names=T(fam?'iso_hn':'iso_cn');
  var sym=fam?'H':'C';
  var xs=[128,330,532];
  for(var k=0;k<3;k++){
    var A=Z+ns[k];
    s+=drawAtomSVG(xs[k],188,Z,ns[k],Z,0.52,CLK,{});
    s+='<rect x="'+(xs[k]-64)+'" y="34" width="128" height="52" rx="10" fill="#151F33" stroke="#3A4A66" stroke-width="1.5"/>';
    s+=notation(xs[k]-8,62,A,Z,sym,26);
    s+=stl(xs[k],306,14,'#D8DEEA',names[k]);
    s+=stl(xs[k],330,12,'#FF9F7E',T('dk_p')+' '+Z+' · '+T('dk_n')+' '+ns[k]);
  }
  s+=stl(330,368,14,'#52B87C',T('iso_same'));
  s+=stl(330,390,14,'#E8934C',T('iso_diff'));
  $('svgiso').innerHTML=s;
}

   {q:'3. 原子整体不带电（电中性），是因为……',o:[

    ['最外层已经排满（8个，氦是2个）',1,'正确——稳定结构既不想得电子也不想失电子。'],
    ['它们没有电子',0,'它们有电子，只是排成了"满员"的稳定结构。'],
    ['原子核不带电',0,'它们的原子核和别人一样带正电。'],

var QZi=0,QZpick=[],QZdone=[],QZfirst=[];
function drawQZ(){buildQuiz()}
function qzHead(){
  var data=QZdata(),N=data.length,nf=0,k;
  for(k=0;k<N;k++)if(QZfirst[k]===true)nf++;
  $('qzprog').textContent=(LANG==='en'?'Q ':'第 ')+Math.min(QZi+1,N)+' / '+N+(LANG==='en'?'':' 题');
  $('qzscore').textContent=(LANG==='en'?'first try ':'一次答对 ')+nf+' / '+N;
  return nf;
}
function buildQuiz(){
  var data=QZdata(),h='',k,j,N=data.length;
  var nf=qzHead();
  if(QZi>=N){
    $('quiz').innerHTML='<div class="q"><div class="qt">'+(LANG==='en'?'🎉 Done! First-try score: ':'🎉 全部完成！一次答对：')+nf+' / '+N+'</div></div>';
    return;
  }
  var d=data[QZi];
  h+='<div class="q"><div class="qt">'+d.q+'</div>';
  for(j=0;j<d.o.length;j++){
    h+='<button class="opt" data-o="'+j+'">'+String.fromCharCode(65+j)+'. '+d.o[j][0]+'</button>';
    h+='<div class="fb" id="fbq_'+j+'">'+d.o[j][2]+'</div>';
  }
  h+='</div>';
  h+='<button class="dbtn" id="qznext" style="display:none">'+(QZi===N-1?(LANG==='en'?'Finish ✔':'完成 ✔'):(LANG==='en'?'Next ▶':'下一题 ▶'))+'</button>';
  $('quiz').innerHTML=h;
  var ops=document.querySelectorAll('#quiz .opt');
  for(k=0;k<ops.length;k++){
    ops[k].addEventListener('click',function(){
      if(QZdone[QZi])return;
      pickQ(+this.getAttribute('data-o'));
    });
  }
  var nb=$('qznext');
  if(nb)nb.addEventListener('click',function(){QZi++;buildQuiz();updSummary()});
  if(QZpick[QZi]!==undefined)restoreQ();
}
function pickQ(oi){
  var data=QZdata(),d=data[QZi];
  QZpick[QZi]=oi;
  if(QZfirst[QZi]===undefined)QZfirst[QZi]=(d.o[oi][1]===1);
  if(d.o[oi][1]===1)QZdone[QZi]=true;
  restoreQ();
  qzHead();
}
function restoreQ(){
  var data=QZdata(),d=data[QZi],j;
  var ops=document.querySelectorAll('#quiz .opt');
  var oi=QZpick[QZi];
  for(j=0;j<ops.length;j++){
    ops[j].classList.remove('ok');ops[j].classList.remove('bad');
    var f=$('fbq_'+j);if(f)f.classList.remove('show');
  }
  if(oi===undefined||!ops[oi])return;
  var right=d.o[oi][1]===1;
  ops[oi].classList.add(right?'ok':'bad');
  var fb=$('fbq_'+oi);if(fb)fb.classList.add('show');
  var nb=$('qznext');
  if(nb)nb.style.display=QZdone[QZi]?'':'none';
}

/* ================= boot ================= */
function setLang(l){
  LANG=l;
  $('langbtn').textContent=(l==='zh')?'EN':'中';
  document.documentElement.setAttribute('lang',l==='zh'?'zh':'en');
  applyI18n();
  buildQuiz();
  RENDER[CUR](); updSummary();
}
var AMB=0;
function ambLoop(){
  CLK+=0.016;
  if(CUR===0){ drawBD(); }
  else if(CUR===1){ epTick(0.016); drawEP(); }
  else if(CUR===2){ trTick(0.016); drawTR(); }
  else if(CUR===3){ drawISO(); }
  updSummary();
  AMB=requestAnimationFrame(ambLoop);
}
function bdSlider(id,key,lab){
  $(id).addEventListener('input',function(){
    BD[key]=+this.value;
    $(lab).textContent=this.value;
    drawBD();updSummary();
  });
}
var PRESETS=[[1,0,1],[2,2,2],[6,6,6],[8,8,8],[11,12,10],[17,18,18]];
function setBD(p,n,e){
  BD.p=p;BD.n=n;BD.e=e;
  $('bdp').value=p;$('bdn').value=n;$('bde').value=e;
  $('bdplab').textContent=p;$('bdnlab').textContent=n;$('bdelab').textContent=e;
  drawBD();updSummary();
}
function boot(){
  RENDER=[drawBD,drawEP,drawTR,drawISO,drawQZ];
  SUMMARY=[
    function(){var el=elemOf(BD.p);return el[0]+' · p'+BD.p+' n'+BD.n+' e'+BD.e},
    function(){return elemOf(EP.p)[0]+' · '+EP.placed+'/'+EP.p},
    function(){return TRPRE[TR.pre].f2+(TR.st==='done'?' ✓':'')},
    function(){return T('iso_figtitle')},
    function(){return T('qz_title')+' '+$('qzscore').textContent}
  ];
  initTabs(); initBD(); initEP(); initTR();
  /* --- ① --- */
  bdSlider('bdp','p','bdplab');
  bdSlider('bdn','n','bdnlab');
  bdSlider('bde','e','bdelab');
  var k;
  for(k=0;k<6;k++)(function(i){
    $('pr'+i).addEventListener('click',function(){
      setBD(PRESETS[i][0],PRESETS[i][1],PRESETS[i][2]);
    });
  })(k);
  $('bdreset').addEventListener('click',function(){setBD(6,6,6)});
  /* --- ② --- */
  $('epp').addEventListener('input',function(){
    EP.p=+this.value;$('epplab').textContent=EP.p+' · '+elemOf(EP.p)[0];
    initEP();drawEP();updSummary();
  });
  $('epfill').addEventListener('click',function(){
    if(EP.placed>=EP.p)initEP();
    EP.run=true;
  });
  $('epreset').addEventListener('click',function(){initEP();drawEP();updSummary()});
  /* --- ③ --- */
  $('trgo').addEventListener('click',function(){
    if(TR.st==='idle'){TR.st='fly';TR.t=0;TR.k=0}
  });
  $('trreset').addEventListener('click',function(){initTR();drawTR();updSummary()});
  var tk;
  for(tk=0;tk<4;tk++)(function(i){
    $('trp'+i).addEventListener('click',function(){
      TR.pre=i;initTR();
      var j;for(j=0;j<4;j++)$('trp'+j).classList.toggle('on',j===i);
      drawTR();updSummary();
    });
  })(tk);
  /* --- ④ --- */
  $('famH').addEventListener('click',function(){ISO.fam='H';this.classList.add('on');$('famC').classList.remove('on');drawISO()});
  $('famC').addEventListener('click',function(){ISO.fam='C';this.classList.add('on');$('famH').classList.remove('on');drawISO()});
  /* --- chrome --- */
  $('qzreset').addEventListener('click',function(){QZpick=[];QZdone=[];QZfirst=[];QZi=0;buildQuiz();updSummary()});
  $('langbtn').addEventListener('click',function(){setLang(LANG==='zh'?'en':'zh')});
  $('thmbtn').addEventListener('click',function(){
    DARK=!DARK;
    if(document.body)document.body.classList.toggle('dark',DARK);
    this.textContent=DARK?'☀️':'🌙';
    RENDER[CUR]();updSummary();
  });
  initExp();
  applyI18n();
  buildQuiz();
  showTab(0);
  AMB=requestAnimationFrame(ambLoop);
}
boot();

/* test hook */
window.__test=function(){
  var i;
  for(i=0;i<TABN;i++){showTab(i)}
  showTab(0);
  setBD(1,0,1);setBD(11,12,10);setBD(17,18,18);setBD(20,20,20);
  for(i=0;i<60;i++){CLK+=0.016;if(i%20===0)drawBD()}
  setBD(6,6,6);
  showTab(1);
  EP.p=11;initEP();EP.run=true;
  for(i=0;i<900;i++){CLK+=0.016;epTick(0.016);if(i%150===0)drawEP()}
  drawEP();
  initEP();
  showTab(2);
  for(var pp=0;pp<4;pp++){
    TR.pre=pp;initTR();drawTR();
    TR.st='fly';TR.t=0;TR.k=0;
    for(i=0;i<400&&TR.st!=='done';i++){CLK+=0.016;trTick(0.016);if(i%60===0)drawTR()}
    drawTR();
  }
  TR.pre=0;initTR();
  showTab(3);
  ISO.fam='C';drawISO();ISO.fam='H';drawISO();
  showTab(4);
  for(i=0;i<8;i++){QZi=i;buildQuiz();pickQ(i%4)}
  QZi=8;buildQuiz();
  QZi=0;QZpick=[];QZdone=[];QZfirst=[];buildQuiz();
  DARK=true;for(i=0;i<TABN;i++){RENDER[i]()}
  DARK=false;
  setLang('en');for(i=0;i<TABN;i++){RENDER[i]()}
  setLang('zh');
  showTab(0);
};
