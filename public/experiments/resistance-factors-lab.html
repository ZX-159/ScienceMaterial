<script>window.LAB_SLUG='resistance-factors-lab';
'use strict';
const LAB_SLUG='resistance-factors-lab';
const SUBJECT='physics';
let LANG='zh';
let DARK=false;
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
function svgEl(svg, x, y, size, fill, txt, anchor, weight){
  const halo = (()=>{
    const hex=fill; if(!hex||hex[0]!=='#') return '#FFFEFB';
    const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    const lum=0.299*r+0.587*g+0.114*b; return lum>140?'#1C2C42':'#FFFEFB';
  })();
  return '<text x="'+Math.round(x)+'" y="'+Math.round(y)+'" font-size="'+Math.round(size)+'" font-weight="'+(weight||700)+'" fill="'+fill+'" text-anchor="'+(anchor||'middle')+'" style="paint-order:stroke;stroke:'+halo+';stroke-width:3px;stroke-linejoin:round">'+txt+'</text>';
}
function plain(x,y,size,fill,txt,anchor,w){return '<text x="'+Math.round(x)+'" y="'+Math.round(y)+'" font-size="'+Math.round(size)+'" font-weight="'+(w||600)+'" fill="'+fill+'" text-anchor="'+(anchor||'middle')+'">'+txt+'</text>';}
function svgPt(svg,ev,vw,vh){
  const r=svg.getBoundingClientRect();
  return {x:(ev.clientX-r.left)*vw/r.width, y:(ev.clientY-r.top)*vh/r.height};
}
function makeDrag(svg,vw,vh,onmove,onup){
  let down=false;
  svg.addEventListener('pointerdown',e=>{
    e.preventDefault(); down=true;
    try{svg.setPointerCapture(e.pointerId)}catch{}
    onmove(svgPt(svg,e,vw,vh),true);
  });
  svg.addEventListener('pointermove',e=>{
    if(!down) return; e.preventDefault();
    onmove(svgPt(svg,e,vw,vh),false);
  });
  const end=()=>{down=false; if(onup) onup();};
  svg.addEventListener('pointerup',end);
  svg.addEventListener('pointercancel',end);
}
let CUR=0;
const TABN=4;
const RENDER=[], SUMMARY=[];
function showTab(i){
  CUR=i;
  document.querySelectorAll('.tab').forEach((t,k)=>t.classList.toggle('on',k===i));
  for(let k=0;k<TABN;k++){
    $('p'+k).classList.toggle('on',k===i);
    $('d'+k).classList.toggle('on',k===i);
  }
  if(RENDER[i]) RENDER[i]();
  updSummary();
}
function updSummary(){ const el=$('docksum'); if(el && SUMMARY[CUR]) el.textContent=SUMMARY[CUR](); }
function initTabs(){
  document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>showTab(+t.dataset.tab)));
  $('dockfold').addEventListener('click',function(){
    const d=$('dock'); d.classList.toggle('folded');
    this.textContent=d.classList.contains('folded')?'⌃':'⌄';
    updSummary();
  });
}
function applyTheme(){
  document.body.classList.toggle('dark',DARK);
  $('thmbtn').textContent=DARK?'☀️':'🌙';
}

// === LAB SPECIFIC PHYSICS ===

let summary0, summary1;
let CMP_H=[], CMP_R=[];
let QUIZ=[];
let resetLab, getLabState, setLabState;

let L=1.0, A=1.0, rho=1.68, temp=20, material='Cu';
const MATERIALS={Cu:{rho:1.68, alpha:0.00393, name:'铜 Cu'}, Al:{rho:2.82, alpha:0.00429, name:'铝 Al'}, Fe:{rho:10, alpha:0.00651, name:'铁 Fe'}, NiCr:{rho:110, alpha:0.00017, name:'镍铬 NiCr'}};
let R=0;
function calcR(){ const m=MATERIALS[material]; const rhoT=m.rho*(1+m.alpha*(temp-20)); return rhoT*L/A; }
function updateChips(){
  R=calcR();
  const m=MATERIALS[material];
  $('qb0').innerHTML='<span class="qtag">题目</span>一根 <b>'+m.name+'</b> 导线，长 <b>'+L.toFixed(1)+' m</b>，截面 <b>'+A.toFixed(2)+' mm²</b>，温度 <b>'+temp+'°C</b>，电阻多大？如果长度加倍、截面减半，会怎样？';
  $('chips0').innerHTML='<span class="chip hl big">R = '+R.toFixed(3)+' Ω</span><span class="chip">ρ₂₀='+m.rho+'×10⁻⁸Ω·m</span><span class="chip blu">α='+m.alpha+'</span><span class="chip">L='+L.toFixed(1)+'m</span><span class="chip">A='+A.toFixed(2)+'mm²</span><span class="chip teal">T='+temp+'°C</span>';
  $('kbox0a').innerHTML='电阻公式 <b>R = ρL/A</b>。长度 ∝ R，截面 ∝ 1/R。温度升高，金属 ρ 增大：<b>ρ=ρ₀[1+α(T-20)]</b>。';
  $('kbox0b').innerHTML='材料影响：铜 1.68，铝 2.82，铁 10，镍铬 110（×10⁻⁸Ω·m）。为什么高压线用铝？轻且够导电。为什么电炉用镍铬？高电阻+耐热。';
  $('note0').textContent='拖动导线长度手柄，或调截面/温度滑块。观察 R 如何变化。类比：水管越长、越细，水流越难。';
}
function draw0(){
  const s=[];
  s.push('<rect x="0" y="0" width="660" height="460" rx="14" fill="#FFFBEB"/>');
  const cx=200, cy=180, lenPx=clamp(L*80, 40, 280);
  const thick=clamp(A*8, 4, 28);
  s.push('<rect x="'+(cx-lenPx/2)+'" y="'+(cy-thick/2)+'" width="'+lenPx+'" height="'+thick+'" rx="'+(thick/2)+'" fill="#B88A43" stroke="#8A6A1E" stroke-width="2"/>');
  s.push(plain(cx, cy-40, 12, '#8A6A1E', 'L='+L.toFixed(1)+'m  A='+A.toFixed(2)+'mm²', 'middle'));
  // circuit
  s.push('<circle cx="'+(cx-lenPx/2-30)+'" cy="'+cy+'" r="14" fill="#fff" stroke="#1C2C42" stroke-width="2"/>');
  s.push('<circle cx="'+(cx+lenPx/2+30)+'" cy="'+cy+'" r="14" fill="#fff" stroke="#1C2C42" stroke-width="2"/>');
  s.push('<path d="M '+(cx-lenPx/2-30)+' '+(cy+20)+' Q '+(cx)+' '+(cy+80)+' '+(cx+lenPx/2+30)+' '+(cy+20)+'" fill="none" stroke="#1C2C42" stroke-width="2" stroke-dasharray="6 4"/>');
  s.push(plain(cx, cy+100, 11, '#68786F', 'I = V/R  ·  V=1.5V  I='+(1.5/R).toFixed(3)+'A', 'middle'));
  // handle
  s.push('<circle cx="'+(cx+lenPx/2)+'" cy="'+cy+'" r="10" fill="#D9542B" stroke="#fff" stroke-width="2" style="cursor:ew-resize"/>');
  $('svg0').innerHTML=s.join('');
}
function draw1(){
  const s=[];
  s.push('<rect x="0" y="0" width="660" height="420" rx="14" fill="#FFFBEB"/>');
  const gx0=60, gx1=620, gy0=360, gy1=40;
  s.push('<line x1="'+gx0+'" y1="'+gy0+'" x2="'+gx1+'" y2="'+gy0+'" stroke="#1C2C42" stroke-width="2"/>');
  s.push('<line x1="'+gx0+'" y1="'+gy0+'" x2="'+gx0+'" y2="'+gy1+'" stroke="#1C2C42" stroke-width="2"/>');
  s.push(plain(gx1, gy0+18, 11, '#68786F', 'L 或 1/A 或 T', 'end'));
  s.push(plain(gx0-6, gy1, 11, '#68786F', 'R (Ω)', 'end'));
  // plot R vs L
  let path='';
  for(let i=0;i<=100;i++){
    const l=0.2+i/100*2.8;
    const m=MATERIALS[material];
    const r=m.rho*(1+m.alpha*(temp-20))*l/A;
    const x=gx0+(gx1-gx0)*i/100;
    const y=gy0-(gy0-gy1)*clamp(r/5,0,1);
    path+=(i?' L ':'M ')+x.toFixed(1)+' '+y.toFixed(1);
  }
  s.push('<path d="'+path+'" fill="none" stroke="#D9542B" stroke-width="3"/>');
  s.push(plain(320, 30, 12, '#D9542B', 'R ∝ L  (A,T 固定)', 'middle',700));
  $('svg1').innerHTML=s.join('');
  $('chips1').innerHTML='<span class="chip hl">当前 R='+R.toFixed(3)+'Ω</span><span class="chip">斜率 = ρ/A</span>';
  $('kbox1a').innerHTML='图表显示 <b>R 随 L 线性增大</b>，斜率就是 ρ/A。换更细的线，斜率更大。';
  $('kbox1b').innerHTML='温度升高，整条线向上平移，因为 ρ 随 T 增大。';
}
CMP_H=['条件','现象','规律'];
CMP_R=[
['长度 L 加倍','R 加倍','R ∝ L'],
['截面 A 加倍','R 减半','R ∝ 1/A'],
['材料 ρ 更大','R 更大','R ∝ ρ'],
['温度 T 升高(金属)','R 增大','ρ=ρ₀(1+αΔT)'],
['并联多根','总 R 减小','1/R总=Σ1/Ri']
];
QUIZ=[
{q:'1. 同材料同温，长度加倍、截面不变，电阻？',o:[['不变',0,'长度影响电阻。'],['加倍',1,'正确：R=ρL/A，L加倍则R加倍。'],['减半',0,'反了。'],['变为4倍',0,'那是长度和截面同时变。']]},
{q:'2. 为什么电炉丝用镍铬而不用铜？',o:[['铜太贵',0,'成本不是主因。'],['镍铬电阻率高且耐高温',1,'正确：110×10⁻⁸ vs 铜1.68，需要高电阻产生热。'],['铜不导电',0,'铜导电最好。'],['镍铬更轻',0,'电炉不在乎重量。']]},
{q:'3. 温度升高，金属电阻？',o:[['减小',0,'那是半导体。'],['增大',1,'正确：离子振动加剧，电子更难通过。'],['不变',0,'有温度系数α。'],['先增后减',0,'金属单调增。']]},
{q:'4. 两根同长铜线，A线截面是B线2倍，则RA？',o:[['2×RB',0,'反比。'],['½ RB',1,'正确：R∝1/A。'],['相等',0,'截面有影响。'],['4×RB',0,'不是平方。']]},
];
function bootLab(){
  const dock=$('d0');
  dock.innerHTML='<span class="dl">材料<select id="mat" class="tgl"><option value="Cu">铜 Cu</option><option value="Al">铝 Al</option><option value="Fe">铁 Fe</option><option value="NiCr">镍铬 NiCr</option></select></span>'+
  '<span class="dl">L<input type="range" id="sl" min="0.2" max="3" step="0.1" value="1"><span class="mono" id="ll">1.0m</span></span>'+
  '<span class="dl">A<input type="range" id="sa" min="0.2" max="3" step="0.1" value="1"><span class="mono" id="la">1.00mm²</span></span>'+
  '<span class="dl">T<input type="range" id="st" min="-20" max="200" step="5" value="20"><span class="mono" id="lt">20°C</span></span>'+
  '<button class="dbtn" id="reset">↺ 重置</button>';
  $('mat').addEventListener('change',e=>{material=e.target.value; updateChips(); draw0(); draw1();});
  $('sl').addEventListener('input',e=>{L=+e.target.value; $('ll').textContent=L.toFixed(1)+'m'; updateChips(); draw0(); draw1();});
  $('sa').addEventListener('input',e=>{A=+e.target.value; $('la').textContent=A.toFixed(2)+'mm²'; updateChips(); draw0(); draw1();});
  $('st').addEventListener('input',e=>{temp=+e.target.value; $('lt').textContent=temp+'°C'; updateChips(); draw0(); draw1();});
  $('reset').addEventListener('click',()=>{L=1;A=1;temp=20;material='Cu'; $('sl').value='1'; $('sa').value='1'; $('st').value='20'; $('mat').value='Cu'; $('ll').textContent='1.0m'; $('la').textContent='1.00mm²'; $('lt').textContent='20°C'; updateChips(); draw0(); draw1();});
  const svg=$('svg0');
  makeDrag(svg,660,460,(pt,isdown)=>{
    if(pt.x<80||pt.x>320) return;
    L=clamp((pt.x-80)/80*3,0.2,3);
    $('sl').value=L.toFixed(1); $('ll').textContent=L.toFixed(1)+'m';
    updateChips(); draw0(); draw1();
  });
  updateChips(); draw0(); draw1();
  summary0=()=> 'R='+R.toFixed(3)+'Ω · '+MATERIALS[material].name;
  summary1=()=> 'R∝L/A · 当前'+R.toFixed(3)+'Ω';
}
resetLab=()=>{L=1;A=1;temp=20;material='Cu'; updateChips(); draw0(); draw1();};
getLabState=()=>({L,A,temp,material});
setLabState=(s)=>{if(s.L) L=s.L; if(s.A) A=s.A; if(s.temp) temp=s.temp; if(s.material) material=s.material; updateChips(); draw0(); draw1();};


function buildCmp(){
  const H=CMP_H, R=CMP_R;
  let h='<table class="cmp"><tr>'; H.forEach(c=>h+='<th>'+c+'</th>'); h+='</tr>';
  R.forEach(row=>{h+='<tr>'; row.forEach(c=>h+='<td>'+c+'</td>'); h+='</tr>';});
  h+='</table>';
  $('cmpwrap').innerHTML=h;
}

// Quiz
let QZi=0, QZpick=[], QZdone=[], QZfirst=[];
function QZdata(){ return QUIZ; }
function qzHead(){
  const N=QZdata().length; let nf=0; for(let k=0;k<N;k++) if(QZfirst[k]===true) nf++;
  $('qzprog').textContent='第 '+(Math.min(QZi+1,N))+' / '+N+' 题';
  $('qzscore').textContent='一次答对 '+nf+' / '+N;
  return nf;
}
function buildQuiz(){
  const data=QZdata(); let h=''; const N=data.length; qzHead();
  if(QZi>=N){ $('quiz').innerHTML='<div class="q"><div class="qt">🎉 全部完成！一次答对：'+qzHead()+' / '+N+'</div></div>'; return; }
  const d=data[QZi];
  h+='<div class="q"><div class="qt">'+d.q+'</div>';
  d.o.forEach((o,j)=>{
    h+='<button class="opt" data-o="'+j+'">'+String.fromCharCode(65+j)+'. '+o[0]+'</button>';
    h+='<div class="fb" id="fbq_'+j+'">'+o[2]+'</div>';
  });
  h+='</div><button class="dbtn" id="qznext" style="display:none;margin-top:12px">'+(QZi===N-1?'完成 ✔':'下一题 ▶')+'</button>';
  $('quiz').innerHTML=h;
  document.querySelectorAll('#quiz .opt').forEach(op=>op.addEventListener('click',function(){
    if(QZdone[QZi]) return; const oi=+this.dataset.o; QZpick[QZi]=oi;
    if(QZfirst[QZi]===undefined) QZfirst[QZi]=(data[QZi].o[oi][1]===1);
    if(data[QZi].o[oi][1]===1) QZdone[QZi]=true;
    restoreQ(); qzHead();
  }));
  const nb=$('qznext'); if(nb) nb.addEventListener('click',()=>{QZi++; buildQuiz(); updSummary();});
  if(QZpick[QZi]!==undefined) restoreQ();
}
function restoreQ(){
  const data=QZdata(), d=data[QZi]; const ops=document.querySelectorAll('#quiz .opt');
  const oi=QZpick[QZi]; ops.forEach((o,j)=>{o.classList.remove('ok','bad'); const f=$('fbq_'+j); if(f) f.classList.remove('show');});
  if(oi===undefined) return; const right=d.o[oi][1]===1; ops[oi].classList.add(right?'ok':'bad'); const fb=$('fbq_'+oi); if(fb) fb.classList.add('show');
  const nb=$('qznext'); if(nb) nb.style.display=QZdone[QZi]?'':'none';
}

function boot(){
  initTabs();
  applyTheme();
  bootLab();
  buildCmp();
  buildQuiz();
  RENDER[0]=draw0; RENDER[1]=draw1; RENDER[2]=()=>{buildCmp();}; RENDER[3]=buildQuiz;
  SUMMARY[0]=()=>summary0?summary0():'实验台';
  SUMMARY[1]=()=>summary1?summary1():'图表·数据';
  SUMMARY[2]=()=>'要点·公式';

<script>
(function(){
  const setVH=()=>{ const h=window.visualViewport?window.visualViewport.height:window.innerHeight; document.documentElement.style.setProperty('--app-height', h+'px'); };
  setVH(); window.addEventListener('resize',setVH); if(window.visualViewport) window.visualViewport.addEventListener('resize',setVH);
  window.addEventListener('message',e=>{
    const d=e.data; if(!d) return;
    if(d==='reset' || d.type==='reset'){ if(window.resetLab) resetLab(); if(window.SCIENCEMATERIAL && window.SCIENCEMATERIAL.reset) window.SCIENCEMATERIAL.reset(); const ev=new Event('reset'); window.dispatchEvent(ev); }
    if(d.type==='pause'){ if(window.pauseLab) pauseLab(); }
    if(d.type==='resume'){ if(window.resumeLab) resumeLab(); }
    if(d.type==='getState' && window.getLabState){ try{ parent.postMessage({type:'state', id:window.LAB_SLUG||'lab', data:getLabState()}, '*'); }catch{} }
    if(d.type==='setState' && window.setLabState){ setLabState(d.data); }
  });
  function notifyReady(){ try{ parent.postMessage({type:'ready', id:window.LAB_SLUG||document.title||'lab'}, '*'); }catch{} }
  setTimeout(notifyReady, 400);
  window.SCIENCEMATERIAL = window.SCIENCEMATERIAL || {};
  window.SCIENCEMATERIAL.reset = window.SCIENCEMATERIAL.reset || function(){ if(window.resetLab) resetLab(); location.reload(); };
})();
</script>
