/* ================= helpers ================= */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function d2r(d){return d*Math.PI/180}
function lum(hex){
  if(hex[0]!=='#')return 0.5;
  var r=parseInt(hex.substr(1,2),16)/255,g=parseInt(hex.substr(3,2),16)/255,b=parseInt(hex.substr(5,2),16)/255;
  return 0.299*r+0.587*g+0.114*b;
}
var DARK=false;
var THMAP={'#FBF7EC':'#1A2130','#FFFDF7':'#1E2637','#F3EDDD':'#2A3348','#FFFFFF':'#2E3850',
'#26221B':'#EDE7D6','#4B4437':'#D2CCBC','#6B6252':'#5A605D','#8A8070':'#9AA2B4','#B9AE95':'#66708A',

'#2C7D8C':'#5FC8DE','#B5652A':'#E0904E','#8A5A2B':'#C98F52','#2F7D4F':'#52B87C'};
function THX(c){return (DARK&&THMAP[c])?THMAP[c]:c}
function PAINT(str){
  if(!DARK)return str;
  return str.replace(/(fill|stroke)="(#[0-9A-Fa-f]{6})"/g,function(m,a,c){
    var mm=THMAP[c.toUpperCase()];
    return mm?(a+'="'+mm+'"'):m;
  });
}
function tl(x,y,size,fill,txt,anchor,weight){
  fill=THX(fill);
  var halo=lum(fill)>0.5?'#26221B':'#FFFFFF';
  return '<text x="'+Math.round(x)+'" y="'+Math.round(y)+'" font-size="'+Math.round(size)+
   '" font-weight="'+(weight||700)+'" fill="'+fill+'" text-anchor="'+(anchor||'middle')+
   '" style="paint-order:stroke;stroke:'+halo+';stroke-width:3px;stroke-linejoin:round">'+txt+'</text>';
}
function tlplain(x,y,size,fill,txt,anchor,weight){
  fill=THX(fill);
  return '<text x="'+Math.round(x)+'" y="'+Math.round(y)+'" font-size="'+Math.round(size)+
   '" font-weight="'+(weight||700)+'" fill="'+fill+'" text-anchor="'+(anchor||'middle')+'">'+txt+'</text>';
}

  var tabs=document.querySelectorAll('.tab'),k;
  for(k=0;k<tabs.length;k++){
    tabs[k].addEventListener('click',function(){showTab(+this.getAttribute('data-tab'))});
  }
  $('dockfold').addEventListener('click',function(){
    var d=$('dock'); d.classList.toggle('folded');
    this.textContent=d.classList.contains('folded')?'⌃':'⌄';
    updSummary();
  });
}
function applyI18n(){
  var els=document.querySelectorAll('[data-i18n]'),k;
  for(k=0;k<els.length;k++)els[k].textContent=T(els[k].getAttribute('data-i18n'));
  els=document.querySelectorAll('[data-i18n-html]');
  for(k=0;k<els.length;k++){
    var tgt=(els[k].querySelector)?els[k].querySelector('.kin'):null;
    (tgt||els[k]).innerHTML=T(els[k].getAttribute('data-i18n-html'));

}
function initExp(){
  var kbs=document.querySelectorAll('.kbox'),k;
  for(k=0;k<kbs.length;k++){
    var kb=kbs[k];
    kb.classList.add('exp');
    kb.innerHTML='<button class="expbtn2" data-i18n="exp_off">💬 点我看解释</button><div class="kin">'+kb.innerHTML+'</div>';
  }
  var bs=document.querySelectorAll('.expbtn2');
  for(k=0;k<bs.length;k++){

/* ================= physics ================= */
var TR={u1:220,n1:2,n2:6,ac:true};   // n in ×100 turns
var PHI=0;                            // shared AC phase
var P0=10000, RL=4;                   // plant power (W), line resistance (Ω)
var TX={u:500,ph:0};                  // transmission voltage + line-dot phase
function trU2(u1,n1,n2,ac){ return ac ? u1*n2/n1 : 0; }
function txCalc(P,R,U){
  var Iv=P/U;
  var loss=Iv*Iv*R;
  if(loss>P)loss=P;
  return {I:Iv,loss:loss,home:P-loss,eff:(P-loss)/P};
}

function coilStrands(x0,x1,y0,y1,n,col){
  var s='',k;
  if(n<1)n=1;
  for(k=0;k<n;k++){
    var y=(n===1)?(y0+y1)/2 : y0+k*(y1-y0)/(n-1);
    s+='<line x1="'+x0+'" y1="'+y.toFixed(1)+'" x2="'+x1+'" y2="'+(y+11).toFixed(1)+'" stroke="'+col+'" stroke-width="6" stroke-linecap="round"/>';
  }
  return s;
}

function fluxAnim(s,ac){
  // flux dots shuttle along the rectangular centerline; corner arrows flip with sin(PHI)
  var C=[[271,121],[449,121],[449,359],[271,359]];
  var per=[],i,k;
  var Ltot=0;
  for(i=0;i<4;i++){
    var a=C[i],b=C[(i+1)%4];
    var l=Math.abs(b[0]-a[0])+Math.abs(b[1]-a[1]);
    per.push(l);Ltot+=l;
  }
  var sn=ac?Math.sin(PHI):0;
  var shift=ac?0.045*sn:0;
  for(k=0;k<14;k++){
    var t=((k/14+shift)%1+1)%1, d=t*Ltot, acc=0;
    for(i=0;i<4;i++){
      if(d<=acc+per[i]){
        var f=(d-acc)/per[i];
        var a2=C[i],b2=C[(i+1)%4];
        var x=a2[0]+(b2[0]-a2[0])*f, y=a2[1]+(b2[1]-a2[1])*f;
        s+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="4" fill="#2C7D8C" opacity="'+(ac?(0.35+0.55*Math.abs(sn)).toFixed(2):'0.30')+'"/>';
        break;
      }
      acc+=per[i];
    }
  }
  // corner direction arrows (flip with the half-cycle)
  if(ac){
    var dir=sn>=0?1:-1;
    var ar=[[360,121,1,0],[449,240,0,1],[360,359,-1,0],[271,240,0,-1]];
    for(k=0;k<4;k++){
      var ax=ar[k][0],ay=ar[k][1],dx=ar[k][2]*dir,dy=ar[k][3]*dir;
      s+='<path d="M '+(ax+dx*14)+' '+(ay+dy*14)+' l '+(-dx*10-dy*6)+' '+(-dy*10+dx*6)+' l '+(dy*12)+' '+(-dx*12)+' Z" fill="#2C7D8C" opacity="'+(0.35+0.55*Math.abs(sn)).toFixed(2)+'"/>';
    }
  }
  return s;
}

function ptOnPolyline(P,t){
  var L=0,segs=[],i;
  for(i=0;i<P.length-1;i++){
    var dx=P[i+1][0]-P[i][0],dy=P[i+1][1]-P[i][1];
    var l=Math.sqrt(dx*dx+dy*dy);
    segs.push(l);L+=l;
  }
  var d=clamp(t,0,1)*L,acc=0;
  for(i=0;i<segs.length;i++){
    if(d<=acc+segs[i]||i===segs.length-1){
      var f=clamp((d-acc)/segs[i],0,1);
      return {x:P[i][0]+(P[i+1][0]-P[i][0])*f, y:P[i][1]+(P[i+1][1]-P[i][1])*f};
    }
    acc+=segs[i];
  }
  return {x:P[0][0],y:P[0][1]};
}

function trMini(ox,n1v,n2v,uin,uout,titleK,appK,col){
  var s='';
  var cy=200;
  // mini core
  s+='<rect x="'+(ox+96)+'" y="'+(cy-88)+'" width="118" height="24" fill="#B9AE95" stroke="#8A8070" stroke-width="2"/>';
  s+='<rect x="'+(ox+96)+'" y="'+(cy+64)+'" width="118" height="24" fill="#B9AE95" stroke="#8A8070" stroke-width="2"/>';
  s+='<rect x="'+(ox+96)+'" y="'+(cy-88)+'" width="24" height="176" fill="#B9AE95" stroke="#8A8070" stroke-width="2"/>';
  s+='<rect x="'+(ox+190)+'" y="'+(cy-88)+'" width="24" height="176" fill="#B9AE95" stroke="#8A8070" stroke-width="2"/>';
  s+=coilStrands(ox+88,ox+128,cy-56,cy+48,n1v,'#B5652A');
  s+=coilStrands(ox+182,ox+222,cy-56,cy+48,n2v,'#8A5A2B');
  // shuttle flux dots on the mini ring
  var C=[[ox+108,cy-76],[ox+202,cy-76],[ox+202,cy+76],[ox+108,cy+76]];
  var sn=Math.sin(PHI), shift=0.045*sn, k, i;
  var per=[],Ltot=0;
  for(i=0;i<4;i++){
    var a=C[i],b=C[(i+1)%4];
    var l=Math.abs(b[0]-a[0])+Math.abs(b[1]-a[1]);
    per.push(l);Ltot+=l;
  }
  for(k=0;k<8;k++){
    var t=((k/8+shift)%1+1)%1, d=t*Ltot, acc=0;
    for(i=0;i<4;i++){
      if(d<=acc+per[i]){
        var f=(d-acc)/per[i];
        var a2=C[i],b2=C[(i+1)%4];
        s+='<circle cx="'+(a2[0]+(b2[0]-a2[0])*f).toFixed(1)+'" cy="'+(a2[1]+(b2[1]-a2[1])*f).toFixed(1)+'" r="3.2" fill="#2C7D8C" opacity="'+(0.3+0.5*Math.abs(sn)).toFixed(2)+'"/>';
        break;
      }
      acc+=per[i];
    }
  }
  // voltage bars in/out
  var hIn=clamp(uin/700,0,1)*150, hOut=clamp(uout/700,0,1)*150;
  s+='<rect x="'+(ox+18)+'" y="'+(cy+72-hIn).toFixed(0)+'" width="34" height="'+hIn.toFixed(0)+'" fill="#DA9526" opacity="0.85" rx="4"/>';
  s+='<rect x="'+(ox+258)+'" y="'+(cy+72-hOut).toFixed(0)+'" width="34" height="'+hOut.toFixed(0)+'" fill="'+col+'" opacity="0.9" rx="4"/>';
  s+=tl(ox+35,cy+94,14,'#8A6A1E',uin+' V');
  s+=tl(ox+275,cy+94,14,col,uout+' V');
  s+=tlplain(ox+35,cy+112,12,'#8A8070',T('in_'));
  s+=tlplain(ox+275,cy+112,12,'#8A8070',T('out_'));
  // arrows
  s+='<path d="M '+(ox+58)+' '+(cy)+' l 24 0 m 0 0 l -9 -7 m 9 7 l -9 7" fill="none" stroke="#8A8070" stroke-width="3"/>';
  s+='<path d="M '+(ox+222)+' '+(cy)+' l 24 0 m 0 0 l -9 -7 m 9 7 l -9 7" fill="none" stroke="#8A8070" stroke-width="3"/>';
  s+=tl(ox+155,cy-108,17,col,T(titleK));
  s+=tl(ox+155,cy+130,14,'#6B6252',T(appK));
  s+=tlplain(ox+112,cy+94,12,'#B5652A','n₁='+n1v);
  s+=tlplain(ox+200,cy+94,12,'#8A5A2B','n₂='+n2v);
  return s;
}

var QZi=0,QZpick=[],QZdone=[],QZfirst=[];
function drawQZ(){buildQuiz()}
function qzHead(){
  var data=QZdata(),N=data.length,nf=0,k;
  for(k=0;k<N;k++)if(QZfirst[k]===true)nf++;
  $('qzprog').textContent=(LANG==='en'?'Q ':'第 ')+Math.min(QZi+1,N)+' / '+N+(LANG==='en'?'':' 题');
  $('qzscore').textContent=(LANG==='en'?'first try ':'一次答对 ')+nf+' / '+N;
  return nf;
}
function buildQuiz(){
  var data=QZdata(),h='',k,j,N=data.length;
  var nf=qzHead();
  if(QZi>=N){
    $('quiz').innerHTML='<div class="q"><div class="qt">'+(LANG==='en'?'🎉 Done! First-try score: ':'🎉 全部完成！一次答对：')+nf+' / '+N+'</div></div>';
    return;
  }
  var d=data[QZi];
  h+='<div class="q"><div class="qt">'+d.q+'</div>';
  for(j=0;j<d.o.length;j++){
    h+='<button class="opt" data-o="'+j+'">'+String.fromCharCode(65+j)+'. '+d.o[j][0]+'</button>';
    h+='<div class="fb" id="fbq_'+j+'">'+d.o[j][2]+'</div>';
  }
  h+='</div>';
  h+='<button class="dbtn" id="qznext" style="display:none">'+(QZi===N-1?(LANG==='en'?'Finish ✔':'完成 ✔'):(LANG==='en'?'Next ▶':'下一题 ▶'))+'</button>';
  $('quiz').innerHTML=h;
  var ops=document.querySelectorAll('#quiz .opt');
  for(k=0;k<ops.length;k++){
    ops[k].addEventListener('click',function(){
      if(QZdone[QZi])return;
      pickQ(+this.getAttribute('data-o'));
    });
  }
  var nb=$('qznext');
  if(nb)nb.addEventListener('click',function(){QZi++;buildQuiz();updSummary()});
  if(QZpick[QZi]!==undefined)restoreQ();
}
function pickQ(oi){
  var data=QZdata(),d=data[QZi];
  QZpick[QZi]=oi;
  if(QZfirst[QZi]===undefined)QZfirst[QZi]=(d.o[oi][1]===1);
  if(d.o[oi][1]===1)QZdone[QZi]=true;
  restoreQ();
  qzHead();
}
function restoreQ(){
  var data=QZdata(),d=data[QZi],j;
  var ops=document.querySelectorAll('#quiz .opt');
  var oi=QZpick[QZi];
  for(j=0;j<ops.length;j++){
    ops[j].classList.remove('ok');ops[j].classList.remove('bad');
    var f=$('fbq_'+j);if(f)f.classList.remove('show');
  }
  if(oi===undefined||!ops[oi])return;
  var right=d.o[oi][1]===1;
  ops[oi].classList.add(right?'ok':'bad');
  var fb=$('fbq_'+oi);if(fb)fb.classList.add('show');
  var nb=$('qznext');
  if(nb)nb.style.display=QZdone[QZi]?'':'none';
}

function $(id){return document.getElementById(id)}

function lum(hex){
  if(hex[0]!=='#')return 0.5;
  var r=parseInt(hex.substr(1,2),16)/255,g=parseInt(hex.substr(3,2),16)/255,b=parseInt(hex.substr(5,2),16)/255;
  return 0.299*r+0.587*g+0.114*b;
}
var DARK=false;
var THMAP={'#FBF7EC':'#1A2130','#FFFDF7':'#1E2637','#F3EDDD':'#2A3348','#FFFFFF':'#2E3850',

  if(!DARK)return str;
  return str.replace(/(fill|stroke)="(#[0-9A-Fa-f]{6})"/g,function(m,a,c){

    return mm?(a+'="'+mm+'"'):m;

}
function tl(x,y,size,fill,txt,anchor,weight){

   '" font-weight="'+(weight||700)+'" fill="'+fill+'" text-anchor="'+(anchor||'middle')+
   '" style="paint-order:stroke;stroke:'+halo+';stroke-width:3px;stroke-linejoin:round">'+txt+'</text>';

function fluxAnim(s,ac){
  // flux dots shuttle along the rectangular centerline; corner arrows flip with sin(PHI)
  var C=[[271,121],[449,121],[449,359],[271,359]];

  var Ltot=0;

  }
  var sn=ac?Math.sin(PHI):0;
  var shift=ac?0.045*sn:0;
  for(k=0;k<14;k++){

        break;

  if(ac){

}

function ptOnPolyline(P,t){
  var L=0,segs=[],i;
  for(i=0;i<P.length-1;i++){
    var dx=P[i+1][0]-P[i][0],dy=P[i+1][1]-P[i][1];
    var l=Math.sqrt(dx*dx+dy*dy);
    segs.push(l);L+=l;
  }
  var d=clamp(t,0,1)*L,acc=0;
  for(i=0;i<segs.length;i++){
    if(d<=acc+segs[i]||i===segs.length-1){
      var f=clamp((d-acc)/segs[i],0,1);
      return {x:P[i][0]+(P[i+1][0]-P[i][0])*f, y:P[i][1]+(P[i+1][1]-P[i][1])*f};
    }
    acc+=segs[i];
  }
  return {x:P[0][0],y:P[0][1]};
}

var QZi=0,QZpick=[],QZdone=[],QZfirst=[];
function drawQZ(){buildQuiz()}
function qzHead(){
  var data=QZdata(),N=data.length,nf=0,k;
  for(k=0;k<N;k++)if(QZfirst[k]===true)nf++;
  $('qzprog').textContent=(LANG==='en'?'Q ':'第 ')+Math.min(QZi+1,N)+' / '+N+(LANG==='en'?'':' 题');
  $('qzscore').textContent=(LANG==='en'?'first try ':'一次答对 ')+nf+' / '+N;
  return nf;
}
function buildQuiz(){
  var data=QZdata(),h='',k,j,N=data.length;
  var nf=qzHead();
  if(QZi>=N){
    $('quiz').innerHTML='<div class="q"><div class="qt">'+(LANG==='en'?'🎉 Done! First-try score: ':'🎉 全部完成！一次答对：')+nf+' / '+N+'</div></div>';
    return;
  }
  var d=data[QZi];
  h+='<div class="q"><div class="qt">'+d.q+'</div>';
  for(j=0;j<d.o.length;j++){
    h+='<button class="opt" data-o="'+j+'">'+String.fromCharCode(65+j)+'. '+d.o[j][0]+'</button>';
    h+='<div class="fb" id="fbq_'+j+'">'+d.o[j][2]+'</div>';
  }
  h+='</div>';
  h+='<button class="dbtn" id="qznext" style="display:none">'+(QZi===N-1?(LANG==='en'?'Finish ✔':'完成 ✔'):(LANG==='en'?'Next ▶':'下一题 ▶'))+'</button>';
  $('quiz').innerHTML=h;
  var ops=document.querySelectorAll('#quiz .opt');
  for(k=0;k<ops.length;k++){
    ops[k].addEventListener('click',function(){
      if(QZdone[QZi])return;
      pickQ(+this.getAttribute('data-o'));
    });
  }
  var nb=$('qznext');
  if(nb)nb.addEventListener('click',function(){QZi++;buildQuiz();updSummary()});
  if(QZpick[QZi]!==undefined)restoreQ();
}
function pickQ(oi){
  var data=QZdata(),d=data[QZi];
  QZpick[QZi]=oi;
  if(QZfirst[QZi]===undefined)QZfirst[QZi]=(d.o[oi][1]===1);
  if(d.o[oi][1]===1)QZdone[QZi]=true;
  restoreQ();
  qzHead();
}
function restoreQ(){
  var data=QZdata(),d=data[QZi],j;
  var ops=document.querySelectorAll('#quiz .opt');
  var oi=QZpick[QZi];
  for(j=0;j<ops.length;j++){
    ops[j].classList.remove('ok');ops[j].classList.remove('bad');
    var f=$('fbq_'+j);if(f)f.classList.remove('show');
  }
  if(oi===undefined||!ops[oi])return;
  var right=d.o[oi][1]===1;
  ops[oi].classList.add(right?'ok':'bad');
  var fb=$('fbq_'+oi);if(fb)fb.classList.add('show');
  var nb=$('qznext');
  if(nb)nb.style.display=QZdone[QZi]?'':'none';
}

    TX.u=10000; $('utsl').value=10000; $('utlab').textContent='10000 V';
  });
  $('qzreset').addEventListener('click',function(){QZpick=[];QZdone=[];QZfirst=[];QZi=0;buildQuiz();updSummary()});
  $('langbtn').addEventListener('click',function(){setLang(LANG==='zh'?'en':'zh')});
  $('thmbtn').addEventListener('click',function(){
    DARK=!DARK;
    if(document.body)document.body.classList.toggle('dark',DARK);
    this.textContent=DARK?'☀️':'🌙';
    RENDER[CUR]();updSummary();
  });
  initExp();
  applyI18n();
  buildCmp(); buildQuiz();
  showTab(0);
  AMB=requestAnimationFrame(ambLoop);
}
boot();

/* test hook */
window.__test=function(){
  var i;
  for(i=0;i<TABN;i++){showTab(i)}
  // slider sweeps on the bench
  showTab(0);
  var n1s=[1,2,5,10],n2s=[1,3,6,10];
  for(i=0;i<4;i++){
    TR.n1=n1s[i];TR.n2=n2s[i];TR.u1=50+i*60;
    PHI=i*0.7; drawTR();
  }
  TR.ac=false; drawTR();
  TR.ac=true; TR.u1=220;TR.n1=2;TR.n2=6; drawTR();
  // step-up/down minis across phases
  showTab(1);
  for(i=0;i<8;i++){PHI=i*0.9;drawUD()}
  // transmission sweep
  showTab(2);
  var us=[250,500,1000,2500,5000,10000];
  for(i=0;i<us.length;i++){TX.u=us[i];TX.ph=i/7;drawTX()}
  TX.u=500;
  // quiz pager
  showTab(4);
  for(i=0;i<7;i++){QZi=i;buildQuiz();pickQ(i%4)}
  QZi=7;buildQuiz();
  QZi=0;QZpick=[];QZdone=[];QZfirst=[];buildQuiz();
  DARK=true;for(i=0;i<TABN;i++){RENDER[i]()}
  DARK=false;
  setLang('en');for(i=0;i<TABN;i++){RENDER[i]()}
  setLang('zh');
  showTab(0);
};
