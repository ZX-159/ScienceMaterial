/* ================= helpers ================= */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function frac(x){return x-Math.floor(x)}
function rnd(k,s){return frac(Math.sin(k*127.1+s*311.7)*43758.5453)}
function lum(hex){
  if(hex[0]!=='#')return 0.5;
  var r=parseInt(hex.substr(1,2),16)/255,g=parseInt(hex.substr(3,2),16)/255,b=parseInt(hex.substr(5,2),16)/255;
  return 0.299*r+0.587*g+0.114*b;
}
var DARK=false;
var THMAP={'#FBF7EC':'#1A2130','#FFFDF7':'#1E2637','#F3EDDD':'#2A3348','#FFFFFF':'#2E3850',
'#26221B':'#EDE7D6','#4B4437':'#D2CCBC','#6B6252':'#5A605D','#8A8070':'#9AA2B4','#B9AE95':'#66708A',
'#E3DCCB':'#39435C','#D8D0BC':'#39435C','#E8E2D4':'#39415A','#9A938A':'#8F97A8','#6B655C':'#B8BECE',
'#2C7D8C':'#5FC8DE','#B5652A':'#E0904E','#8A5A2B':'#C98F52','#2F7D4F':'#52B87C','#D9542B':'#FF7A50',
'#DA9526':'#FFB84D','#3B6EA5':'#7FB2E0'};
function THX(c){return (DARK&&THMAP[c])?THMAP[c]:c}
function PAINT(str){
  if(!DARK)return str;
  return str.replace(/(fill|stroke)="(#[0-9A-Fa-f]{6})"/g,function(m,a,c){
    var mm=THMAP[c.toUpperCase()];
    return mm?(a+'="'+mm+'"'):m;
  });
}
function tl(x,y,size,fill,txt,anchor,weight){
  fill=THX(fill);
  var halo=lum(fill)>0.5?'#26221B':'#FFFFFF';
  return '<text x="'+Math.round(x)+'" y="'+Math.round(y)+'" font-size="'+Math.round(size)+
   '" font-weight="'+(weight||700)+'" fill="'+fill+'" text-anchor="'+(anchor||'middle')+
   '" style="paint-order:stroke;stroke:'+halo+';stroke-width:3px;stroke-linejoin:round">'+txt+'</text>';
}
function tlplain(x,y,size,fill,txt,anchor,weight){
  fill=THX(fill);
  return '<text x="'+Math.round(x)+'" y="'+Math.round(y)+'" font-size="'+Math.round(size)+
   '" font-weight="'+(weight||700)+'" fill="'+fill+'" text-anchor="'+(anchor||'middle')+'">'+txt+'</text>';
}

/* ================= ① Oersted ================= */
var OE={on:false,dir:1,I:1.5,ang:0,vel:0};
function oeTarget(){
  if(!OE.on)return 0;
  /* current NORTH in the wire ABOVE the needle -> B under the wire points WEST
     -> the needle N tip swings WEST = negative angle */
  return -OE.dir*70*OE.I/(OE.I+0.8);
}
function oeStep(dt){
  var tg=oeTarget();
  OE.vel+=(tg-OE.ang)*10*dt-OE.vel*3.4*dt;
  OE.ang+=OE.vel*dt;
}
function initOE(){OE.on=false;OE.dir=1;OE.I=1.5;OE.ang=0;OE.vel=0}

/* ================= ② straight wire ================= */
var W={view:'3d',dir:1,px:470,py:150};
var WC={cx:330,cy:225};
/* screen-space tangent of the field circle at (px,py); dir=+1 means ⊙ (out of page) → CCW on screen */
function secTangent(px,py,dir){
  var dx=px-WC.cx,dy=py-WC.cy;
  var r=Math.sqrt(dx*dx+dy*dy)||1;
  if(dir===1)return {x:dy/r,y:-dx/r};
  return {x:-dy/r,y:dx/r};
}

/* dir=+1: front strands carry current UPWARD.

function solNend(dir){return dir===1?'L':'R'}

/* ================= ④ trainer ================= */
var TRN={i:0,pick:-1,first:[],done:false};
function trnQ(i){
  var ty=i%3;
  if(ty===0){
    var out=rnd(i,11)<0.5;
    return {ty:0,out:out,opts:[T('tr_ccw'),T('tr_cw')],correct:out?0:1};
  }
  if(ty===1){
    var up=rnd(i,17)<0.5;
    /* front strands up -> N at the LEFT end -> left end is N */
    return {ty:1,up:up,opts:['N','S'],correct:up?0:1};
  }
  var poss=['E','S','W','N'];
  var pi=Math.floor(rnd(i,23)*4)%4;
  var out2=rnd(i,29)<0.5;
  /* CCW (⊙) tangent N-direction at: E→北, N→西, W→南, S→东; CW opposite */
  var ccwAns={E:'N',N:'W',W:'S',S:'E'};
  var cwAns={E:'S',N:'E',W:'N',S:'W'};
  var ans=(out2?ccwAns:cwAns)[poss[pi]];
  var opts=['N','E','S','W'];
  var lbl={N:T('posN'),E:T('posE'),S:T('posS'),W:T('posW')};
  return {ty:2,out:out2,pos:poss[pi],opts:[lbl.N,lbl.E,lbl.S,lbl.W],optKeys:opts,correct:opts.indexOf(ans)};
}
function initTRN(){TRN.i=0;TRN.pick=-1;TRN.first=[];TRN.done=false}

function benchBG(w,h){

function compassSVG(cx,cy,R,angDeg,scale){
  /* angDeg: 0 = N points up (screen), positive = clockwise on screen */
  var a=angDeg*Math.PI/180;
  var nx=cx+R*0.72*Math.sin(a),ny=cy-R*0.72*Math.cos(a);
  var sx=cx-R*0.72*Math.sin(a),sy=cy+R*0.72*Math.cos(a);
  var s='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+R+'" fill="#FFFDF7" stroke="#8A8070" stroke-width="2"/>';
  s+='<line x1="'+sx.toFixed(1)+'" y1="'+sy.toFixed(1)+'" x2="'+cx.toFixed(1)+'" y2="'+cy.toFixed(1)+'" stroke="#9A938A" stroke-width="'+(5*scale).toFixed(1)+'" stroke-linecap="round"/>';
  s+='<line x1="'+cx.toFixed(1)+'" y1="'+cy.toFixed(1)+'" x2="'+nx.toFixed(1)+'" y2="'+ny.toFixed(1)+'" stroke="#D9542B" stroke-width="'+(5*scale).toFixed(1)+'" stroke-linecap="round"/>';
  s+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+(3.4*scale).toFixed(1)+'" fill="#4B4437"/>';

function arrowHead(x,y,vx,vy,col,w){
  var vd=Math.hypot(vx,vy)||1;vx/=vd;vy/=vd;

  return '<path d="M '+x.toFixed(1)+' '+y.toFixed(1)+

   ' l '+(-vx*10-lx*5.5).toFixed(1)+' '+(-vy*10-ly*5.5).toFixed(1)+
   '" stroke="'+col+'" stroke-width="'+(w||3)+'" fill="none" stroke-linecap="round"/>';
}

  $('o_ang').textContent=T('oe_ang')+' '+Math.round(OE.ang)+'°';

var OEPATHTOT=1280;
function oePathPoint(d){
  var wx=330;
  /* closed loop: down the main wire, right, down, left along the battery row, up the left side, back to the top */
  var segs=[[wx,70,wx,340],[wx,340,470,340],[470,340,470,430],[470,430,190,430],[190,430,190,70],[190,70,wx,70]];
  var lens=segs.map(function(g){return Math.hypot(g[2]-g[0],g[3]-g[1])});
  var tot=0,k;
  for(k=0;k<lens.length;k++)tot+=lens[k];
  d=((d%tot)+tot)%tot;
  for(k=0;k<segs.length;k++){
    if(d<=lens[k]){
      var t=d/lens[k];
      return [segs[k][0]+(segs[k][2]-segs[k][0])*t,segs[k][1]+(segs[k][3]-segs[k][1])*t];
    }
    d-=lens[k];
  }
  return [wx,70];
}

var QZi=0,QZpick=[],QZdone=[],QZfirst=[];
function drawQZ(){buildQuiz()}
function qzHead(){
  var data=QZdata(),N=data.length,nf=0,k;
  for(k=0;k<N;k++)if(QZfirst[k]===true)nf++;
  $('qzprog').textContent=(LANG==='en'?'Q ':'第 ')+Math.min(QZi+1,N)+' / '+N+(LANG==='en'?'':' 题');
  $('qzscore').textContent=(LANG==='en'?'first try ':'一次答对 ')+nf+' / '+N;
  return nf;
}
function buildQuiz(){
  var data=QZdata(),h='',k,j,N=data.length;
  var nf=qzHead();
  if(QZi>=N){
    $('quiz').innerHTML='<div class="q"><div class="qt">'+(LANG==='en'?'🎉 Done! First-try score: ':'🎉 全部完成！一次答对：')+nf+' / '+N+'</div></div>';
    return;
  }
  var d=data[QZi];
  h+='<div class="q"><div class="qt">'+d.q+'</div>';
  for(j=0;j<d.o.length;j++){
    h+='<button class="opt" data-o="'+j+'">'+String.fromCharCode(65+j)+'. '+d.o[j][0]+'</button>';
    h+='<div class="fb" id="fbq_'+j+'">'+d.o[j][2]+'</div>';
  }
  h+='</div>';
  h+='<button class="dbtn" id="qznext" style="display:none">'+(QZi===N-1?(LANG==='en'?'Finish ✔':'完成 ✔'):(LANG==='en'?'Next ▶':'下一题 ▶'))+'</button>';
  $('quiz').innerHTML=h;
  var ops=document.querySelectorAll('#quiz .opt');
  for(k=0;k<ops.length;k++){
    ops[k].addEventListener('click',function(){
      if(QZdone[QZi])return;
      pickQ(+this.getAttribute('data-o'));
    });
  }
  var nb=$('qznext');
  if(nb)nb.addEventListener('click',function(){QZi++;buildQuiz();updSummary()});
  if(QZpick[QZi]!==undefined)restoreQ();
}
function pickQ(oi){
  var data=QZdata(),d=data[QZi];
  QZpick[QZi]=oi;
  if(QZfirst[QZi]===undefined)QZfirst[QZi]=(d.o[oi][1]===1);
  if(d.o[oi][1]===1)QZdone[QZi]=true;
  restoreQ();
  qzHead();
}
function restoreQ(){
  var data=QZdata(),d=data[QZi],j;
  var ops=document.querySelectorAll('#quiz .opt');
  var oi=QZpick[QZi];
  for(j=0;j<ops.length;j++){
    ops[j].classList.remove('ok');ops[j].classList.remove('bad');
    var f=$('fbq_'+j);if(f)f.classList.remove('show');
  }
  if(oi===undefined||!ops[oi])return;
  var right=d.o[oi][1]===1;
  ops[oi].classList.add(right?'ok':'bad');
  var fb=$('fbq_'+oi);if(fb)fb.classList.add('show');
  var nb=$('qznext');
  if(nb)nb.style.display=QZdone[QZi]?'':'none';
}

  $('wvsec').addEventListener('click',function(){W.view='sec';this.classList.add('on');$('wv3d').classList.remove('on');drawW()});
  $('wflip').addEventListener('click',function(){W.dir=-W.dir;drawW();updSummary()});
  /* compass drag in section view */
  var dragging=false;
  var svgw=$('svgw');
  function evPos(e){
    var r=svgw.getBoundingClientRect();
    var x=(e.clientX-r.left)/r.width*660,y=(e.clientY-r.top)/r.height*470;
    return [x,y];
  }
  svgw.addEventListener('pointerdown',function(e){
    if(W.view!=='sec')return;
    e.preventDefault();
    var p=evPos(e);
    if(Math.hypot(p[0]-W.px,p[1]-W.py)<46){dragging=true}
  });
  svgw.addEventListener('pointermove',function(e){
    if(!dragging)return;
    var p=evPos(e);
    var dx=p[0]-WC.cx,dy=p[1]-WC.cy;
    var r=clamp(Math.hypot(dx,dy),42,205);
    var a=Math.atan2(dy,dx);
    W.px=WC.cx+r*Math.cos(a);W.py=WC.cy+r*Math.sin(a);
    W.px=clamp(W.px,30,630);W.py=clamp(W.py,34,440);
  });
  svgw.addEventListener('pointerup',function(){dragging=false});
  svgw.addEventListener('pointercancel',function(){dragging=false});
  /* --- ③ --- */
  $('sflip').addEventListener('click',function(){SOL.dir=-SOL.dir;drawSOL();updSummary()});
  $('sghost').addEventListener('click',function(){SOL.ghost=!SOL.ghost;this.classList.toggle('on',SOL.ghost);drawSOL()});

  /* --- ④ --- */

  $('langbtn').addEventListener('click',function(){setLang(LANG==='zh'?'en':'zh')});
  $('thmbtn').addEventListener('click',function(){

    this.textContent=DARK?'☀️':'🌙';
    RENDER[CUR]();updSummary();
  });
  initExp();
  applyI18n();
  swLabel();
  buildQuiz();
  showTab(0);
  AMB=requestAnimationFrame(ambLoop);
}

/* ================= helpers ================= */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function frac(x){return x-Math.floor(x)}
function rnd(k,s){return frac(Math.sin(k*127.1+s*311.7)*43758.5453)}
function lum(hex){
  if(hex[0]!=='#')return 0.5;
  var r=parseInt(hex.substr(1,2),16)/255,g=parseInt(hex.substr(3,2),16)/255,b=parseInt(hex.substr(5,2),16)/255;
  return 0.299*r+0.587*g+0.114*b;
}
var DARK=false;
var THMAP={'#FBF7EC':'#1A2130','#FFFDF7':'#1E2637','#F3EDDD':'#2A3348','#FFFFFF':'#2E3850',
'#26221B':'#EDE7D6','#4B4437':'#D2CCBC','#6B6252':'#5A605D','#8A8070':'#9AA2B4','#B9AE95':'#66708A',
'#E3DCCB':'#39435C','#D8D0BC':'#39435C','#E8E2D4':'#39415A','#9A938A':'#8F97A8','#6B655C':'#B8BECE',
'#2C7D8C':'#5FC8DE','#B5652A':'#E0904E','#8A5A2B':'#C98F52','#2F7D4F':'#52B87C','#D9542B':'#FF7A50',
'#DA9526':'#FFB84D','#3B6EA5':'#7FB2E0'};
function THX(c){return (DARK&&THMAP[c])?THMAP[c]:c}
function PAINT(str){
  if(!DARK)return str;
  return str.replace(/(fill|stroke)="(#[0-9A-Fa-f]{6})"/g,function(m,a,c){
    var mm=THMAP[c.toUpperCase()];
    return mm?(a+'="'+mm+'"'):m;
  });
}
function tl(x,y,size,fill,txt,anchor,weight){
  fill=THX(fill);
  var halo=lum(fill)>0.5?'#26221B':'#FFFFFF';
  return '<text x="'+Math.round(x)+'" y="'+Math.round(y)+'" font-size="'+Math.round(size)+
   '" font-weight="'+(weight||700)+'" fill="'+fill+'" text-anchor="'+(anchor||'middle')+
   '" style="paint-order:stroke;stroke:'+halo+';stroke-width:3px;stroke-linejoin:round">'+txt+'</text>';
}
function tlplain(x,y,size,fill,txt,anchor,weight){
  fill=THX(fill);
  return '<text x="'+Math.round(x)+'" y="'+Math.round(y)+'" font-size="'+Math.round(size)+
   '" font-weight="'+(weight||700)+'" fill="'+fill+'" text-anchor="'+(anchor||'middle')+'">'+txt+'</text>';
}

/* ================= ① Oersted ================= */
var OE={on:false,dir:1,I:1.5,ang:0,vel:0};
function oeTarget(){
  if(!OE.on)return 0;
  /* current NORTH in the wire ABOVE the needle -> B under the wire points WEST
     -> the needle N tip swings WEST = negative angle */
  return -OE.dir*70*OE.I/(OE.I+0.8);
}
function oeStep(dt){
  var tg=oeTarget();
  OE.vel+=(tg-OE.ang)*10*dt-OE.vel*3.4*dt;
  OE.ang+=OE.vel*dt;
}
function initOE(){OE.on=false;OE.dir=1;OE.I=1.5;OE.ang=0;OE.vel=0}

/* ================= ② straight wire ================= */
var W={view:'3d',dir:1,px:470,py:150};
var WC={cx:330,cy:225};
/* screen-space tangent of the field circle at (px,py); dir=+1 means ⊙ (out of page) → CCW on screen */
function secTangent(px,py,dir){
  var dx=px-WC.cx,dy=py-WC.cy;
  var r=Math.sqrt(dx*dx+dy*dy)||1;
  if(dir===1)return {x:dy/r,y:-dx/r};
  return {x:-dy/r,y:dx/r};
}
function initW(){W.view='3d';W.dir=1;W.px=470;W.py=150}

/* dir=+1: front strands carry current UPWARD.
   Right hand: fingers follow the front current up and curl over the top

function solNend(dir){return dir===1?'L':'R'}
function initSOL(){SOL.on=true;SOL.dir=1;SOL.ghost=false}

/* ================= ④ trainer ================= */
var TRN={i:0,pick:-1,first:[],done:false};
function trnQ(i){
  var ty=i%3;
  if(ty===0){
    var out=rnd(i,11)<0.5;
    return {ty:0,out:out,opts:[T('tr_ccw'),T('tr_cw')],correct:out?0:1};
  }
  if(ty===1){
    var up=rnd(i,17)<0.5;
    /* front strands up -> N at the LEFT end -> left end is N */
    return {ty:1,up:up,opts:['N','S'],correct:up?0:1};
  }
  var poss=['E','S','W','N'];
  var pi=Math.floor(rnd(i,23)*4)%4;
  var out2=rnd(i,29)<0.5;
  /* CCW (⊙) tangent N-direction at: E→北, N→西, W→南, S→东; CW opposite */
  var ccwAns={E:'N',N:'W',W:'S',S:'E'};
  var cwAns={E:'S',N:'E',W:'N',S:'W'};
  var ans=(out2?ccwAns:cwAns)[poss[pi]];
  var opts=['N','E','S','W'];
  var lbl={N:T('posN'),E:T('posE'),S:T('posS'),W:T('posW')};
  return {ty:2,out:out2,pos:poss[pi],opts:[lbl.N,lbl.E,lbl.S,lbl.W],optKeys:opts,correct:opts.indexOf(ans)};
}
function initTRN(){TRN.i=0;TRN.pick=-1;TRN.first=[];TRN.done=false}

/* ================= shared bits ================= */
function benchBG(w,h){
  return '<rect x="0" y="0" width="'+w+'" height="'+h+'" rx="14" fill="#FBF7EC"/>';
}
function compassSVG(cx,cy,R,angDeg,scale){
  /* angDeg: 0 = N points up (screen), positive = clockwise on screen */
  var a=angDeg*Math.PI/180;
  var nx=cx+R*0.72*Math.sin(a),ny=cy-R*0.72*Math.cos(a);
  var sx=cx-R*0.72*Math.sin(a),sy=cy+R*0.72*Math.cos(a);
  var s='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+R+'" fill="#FFFDF7" stroke="#8A8070" stroke-width="2"/>';
  s+='<line x1="'+sx.toFixed(1)+'" y1="'+sy.toFixed(1)+'" x2="'+cx.toFixed(1)+'" y2="'+cy.toFixed(1)+'" stroke="#9A938A" stroke-width="'+(5*scale).toFixed(1)+'" stroke-linecap="round"/>';
  s+='<line x1="'+cx.toFixed(1)+'" y1="'+cy.toFixed(1)+'" x2="'+nx.toFixed(1)+'" y2="'+ny.toFixed(1)+'" stroke="#D9542B" stroke-width="'+(5*scale).toFixed(1)+'" stroke-linecap="round"/>';
  s+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+(3.4*scale).toFixed(1)+'" fill="#4B4437"/>';
  return s;
}
function arrowHead(x,y,vx,vy,col,w){
  var vd=Math.hypot(vx,vy)||1;vx/=vd;vy/=vd;
  var lx=-vy,ly=vx;
  return '<path d="M '+x.toFixed(1)+' '+y.toFixed(1)+
   ' l '+(-vx*10+lx*5.5).toFixed(1)+' '+(-vy*10+ly*5.5).toFixed(1)+
   ' M '+x.toFixed(1)+' '+y.toFixed(1)+
   ' l '+(-vx*10-lx*5.5).toFixed(1)+' '+(-vy*10-ly*5.5).toFixed(1)+
   '" stroke="'+col+'" stroke-width="'+(w||3)+'" fill="none" stroke-linecap="round"/>';
}

var OEPATHTOT=1280;
function oePathPoint(d){
  var wx=330;
  /* closed loop: down the main wire, right, down, left along the battery row, up the left side, back to the top */
  var segs=[[wx,70,wx,340],[wx,340,470,340],[470,340,470,430],[470,430,190,430],[190,430,190,70],[190,70,wx,70]];
  var lens=segs.map(function(g){return Math.hypot(g[2]-g[0],g[3]-g[1])});
  var tot=0,k;
  for(k=0;k<lens.length;k++)tot+=lens[k];
  d=((d%tot)+tot)%tot;
  for(k=0;k<segs.length;k++){
    if(d<=lens[k]){
      var t=d/lens[k];
      return [segs[k][0]+(segs[k][2]-segs[k][0])*t,segs[k][1]+(segs[k][3]-segs[k][1])*t];
    }
    d-=lens[k];
  }
  return [wx,70];
}

/* ================= ② straight wire ================= */
function drawW(){
  var s=benchBG(660,470);
  var k;
  if(W.view==='sec'){
    /* section view: wire = dot/cross at centre, concentric circles */
    var RS=[55,95,140,190];
    for(k=0;k<RS.length;k++){
      var op=(1-k*0.19).toFixed(2);
      s+='<circle cx="'+WC.cx+'" cy="'+WC.cy+'" r="'+RS[k]+'" fill="none" stroke="#3B6EA5" stroke-width="2.5" opacity="'+op+'" stroke-dasharray="7 7" stroke-dashoffset="'+((W.dir===1?-1:1)*CLK*18).toFixed(0)+'"/>';
      /* direction arrow on each circle at 45° */
      var aa=-Math.PI/4;
      var ax=WC.cx+RS[k]*Math.cos(aa),ay=WC.cy+RS[k]*Math.sin(aa);
      var tg=secTangent(ax,ay,W.dir);
      s+=arrowHead(ax,ay,tg.x,tg.y,'#3B6EA5',3);
    }
    /* the wire symbol */
    s+='<circle cx="'+WC.cx+'" cy="'+WC.cy+'" r="14" fill="#FFFDF7" stroke="#B5652A" stroke-width="4"/>';
    if(W.dir===1)s+='<circle cx="'+WC.cx+'" cy="'+WC.cy+'" r="4.5" fill="#B5652A"/>';
    else{
      s+='<line x1="'+(WC.cx-8)+'" y1="'+(WC.cy-8)+'" x2="'+(WC.cx+8)+'" y2="'+(WC.cy+8)+'" stroke="#B5652A" stroke-width="4"/>';
      s+='<line x1="'+(WC.cx+8)+'" y1="'+(WC.cy-8)+'" x2="'+(WC.cx-8)+'" y2="'+(WC.cy+8)+'" stroke="#B5652A" stroke-width="4"/>';
    }
    s+=tl(WC.cx,52,16,'#B5652A',W.dir===1?T('w_cur_out'):T('w_cur_in'));
    s+=tlplain(WC.cx+198,WC.cy+184>460?452:WC.cy+196,13,'#8A8070','','middle');
    s+=tl(560,440,13,'#6B6252',T('w_weak'),'middle');
    /* draggable compass, aligned to local tangent */
    var tg2=secTangent(W.px,W.py,W.dir);
    var ang=Math.atan2(tg2.x,-tg2.y)*180/Math.PI;
    s+=compassSVG(W.px,W.py,26,ang,1);
    s+=tl(W.px,W.py-36,13,'#2C7D8C',T('w_drag'));
  }else{
    /* 3-D: vertical wire, field circles as ellipses */
    var wx=330;
    s+='<line x1="'+wx+'" y1="40" x2="'+wx+'" y2="430" stroke="#B5652A" stroke-width="8" stroke-linecap="round"/>';
    var ys=[130,225,320];
    for(k=0;k<ys.length;k++){
      var rr=95+k*0;
      /* back half then front half for depth */
      s+='<path d="M '+(wx-rr)+' '+ys[k]+' A '+rr+' 26 0 0 1 '+(wx+rr)+' '+ys[k]+'" fill="none" stroke="#3B6EA5" stroke-width="2" opacity="0.45" stroke-dasharray="6 6"/>';
      s+='<path d="M '+(wx-rr)+' '+ys[k]+' A '+rr+' 26 0 0 0 '+(wx+rr)+' '+ys[k]+'" fill="none" stroke="#3B6EA5" stroke-width="2.6" stroke-dasharray="6 6" stroke-dashoffset="'+((W.dir===1?-1:1)*CLK*16).toFixed(0)+'"/>';
      /* FRONT of each ring: current UP -> B at the front points EAST (right) */
      s+=arrowHead(wx+(W.dir===1?44:-44),ys[k]+24,(W.dir===1?1:-1),0,'#3B6EA5',3);
    }
    /* current arrow + label: dir=+1 → up */
    s+=arrowHead(wx,W.dir===1?66:404,0,W.dir===1?-1:1,'#D9542B',5);
    s+=tl(wx+18,W.dir===1?76:404,15,'#D9542B',W.dir===1?T('w_cur_up'):T('w_cur_dn'),'start');
    /* marching current dots on the wire */
    for(k=0;k<10;k++){
      var u=frac(rnd(k,401)+CLK*0.13*(W.dir===1?-1:1));
      s+='<circle cx="'+wx+'" cy="'+(45+u*380).toFixed(1)+'" r="3.2" fill="#DA9526"/>';
    }
    /* right-hand rule caption */
    s+=tl(116,70,14,'#2C7D8C','\ud83e\udd1a '+T('w_rule'),'start');

  }
  $('svgw').innerHTML=PAINT(s);
  $('qb1').innerHTML='<span class="qtag">'+T('qtag')+'</span>'+T('wqb');
}

var QZi=0,QZpick=[],QZdone=[],QZfirst=[];
function drawQZ(){buildQuiz()}
function qzHead(){
  var data=QZdata(),N=data.length,nf=0,k;
  for(k=0;k<N;k++)if(QZfirst[k]===true)nf++;
  $('qzprog').textContent=(LANG==='en'?'Q ':'第 ')+Math.min(QZi+1,N)+' / '+N+(LANG==='en'?'':' 题');
  $('qzscore').textContent=(LANG==='en'?'first try ':'一次答对 ')+nf+' / '+N;
  return nf;
}
function buildQuiz(){
  var data=QZdata(),h='',k,j,N=data.length;
  var nf=qzHead();
  if(QZi>=N){
    $('quiz').innerHTML='<div class="q"><div class="qt">'+(LANG==='en'?'🎉 Done! First-try score: ':'🎉 全部完成！一次答对：')+nf+' / '+N+'</div></div>';
    return;
  }
  var d=data[QZi];
  h+='<div class="q"><div class="qt">'+d.q+'</div>';
  for(j=0;j<d.o.length;j++){
    h+='<button class="opt" data-o="'+j+'">'+String.fromCharCode(65+j)+'. '+d.o[j][0]+'</button>';
    h+='<div class="fb" id="fbq_'+j+'">'+d.o[j][2]+'</div>';
  }
  h+='</div>';
  h+='<button class="dbtn" id="qznext" style="display:none">'+(QZi===N-1?(LANG==='en'?'Finish ✔':'完成 ✔'):(LANG==='en'?'Next ▶':'下一题 ▶'))+'</button>';
  $('quiz').innerHTML=h;
  var ops=document.querySelectorAll('#quiz .opt');
  for(k=0;k<ops.length;k++){
    ops[k].addEventListener('click',function(){
      if(QZdone[QZi])return;
      pickQ(+this.getAttribute('data-o'));
    });
  }
  var nb=$('qznext');
  if(nb)nb.addEventListener('click',function(){QZi++;buildQuiz();updSummary()});
  if(QZpick[QZi]!==undefined)restoreQ();
}
function pickQ(oi){
  var data=QZdata(),d=data[QZi];
  QZpick[QZi]=oi;
  if(QZfirst[QZi]===undefined)QZfirst[QZi]=(d.o[oi][1]===1);
  if(d.o[oi][1]===1)QZdone[QZi]=true;
  restoreQ();
  qzHead();
}
function restoreQ(){
  var data=QZdata(),d=data[QZi],j;
  var ops=document.querySelectorAll('#quiz .opt');
  var oi=QZpick[QZi];
  for(j=0;j<ops.length;j++){
    ops[j].classList.remove('ok');ops[j].classList.remove('bad');
    var f=$('fbq_'+j);if(f)f.classList.remove('show');
  }
  if(oi===undefined||!ops[oi])return;
  var right=d.o[oi][1]===1;
  ops[oi].classList.add(right?'ok':'bad');
  var fb=$('fbq_'+oi);if(fb)fb.classList.add('show');
  var nb=$('qznext');
  if(nb)nb.style.display=QZdone[QZi]?'':'none';
}

  else if(CUR===1){ drawW(); }

function boot(){
  RENDER=[drawOE,drawW,drawSOL,drawTRN,drawQZ];
  SUMMARY=[
    function(){return (OE.on?('⚡ '+OE.I.toFixed(1)+' A · '+Math.round(OE.ang)+'°'):(LANG==='en'?'○ off':'○ 断开'))},
    function(){return (W.view==='sec'?(W.dir===1?'⊙':'⊗'):(W.dir===1?'↑':'↓'))+' '+(LANG==='en'?'wire field':'直导线磁场')},
    function(){return 'N: '+(solNend(SOL.dir)==='R'?(LANG==='en'?'right':'右'):(LANG==='en'?'left':'左'))},
    function(){return $('trscore').textContent},
    function(){return T('qz_title')+' '+$('qzscore').textContent}
  ];
  initTabs(); initOE(); initW(); initSOL(); initTRN();
  /* --- ① --- */
  $('osw').addEventListener('click',function(){OE.on=!OE.on;this.classList.toggle('on',OE.on);swLabel();drawOE();updSummary()});
  $('oflip').addEventListener('click',function(){OE.dir=-OE.dir;drawOE();updSummary()});
  $('oI').addEventListener('input',function(){OE.I=+this.value;$('oIlab').textContent=OE.I.toFixed(1)+' A';drawOE();updSummary()});
  $('oreset').addEventListener('click',function(){initOE();$('osw').classList.remove('on');swLabel();drawOE();updSummary()});
  /* --- ② --- */
  $('wv3d').addEventListener('click',function(){W.view='3d';this.classList.add('on');$('wvsec').classList.remove('on');drawW()});
  $('wvsec').addEventListener('click',function(){W.view='sec';this.classList.add('on');$('wv3d').classList.remove('on');drawW()});
  $('wflip').addEventListener('click',function(){W.dir=-W.dir;drawW();updSummary()});
  /* compass drag in section view */
  var dragging=false;
  var svgw=$('svgw');
  function evPos(e){
    var r=svgw.getBoundingClientRect();
    var x=(e.clientX-r.left)/r.width*660,y=(e.clientY-r.top)/r.height*470;
    return [x,y];
  }
  svgw.addEventListener('pointerdown',function(e){
    if(W.view!=='sec')return;
    e.preventDefault();
    var p=evPos(e);
    if(Math.hypot(p[0]-W.px,p[1]-W.py)<46){dragging=true}
  });
  svgw.addEventListener('pointermove',function(e){
    if(!dragging)return;
    var p=evPos(e);
    var dx=p[0]-WC.cx,dy=p[1]-WC.cy;
    var r=clamp(Math.hypot(dx,dy),42,205);
    var a=Math.atan2(dy,dx);
    W.px=WC.cx+r*Math.cos(a);W.py=WC.cy+r*Math.sin(a);
    W.px=clamp(W.px,30,630);W.py=clamp(W.py,34,440);
  });
  svgw.addEventListener('pointerup',function(){dragging=false});
  svgw.addEventListener('pointercancel',function(){dragging=false});
  /* --- ③ --- */
  $('sflip').addEventListener('click',function(){SOL.dir=-SOL.dir;drawSOL();updSummary()});
  $('sghost').addEventListener('click',function(){SOL.ghost=!SOL.ghost;this.classList.toggle('on',SOL.ghost);drawSOL()});
  $('sreset').addEventListener('click',function(){initSOL();$('sghost').classList.remove('on');drawSOL();updSummary()});
  /* --- ④ --- */
  $('trnext').addEventListener('click',function(){TRN.i++;TRN.pick=-1;drawTRN()});
  /* --- chrome --- */
  $('qzreset').addEventListener('click',function(){QZpick=[];QZdone=[];QZfirst=[];QZi=0;buildQuiz();updSummary()});
  $('langbtn').addEventListener('click',function(){setLang(LANG==='zh'?'en':'zh')});
  $('thmbtn').addEventListener('click',function(){
    DARK=!DARK;
    if(document.body)document.body.classList.toggle('dark',DARK);
    this.textContent=DARK?'☀️':'🌙';
    RENDER[CUR]();updSummary();
  });
  initExp();
  applyI18n();
  swLabel();
  buildQuiz();
  showTab(0);
  AMB=requestAnimationFrame(ambLoop);
}
boot();
