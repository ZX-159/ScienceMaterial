'use strict';
const $ = id => document.getElementById(id);
function clamp(v,a,b){ if(!isFinite(v)) return a; return v<a?a:(v>b?b:v); }
function f1(v){ return (Math.abs(v)<5e-3?0:v).toFixed(1); }

============================================================ */
const CV_FONT = '"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
const SC = 2;
function ptr(ev, cv, sc){
  const r = cv.getBoundingClientRect();
  return { x:(ev.clientX-r.left)*cv.width/r.width/(sc||1), y:(ev.clientY-r.top)*cv.height/r.height/(sc||1) };
}
function rrect(c,x,y,w,h,r){
  c.beginPath();
  if(c.roundRect){ c.roundRect(x,y,w,h,r); return; }
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}
function circle(c,x,y,r,fill,stroke,lw){

  if(stroke){ c.strokeStyle=stroke; c.lineWidth=lw||1.5; c.stroke(); }
}
function line(c,x1,y1,x2,y2,col,lw,dash){
  c.beginPath();
  if(c.setLineDash) c.setLineDash(dash||[]);
  c.moveTo(x1,y1); c.lineTo(x2,y2);
  c.strokeStyle=col; c.lineWidth=lw||1.5; c.stroke();

function TX(c,s,x,y,font,color,align,base){
  if(!isFinite(x)||!isFinite(y)) return;

  c.fillText(s,x,y);

function fsOf(font){ const m=/(\d+(?:\.\d+)?)px/.exec(String(font)); return m?parseFloat(m[1]):14; }

/* ---- label bookkeeping: no overlap, always clamped inside the canvas ---- */
let LBLS=[];
function labelReset(){ LBLS=[]; }
function boxHit(a,b){ return !(a.x1<=b.x0 || b.x1<=a.x0 || a.y1<=b.y0 || b.y1<=a.y0); }
function boxFree(b){ for(let i=0;i<LBLS.length;i++) if(boxHit(LBLS[i],b)) return false; return true; }
/* pill-backed label; tries each candidate, finally clamps the first one into view */
function tchip(c,s,cands,font,color,W,H,bgOverride){
  if(!s) return false;
  c.font=font;
  const fs=fsOf(font), tw=c.measureText(s).width, w=tw+22, h=fs+13;
  const draw = (x,y)=>{
    rrect(c,x-w/2,y-h/2,w,h,h/2);
    c.fillStyle=bgOverride||C().pill; c.fill();
    c.strokeStyle=C().pillLine; c.lineWidth=1.2; c.stroke();
    TX(c,s,x,y,font,color,'center','middle');
    LBLS.push({x0:x-w/2-2,y0:y-h/2-2,x1:x+w/2+2,y1:y+h/2+2});
  };
  for(let i=0;i<cands.length;i++){
    const p=cands[i];
    if(!isFinite(p[0])||!isFinite(p[1])) continue;
    const b={x0:p[0]-w/2-2,y0:p[1]-h/2-2,x1:p[0]+w/2+2,y1:p[1]+h/2+2};
    if(b.x0<2||b.x1>W-2||b.y0<2||b.y1>H-2) continue;
    if(!boxFree(b)) continue;
    draw(p[0],p[1]); return true;
  }
  const p0=cands[0];
  if(!p0||!isFinite(p0[0])||!isFinite(p0[1])) return false;
  draw(clamp(p0[0], w/2+4, W-w/2-4), clamp(p0[1], h/2+4, H-h/2-4));
  return true;
}
function labText(c,s,cands,font,color,align,W,H){
  if(!s) return false;
  c.font=font;
  const fs=fsOf(font), tw=c.measureText(s).width, h=fs*1.3;
  for(let i=0;i<cands.length;i++){
    const p=cands[i];
    if(!isFinite(p[0])||!isFinite(p[1])) continue;
    const ax = align==='right' ? p[0]-tw : (align==='center' ? p[0]-tw/2 : p[0]);
    const b={x0:ax-3,y0:p[1]-h/2-2,x1:ax+tw+3,y1:p[1]+h/2+2};
    if(b.x0<2||b.x1>W-2||b.y0<2||b.y1>H-2) continue;
    if(!boxFree(b)) continue;
    LBLS.push(b); TX(c,s,p[0],p[1],font,color,align||'left','middle'); return true;
  }
  return false;
}

/* ============================================================
   Geometry (carried over verbatim from the self-study build)
============================================================ */
function polyCentroid(p){
  let a=0,cx=0,cy=0;
  for(let i=0,n=p.length;i<n;i++){
    const j=(i+1)%n;
    const cr=p[i][0]*p[j][1]-p[j][0]*p[i][1];
    a+=cr; cx+=(p[i][0]+p[j][0])*cr; cy+=(p[i][1]+p[j][1])*cr;
  }
  a/=2;
  return {x:cx/(6*a), y:cy/(6*a), a:a};
}
function pip(p,x,y){
  let c=false;
  for(let i=0,j=p.length-1;i<p.length;j=i++){
    const xi=p[i][0],yi=p[i][1],xj=p[j][0],yj=p[j][1];
    if(((yi>y)!==(yj>y)) && (x<(xj-xi)*(y-yi)/(yj-yi)+xi)) c=!c;
  }
  return c;
}
/* composite rule: outer area-weighted centroid minus each hole */
function shapeCG(s){
  const co=polyCentroid(s.outer);
  let A=Math.abs(co.a), mx=co.x*A, my=co.y*A;
  const hs=s.holes||[];
  for(let i=0;i<hs.length;i++){
    const ch=polyCentroid(hs[i]); const ah=Math.abs(ch.a);
    A-=ah; mx-=ch.x*ah; my-=ch.y*ah;
  }
  return {x:mx/A, y:my/A, area:A};
}
function inShape(s,x,y){
  if(!pip(s.outer,x,y)) return false;
  const hs=s.holes||[];
  for(let i=0;i<hs.length;i++) if(pip(hs[i],x,y)) return false;
  return true;
}
function bboxOf(s){
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  s.outer.forEach(function(q){ x0=Math.min(x0,q[0]); x1=Math.max(x1,q[0]); y0=Math.min(y0,q[1]); y1=Math.max(y1,q[1]); });
  return {x0:x0,x1:x1,y0:y0,y1:y1,cx:(x0+x1)/2,cy:(y0+y1)/2,w:x1-x0,h:y1-y0};
}
function nearestOnEdge(s,x,y){
  const p=s.outer; let best=[p[0][0],p[0][1]], bd=1e18;
  for(let i=0;i<p.length;i++){
    const a=p[i], b=p[(i+1)%p.length];
    const vx=b[0]-a[0], vy=b[1]-a[1], L2=vx*vx+vy*vy;
    let u = L2>0 ? ((x-a[0])*vx+(y-a[1])*vy)/L2 : 0;
    u=clamp(u,0,1);
    const qx=a[0]+vx*u, qy=a[1]+vy*u;
    const d=(qx-x)*(qx-x)+(qy-y)*(qy-y);
    if(d<bd){ bd=d; best=[qx,qy]; }
  }
  return best;
}
function lineX(l1,l2){
  const cr = l1.d[0]*l2.d[1] - l1.d[1]*l2.d[0];
  if(Math.abs(cr)<1e-7) return null;
  const ex=l2.p[0]-l1.p[0], ey=l2.p[1]-l1.p[1];
  const u=(ex*l2.d[1]-ey*l2.d[0])/cr;
  return {x:l1.p[0]+l1.d[0]*u, y:l1.p[1]+l1.d[1]*u};
}
function circlePoly(cx,cy,r,n){
  const p=[]; for(let i=0;i<n;i++){ const a=i/n*Math.PI*2; p.push([cx+r*Math.cos(a), cy+r*Math.sin(a)]); }
  return p;
}
/* crescent = inside circle A, outside circle B; traced as one polygon */
function crescentPoly(R,r,d,N){
  const x=(d*d+R*R-r*r)/(2*d), y=Math.sqrt(R*R-x*x);
  const aA=Math.atan2(y,x), a2=Math.abs(Math.atan2(-y,x-d)), sweep=2*Math.PI-2*a2;
  const pts=[];
  for(let i=0;i<=N;i++){ const a=aA+(2*Math.PI-2*aA)*i/N; pts.push([R*Math.cos(a), R*Math.sin(a)]); }
  for(let i=1;i<N;i++){ const a=-a2-sweep*i/N; pts.push([d+r*Math.cos(a), r*Math.sin(a)]); }
  return pts;
}
function leafPoly(N){
  const p=[], a=104;
  for(let i=0;i<=N;i++){ const x=-a+2*a*i/N, u=Math.max(0,1-(x/a)*(x/a)); p.push([x,-54*Math.pow(u,0.72)]); }
  for(let i=N-1;i>=1;i--){ const x=-a+2*a*i/N, u=Math.max(0,1-(x/a)*(x/a)); p.push([x, 30*Math.pow(u,1.15)]); }
  return p;
}
function rotPoly(p,ang){
  const c=Math.cos(ang), s=Math.sin(ang);
  return p.map(function(q){ return [q[0]*c-q[1]*s, q[0]*s+q[1]*c]; });
}

/* ================= the plates ================= */
const SHAPES=[
  {key:'square', outer:[[-78,-78],[78,-78],[78,78],[-78,78]], pick:[[-1,-1],[-1,0.6]]},
  {key:'blob', outer:[[-90,-40],[-30,-95],[60,-80],[95,-5],[55,75],[-25,95],[-85,45]], pick:[[-1,-1],[0.2,1]]},
  {key:'L', outer:[[-70,-95],[10,-95],[10,25],[95,25],[95,95],[-70,95]], pick:[[-1,-1],[-1,0.6]]},
  {key:'leaf', outer:rotPoly(leafPoly(70),-0.38), pick:[[-1,-1],[0.2,1]]},
  {key:'gun', outer:[[-95,-70],[55,-70],[55,-30],[30,-30],[58,70],[8,78],[-10,-30],[-95,-30]], pick:[[-1,-1],[1,0.3]]},
  {key:'moon', outside:true, outer:crescentPoly(100,88,30,200), pick:[[-1,-1],[-1,0.6]]},
  {key:'ring', outside:true, outer:circlePoly(0,0,100,180), holes:[circlePoly(0,0,56,140)], pick:[[-1,-1],[0.2,1]]}
];
/* one common scale so a plate hung from any edge point still fits the canvas */
const SCL=0.82;
const SHMAP={};
SHAPES.forEach(function(s){
  s.outer = s.outer.map(function(q){ return [q[0]*SCL, q[1]*SCL]; });
  if(s.holes) s.holes = s.holes.map(function(h){ return h.map(function(q){ return [q[0]*SCL, q[1]*SCL]; }); });
  s.cg = shapeCG(s);
  s.bb = bboxOf(s);
  s.diag = Math.hypot(s.bb.w, s.bb.h);
  s.tol = Math.max(12, s.diag*0.06);
  s.offC = Math.hypot(s.cg.x-s.bb.cx, s.cg.y-s.bb.cy);
  s.onBoard = inShape(s, s.cg.x, s.cg.y);
  SHMAP[s.key]=s;
});
function shName(s){ return t('n_'+s.key); }

/* ============================================================
   Suspension rig (shared by demo lab, compare and game)
============================================================ */
function newRig(cv, W, H, cfg){
  return {
    cv:cv, ctx:cv.getContext('2d'), W:W, H:H,
    x0:cfg.x0, x1:cfg.x1, ceilY:cfg.ceilY, PIN:cfg.pin, floorY:cfg.floorY,
    vs:cfg.vs, tm:cfg.tm||1,
    sh:null, P:null, phase:'idle', pIdx:0,
    pose:{aL:[0,0], aS:[cfg.pin[0], cfg.idleY], phi:0}, idleY:cfg.idleY,
    om:0, target:0, swingT:0, liftU:0, liftFrom:[0,0],
    lines:[], cross:null, guess:null, ok:null,
    sup:null, balOK:true, balT:0, balSgn:1
  };
}
/* local (plate) coords → screen coords, with the rig's view scale */
function L2S(pt,pose,vs){
  vs=vs||1;
  const c=Math.cos(pose.phi), s=Math.sin(pose.phi);
  const dx=(pt[0]-pose.aL[0])*vs, dy=(pt[1]-pose.aL[1])*vs;
  return {x:pose.aS[0]+dx*c-dy*s, y:pose.aS[1]+dx*s+dy*c};
}
function S2L(x,y,pose,vs){
  vs=vs||1;
  const c=Math.cos(pose.phi), s=Math.sin(pose.phi);
  const dx=(x-pose.aS[0])/vs, dy=(y-pose.aS[1])/vs;
  return [pose.aL[0]+dx*c+dy*s, pose.aL[1]-dx*s+dy*c];
}
function wrapPi(a){ while(a>Math.PI)a-=2*Math.PI; while(a<=-Math.PI)a+=2*Math.PI; return a; }
/* target angle: turn "CG relative to pivot" to point straight down (+y on screen) */
function targetPhi(sh,P,phiNow){
  const a=Math.atan2(sh.cg.y-P[1], sh.cg.x-P[0]);
  return phiNow + wrapPi(Math.PI/2 - a - phiNow);
}
function rigSetShape(R,sh){
  R.sh=sh; R.P=null; R.phase='idle'; R.lines=[]; R.cross=null; R.guess=null; R.ok=null;
  R.om=0; R.swingT=0; R.pIdx=0;
  R.pose={aL:[sh.bb.cx, sh.bb.cy], aS:[R.PIN[0], R.idleY], phi:0};
}
function rigPickPoint(R,sx,sy){
  if(!R.sh) return false;
  const loc=S2L(sx,sy,R.pose,R.vs);
  const p=nearestOnEdge(R.sh,loc[0],loc[1]);
  if(Math.hypot(p[0]-R.sh.cg.x, p[1]-R.sh.cg.y) < 6) return false;
  R.P=p;
  if(R.phase==='balance') R.phase='rest';
  return true;
}
function rigPickDir(R,dir){
  if(!R.sh) return false;
  R.P = nearestOnEdge(R.sh, dir[0]*1000, dir[1]*1000);
  return true;
}
/* release: first align the pivot in place with the string end, then lift it up */
function rigHang(R){
  if(!R.sh||!R.P) return false;
  if(R.phase==='lift'||R.phase==='swing') return false;
  const now=L2S(R.P,R.pose,R.vs);
  R.pose.aL=[R.P[0],R.P[1]];
  R.pose.aS=[now.x,now.y];
  R.liftFrom=[now.x,now.y];
  R.pIdx=R.lines.length;
  R.liftU=0; R.phase='lift'; R.swingT=0;
  return true;
}
function rigStartSwing(R){
  R.pose.aS=[R.PIN[0],R.PIN[1]];
  R.target=targetPhi(R.sh,R.P,R.pose.phi);
  const d=Math.abs(wrapPi(R.pose.phi-R.target));
  R.om = (d<0.15) ? 1.15 : 0;
  R.phase='swing'; R.swingT=0;
}
function rigSnap(R){
  const k=Math.round((R.pose.phi-R.target)/(2*Math.PI));
  R.pose.phi=R.target+2*Math.PI*k;
  R.om=0; R.phase='rest';
}
/* damped pendulum about the pivot, converging on "CG straight below" */
function rigStep(R,dt0){
  const dt = dt0*R.tm;
  if(R.phase==='lift'){
    R.liftU=Math.min(1,R.liftU+dt*2.4);
    const u=R.liftU, e=u*u*(3-2*u);
    R.pose.aS=[R.liftFrom[0]+(R.PIN[0]-R.liftFrom[0])*e, R.liftFrom[1]+(R.PIN[1]-R.liftFrom[1])*e];
    if(R.liftU>=1) rigStartSwing(R);
    return;
  }
  if(R.phase==='swing'){
    R.swingT+=dt;
    const steps=3, h=dt/steps;
    for(let i=0;i<steps;i++){
      const d=R.pose.phi-R.target;
      R.om += (-30*Math.sin(d) - 1.9*R.om)*h;
      R.pose.phi += R.om*h;
    }
    const dd=Math.abs(wrapPi(R.pose.phi-R.target));
    if((dd<0.005 && Math.abs(R.om)<0.03) || R.swingT>7) rigSnap(R);
    return;
  }
  if(R.phase==='balance'){ R.balT+=dt; return; }
}
/* draw the plumb line onto the plate (plate-local, so it turns with the plate) */
function rigDrawLine(R){
  if(R.phase!=='rest'||!R.P) return 'notrest';
  const dx=R.sh.cg.x-R.P[0], dy=R.sh.cg.y-R.P[1], L=Math.hypot(dx,dy);
  if(L<6) return 'toonear';
  const nd=[dx/L,dy/L];
  for(let i=0;i<R.lines.length;i++){
    const cr=Math.abs(R.lines[i].d[0]*nd[1]-R.lines[i].d[1]*nd[0]);
    if(cr<0.17) return 'dup';           /* within about 10 degrees of an existing line */
  }
  R.lines.push({p:[R.P[0],R.P[1]], d:nd});
  if(R.lines.length>=2 && !R.cross){
    for(let i=0;i<R.lines.length&&!R.cross;i++)
      for(let j=i+1;j<R.lines.length;j++){
        const x=lineX(R.lines[i],R.lines[j]);
        if(x){ R.cross=x; break; }
      }
  }
  return 'ok';
}
/* a support point that is clearly NOT the CG (still on the plate) */
function offPoint(sh){
  const c=sh.cg; let far=sh.outer[0], fd=-1;
  sh.outer.forEach(function(q){
    const d=(q[0]-c.x)*(q[0]-c.x)+(q[1]-c.y)*(q[1]-c.y);
    if(d>fd){ fd=d; far=q; }
  });
  const ts=[0.55,0.45,0.65,0.35,0.75];
  for(let i=0;i<ts.length;i++){
    const p=[c.x+(far[0]-c.x)*ts[i], c.y+(far[1]-c.y)*ts[i]];
    if(inShape(sh,p[0],p[1]) && Math.hypot(p[0]-c.x,p[1]-c.y)>26) return p;
  }
  const q=[c.x+(far[0]-c.x)*0.9, c.y+(far[1]-c.y)*0.9];
  return inShape(sh,q[0],q[1])?q:[far[0],far[1]];
}
function rigBalance(R,onCG){
  if(!R.sh) return;
  R.sup = onCG ? [R.sh.cg.x,R.sh.cg.y] : offPoint(R.sh);
  R.balOK=!!onCG; R.balT=0;
  R.balSgn = (R.sh.cg.x-R.sup[0])>=0 ? 1 : -1;
  R.phase='balance';
}
function balPose(R){
  const u = R.balOK ? 0 : clamp((R.balT-0.55)/1.5,0,1);
  return {
    ax:R.PIN[0], ay:R.floorY-140,
    tilt: R.balOK ? Math.sin(R.balT*3.1)*0.022 : R.balSgn*0.62*u,
    drop: R.balOK ? 0 : 130*u*u,
    sq:0.54, u:u
  };
}
function balPos(R,px,py,bp){
  const dx=(px-R.sup[0])*R.vs, dy=(py-R.sup[1])*R.vs;
  const c=Math.cos(bp.tilt), s=Math.sin(bp.tilt);
  return {x: bp.ax + (dx*c-dy*s), y: bp.ay + bp.drop + (dx*s+dy*c)*bp.sq};
}
/* θ — the signature reading: angle between (pivot→CG) and straight down */
function thetaOf(R){
  if(!R.sh || !R.P) return null;
  const A=L2S(R.P,R.pose,R.vs), G=L2S([R.sh.cg.x,R.sh.cg.y],R.pose,R.vs);
  const dx=G.x-A.x, dy=G.y-A.y;
  if(Math.hypot(dx,dy)<1e-6) return 0;
  return Math.abs(wrapPi(Math.atan2(dx,dy)))*180/Math.PI;
}
function pinDist(R){
  if(!R.sh||!R.P) return null;
  return Math.hypot(R.sh.cg.x-R.P[0], R.sh.cg.y-R.P[1]);
}

/* ============================================================
   Drawing the rig
============================================================ */
function addPoly(g,p){
  g.moveTo(p[0][0],p[0][1]);
  for(let i=1;i<p.length;i++) g.lineTo(p[i][0],p[i][1]);
  g.closePath();
}
function shapeOuterPath(g,s){ g.beginPath(); addPoly(g,s.outer); }
function drawPlate(g,s,lines,lw){
  shapeOuterPath(g,s);
  g.fillStyle=C().board; g.fill();
  g.strokeStyle=C().boardEdge; g.lineWidth=lw||3; g.lineJoin='round'; g.stroke();
  const hs=s.holes||[];
  for(let i=0;i<hs.length;i++){
    g.beginPath(); addPoly(g,hs[i]);
    g.fillStyle=C().boardHole; g.fill();
    g.strokeStyle=C().boardEdge; g.lineWidth=lw||3; g.stroke();
  }
  const cols=[C().line1,C().line2,C().line3];
  for(let i=0;i<lines.length;i++){
    const ln=lines[i], col=cols[i%3];
    line(g, ln.p[0]-ln.d[0]*6, ln.p[1]-ln.d[1]*6, ln.p[0]+ln.d[0]*s.diag, ln.p[1]+ln.d[1]*s.diag, col, 2.6);
    circle(g, ln.p[0], ln.p[1], 4.5, col, null, 0);
  }
}
function cgMark(g,x,y,r){
  const rr=r||11;
  circle(g,x,y,rr,C().pill,C().cg,3);
  g.strokeStyle=C().cg; g.lineWidth=2.6;
  g.beginPath();
  g.moveTo(x-rr,y); g.lineTo(x+rr,y); g.moveTo(x,y-rr); g.lineTo(x,y+rr);
  g.stroke();
}
function boxMark(g,x,y){
  g.strokeStyle=C().boxc; g.lineWidth=2;
  g.beginPath();
  g.moveTo(x-9,y); g.lineTo(x+9,y); g.moveTo(x,y-9); g.lineTo(x,y+9);
  g.stroke();
}
/* the hanging scene: stand, string, swinging plate, θ wedge */
function drawScene(g,R,opt){
  const W=R.W, H=R.H;
  if(!R.sh) return;
  if(R.phase==='balance'){ drawBalance(g,R,opt); return; }
  const hung=(R.phase==='lift'||R.phase==='swing'||R.phase==='rest');

  /* stand / ceiling */
  const cw=R.x1-R.x0-40;
  g.fillStyle=C().stand; g.fillRect(R.x0+20,R.ceilY,cw,16);
  g.strokeStyle=C().standEdge; g.lineWidth=2.2; g.strokeRect(R.x0+20,R.ceilY,cw,16);
  g.strokeStyle=C().standEdge; g.lineWidth=2; g.beginPath();
  for(let x=R.x0+30;x<R.x1-22;x+=16){ g.moveTo(x,R.ceilY); g.lineTo(x-8,R.ceilY-8); }
  g.stroke();
  const hookY=R.ceilY+16;
  circle(g,R.PIN[0],hookY+5,5,C().standEdge,null,0);

  /* plumb guide + string */
  if(hung){
    line(g,R.PIN[0],R.PIN[1],R.PIN[0],R.floorY,C().plumb,2,[7,6]);
    line(g,R.PIN[0],hookY+5,R.pose.aS[0],R.pose.aS[1],C().string,2.6);
  }

  /* plate */
  g.save();
  g.translate(R.pose.aS[0],R.pose.aS[1]);
  g.rotate(R.pose.phi);
  g.scale(R.vs,R.vs);
  g.translate(-R.pose.aL[0],-R.pose.aL[1]);
  drawPlate(g,R.sh,R.lines,3/R.vs*1.15);
  g.restore();

  /* pivot hole */
  const Ps = R.P ? L2S(R.P,R.pose,R.vs) : null;
  if(Ps) circle(g,Ps.x,Ps.y,6,C().pill,C().pin,2.8);

  /* θ wedge between the plumb line and pivot→CG */
  const Cs = R.sh ? L2S([R.sh.cg.x,R.sh.cg.y],R.pose,R.vs) : null;
  if(Ps && Cs && opt.showTheta){
    const ang=Math.atan2(Cs.y-Ps.y, Cs.x-Ps.x);
    const dd=wrapPi(ang-Math.PI/2);
    const rad=clamp(Math.hypot(Cs.x-Ps.x,Cs.y-Ps.y)*0.55, 22, 74);
    line(g,Ps.x,Ps.y,Cs.x,Cs.y,C().theta,2,[6,5]);
    if(Math.abs(dd)>0.012){
      g.beginPath();
      g.arc(Ps.x,Ps.y,rad,Math.PI/2,Math.PI/2+dd,dd<0);
      g.strokeStyle=C().theta; g.lineWidth=2.4; g.stroke();
    }
  }

  /* CG marker + guess cross */
  if(opt.showCG && Cs) cgMark(g,Cs.x,Cs.y);
  if(R.guess){
    const q=L2S(R.guess,R.pose,R.vs);
    const col=(R.ok===null)?C().theta:(R.ok?C().good:C().bad);
    g.strokeStyle=col; g.lineWidth=3.2;
    g.beginPath();
    g.moveTo(q.x-10,q.y-10); g.lineTo(q.x+10,q.y+10);
    g.moveTo(q.x+10,q.y-10); g.lineTo(q.x-10,q.y+10);
    g.stroke();
    if(opt.showCG && Cs && R.ok===false) line(g,q.x,q.y,Cs.x,Cs.y,C().bad,2,[5,4]);
  }

  /* ---- labels ---- */
  labText(g,t('cvStand'),[[R.x0+26,R.ceilY-16]],'700 14px '+CV_FONT,C().cvTextDim,'left',W,H);
  if(hung) labText(g,t('cvPlumb'),[[R.PIN[0]+10,R.floorY-16],[R.PIN[0]-10,R.floorY-16]],'700 14px '+CV_FONT,C().plumb,(R.PIN[0]>W/2?'right':'left'),W,H);
  if(opt.showCG && Cs)
    tchip(g,t('cvCG'),[[Cs.x+62,Cs.y],[Cs.x-62,Cs.y],[Cs.x,Cs.y+34],[Cs.x,Cs.y-34]],'700 14px '+CV_FONT,C().cg,W,H);
  if(Ps){
    const key = hung ? tf('cvPin',{k:'ABC'.charAt(Math.min(2,R.pIdx))}) : t('cvPinSel');
    tchip(g,key,[[Ps.x+58,Ps.y-20],[Ps.x-58,Ps.y-20],[Ps.x+58,Ps.y+22],[Ps.x-58,Ps.y+22]],'700 14px '+CV_FONT,C().pin,W,H);
  }
  if(opt.showTheta && Ps){
    const th=thetaOf(R);
    if(th!==null) tchip(g,tf('cvTheta',{th:f1(th)}),[[Ps.x+4,Ps.y+58],[Ps.x+4,Ps.y-58]],'900 17px '+CV_FONT,C().theta,W,H);
  }
  if(R.guess && opt.guessLabel){
    const q=L2S(R.guess,R.pose,R.vs);
    tchip(g,t('cvGuess'),[[q.x,q.y+32],[q.x,q.y-32],[q.x+58,q.y]],'700 13px '+CV_FONT,C().theta,W,H);
  }
  if(opt.tip) tchip(g,opt.tip,[[R.PIN[0],R.floorY+22]],'700 15px '+CV_FONT,C().cvText,W,H);
}
function drawBalance(g,R,opt){
  const W=R.W,H=R.H, bp=balPose(R);
  line(g,R.x0+30,bp.ay,R.x1-30,bp.ay,C().tableLine,2);
  g.save();
  g.translate(bp.ax, bp.ay+bp.drop);
  g.scale(1,bp.sq);
  g.rotate(bp.tilt);
  g.scale(R.vs,R.vs);
  g.translate(-R.sup[0],-R.sup[1]);
  drawPlate(g,R.sh,R.lines,3.4/R.vs);
  g.restore();
  const c=balPos(R,R.sh.cg.x,R.sh.cg.y,bp);
  cgMark(g,c.x,c.y);
  /* finger */
  g.fillStyle=C().skin; rrect(g,bp.ax-14,bp.ay+4,28,104,14); g.fill();
  g.strokeStyle=C().skinEdge; g.lineWidth=2.4; rrect(g,bp.ax-14,bp.ay+4,28,104,14); g.stroke();
  circle(g,bp.ax,bp.ay+2,4.5,C().cvText,null,0);

  labText(g,t('cvFinger'),[[bp.ax+22,bp.ay+56],[bp.ax-22,bp.ay+56]],'800 14px '+CV_FONT,C().cvTextDim,(bp.ax>W/2?'right':'left'),W,H);
  tchip(g,t('cvCG'),[[c.x+62,c.y],[c.x-62,c.y],[c.x,c.y-34],[c.x,c.y+34]],'700 14px '+CV_FONT,C().cg,W,H);
  tchip(g, R.balOK ? t('cvBalOK') : t('cvBalNG'), [[R.PIN[0],R.ceilY+60]],
    '800 17px '+CV_FONT, R.balOK?C().good:C().bad, W, H);
}
/* the flat "paper view": plate unrotated, with the lines and the crossing point */
function drawFlat(g,R,cx,cy,vs,W,H,showCross){
  const s=R.sh;
  if(!s) return;
  g.save();
  g.translate(cx,cy); g.scale(vs,vs); g.translate(-s.bb.cx,-s.bb.cy);
  drawPlate(g,s,R.lines,3/vs);
  g.restore();
  const M = p => ({x:cx+(p[0]-s.bb.cx)*vs, y:cy+(p[1]-s.bb.cy)*vs});
  for(let i=0;i<R.lines.length;i++){
    const ln=R.lines[i];
    const q=M([ln.p[0]+ln.d[0]*s.diag*0.62, ln.p[1]+ln.d[1]*s.diag*0.62]);
    tchip(g,tf('cvLineN',{k:'①②③'.charAt(i)}),[[q.x,q.y],[q.x+44,q.y],[q.x-44,q.y],[q.x,q.y+26]],
      '700 13px '+CV_FONT,[C().line1,C().line2,C().line3][i%3],W,H);
  }
  if(showCross && R.cross){
    const q=M([R.cross.x,R.cross.y]);
    cgMark(g,q.x,q.y);
    tchip(g,t('cvCG'),[[q.x+60,q.y],[q.x-60,q.y],[q.x,q.y-32],[q.x,q.y+32]],'700 14px '+CV_FONT,C().cg,W,H);
  }
}

const W_W=1000, W_H=500;
const labCv=$('cv-lab'), labCtx=labCv.getContext('2d');

const FLAT = {cx:780, cy:250, vs:1.3, x0:588, y0:56, x1:972, y1:456};
let FLASH=null, CONCL=null, WARN=null;

function drawLab(){
  const g=labCtx;
  g.setTransform(1,0,0,1,0,0);
  g.clearRect(0,0,labCv.width,labCv.height);
  g.setTransform(SC,0,0,SC,0,0);

  g.strokeStyle=C().panelLine; g.lineWidth=1.4; g.stroke();

  let tip='';
  if(!inGame){
    if(!D.P && D.phase==='idle') tip=t('cvClick');
    else if(D.phase==='swing'||D.phase==='lift') tip=t('cvSwing');
    else if(D.phase==='rest' && D.lines.length<2) tip=t('cvDrawNow');
  } else {
    tip = GAME.phase==='guess' ? t('gGoalGuess') : (GAME.phase==='verify' ? t('gGoalVerify') : '');
  }
  drawScene(g,D,{showCG:showCG, showTheta:(D.phase!=='balance'), tip:tip, guessLabel:true});
  drawFlat(g,D,FLAT.cx,FLAT.cy,FLAT.vs,W_W,W_H,showCG);

  /* paper-view footer text */
  const foot = D.cross
    ? tf('cvCross',{x:f1(D.cross.x), y:f1(D.cross.y)})

  labText(g,foot,[[FLAT.cx,FLAT.y1-22]],'700 16px '+CV_FONT, D.cross?C().cg:C().cvTextDim,'center',W_W,W_H);

    labText(g, shName(D.sh) + (D.sh.outside ? '　'+t('cvOff') : ''),
      [[FLAT.cx,FLAT.y0+24]],'700 16px '+CV_FONT, D.sh.outside?C().bad:C().cvText,'center',W_W,W_H);
  }
}


/* 步骤指引：done = 已完成, cur = 当前该做的那一步 */
function renderSteps(){
  const box=$('l-steps'); if(!box) return;
  const n=D.lines.length;
  const done=[ !!D.P, (D.phase==='rest'||D.phase==='balance'||n>=1), n>=1, n>=2, !!D.cross ];
  let cur=done.indexOf(false);
  const html=[1,2,3,4,5].map(function(i){
    const cls = done[i-1] ? 'done' : (i-1===cur ? 'cur' : '');
    return '<li class="'+cls+'">'+t('sp'+i)+'</li>';
  }).join('');
  if(box.__h!==html){ box.innerHTML=html; box.__h=html; }
}

/* ---------- sidebar / messages ---------- */
function stKeys(){
  if(D.phase==='balance') return D.balOK ? ['stBalOKT','stBalOKS'] : ['stBalNGT','stBalNGS'];
  if(D.phase==='lift') return ['stLiftT','stLiftS'];
  if(D.phase==='swing') return ['stSwingT','stSwingS'];
  if(D.phase==='rest') return ['stRestT','stRestS'];
  return D.P ? ['stPickT','stPickS'] : ['stIdleT','stIdleS'];
}
function labUI(){
  renderSteps();
  const k=stKeys(), bd=$('l-state'), chip=t(k[0])+'<small>'+t(k[1])+'</small>';
  if(bd && chip!==lastChip){
    bd.innerHTML = chip; lastChip = chip;
    const col = D.phase==='rest' ? '#1d7a3a' : (D.phase==='balance' ? (D.balOK?'#1d7a3a':'#b8432f') : (D.phase==='swing'||D.phase==='lift') ? 'var(--gold-ink)' : '#2f6690');
    bd.style.color=col; bd.style.borderColor=col;
  }
  /* buttons */
  const canHang = !!(D.sh && D.P && (D.phase==='idle'||D.phase==='rest'||D.phase==='balance'));
  if($('btn-hang')) $('btn-hang').disabled = !canHang;
  if($('btn-line')) $('btn-line').disabled = !(D.phase==='rest' && D.lines.length<3);
  if($('btn-again')) $('btn-again').disabled = !(D.phase==='rest' && D.lines.length>=1);
  if($('btn-bal')) $('btn-bal').disabled = !D.cross;
  if($('btn-bad')) $('btn-bad').disabled = !D.cross;
  if($('gm-hang')) $('gm-hang').disabled = !(canHang && GAME.phase==='verify');
  if($('gm-line')) $('gm-line').disabled = !(D.phase==='rest' && D.lines.length<3 && GAME.phase==='verify');
  renderMsg();
}
let lastMsg='', lastChip='';
function renderMsg(){
  const th=thetaOf(D), d=pinDist(D);
  const flash = FLASH ? '<em>'+t(FLASH)+'</em><br>' : '';
  const warn = WARN ? t(WARN)+'<br>' : '';
  /* θ 只有真正挂起来后才有意义，没数值时不占版面 */
  const formula = (th===null) ? '' : tf('f_theta',{th:f1(th), d: d===null?'--':f1(d)})+'<br>';
  let live;
  if(D.phase==='balance') live = D.balOK ? t('live_balok') : t('live_balng');
  else if(D.phase==='rest') live = t('live_rest');
  else if(D.phase==='swing'||D.phase==='lift') live = t('live_swing');
  else if(D.P) live = tf('live_pick',{th: th===null?'--':f1(th)});
  else live = t('live_idle');
  const tip = D.lines.length>=2 ? t('tip_done')
            : D.lines.length===1 ? tf('tip_need2',{n:1})
            : t('tip_first');
  const box=$('l-status'), html = warn + flash + formula + live + '<br>' + tip;
  if(box && html!==lastMsg){ box.innerHTML = html; lastMsg = html; }
  const cb=$('l-conclude');
  if(cb){
    if(CONCL){ cb.innerHTML = t(CONCL); cb.classList.add('on'); }
    else cb.classList.remove('on');
  }
}
function pickShape(k){
  const s=SHMAP[k];
  if(!s) return;
  SCRIPT=null;
  rigSetShape(D,s);
  FLASH=null; CONCL=null; WARN=null;
  document.querySelectorAll('.sbtn[data-sh]').forEach(b=>b.classList.toggle('pick', b.dataset.sh===k));
  labUI();
}
function labHang(){
  WARN=null; FLASH=null;
  if(rigHang(D)) labUI();
}
function labLine(){
  const r=rigDrawLine(D);
  if(r==='dup'){ WARN='w_dup'; CONCL='c_dup'; }
  else if(r==='toonear'){ WARN='w_near'; }
  else if(r==='ok'){
    WARN=null;
    if(D.lines.length===1) FLASH='r_line1';
    else if(D.cross){ FLASH='r_cross'; CONCL = D.sh.outside ? 'c_outside' : 'c_cross'; }
  }
  labUI();
}
function labAgain(){
  FLASH=null;
  WARN='w_again';
  labUI();
}
function labBal(onCG){
  if(!D.cross) return;
  SCRIPT=null;
  rigBalance(D,onCG);
  FLASH=null; WARN=null;
  CONCL = onCG ? 'c_balok' : 'c_balng';
  labUI();
}
function labReset(){
  SCRIPT=null;
  rigSetShape(D, D.sh||SHAPES[0]);
  FLASH=null; CONCL=null; WARN=null;
  labUI();
}
labCv.addEventListener('pointerdown', function(ev){
  const p=ptr(ev,labCv,SC);
  const inGame=$('panel-game').classList.contains('on');
  if(inGame && GAME.phase==='guess'){ gameGuess(p.x,p.y); return; }
  if(D.phase==='lift'||D.phase==='swing') return;
  if(p.x>FLAT.x0) return;               /* the paper view is read-only in lab mode */
  SCRIPT=null;
  if(rigPickPoint(D,p.x,p.y)){ WARN=null; FLASH=null; labUI(); }
});

/* ---------- one-click presets (was the static 4-step / myth-buster cards) ---------- */
const PRESETS = {
  pr1:{ sh:'blob', hangs:2 }, pr2:{ sh:'moon', hangs:2 }, pr3:{ sh:'ring', hangs:2 },
  pr4:{ sh:'L', hangs:2, same:true }, pr5:{ sh:'square', hangs:2 }
};
let SCRIPT=null;
function runPreset(id){
  const p=PRESETS[id];
  if(!p) return;
  setMode('lab');
  pickShape(p.sh);
  CONCL=id+'why';
  SCRIPT={ id:id, step:0, wait:0.4, same:!!p.same };
  const btn=document.querySelector('#ctl-lab [data-p="'+id+'"]');
  if(btn){ btn.classList.remove('flash'); void btn.offsetWidth; btn.classList.add('flash');
    setTimeout(()=>btn.classList.remove('flash'), 1800); }
  labUI();
}
function scriptStep(dt){
  if(!SCRIPT) return;
  if(SCRIPT.wait>0){ SCRIPT.wait-=dt; return; }
  const s=D.sh;
  if(SCRIPT.step===0){ rigPickDir(D,s.pick[0]); SCRIPT.step=1; SCRIPT.wait=0.5; labUI(); return; }
  if(SCRIPT.step===1){ rigHang(D); SCRIPT.step=2; labUI(); return; }
  if(SCRIPT.step===2){ if(D.phase==='rest'){ SCRIPT.step=3; SCRIPT.wait=0.5; } return; }
  if(SCRIPT.step===3){ labLine(); SCRIPT.step=4; SCRIPT.wait=0.9; return; }
  if(SCRIPT.step===4){ rigPickDir(D, SCRIPT.same ? s.pick[0] : s.pick[1]); SCRIPT.step=5; SCRIPT.wait=0.5; labUI(); return; }
  if(SCRIPT.step===5){ rigHang(D); SCRIPT.step=6; labUI(); return; }
  if(SCRIPT.step===6){ if(D.phase==='rest'){ SCRIPT.step=7; SCRIPT.wait=0.5; } return; }
  if(SCRIPT.step===7){ labLine(); CONCL=SCRIPT.id+'why'; renderMsg(); SCRIPT=null; return; }
}

/* ============================================================
   Tab 3: Class quiz
============================================================ */
const QUIZ_TIME=20;
let qIdx=0, qScore=0, qDone=[], qTimer=null, qLeft=0;
function stopTimer(){ if(qTimer){ clearInterval(qTimer); qTimer=null; } }
function startTimer(){
  stopTimer();
  qLeft=QUIZ_TIME;
  const bar=$('q-timer-bar');
  bar.style.width='100%';
  $('q-timer').classList.remove('low');
  qTimer=setInterval(function(){
    qLeft-=0.1;
    bar.style.width=Math.max(0,qLeft/QUIZ_TIME*100)+'%';
    if(qLeft<=5) $('q-timer').classList.add('low');
    if(qLeft<=0){ stopTimer(); timeUpQ(); }
  },100);
}
function renderQ(){
  const item=QUIZ()[qIdx];
  $('q-emoji').textContent=item.e;
  $('q-text').innerHTML=(qIdx+1)+'. '+item.q;
  $('q-exp').innerHTML='';
  $('q-next').style.display='none';
  $('q-restart').style.display='none';
  const box=$('q-opts');
  box.innerHTML='';
  item.o.forEach(function(opt,i){
    const b=document.createElement('button');
    b.className='qbtn';
    b.textContent='ABC'[i]+'. '+opt;
    b.onclick=function(){ answerQ(i,b); };
    box.appendChild(b);
  });
  renderProg();
  $('q-score-n').textContent=qScore;
  if(qDone[qIdx]!==undefined){
    const btns=[].slice.call(box.children);
    btns.forEach(b=>b.disabled=true);
    btns[item.a].classList.add('right');
    $('q-exp').innerHTML=item.x;
    if(qIdx<QUIZ().length-1) $('q-next').style.display='inline-block';
    else $('q-restart').style.display='inline-block';
  } else startTimer();
}
function renderProg(){
  $('q-prog').innerHTML=QUIZ().map(function(_,i){
    return '<div class="qdot '+(i===qIdx?'cur ':'')+(qDone[i]===true?'right':qDone[i]===false?'wrong':'')+'"></div>';
  }).join('');
}
function finishQ(prefix,correct){
  stopTimer();
  const item=QUIZ()[qIdx];
  qDone[qIdx]=correct;
  if(correct) qScore++;
  const btns=[].slice.call($('q-opts').children);
  btns.forEach(b=>b.disabled=true);
  btns[item.a].classList.add('right');
  $('q-exp').innerHTML=prefix+item.x;
  renderProg();
  $('q-score-n').textContent=qScore;
  if(qIdx<QUIZ().length-1) $('q-next').style.display='inline-block';
  else{
    const pct=qScore/QUIZ().length;
    const msg=pct===1?t('resGold'):pct>=0.7?t('resGood'):t('resTry');
    $('q-exp').innerHTML+='<br><em>'+qScore+' / '+QUIZ().length+' — '+msg+'</em>';
    $('q-restart').style.display='inline-block';
  }
}
function answerQ(i,btn){
  if(qDone[qIdx]!==undefined) return;
  const item=QUIZ()[qIdx];
  const correct=i===item.a;
  if(!correct) btn.classList.add('wrong');
  finishQ(correct?t('rRight')+' ':t('rWrong')+' ', correct);
}
function timeUpQ(){
  if(qDone[qIdx]!==undefined) return;
  finishQ(t('timeUp')+' ', false);
}
function nextQ(){ qIdx++; renderQ(); }
function restartQ(){ qIdx=0; qScore=0; qDone=[]; renderQ(); }

/* ============================================================
   Tab 4: Guess-the-CG challenge (template A — reuses the lab canvas)
============================================================ */
const GAME_ROUNDS=3, GAME_TIME=60;
const GAME={ round:0, score:0, phase:'guess', left:GAME_TIME, timer:null, order:[], err:null, pts:0, reveal:false };
function stopGTimer(){ if(GAME.timer){ clearInterval(GAME.timer); GAME.timer=null; } }
function startGame(){
  GAME.round=0; GAME.score=0;
  $('g-score').textContent=0;
  const idx=SHAPES.map(function(_,i){ return i; });
  for(let i=idx.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const tmp=idx[i]; idx[i]=idx[j]; idx[j]=tmp; }
  GAME.order=idx.slice(0,GAME_ROUNDS);
  nextRound();
}
function nextRound(){
  GAME.round++;
  GAME.phase='guess'; GAME.err=null; GAME.pts=0; GAME.reveal=false;
  GAME.left=GAME_TIME;
  const s=SHAPES[GAME.order[GAME.round-1]];
  rigSetShape(D,s);
  FLASH=null; CONCL=null; WARN=null;
  document.querySelectorAll('.sbtn[data-sh]').forEach(b=>b.classList.toggle('pick', b.dataset.sh===s.key));
  $('g-status').innerHTML=tf('gGo',{r:GAME.round, n:shName(s)});
  gameSync();
  stopGTimer();
  GAME.timer=setInterval(function(){
    GAME.left--;
    $('g-time').textContent=Math.max(0,GAME.left);
    $('g-time').classList.toggle('low', GAME.left<=10);
    if(GAME.left<=0) endRound('time');
  },1000);
}
function gameGuess(wx,wy){
  if(GAME.phase!=='guess'||!D.sh) return;
  let loc=null;
  if(wx>FLAT.x0){
    loc=[ (wx-FLAT.cx)/FLAT.vs + D.sh.bb.cx, (wy-FLAT.cy)/FLAT.vs + D.sh.bb.cy ];
  } else {
    loc=S2L(wx,wy,D.pose,D.vs);
  }
  D.guess=loc; D.ok=null;
  GAME.err=Math.hypot(loc[0]-D.sh.cg.x, loc[1]-D.sh.cg.y);
  GAME.phase='verify';
  $('g-status').innerHTML=t('gLocked');
  gameSync();
}
function gameHang(){ labHang(); gameSync(); }
function gameLine(){
  labLine();
  if(D.cross && GAME.phase==='verify') endRound('win');
  gameSync();
}
function endRound(how){
  stopGTimer();
  const s=D.sh;
  if(how==='win'){
    GAME.reveal=true;
    D.ok = GAME.err<=s.tol;
    const e=GAME.err;
    GAME.pts = e<=s.tol?100 : e<=2*s.tol?70 : e<=3*s.tol?40 : 10;
    GAME.score+=GAME.pts;
    const msg = e<=s.tol?t('gPerfect') : e<=2*s.tol?t('gClose') : t('gMiss');
    $('g-status').innerHTML=tf('gWin',{e:f1(e), t:f1(s.tol), p:GAME.pts, msg:msg});
  } else if(how==='time'){
    GAME.reveal=true;
    if(GAME.err===null){ $('g-status').innerHTML=t('gNoGuess'); }
    else{
      D.ok = GAME.err<=s.tol;
      GAME.pts = GAME.err<=s.tol?50 : GAME.err<=2*s.tol?30 : 10;
      GAME.score+=GAME.pts;
      $('g-status').innerHTML=tf('gTimeUp',{p:GAME.pts});
    }
  } else {
    GAME.reveal=true;
    $('g-status').innerHTML=t('gSkipped');
  }
  $('g-score').textContent=GAME.score;
  GAME.phase = GAME.round>=GAME_ROUNDS ? 'done' : 'next';
  if(GAME.phase==='done'){
    const rk = GAME.score>=250?t('gRank1') : GAME.score>=150?t('gRank2') : t('gRank3');
    $('g-status').innerHTML += '<br>'+t('gFinal')+' '+GAME.score+' — '+rk;
  }
  gameSync();
}
function gameAct(){
  if(GAME.phase==='guess'||GAME.phase==='verify') endRound('skip');
  else if(GAME.phase==='next') nextRound();
  else startGame();
}
function gameSync(){
  if(!$('g-round')) return;
  $('g-round').textContent=GAME.round;
  $('g-score').textContent=GAME.score;
  $('g-score-hud').textContent=GAME.score;
  $('g-time').textContent=Math.max(0,GAME.left);
  $('g-err').textContent = (GAME.reveal && GAME.err!==null) ? f1(GAME.err) : '--';
  const goal = GAME.phase==='guess' ? t('gGoalGuess') : t('gGoalVerify');
  $('g-goal-side').textContent=goal;
  $('g-goal-side').style.color = GAME.phase==='guess' ? '#b8432f' : '#2f6690';
  $('g-goal-hud').innerHTML='<b style="font-size:15px">'+goal+'</b>';
  $('g-act').textContent = (GAME.phase==='guess'||GAME.phase==='verify') ? t('gSkip')
                         : GAME.phase==='next' ? t('gNextRound') : t('gPlayAgain');
  const active = (GAME.phase==='verify');
  $('gm-hang').disabled = !(active && D.P && (D.phase==='idle'||D.phase==='rest'));
  $('gm-line').disabled = !(active && D.phase==='rest' && D.lines.length<3);
}

/* ============================================================
   Main loop & mode switching
============================================================ */
let lastT=performance.now();
function mainLoop(now){
  const dt=Math.min(0.04,(now-lastT)/1000);
  lastT=now;
  const labOn=$('panel-lab').classList.contains('on');
  const gameOn=$('panel-game').classList.contains('on');
  if(labOn||gameOn){
    const was=D.phase;
    if(labOn) scriptStep(dt);
    rigStep(D,dt);
    if(was!==D.phase && D.phase==='rest'){ FLASH='r_rest'; }
    drawLab();
    labUI();
    if(gameOn) gameSync();
  }
  requestAnimationFrame(mainLoop);
}
function setMode(m){
  stopTimer(); stopGTimer();
  SCRIPT=null;
  for(const id of ['lab','quiz','game']){
    $('tab-'+id).classList.toggle('on', id===m);
    $('panel-'+id).classList.toggle('on', id===m);
    $('ctl-'+id).classList.toggle('on', id===m);
    $('sb-'+id).classList.toggle('on', id===m);
  }
  if(m==='lab'){
    ($('panel-lab').querySelector('.cvarea')||$('panel-lab')).appendChild(labCv);
    D.guess=null; D.ok=null;
    labUI();
  }
  if(m==='quiz') renderQ();
  if(m==='game'){ $('game-cvhost').appendChild(labCv); startGame(); }
}

/* ---------- boot ---------- */
applyTheme();
applyLang();
syncExplain();
pickShape('blob');
renderQ();
setMode('lab');
requestAnimationFrame(mainLoop);
</script>

/* ============================================================
   Shared drawing helpers
============================================================ */
const CV_FONT = '"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
const SC = 2;
function ptr(ev, cv, sc){
  const r = cv.getBoundingClientRect();
  return { x:(ev.clientX-r.left)*cv.width/r.width/(sc||1), y:(ev.clientY-r.top)*cv.height/r.height/(sc||1) };
}
function rrect(c,x,y,w,h,r){
  c.beginPath();
  if(c.roundRect){ c.roundRect(x,y,w,h,r); return; }
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}
function circle(c,x,y,r,fill,stroke,lw){
  c.beginPath(); c.arc(x,y,r,0,Math.PI*2);
  if(fill){ c.fillStyle=fill; c.fill(); }
  if(stroke){ c.strokeStyle=stroke; c.lineWidth=lw||1.5; c.stroke(); }
}
function line(c,x1,y1,x2,y2,col,lw,dash){
  c.beginPath();
  if(c.setLineDash) c.setLineDash(dash||[]);
  c.moveTo(x1,y1); c.lineTo(x2,y2);
  c.strokeStyle=col; c.lineWidth=lw||1.5; c.stroke();
  if(c.setLineDash) c.setLineDash([]);
}
function TX(c,s,x,y,font,color,align,base){
  if(!isFinite(x)||!isFinite(y)) return;
  c.font=font; c.fillStyle=color; c.textAlign=align||'left'; c.textBaseline=base||'middle';
  c.fillText(s,x,y);
}
function fsOf(font){ const m=/(\d+(?:\.\d+)?)px/.exec(String(font)); return m?parseFloat(m[1]):14; }

/* ---- label bookkeeping: no overlap, always clamped inside the canvas ---- */
let LBLS=[];
function labelReset(){ LBLS=[]; }
function boxHit(a,b){ return !(a.x1<=b.x0 || b.x1<=a.x0 || a.y1<=b.y0 || b.y1<=a.y0); }
function boxFree(b){ for(let i=0;i<LBLS.length;i++) if(boxHit(LBLS[i],b)) return false; return true; }
/* pill-backed label; tries each candidate, finally clamps the first one into view */
function tchip(c,s,cands,font,color,W,H,bgOverride){
  if(!s) return false;
  c.font=font;
  const fs=fsOf(font), tw=c.measureText(s).width, w=tw+22, h=fs+13;
  const draw = (x,y)=>{
    rrect(c,x-w/2,y-h/2,w,h,h/2);
    c.fillStyle=bgOverride||C().pill; c.fill();
    c.strokeStyle=C().pillLine; c.lineWidth=1.2; c.stroke();
    TX(c,s,x,y,font,color,'center','middle');
    LBLS.push({x0:x-w/2-2,y0:y-h/2-2,x1:x+w/2+2,y1:y+h/2+2});
  };
  for(let i=0;i<cands.length;i++){
    const p=cands[i];
    if(!isFinite(p[0])||!isFinite(p[1])) continue;
    const b={x0:p[0]-w/2-2,y0:p[1]-h/2-2,x1:p[0]+w/2+2,y1:p[1]+h/2+2};
    if(b.x0<2||b.x1>W-2||b.y0<2||b.y1>H-2) continue;
    if(!boxFree(b)) continue;
    draw(p[0],p[1]); return true;
  }
  const p0=cands[0];
  if(!p0||!isFinite(p0[0])||!isFinite(p0[1])) return false;
  draw(clamp(p0[0], w/2+4, W-w/2-4), clamp(p0[1], h/2+4, H-h/2-4));
  return true;
}
function labText(c,s,cands,font,color,align,W,H){
  if(!s) return false;
  c.font=font;
  const fs=fsOf(font), tw=c.measureText(s).width, h=fs*1.3;
  for(let i=0;i<cands.length;i++){
    const p=cands[i];
    if(!isFinite(p[0])||!isFinite(p[1])) continue;
    const ax = align==='right' ? p[0]-tw : (align==='center' ? p[0]-tw/2 : p[0]);
    const b={x0:ax-3,y0:p[1]-h/2-2,x1:ax+tw+3,y1:p[1]+h/2+2};
    if(b.x0<2||b.x1>W-2||b.y0<2||b.y1>H-2) continue;
    if(!boxFree(b)) continue;
    LBLS.push(b); TX(c,s,p[0],p[1],font,color,align||'left','middle'); return true;
  }
  return false;
}

/* ============================================================
   Geometry (carried over verbatim from the self-study build)
============================================================ */
function polyCentroid(p){
  let a=0,cx=0,cy=0;
  for(let i=0,n=p.length;i<n;i++){
    const j=(i+1)%n;
    const cr=p[i][0]*p[j][1]-p[j][0]*p[i][1];
    a+=cr; cx+=(p[i][0]+p[j][0])*cr; cy+=(p[i][1]+p[j][1])*cr;
  }
  a/=2;
  return {x:cx/(6*a), y:cy/(6*a), a:a};
}
function pip(p,x,y){
  let c=false;
  for(let i=0,j=p.length-1;i<p.length;j=i++){
    const xi=p[i][0],yi=p[i][1],xj=p[j][0],yj=p[j][1];
    if(((yi>y)!==(yj>y)) && (x<(xj-xi)*(y-yi)/(yj-yi)+xi)) c=!c;
  }
  return c;
}
/* composite rule: outer area-weighted centroid minus each hole */
function shapeCG(s){
  const co=polyCentroid(s.outer);
  let A=Math.abs(co.a), mx=co.x*A, my=co.y*A;
  const hs=s.holes||[];
  for(let i=0;i<hs.length;i++){
    const ch=polyCentroid(hs[i]); const ah=Math.abs(ch.a);
    A-=ah; mx-=ch.x*ah; my-=ch.y*ah;
  }
  return {x:mx/A, y:my/A, area:A};
}
function inShape(s,x,y){
  if(!pip(s.outer,x,y)) return false;
  const hs=s.holes||[];
  for(let i=0;i<hs.length;i++) if(pip(hs[i],x,y)) return false;
  return true;
}
function bboxOf(s){
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  s.outer.forEach(function(q){ x0=Math.min(x0,q[0]); x1=Math.max(x1,q[0]); y0=Math.min(y0,q[1]); y1=Math.max(y1,q[1]); });
  return {x0:x0,x1:x1,y0:y0,y1:y1,cx:(x0+x1)/2,cy:(y0+y1)/2,w:x1-x0,h:y1-y0};
}
function nearestOnEdge(s,x,y){
  const p=s.outer; let best=[p[0][0],p[0][1]], bd=1e18;
  for(let i=0;i<p.length;i++){
    const a=p[i], b=p[(i+1)%p.length];
    const vx=b[0]-a[0], vy=b[1]-a[1], L2=vx*vx+vy*vy;
    let u = L2>0 ? ((x-a[0])*vx+(y-a[1])*vy)/L2 : 0;
    u=clamp(u,0,1);
    const qx=a[0]+vx*u, qy=a[1]+vy*u;
    const d=(qx-x)*(qx-x)+(qy-y)*(qy-y);
    if(d<bd){ bd=d; best=[qx,qy]; }
  }
  return best;
}
function lineX(l1,l2){
  const cr = l1.d[0]*l2.d[1] - l1.d[1]*l2.d[0];
  if(Math.abs(cr)<1e-7) return null;
  const ex=l2.p[0]-l1.p[0], ey=l2.p[1]-l1.p[1];
  const u=(ex*l2.d[1]-ey*l2.d[0])/cr;
  return {x:l1.p[0]+l1.d[0]*u, y:l1.p[1]+l1.d[1]*u};
}
function circlePoly(cx,cy,r,n){
  const p=[]; for(let i=0;i<n;i++){ const a=i/n*Math.PI*2; p.push([cx+r*Math.cos(a), cy+r*Math.sin(a)]); }
  return p;
}
/* crescent = inside circle A, outside circle B; traced as one polygon */
function crescentPoly(R,r,d,N){
  const x=(d*d+R*R-r*r)/(2*d), y=Math.sqrt(R*R-x*x);
  const aA=Math.atan2(y,x), a2=Math.abs(Math.atan2(-y,x-d)), sweep=2*Math.PI-2*a2;
  const pts=[];
  for(let i=0;i<=N;i++){ const a=aA+(2*Math.PI-2*aA)*i/N; pts.push([R*Math.cos(a), R*Math.sin(a)]); }
  for(let i=1;i<N;i++){ const a=-a2-sweep*i/N; pts.push([d+r*Math.cos(a), r*Math.sin(a)]); }
  return pts;
}
function leafPoly(N){
  const p=[], a=104;
  for(let i=0;i<=N;i++){ const x=-a+2*a*i/N, u=Math.max(0,1-(x/a)*(x/a)); p.push([x,-54*Math.pow(u,0.72)]); }
  for(let i=N-1;i>=1;i--){ const x=-a+2*a*i/N, u=Math.max(0,1-(x/a)*(x/a)); p.push([x, 30*Math.pow(u,1.15)]); }
  return p;
}
function rotPoly(p,ang){
  const c=Math.cos(ang), s=Math.sin(ang);
  return p.map(function(q){ return [q[0]*c-q[1]*s, q[0]*s+q[1]*c]; });
}

/* ================= the plates ================= */
const SHAPES=[
  {key:'square', outer:[[-78,-78],[78,-78],[78,78],[-78,78]], pick:[[-1,-1],[-1,0.6]]},
  {key:'blob', outer:[[-90,-40],[-30,-95],[60,-80],[95,-5],[55,75],[-25,95],[-85,45]], pick:[[-1,-1],[0.2,1]]},
  {key:'L', outer:[[-70,-95],[10,-95],[10,25],[95,25],[95,95],[-70,95]], pick:[[-1,-1],[-1,0.6]]},
  {key:'leaf', outer:rotPoly(leafPoly(70),-0.38), pick:[[-1,-1],[0.2,1]]},
  {key:'gun', outer:[[-95,-70],[55,-70],[55,-30],[30,-30],[58,70],[8,78],[-10,-30],[-95,-30]], pick:[[-1,-1],[1,0.3]]},
  {key:'moon', outside:true, outer:crescentPoly(100,88,30,200), pick:[[-1,-1],[-1,0.6]]},
  {key:'ring', outside:true, outer:circlePoly(0,0,100,180), holes:[circlePoly(0,0,56,140)], pick:[[-1,-1],[0.2,1]]}
];
/* one common scale so a plate hung from any edge point still fits the canvas */
const SCL=0.82;
const SHMAP={};
SHAPES.forEach(function(s){
  s.outer = s.outer.map(function(q){ return [q[0]*SCL, q[1]*SCL]; });
  if(s.holes) s.holes = s.holes.map(function(h){ return h.map(function(q){ return [q[0]*SCL, q[1]*SCL]; }); });
  s.cg = shapeCG(s);
  s.bb = bboxOf(s);
  s.diag = Math.hypot(s.bb.w, s.bb.h);
  s.tol = Math.max(12, s.diag*0.06);
  s.offC = Math.hypot(s.cg.x-s.bb.cx, s.cg.y-s.bb.cy);
  s.onBoard = inShape(s, s.cg.x, s.cg.y);
  SHMAP[s.key]=s;
});
function shName(s){ return t('n_'+s.key); }

/* ============================================================
   Suspension rig (shared by demo lab, compare and game)
============================================================ */
function newRig(cv, W, H, cfg){
  return {
    cv:cv, ctx:cv.getContext('2d'), W:W, H:H,
    x0:cfg.x0, x1:cfg.x1, ceilY:cfg.ceilY, PIN:cfg.pin, floorY:cfg.floorY,
    vs:cfg.vs, tm:cfg.tm||1,
    sh:null, P:null, phase:'idle', pIdx:0,
    pose:{aL:[0,0], aS:[cfg.pin[0], cfg.idleY], phi:0}, idleY:cfg.idleY,
    om:0, target:0, swingT:0, liftU:0, liftFrom:[0,0],
    lines:[], cross:null, guess:null, ok:null,
    sup:null, balOK:true, balT:0, balSgn:1
  };
}
/* local (plate) coords → screen coords, with the rig's view scale */
function L2S(pt,pose,vs){
  vs=vs||1;
  const c=Math.cos(pose.phi), s=Math.sin(pose.phi);
  const dx=(pt[0]-pose.aL[0])*vs, dy=(pt[1]-pose.aL[1])*vs;
  return {x:pose.aS[0]+dx*c-dy*s, y:pose.aS[1]+dx*s+dy*c};
}
function S2L(x,y,pose,vs){
  vs=vs||1;
  const c=Math.cos(pose.phi), s=Math.sin(pose.phi);
  const dx=(x-pose.aS[0])/vs, dy=(y-pose.aS[1])/vs;
  return [pose.aL[0]+dx*c+dy*s, pose.aL[1]-dx*s+dy*c];
}
function wrapPi(a){ while(a>Math.PI)a-=2*Math.PI; while(a<=-Math.PI)a+=2*Math.PI; return a; }
/* target angle: turn "CG relative to pivot" to point straight down (+y on screen) */
function targetPhi(sh,P,phiNow){
  const a=Math.atan2(sh.cg.y-P[1], sh.cg.x-P[0]);
  return phiNow + wrapPi(Math.PI/2 - a - phiNow);
}
function rigSetShape(R,sh){
  R.sh=sh; R.P=null; R.phase='idle'; R.lines=[]; R.cross=null; R.guess=null; R.ok=null;
  R.om=0; R.swingT=0; R.pIdx=0;
  R.pose={aL:[sh.bb.cx, sh.bb.cy], aS:[R.PIN[0], R.idleY], phi:0};
}
function rigPickPoint(R,sx,sy){
  if(!R.sh) return false;
  const loc=S2L(sx,sy,R.pose,R.vs);
  const p=nearestOnEdge(R.sh,loc[0],loc[1]);
  if(Math.hypot(p[0]-R.sh.cg.x, p[1]-R.sh.cg.y) < 6) return false;
  R.P=p;
  if(R.phase==='balance') R.phase='rest';
  return true;
}
function rigPickDir(R,dir){
  if(!R.sh) return false;
  R.P = nearestOnEdge(R.sh, dir[0]*1000, dir[1]*1000);
  return true;
}
/* release: first align the pivot in place with the string end, then lift it up */
function rigHang(R){
  if(!R.sh||!R.P) return false;
  if(R.phase==='lift'||R.phase==='swing') return false;
  const now=L2S(R.P,R.pose,R.vs);
  R.pose.aL=[R.P[0],R.P[1]];
  R.pose.aS=[now.x,now.y];
  R.liftFrom=[now.x,now.y];
  R.pIdx=R.lines.length;
  R.liftU=0; R.phase='lift'; R.swingT=0;
  return true;
}
function rigStartSwing(R){
  R.pose.aS=[R.PIN[0],R.PIN[1]];
  R.target=targetPhi(R.sh,R.P,R.pose.phi);
  const d=Math.abs(wrapPi(R.pose.phi-R.target));
  R.om = (d<0.15) ? 1.15 : 0;
  R.phase='swing'; R.swingT=0;
}
function rigSnap(R){
  const k=Math.round((R.pose.phi-R.target)/(2*Math.PI));
  R.pose.phi=R.target+2*Math.PI*k;
  R.om=0; R.phase='rest';
}
/* damped pendulum about the pivot, converging on "CG straight below" */
function rigStep(R,dt0){
  const dt = dt0*R.tm;
  if(R.phase==='lift'){
    R.liftU=Math.min(1,R.liftU+dt*2.4);
    const u=R.liftU, e=u*u*(3-2*u);
    R.pose.aS=[R.liftFrom[0]+(R.PIN[0]-R.liftFrom[0])*e, R.liftFrom[1]+(R.PIN[1]-R.liftFrom[1])*e];
    if(R.liftU>=1) rigStartSwing(R);
    return;
  }
  if(R.phase==='swing'){
    R.swingT+=dt;
    const steps=3, h=dt/steps;
    for(let i=0;i<steps;i++){
      const d=R.pose.phi-R.target;
      R.om += (-30*Math.sin(d) - 1.9*R.om)*h;
      R.pose.phi += R.om*h;
    }
    const dd=Math.abs(wrapPi(R.pose.phi-R.target));
    if((dd<0.005 && Math.abs(R.om)<0.03) || R.swingT>7) rigSnap(R);
    return;
  }
  if(R.phase==='balance'){ R.balT+=dt; return; }
}
/* draw the plumb line onto the plate (plate-local, so it turns with the plate) */
function rigDrawLine(R){
  if(R.phase!=='rest'||!R.P) return 'notrest';
  const dx=R.sh.cg.x-R.P[0], dy=R.sh.cg.y-R.P[1], L=Math.hypot(dx,dy);
  if(L<6) return 'toonear';
  const nd=[dx/L,dy/L];
  for(let i=0;i<R.lines.length;i++){
    const cr=Math.abs(R.lines[i].d[0]*nd[1]-R.lines[i].d[1]*nd[0]);
    if(cr<0.17) return 'dup';           /* within about 10 degrees of an existing line */
  }
  R.lines.push({p:[R.P[0],R.P[1]], d:nd});
  if(R.lines.length>=2 && !R.cross){
    for(let i=0;i<R.lines.length&&!R.cross;i++)
      for(let j=i+1;j<R.lines.length;j++){
        const x=lineX(R.lines[i],R.lines[j]);
        if(x){ R.cross=x; break; }
      }
  }
  return 'ok';
}
/* a support point that is clearly NOT the CG (still on the plate) */
function offPoint(sh){
  const c=sh.cg; let far=sh.outer[0], fd=-1;
  sh.outer.forEach(function(q){
    const d=(q[0]-c.x)*(q[0]-c.x)+(q[1]-c.y)*(q[1]-c.y);
    if(d>fd){ fd=d; far=q; }
  });
  const ts=[0.55,0.45,0.65,0.35,0.75];
  for(let i=0;i<ts.length;i++){
    const p=[c.x+(far[0]-c.x)*ts[i], c.y+(far[1]-c.y)*ts[i]];
    if(inShape(sh,p[0],p[1]) && Math.hypot(p[0]-c.x,p[1]-c.y)>26) return p;
  }
  const q=[c.x+(far[0]-c.x)*0.9, c.y+(far[1]-c.y)*0.9];
  return inShape(sh,q[0],q[1])?q:[far[0],far[1]];
}
function rigBalance(R,onCG){
  if(!R.sh) return;
  R.sup = onCG ? [R.sh.cg.x,R.sh.cg.y] : offPoint(R.sh);
  R.balOK=!!onCG; R.balT=0;
  R.balSgn = (R.sh.cg.x-R.sup[0])>=0 ? 1 : -1;
  R.phase='balance';
}
function balPose(R){
  const u = R.balOK ? 0 : clamp((R.balT-0.55)/1.5,0,1);
  return {
    ax:R.PIN[0], ay:R.floorY-140,
    tilt: R.balOK ? Math.sin(R.balT*3.1)*0.022 : R.balSgn*0.62*u,
    drop: R.balOK ? 0 : 130*u*u,
    sq:0.54, u:u
  };
}
function balPos(R,px,py,bp){
  const dx=(px-R.sup[0])*R.vs, dy=(py-R.sup[1])*R.vs;
  const c=Math.cos(bp.tilt), s=Math.sin(bp.tilt);
  return {x: bp.ax + (dx*c-dy*s), y: bp.ay + bp.drop + (dx*s+dy*c)*bp.sq};
}
/* θ — the signature reading: angle between (pivot→CG) and straight down */
function thetaOf(R){
  if(!R.sh || !R.P) return null;
  const A=L2S(R.P,R.pose,R.vs), G=L2S([R.sh.cg.x,R.sh.cg.y],R.pose,R.vs);
  const dx=G.x-A.x, dy=G.y-A.y;
  if(Math.hypot(dx,dy)<1e-6) return 0;
  return Math.abs(wrapPi(Math.atan2(dx,dy)))*180/Math.PI;
}
function pinDist(R){
  if(!R.sh||!R.P) return null;
  return Math.hypot(R.sh.cg.x-R.P[0], R.sh.cg.y-R.P[1]);
}

/* ============================================================
   Drawing the rig
============================================================ */
function addPoly(g,p){
  g.moveTo(p[0][0],p[0][1]);
  for(let i=1;i<p.length;i++) g.lineTo(p[i][0],p[i][1]);
  g.closePath();
}
function shapeOuterPath(g,s){ g.beginPath(); addPoly(g,s.outer); }
function drawPlate(g,s,lines,lw){
  shapeOuterPath(g,s);
  g.fillStyle=C().board; g.fill();
  g.strokeStyle=C().boardEdge; g.lineWidth=lw||3; g.lineJoin='round'; g.stroke();
  const hs=s.holes||[];
  for(let i=0;i<hs.length;i++){
    g.beginPath(); addPoly(g,hs[i]);
    g.fillStyle=C().boardHole; g.fill();
    g.strokeStyle=C().boardEdge; g.lineWidth=lw||3; g.stroke();
  }
  const cols=[C().line1,C().line2,C().line3];
  for(let i=0;i<lines.length;i++){
    const ln=lines[i], col=cols[i%3];
    line(g, ln.p[0]-ln.d[0]*6, ln.p[1]-ln.d[1]*6, ln.p[0]+ln.d[0]*s.diag, ln.p[1]+ln.d[1]*s.diag, col, 2.6);
    circle(g, ln.p[0], ln.p[1], 4.5, col, null, 0);
  }
}
function cgMark(g,x,y,r){
  const rr=r||11;
  circle(g,x,y,rr,C().pill,C().cg,3);
  g.strokeStyle=C().cg; g.lineWidth=2.6;
  g.beginPath();
  g.moveTo(x-rr,y); g.lineTo(x+rr,y); g.moveTo(x,y-rr); g.lineTo(x,y+rr);
  g.stroke();
}
function boxMark(g,x,y){
  g.strokeStyle=C().boxc; g.lineWidth=2;
  g.beginPath();
  g.moveTo(x-9,y); g.lineTo(x+9,y); g.moveTo(x,y-9); g.lineTo(x,y+9);
  g.stroke();
}
/* the hanging scene: stand, string, swinging plate, θ wedge */
function drawScene(g,R,opt){
  const W=R.W, H=R.H;
  if(!R.sh) return;
  if(R.phase==='balance'){ drawBalance(g,R,opt); return; }
  const hung=(R.phase==='lift'||R.phase==='swing'||R.phase==='rest');

  /* stand / ceiling */
  const cw=R.x1-R.x0-40;
  g.fillStyle=C().stand; g.fillRect(R.x0+20,R.ceilY,cw,16);
  g.strokeStyle=C().standEdge; g.lineWidth=2.2; g.strokeRect(R.x0+20,R.ceilY,cw,16);
  g.strokeStyle=C().standEdge; g.lineWidth=2; g.beginPath();
  for(let x=R.x0+30;x<R.x1-22;x+=16){ g.moveTo(x,R.ceilY); g.lineTo(x-8,R.ceilY-8); }
  g.stroke();
  const hookY=R.ceilY+16;
  circle(g,R.PIN[0],hookY+5,5,C().standEdge,null,0);

  /* plumb guide + string */
  if(hung){
    line(g,R.PIN[0],R.PIN[1],R.PIN[0],R.floorY,C().plumb,2,[7,6]);
    line(g,R.PIN[0],hookY+5,R.pose.aS[0],R.pose.aS[1],C().string,2.6);
  }

  /* plate */
  g.save();
  g.translate(R.pose.aS[0],R.pose.aS[1]);
  g.rotate(R.pose.phi);
  g.scale(R.vs,R.vs);
  g.translate(-R.pose.aL[0],-R.pose.aL[1]);
  drawPlate(g,R.sh,R.lines,3/R.vs*1.15);
  g.restore();

  /* pivot hole */
  const Ps = R.P ? L2S(R.P,R.pose,R.vs) : null;
  if(Ps) circle(g,Ps.x,Ps.y,6,C().pill,C().pin,2.8);

  /* θ wedge between the plumb line and pivot→CG */
  const Cs = R.sh ? L2S([R.sh.cg.x,R.sh.cg.y],R.pose,R.vs) : null;
  if(Ps && Cs && opt.showTheta){
    const ang=Math.atan2(Cs.y-Ps.y, Cs.x-Ps.x);
    const dd=wrapPi(ang-Math.PI/2);
    const rad=clamp(Math.hypot(Cs.x-Ps.x,Cs.y-Ps.y)*0.55, 22, 74);
    line(g,Ps.x,Ps.y,Cs.x,Cs.y,C().theta,2,[6,5]);
    if(Math.abs(dd)>0.012){
      g.beginPath();
      g.arc(Ps.x,Ps.y,rad,Math.PI/2,Math.PI/2+dd,dd<0);
      g.strokeStyle=C().theta; g.lineWidth=2.4; g.stroke();
    }
  }

  /* CG marker + guess cross */
  if(opt.showCG && Cs) cgMark(g,Cs.x,Cs.y);
  if(R.guess){
    const q=L2S(R.guess,R.pose,R.vs);
    const col=(R.ok===null)?C().theta:(R.ok?C().good:C().bad);
    g.strokeStyle=col; g.lineWidth=3.2;
    g.beginPath();
    g.moveTo(q.x-10,q.y-10); g.lineTo(q.x+10,q.y+10);
    g.moveTo(q.x+10,q.y-10); g.lineTo(q.x-10,q.y+10);
    g.stroke();
    if(opt.showCG && Cs && R.ok===false) line(g,q.x,q.y,Cs.x,Cs.y,C().bad,2,[5,4]);
  }

  /* ---- labels ---- */
  labText(g,t('cvStand'),[[R.x0+26,R.ceilY-16]],'700 14px '+CV_FONT,C().cvTextDim,'left',W,H);
  if(hung) labText(g,t('cvPlumb'),[[R.PIN[0]+10,R.floorY-16],[R.PIN[0]-10,R.floorY-16]],'700 14px '+CV_FONT,C().plumb,(R.PIN[0]>W/2?'right':'left'),W,H);
  if(opt.showCG && Cs)
    tchip(g,t('cvCG'),[[Cs.x+62,Cs.y],[Cs.x-62,Cs.y],[Cs.x,Cs.y+34],[Cs.x,Cs.y-34]],'700 14px '+CV_FONT,C().cg,W,H);
  if(Ps){
    const key = hung ? tf('cvPin',{k:'ABC'.charAt(Math.min(2,R.pIdx))}) : t('cvPinSel');
    tchip(g,key,[[Ps.x+58,Ps.y-20],[Ps.x-58,Ps.y-20],[Ps.x+58,Ps.y+22],[Ps.x-58,Ps.y+22]],'700 14px '+CV_FONT,C().pin,W,H);
  }
  if(opt.showTheta && Ps){
    const th=thetaOf(R);
    if(th!==null) tchip(g,tf('cvTheta',{th:f1(th)}),[[Ps.x+4,Ps.y+58],[Ps.x+4,Ps.y-58]],'900 17px '+CV_FONT,C().theta,W,H);
  }
  if(R.guess && opt.guessLabel){
    const q=L2S(R.guess,R.pose,R.vs);
    tchip(g,t('cvGuess'),[[q.x,q.y+32],[q.x,q.y-32],[q.x+58,q.y]],'700 13px '+CV_FONT,C().theta,W,H);
  }
  if(opt.tip) tchip(g,opt.tip,[[R.PIN[0],R.floorY+22]],'700 15px '+CV_FONT,C().cvText,W,H);
}
function drawBalance(g,R,opt){
  const W=R.W,H=R.H, bp=balPose(R);
  line(g,R.x0+30,bp.ay,R.x1-30,bp.ay,C().tableLine,2);
  g.save();
  g.translate(bp.ax, bp.ay+bp.drop);
  g.scale(1,bp.sq);
  g.rotate(bp.tilt);
  g.scale(R.vs,R.vs);
  g.translate(-R.sup[0],-R.sup[1]);
  drawPlate(g,R.sh,R.lines,3.4/R.vs);
  g.restore();
  const c=balPos(R,R.sh.cg.x,R.sh.cg.y,bp);
  cgMark(g,c.x,c.y);
  /* finger */
  g.fillStyle=C().skin; rrect(g,bp.ax-14,bp.ay+4,28,104,14); g.fill();
  g.strokeStyle=C().skinEdge; g.lineWidth=2.4; rrect(g,bp.ax-14,bp.ay+4,28,104,14); g.stroke();
  circle(g,bp.ax,bp.ay+2,4.5,C().cvText,null,0);

  labText(g,t('cvFinger'),[[bp.ax+22,bp.ay+56],[bp.ax-22,bp.ay+56]],'800 14px '+CV_FONT,C().cvTextDim,(bp.ax>W/2?'right':'left'),W,H);
  tchip(g,t('cvCG'),[[c.x+62,c.y],[c.x-62,c.y],[c.x,c.y-34],[c.x,c.y+34]],'700 14px '+CV_FONT,C().cg,W,H);
  tchip(g, R.balOK ? t('cvBalOK') : t('cvBalNG'), [[R.PIN[0],R.ceilY+60]],
    '800 17px '+CV_FONT, R.balOK?C().good:C().bad, W, H);
}
/* the flat "paper view": plate unrotated, with the lines and the crossing point */
function drawFlat(g,R,cx,cy,vs,W,H,showCross){
  const s=R.sh;
  if(!s) return;
  g.save();
  g.translate(cx,cy); g.scale(vs,vs); g.translate(-s.bb.cx,-s.bb.cy);
  drawPlate(g,s,R.lines,3/vs);
  g.restore();
  const M = p => ({x:cx+(p[0]-s.bb.cx)*vs, y:cy+(p[1]-s.bb.cy)*vs});
  for(let i=0;i<R.lines.length;i++){
    const ln=R.lines[i];
    const q=M([ln.p[0]+ln.d[0]*s.diag*0.62, ln.p[1]+ln.d[1]*s.diag*0.62]);
    tchip(g,tf('cvLineN',{k:'①②③'.charAt(i)}),[[q.x,q.y],[q.x+44,q.y],[q.x-44,q.y],[q.x,q.y+26]],
      '700 13px '+CV_FONT,[C().line1,C().line2,C().line3][i%3],W,H);
  }
  if(showCross && R.cross){
    const q=M([R.cross.x,R.cross.y]);
    cgMark(g,q.x,q.y);
    tchip(g,t('cvCG'),[[q.x+60,q.y],[q.x-60,q.y],[q.x,q.y-32],[q.x,q.y+32]],'700 14px '+CV_FONT,C().cg,W,H);
  }
}

/* ============================================================
   Tab 1: Demo lab (world 1000 x 500, canvas at 2x)
============================================================ */
const W_W=1000, W_H=500;
const labCv=$('cv-lab'), labCtx=labCv.getContext('2d');
const D = newRig(labCv, W_W, W_H, {x0:22, x1:566, ceilY:34, pin:[286,186], floorY:432, idleY:250, vs:1.15});
const FLAT = {cx:780, cy:250, vs:1.3, x0:588, y0:56, x1:972, y1:456};
let FLASH=null, CONCL=null, WARN=null;

function drawLab(){
  const g=labCtx;
  g.setTransform(1,0,0,1,0,0);
  g.clearRect(0,0,labCv.width,labCv.height);
  g.setTransform(SC,0,0,SC,0,0);
  labelReset();
  const inGame = $('panel-game').classList.contains('on');
  const showCG = !!D.cross || (inGame && GAME.reveal);

  /* fixed captions get their box first so they always win */
  labText(g,t('cvScene'),[[D.x0+8,16]],'700 16px '+CV_FONT,C().cvTextDim,'left',W_W,W_H);
  labText(g,t('cvFlat'),[[FLAT.x0+12,16]],'700 16px '+CV_FONT,C().cvTextDim,'left',W_W,W_H);

  /* right: paper view panel */
  rrect(g,FLAT.x0,FLAT.y0,FLAT.x1-FLAT.x0,FLAT.y1-FLAT.y0,12);
  g.fillStyle=C().panel; g.fill();
  g.strokeStyle=C().panelLine; g.lineWidth=1.4; g.stroke();

  let tip='';
  if(!inGame){
    if(!D.P && D.phase==='idle') tip=t('cvClick');
    else if(D.phase==='swing'||D.phase==='lift') tip=t('cvSwing');
    else if(D.phase==='rest' && D.lines.length<2) tip=t('cvDrawNow');
  } else {
    tip = GAME.phase==='guess' ? t('gGoalGuess') : (GAME.phase==='verify' ? t('gGoalVerify') : '');
  }
  drawScene(g,D,{showCG:showCG, showTheta:(D.phase!=='balance'), tip:tip, guessLabel:true});
  drawFlat(g,D,FLAT.cx,FLAT.cy,FLAT.vs,W_W,W_H,showCG);

  /* paper-view footer text */
  const foot = D.cross
    ? tf('cvCross',{x:f1(D.cross.x), y:f1(D.cross.y)})
    : t('cvNoCross');
  labText(g,foot,[[FLAT.cx,FLAT.y1-22]],'700 16px '+CV_FONT, D.cross?C().cg:C().cvTextDim,'center',W_W,W_H);
  if(D.sh){
    labText(g, shName(D.sh) + (D.sh.outside ? '　'+t('cvOff') : ''),
      [[FLAT.cx,FLAT.y0+24]],'700 16px '+CV_FONT, D.sh.outside?C().bad:C().cvText,'center',W_W,W_H);
  }
}


/* 步骤指引：done = 已完成, cur = 当前该做的那一步 */
function renderSteps(){
  const box=$('l-steps'); if(!box) return;
  const n=D.lines.length;
  const done=[ !!D.P, (D.phase==='rest'||D.phase==='balance'||n>=1), n>=1, n>=2, !!D.cross ];
  let cur=done.indexOf(false);
  const html=[1,2,3,4,5].map(function(i){
    const cls = done[i-1] ? 'done' : (i-1===cur ? 'cur' : '');
    return '<li class="'+cls+'">'+t('sp'+i)+'</li>';
  }).join('');
  if(box.__h!==html){ box.innerHTML=html; box.__h=html; }
}

/* ---------- sidebar / messages ---------- */
function stKeys(){
  if(D.phase==='balance') return D.balOK ? ['stBalOKT','stBalOKS'] : ['stBalNGT','stBalNGS'];
  if(D.phase==='lift') return ['stLiftT','stLiftS'];
  if(D.phase==='swing') return ['stSwingT','stSwingS'];
  if(D.phase==='rest') return ['stRestT','stRestS'];
  return D.P ? ['stPickT','stPickS'] : ['stIdleT','stIdleS'];
}
function labUI(){
  renderSteps();
  const k=stKeys(), bd=$('l-state'), chip=t(k[0])+'<small>'+t(k[1])+'</small>';
  if(bd && chip!==lastChip){
    bd.innerHTML = chip; lastChip = chip;
    const col = D.phase==='rest' ? '#1d7a3a' : (D.phase==='balance' ? (D.balOK?'#1d7a3a':'#b8432f') : (D.phase==='swing'||D.phase==='lift') ? 'var(--gold-ink)' : '#2f6690');
    bd.style.color=col; bd.style.borderColor=col;
  }
  /* buttons */
  const canHang = !!(D.sh && D.P && (D.phase==='idle'||D.phase==='rest'||D.phase==='balance'));
  if($('btn-hang')) $('btn-hang').disabled = !canHang;
  if($('btn-line')) $('btn-line').disabled = !(D.phase==='rest' && D.lines.length<3);
  if($('btn-again')) $('btn-again').disabled = !(D.phase==='rest' && D.lines.length>=1);
  if($('btn-bal')) $('btn-bal').disabled = !D.cross;
  if($('btn-bad')) $('btn-bad').disabled = !D.cross;
  if($('gm-hang')) $('gm-hang').disabled = !(canHang && GAME.phase==='verify');
  if($('gm-line')) $('gm-line').disabled = !(D.phase==='rest' && D.lines.length<3 && GAME.phase==='verify');
  renderMsg();
}
let lastMsg='', lastChip='';
function renderMsg(){
  const th=thetaOf(D), d=pinDist(D);
  const flash = FLASH ? '<em>'+t(FLASH)+'</em><br>' : '';
  const warn = WARN ? t(WARN)+'<br>' : '';
  /* θ 只有真正挂起来后才有意义，没数值时不占版面 */
  const formula = (th===null) ? '' : tf('f_theta',{th:f1(th), d: d===null?'--':f1(d)})+'<br>';
  let live;
  if(D.phase==='balance') live = D.balOK ? t('live_balok') : t('live_balng');
  else if(D.phase==='rest') live = t('live_rest');
  else if(D.phase==='swing'||D.phase==='lift') live = t('live_swing');
  else if(D.P) live = tf('live_pick',{th: th===null?'--':f1(th)});
  else live = t('live_idle');
  const tip = D.lines.length>=2 ? t('tip_done')
            : D.lines.length===1 ? tf('tip_need2',{n:1})
            : t('tip_first');
  const box=$('l-status'), html = warn + flash + formula + live + '<br>' + tip;
  if(box && html!==lastMsg){ box.innerHTML = html; lastMsg = html; }
  const cb=$('l-conclude');
  if(cb){
    if(CONCL){ cb.innerHTML = t(CONCL); cb.classList.add('on'); }
    else cb.classList.remove('on');
  }
}
function pickShape(k){
  const s=SHMAP[k];
  if(!s) return;
  SCRIPT=null;
  rigSetShape(D,s);
  FLASH=null; CONCL=null; WARN=null;
  document.querySelectorAll('.sbtn[data-sh]').forEach(b=>b.classList.toggle('pick', b.dataset.sh===k));
  labUI();
}
function labHang(){
  WARN=null; FLASH=null;
  if(rigHang(D)) labUI();
}
function labLine(){
  const r=rigDrawLine(D);
  if(r==='dup'){ WARN='w_dup'; CONCL='c_dup'; }
  else if(r==='toonear'){ WARN='w_near'; }
  else if(r==='ok'){
    WARN=null;
    if(D.lines.length===1) FLASH='r_line1';
    else if(D.cross){ FLASH='r_cross'; CONCL = D.sh.outside ? 'c_outside' : 'c_cross'; }
  }
  labUI();
}
function labAgain(){
  FLASH=null;
  WARN='w_again';
  labUI();
}
function labBal(onCG){
  if(!D.cross) return;
  SCRIPT=null;
  rigBalance(D,onCG);
  FLASH=null; WARN=null;
  CONCL = onCG ? 'c_balok' : 'c_balng';
  labUI();
}
function labReset(){
  SCRIPT=null;
  rigSetShape(D, D.sh||SHAPES[0]);
  FLASH=null; CONCL=null; WARN=null;
  labUI();
}
labCv.addEventListener('pointerdown', function(ev){
  const p=ptr(ev,labCv,SC);
  const inGame=$('panel-game').classList.contains('on');
  if(inGame && GAME.phase==='guess'){ gameGuess(p.x,p.y); return; }
  if(D.phase==='lift'||D.phase==='swing') return;
  if(p.x>FLAT.x0) return;               /* the paper view is read-only in lab mode */
  SCRIPT=null;
  if(rigPickPoint(D,p.x,p.y)){ WARN=null; FLASH=null; labUI(); }
});

/* ---------- one-click presets (was the static 4-step / myth-buster cards) ---------- */
const PRESETS = {
  pr1:{ sh:'blob', hangs:2 }, pr2:{ sh:'moon', hangs:2 }, pr3:{ sh:'ring', hangs:2 },
  pr4:{ sh:'L', hangs:2, same:true }, pr5:{ sh:'square', hangs:2 }
};
let SCRIPT=null;
function runPreset(id){
  const p=PRESETS[id];
  if(!p) return;
  setMode('lab');
  pickShape(p.sh);
  CONCL=id+'why';
  SCRIPT={ id:id, step:0, wait:0.4, same:!!p.same };
  const btn=document.querySelector('#ctl-lab [data-p="'+id+'"]');
  if(btn){ btn.classList.remove('flash'); void btn.offsetWidth; btn.classList.add('flash');
    setTimeout(()=>btn.classList.remove('flash'), 1800); }
  labUI();
}
function scriptStep(dt){
  if(!SCRIPT) return;
  if(SCRIPT.wait>0){ SCRIPT.wait-=dt; return; }
  const s=D.sh;
  if(SCRIPT.step===0){ rigPickDir(D,s.pick[0]); SCRIPT.step=1; SCRIPT.wait=0.5; labUI(); return; }
  if(SCRIPT.step===1){ rigHang(D); SCRIPT.step=2; labUI(); return; }
  if(SCRIPT.step===2){ if(D.phase==='rest'){ SCRIPT.step=3; SCRIPT.wait=0.5; } return; }
  if(SCRIPT.step===3){ labLine(); SCRIPT.step=4; SCRIPT.wait=0.9; return; }
  if(SCRIPT.step===4){ rigPickDir(D, SCRIPT.same ? s.pick[0] : s.pick[1]); SCRIPT.step=5; SCRIPT.wait=0.5; labUI(); return; }
  if(SCRIPT.step===5){ rigHang(D); SCRIPT.step=6; labUI(); return; }
  if(SCRIPT.step===6){ if(D.phase==='rest'){ SCRIPT.step=7; SCRIPT.wait=0.5; } return; }
  if(SCRIPT.step===7){ labLine(); CONCL=SCRIPT.id+'why'; renderMsg(); SCRIPT=null; return; }
}

/* ---------- data recording ---------- */

/* ============================================================
   Tab 3: Class quiz
============================================================ */
const QUIZ_TIME=20;
let qIdx=0, qScore=0, qDone=[], qTimer=null, qLeft=0;
function stopTimer(){ if(qTimer){ clearInterval(qTimer); qTimer=null; } }
function startTimer(){
  stopTimer();
  qLeft=QUIZ_TIME;
  const bar=$('q-timer-bar');
  bar.style.width='100%';
  $('q-timer').classList.remove('low');
  qTimer=setInterval(function(){
    qLeft-=0.1;
    bar.style.width=Math.max(0,qLeft/QUIZ_TIME*100)+'%';
    if(qLeft<=5) $('q-timer').classList.add('low');
    if(qLeft<=0){ stopTimer(); timeUpQ(); }
  },100);
}
function renderQ(){
  const item=QUIZ()[qIdx];
  $('q-emoji').textContent=item.e;
  $('q-text').innerHTML=(qIdx+1)+'. '+item.q;
  $('q-exp').innerHTML='';
  $('q-next').style.display='none';
  $('q-restart').style.display='none';
  const box=$('q-opts');
  box.innerHTML='';
  item.o.forEach(function(opt,i){
    const b=document.createElement('button');
    b.className='qbtn';
    b.textContent='ABC'[i]+'. '+opt;
    b.onclick=function(){ answerQ(i,b); };
    box.appendChild(b);
  });
  renderProg();
  $('q-score-n').textContent=qScore;
  if(qDone[qIdx]!==undefined){
    const btns=[].slice.call(box.children);
    btns.forEach(b=>b.disabled=true);
    btns[item.a].classList.add('right');
    $('q-exp').innerHTML=item.x;
    if(qIdx<QUIZ().length-1) $('q-next').style.display='inline-block';
    else $('q-restart').style.display='inline-block';
  } else startTimer();
}
function renderProg(){
  $('q-prog').innerHTML=QUIZ().map(function(_,i){
    return '<div class="qdot '+(i===qIdx?'cur ':'')+(qDone[i]===true?'right':qDone[i]===false?'wrong':'')+'"></div>';
  }).join('');
}
function finishQ(prefix,correct){
  stopTimer();
  const item=QUIZ()[qIdx];
  qDone[qIdx]=correct;
  if(correct) qScore++;
  const btns=[].slice.call($('q-opts').children);
  btns.forEach(b=>b.disabled=true);
  btns[item.a].classList.add('right');
  $('q-exp').innerHTML=prefix+item.x;
  renderProg();
  $('q-score-n').textContent=qScore;
  if(qIdx<QUIZ().length-1) $('q-next').style.display='inline-block';
  else{
    const pct=qScore/QUIZ().length;
    const msg=pct===1?t('resGold'):pct>=0.7?t('resGood'):t('resTry');
    $('q-exp').innerHTML+='<br><em>'+qScore+' / '+QUIZ().length+' — '+msg+'</em>';
    $('q-restart').style.display='inline-block';
  }
}
function answerQ(i,btn){
  if(qDone[qIdx]!==undefined) return;
  const item=QUIZ()[qIdx];
  const correct=i===item.a;
  if(!correct) btn.classList.add('wrong');
  finishQ(correct?t('rRight')+' ':t('rWrong')+' ', correct);
}
function timeUpQ(){
  if(qDone[qIdx]!==undefined) return;
  finishQ(t('timeUp')+' ', false);
}
function nextQ(){ qIdx++; renderQ(); }
function restartQ(){ qIdx=0; qScore=0; qDone=[]; renderQ(); }

/* ============================================================
   Tab 4: Guess-the-CG challenge (template A — reuses the lab canvas)
============================================================ */
const GAME_ROUNDS=3, GAME_TIME=60;
const GAME={ round:0, score:0, phase:'guess', left:GAME_TIME, timer:null, order:[], err:null, pts:0, reveal:false };
function stopGTimer(){ if(GAME.timer){ clearInterval(GAME.timer); GAME.timer=null; } }
function startGame(){
  GAME.round=0; GAME.score=0;
  $('g-score').textContent=0;
  const idx=SHAPES.map(function(_,i){ return i; });
  for(let i=idx.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const tmp=idx[i]; idx[i]=idx[j]; idx[j]=tmp; }
  GAME.order=idx.slice(0,GAME_ROUNDS);
  nextRound();
}
function nextRound(){
  GAME.round++;
  GAME.phase='guess'; GAME.err=null; GAME.pts=0; GAME.reveal=false;
  GAME.left=GAME_TIME;
  const s=SHAPES[GAME.order[GAME.round-1]];
  rigSetShape(D,s);
  FLASH=null; CONCL=null; WARN=null;
  document.querySelectorAll('.sbtn[data-sh]').forEach(b=>b.classList.toggle('pick', b.dataset.sh===s.key));
  $('g-status').innerHTML=tf('gGo',{r:GAME.round, n:shName(s)});
  gameSync();
  stopGTimer();
  GAME.timer=setInterval(function(){
    GAME.left--;
    $('g-time').textContent=Math.max(0,GAME.left);
    $('g-time').classList.toggle('low', GAME.left<=10);
    if(GAME.left<=0) endRound('time');
  },1000);
}
function gameGuess(wx,wy){
  if(GAME.phase!=='guess'||!D.sh) return;
  let loc=null;
  if(wx>FLAT.x0){
    loc=[ (wx-FLAT.cx)/FLAT.vs + D.sh.bb.cx, (wy-FLAT.cy)/FLAT.vs + D.sh.bb.cy ];
  } else {
    loc=S2L(wx,wy,D.pose,D.vs);
  }
  D.guess=loc; D.ok=null;
  GAME.err=Math.hypot(loc[0]-D.sh.cg.x, loc[1]-D.sh.cg.y);
  GAME.phase='verify';
  $('g-status').innerHTML=t('gLocked');
  gameSync();
}
function gameHang(){ labHang(); gameSync(); }
function gameLine(){
  labLine();
  if(D.cross && GAME.phase==='verify') endRound('win');
  gameSync();
}
function endRound(how){
  stopGTimer();
  const s=D.sh;
  if(how==='win'){
    GAME.reveal=true;
    D.ok = GAME.err<=s.tol;
    const e=GAME.err;
    GAME.pts = e<=s.tol?100 : e<=2*s.tol?70 : e<=3*s.tol?40 : 10;
    GAME.score+=GAME.pts;
    const msg = e<=s.tol?t('gPerfect') : e<=2*s.tol?t('gClose') : t('gMiss');
    $('g-status').innerHTML=tf('gWin',{e:f1(e), t:f1(s.tol), p:GAME.pts, msg:msg});
  } else if(how==='time'){
    GAME.reveal=true;
    if(GAME.err===null){ $('g-status').innerHTML=t('gNoGuess'); }
    else{
      D.ok = GAME.err<=s.tol;
      GAME.pts = GAME.err<=s.tol?50 : GAME.err<=2*s.tol?30 : 10;
      GAME.score+=GAME.pts;
      $('g-status').innerHTML=tf('gTimeUp',{p:GAME.pts});
    }
  } else {
    GAME.reveal=true;
    $('g-status').innerHTML=t('gSkipped');
  }
  $('g-score').textContent=GAME.score;
  GAME.phase = GAME.round>=GAME_ROUNDS ? 'done' : 'next';
  if(GAME.phase==='done'){
    const rk = GAME.score>=250?t('gRank1') : GAME.score>=150?t('gRank2') : t('gRank3');
    $('g-status').innerHTML += '<br>'+t('gFinal')+' '+GAME.score+' — '+rk;
  }
  gameSync();
}
function gameAct(){
  if(GAME.phase==='guess'||GAME.phase==='verify') endRound('skip');
  else if(GAME.phase==='next') nextRound();
  else startGame();
}
function gameSync(){
  if(!$('g-round')) return;
  $('g-round').textContent=GAME.round;
  $('g-score').textContent=GAME.score;
  $('g-score-hud').textContent=GAME.score;
  $('g-time').textContent=Math.max(0,GAME.left);
  $('g-err').textContent = (GAME.reveal && GAME.err!==null) ? f1(GAME.err) : '--';
  const goal = GAME.phase==='guess' ? t('gGoalGuess') : t('gGoalVerify');
  $('g-goal-side').textContent=goal;
  $('g-goal-side').style.color = GAME.phase==='guess' ? '#b8432f' : '#2f6690';
  $('g-goal-hud').innerHTML='<b style="font-size:15px">'+goal+'</b>';
  $('g-act').textContent = (GAME.phase==='guess'||GAME.phase==='verify') ? t('gSkip')
                         : GAME.phase==='next' ? t('gNextRound') : t('gPlayAgain');
  const active = (GAME.phase==='verify');
  $('gm-hang').disabled = !(active && D.P && (D.phase==='idle'||D.phase==='rest'));
  $('gm-line').disabled = !(active && D.phase==='rest' && D.lines.length<3);
}

/* ============================================================
   Main loop & mode switching
============================================================ */
let lastT=performance.now();
function mainLoop(now){
  const dt=Math.min(0.04,(now-lastT)/1000);
  lastT=now;
  const labOn=$('panel-lab').classList.contains('on');
  const gameOn=$('panel-game').classList.contains('on');
  if(labOn||gameOn){
    const was=D.phase;
    if(labOn) scriptStep(dt);
    rigStep(D,dt);
    if(was!==D.phase && D.phase==='rest'){ FLASH='r_rest'; }
    drawLab();
    labUI();
    if(gameOn) gameSync();
  }
  requestAnimationFrame(mainLoop);
}
function setMode(m){
  stopTimer(); stopGTimer();
  SCRIPT=null;
  for(const id of ['lab','quiz','game']){
    $('tab-'+id).classList.toggle('on', id===m);
    $('panel-'+id).classList.toggle('on', id===m);
    $('ctl-'+id).classList.toggle('on', id===m);
    $('sb-'+id).classList.toggle('on', id===m);
  }
  if(m==='lab'){
    ($('panel-lab').querySelector('.cvarea')||$('panel-lab')).appendChild(labCv);
    D.guess=null; D.ok=null;
    labUI();
  }
  if(m==='quiz') renderQ();
  if(m==='game'){ $('game-cvhost').appendChild(labCv); startGame(); }
}

/* ---------- boot ---------- */
applyTheme();
applyLang();
syncExplain();
pickShape('blob');
renderQ();
setMode('lab');
requestAnimationFrame(mainLoop);
